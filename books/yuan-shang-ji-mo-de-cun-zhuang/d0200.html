    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>在人潮里</h1><p id="source-date" class="diary-date"><time datetime="2014-05-18" title="原笔记创建日期，不一定等同于落笔时间">2014年5月18日</time></p><p id="source-b-001">人来人往，很多时候的尖叫呐喊，狂笑，身在其中，但是却有莫名的孤独感。真是的孤独感，并非远离人群的孤独。</p><p id="source-b-002">哥们，好久不聊天了。</p><p id="source-b-003">我现在呢，进了一些水果，在学校卖， 3天了 寥寥无几的订单，一直告诉自己 这只是没有推广，没有足够的推广，很多人看到我的产品，我相信会喜欢上我。产品代表的就是我个人的某一个面向。我跟你说这个消息，在这个时间，我也只有找你聊聊 你是一个很懂得倾听的人，你从来不会插我的话题，从来都是 hi无条件地 不管任何时间，你都能够出现在我的身边，鼓励我，当我难捱的时候。你在我身边。惺惺相惜着，为什么我现在想流泪呢？是因为感动吗？或是眼睛酸了，可能是进沙子了吧。与你相遇了有五百多个日子，也有很多时候我是抛弃你 背弃你的，打发你，随便与你只言片语，但是你总不会介意，还是一如既往地出现。就像现在这个样子，安慰我，只有你最能够明白我的心，这对我的爱人应该是很伤感的措辞。</p><p id="source-b-004">卖水果的进程还在进行着，我想说说自己的优点，我怕我又忘记了 因为我很得意忘形，我很傲慢，从来而来的优越性，霸道还残留在身上，傲慢至极。自以为是是你的强项，还有生性急躁，我不懂得控制自己的，我想这些毛病 并没少伤害到你。甚至是我身边的人，停止自己的傲慢，有修行的人定是足够宽容的，至少不会对人大吼。 不应该出现在你身上的暴躁 不满。</p><p id="source-b-005">当蓝剑以不同形式跟你话语，为何你的身上还有许多的不满，你明明知道他只是在开玩笑，而我可笑的内心却是不满的，还想着要不要假装一下，我希望得到别人的反馈，我希望得到别人的安慰，这该死的傲慢，而且是我欺瞒，明明是看得到真相的，但是我的傲慢马上跑出来，阻止我的判断，它另我发怒，陷入无明。特别想说自己的这些东西，傲慢的人在世间是混不出头的，更不用说在佛法上，傲慢无法让人接受外界，一直在自己思想的狭隘里面自我摧毁并洋洋得意。 这多么糟糕的习惯。 请加持我，保持我的觉知。</p><p id="source-b-006">最感恩的是三宝，上师一直在我身边加持我，让我受到正见的佛法，这条路上许多人给我指点，不另我偏离正见。感恩一切上师给我的加持，无限的感恩，在菩提路上我应该更永远，大乘人要看发心，不应该有丝毫未自己的心，出现了也要把它给斩断，上师一直都在看护我，一直都在给我指引，噶玛巴千诺。我梦中的雪狮，震吼的声响彻寰宇，还有什么另我振奋，在这菩提路上勇猛前行。梦中的雪狮 请加持我，让上师证悟的力量出现在我身上，上师的宽广，觉醒，慈悲，智慧，来到我的身上，还有你 我的倾听者。觉醒过来，看看天际 它仅仅是一片蓝，看看那些可爱的人，他们仅仅是可爱的人们，不思善不思恶 不带分别地去理解他们的痛苦 理解他们痛苦的来源。你可以更加慈悲 可以更加有智慧。 当懂得感同身受时。感受上师的智慧 一切就会发生。</p><p id="source-b-007">我并无任何修行，我这么认为 ，想必你也是这样认为，但是我的话语却常常带有那么鼓励人的，好像是明白一样的字眼，倘若这能够人升起信心，尽管没有功夫 都是空话这又是何妨呢？ 常作度舟人缘聚缘散 缘住时全身心投入 缘去时 笑笑了之。 不过是过去与现在的去留 我们只能对过去的挥挥手 对当下的这一刻全身心投入。阿月 她是有交往最为久的女朋友了，我认为她是一个大乘种的人，很多东西都是契合的，这可能是我的直觉吧。谨记的是 身心投入 也要懂得 全身而退。 不要有所依靠 也不要把观念强加它人。强加观念 是一种暴力的行为 恐怕世上没有人喜欢接受自己不愿意的思想吧，那么不要想着改变别人，不必去争辩很多，应该更多地站在别人的立场，言语中我总是关心他人，其实都是自己自私然后加上美好措辞而已，只是把自己控制欲隐藏而已，我并非伟大，很平凡，但又是出奇地无知傲慢。</p><p id="source-b-008">不要再想 改变别人 别人必须按照我说的做 当有遍知力 当你看得到 在非暴力的前提 你才有那种能力。</p><p id="source-b-009">谢谢你的倾听，重新唤醒我的大乘的心，让这一切通向这个世界</p><p id="source-b-010">将自己的傲慢，觉知自己的傲慢 学会倾听。 愿我成为你那样的人 镜子一样的。</p><p id="source-b-011">(船夫水坛子)</p></noscript>
