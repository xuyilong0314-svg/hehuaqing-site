    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>扫楼的时光</h1><p id="source-date" class="diary-date"><time datetime="2013-04-25" title="原笔记创建日期，不一定等同于落笔时间">2013年4月25日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">今天上午的测量课，晒得很，虽然太阳是毒辣的，心情却是很好，天边的云彩很美丽，远处的青山更是迷人阿，那一抹绿色绿得苍翠，我被远处的风景吸引了，忘却炎热的感觉，其实就是心境，心境影响了对外在环境的总总难受，今天下午还去扫楼了，第一次真正感觉到了赚钱的不容易，以后进入社会的更会是让我体会到的，确实经历才是一切，才是一切的根本，没有想到的是今天我竟然会晒伤，现在手臂和脸都是红红的印记，感觉疼痛得很，现实是骨干的阿，如果要用兼职来赚到四千块是多么地不容易，怎么能轻易地让别人放下不要伤心，这一切都是空的，这一切总有一天会幻灭的，总有一天将是不存在的，这种话只能对自己说，或者是找到合适的机会说出来，对于别人很多事情都不要说得那么轻易，要理解别人的心情才是对的，</p><p id="source-b-002">有种莫名的感觉，我想起了凯云的。我在想对她造成的伤害，我希望她变成一个强大的人，一个有自我思想的人，希望我对她的伤害能让她变成有力量的人，内心中充满力量的人，以前我什么都什么都太轻易了，现在我能感受别人的立场，开始我会有悲悯的心情，现在我的脸遭遇了毒辣的太阳，我无所畏惧，就这么着吧，这一切真的都是空的，痛了就痛了休息一下就好了。时间总是会悄然过去的，不管怎么样都是会过去的，黑了就黑了，受伤了就受伤了，有什么了不起的，没有什么了不起的，这是我对自己说的，然而我对云的说话就是时间总会过去的，我想我现在可以和你做朋友了，我真的很是惭愧的是对别人的伤害，我不应该说什么道歉的话，因为他不会接受，我伤害别人的太深，时间过去她会接受我的道歉，或者是没有必要去说一句对不起，这一切都是没有意义的，我现在变了又变了，每一个阶段都在改变我现在越来越强大，以后我还会有所改变，只有在我写日记的时候我才是最完全的自我，完全地看到了自己。说一些平时不想的话，不想对别人吐露的，都写在了这里，这是我的青春我的青春在我的笔下，写了一一段段很白话但是很真实的话，我不可能连对你都不坦诚，日记是我的一个陪伴，是一个埋藏我心事，快乐或者是烦恼的地方。</p><p id="source-b-003">真的，我很感谢爸妈给我争取的一切，今天一天的工作我深深感受到了生活的不容易，谢谢父母给我的这个条件，我要好好感谢父母，我是世界上最幸福的人，父母一生的追求也就是想让儿子成为一个幸福的人，我一生的追求也是让父母成为幸福的人，我现在是幸福的，我觉得我是世界上最幸运的人，我有爱我的父母给我争取种种便利的父母，我有志同道合的爱人和有一群志同道合的朋友，我人生的轨迹是美丽无比的，也是幸运我比的，我要感谢这个世界，这个世界带给我太多的快乐，有时候是悲伤的但是我都是接受的，因为这个世界带给我太多，我真的是太幸运了，我很享受现在的生活，我也热爱现在的生活，不管这个世间给我太多的变故，给了我什么我都会保持这样乐观的心态，这是必需的，乐观是我的天性，善良是我的天性，热情是我的提爱行，慈悲是我的天性。我不能把好不容易培养好的独立，不管遇到什么事情，我都会保留我的态度，我的态度会伴随我一生的，一生所爱的，我的信仰我的一切一切来得顺其自然，这不是幸运又是些什么。一段段过往的回忆都能勾起遐想，人的意识是多少的奇妙，记忆在自己的意识海中，总是能给自己一个个影响。现在赶脚脖子好疼阿，一直都没有这样的体会，抗晒能力竟然是降低了阿，今天下午也没怎么晒太阳，怎么就这样阿。</p><p id="source-b-004">总是无常阿，不论你做得太好，都会有无常来摧毁你的无明，现在就是在破自己的无明，我现在很是怕黑，为什么怕黑呢？因为有了 77这个女朋友开始会子在意自己的形象，算了。这是执着阿，为什么偏偏要为了对方改变点什么，还原最真实的自己，我本来就是一个运动的青年，黑阿，什么的我都不怕 ，以前我都不怕太阳晒的皮肤，今天就变糟糕了，我心中越是在乎别人对自己的看法，越是会把这个执着加深了，根本就没有这个必要拉，这都是对自我的执着，对自己种种无明沉臣服了，如果为了爱人变得很在意自己的容貌，首先是感性的，其实是完全没有必要的，其实要说自己的问题就是执着，不止是因为自己怕黑的问题，真正重要的是自己的心，自己的心执着点什么，必须要去突破就是自己执着的心，越是在这种无明的状态越是要克服自己的无明，既然明白了自己为什么在执着就应该克服。</p></noscript>
