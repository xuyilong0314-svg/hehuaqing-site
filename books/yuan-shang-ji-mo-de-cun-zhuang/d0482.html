    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>幸运如我</h1><p id="source-date" class="diary-date"><time datetime="2013-04-18" title="原笔记创建日期，不一定等同于落笔时间">2013年4月18日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">当然的幸运如我，我是全世界最幸福的人，我身边有一个共同目标的知音，阿福。还有是知音又是恋人的人 77，今天和福去了市区难得的在湖畔边上坐着，悠悠闲闲地谈着一些事情，我吐露了这几天我苦恼，第一次开始会倾诉了，源自于知音的那种信任感，好好好！</p><p id="source-b-002">然后就是如愿地下起了雨，我们在树下的长椅上面，我们没有逃只是在看，没有人的九峰桥湖畔，看着一个个避雨的行人，很是惬意一次又一次的击掌，有了共同的信念很是幸福，又是一个我生命总中重要的人，身上一些烦恼都随着这场雨而去了，昨天晚上说需要一场雨让自己高兴起来，感谢上天的满足，感谢上天的倾听，我爱这片大地，用我的生命去爱这片大地，我极其地喜欢雨，我喜欢着闪电，震撼我心，我不再迷惘我开始清醒理清自己的脉络，看自己的生长方向，改正自己的生长方向，无比快乐的是，在对的时间遇到了对的人，在对的时间和对的人共同努力，在对的人中相互学习，在对的时间中付出不亚于任何人的努力，这就是人生的脉络，有时候都是需要自己来调节自己的心态，只有自己是最懂自己的，仰仗这片大地给我们的启发，我越来越多，我的磁场开始会吸引人，吸引这一个个跟我志同道合的人的，说到幸运莫过于是遇到了知音，志同道合的人，话不投机半句多，遇到投机的人有说不完的话，有用不完的激情，对未来有无限的信心，有无限的激情去面对，因为不是一个人，一生中知音一二足够了。还有什么比我更加幸运的吗？我看没有 ！</p></noscript>
