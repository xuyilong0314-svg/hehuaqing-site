    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>你自以为是的傲慢会伤人的。</h1><p id="source-date" class="diary-date"><time datetime="2014-05-07" title="原笔记创建日期，不一定等同于落笔时间">2014年5月7日</time></p><p id="source-b-001">重新去听我刚才和妈妈微信，我的口气真的很不好，当自己以为很了不起的时候，我却发生了变化。</p><p id="source-b-002">我的傲慢伤害了别人 我开始又不懂得体贴别人，嘴里都是慈悲 但是心里却不是这样。</p><p id="source-b-003">永远记住你此刻的心 永远都是这样。</p><p id="source-b-004">你一定要知道 你盛气凌人的时候 一定是错误的时候，不要以为你自己有多了不起 你的傲慢会伤人的。忏悔</p><p id="source-b-005">上师加持我的，我不应该傲慢 感恩我的母亲 感恩这一切。</p><p id="source-b-006">你一直都是很傲慢的 你一定要看清楚自己 不要以为自己了不起 你的豁达是建立在别人给你的基础上面的</p><p id="source-b-007">如果你没有钱 你根本就不是真正的豁达 将佛法融入到生活里去。</p><p id="source-b-008">你应该检讨自己的过患，看到自己的傲慢 你已经因为自己是素食而产生了 傲慢</p><p id="source-b-009">开始了自以为是的宽容 其实你并不那么伟大，你应该检验自己的心 现在就是检验自己心的时候</p><p id="source-b-010">如果素食让别人心存疑虑的话 那么这并不重要。</p><p id="source-b-011">大乘行者 看发心而不是看形式。</p><p id="source-b-012">简单+普通</p></noscript>
