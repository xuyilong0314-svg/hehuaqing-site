    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>大环境与自我的关系</h1><p id="source-date" class="diary-date"><time datetime="2013-01-10" title="原笔记创建日期，不一定等同于落笔时间">2013年1月10日</time></p><p id="source-b-001">大环境指的是我们赖以生存的，大到宇宙小到家庭，乃至是自己的生活圈，社交朋友，接触的到东西，社会体制，这些都是大环境，大环境是非常重要的一环，大环境是一种潮流，每个人都必须按照它的指示才能上岸，大环境的好坏是决定此岸是天堂或者是地狱，这是起着决定性。世界的大格局，政府的决策，每一个公民回馈给社会的，这都是促成这个大浪的分子。</p><p id="source-b-002">还有就是个人，每个人对这个社会付出的是什么:冷漠、热情、自私、无我、积极、消极。现在有流行一个词 “正能量”，为什么会流行这个词语，因为现在社会的现状就是缺乏正能量，电视上，网路上都报道者，一件件令人痛心，一件件惨不忍睹的世间、“小悦悦”“虐童”...... 正能量的匮乏像干涸的大地，没有甘甜的泉水，显现出的是一幅饥荒的图。人人自危，人人都在找食物，都是找不到，因为干涸的土地剩下了冷漠，因为每个人都把水给抽光藏起来，不知道涵养水源的道理，不知道一个生态中每一环中是不能缺少付出的，一味地私自，只会使大地更加贫瘠，还有一部分人，他们对这个社会有影响力，他们都在传播这正能量，他们努力地甘露投向这干涸的土地、比如说陈坤他是一个佛教徒，他发起一个行走的力量他带动了很多人，他出了几本书，都是关乎心灵，都是为这贫瘠大地贡献，他起了带头作用。孙冕老爷子，他一直都在帮助老兵，因为他的发起，成立了一个专门帮助老兵的民间团体，感恩。还有在网络上很火的延参法师，他在峨眉山用他不标准的普通话火了，一把。他走向了媒体大众面前，弘扬佛法，发出阵阵的正能量，很多法师都参加了媒体，在微博这个平台为大地倒下甘露。 、天后王菲，也是一个佛教徒，女王的磁场，不食人间烟火的女子，她的善举，她的嫣然天使。</p><p id="source-b-003">感谢这些人，还有很多很多、李开复，舒淇 .....我偏重于写出为大地奉献，因为我始终相信这世间是充满爱的，我心中的大地是一滩取之不尽的涌泉，用自己的涌泉去挥洒，为这贫瘠的大地注入甘露，邵小毛的歌很好，词很好，就是一个年轻人的姿态，不服输，对这个大环境不服输，对自己的目标坚持。</p><p id="source-b-004">对与自己的付出要求回报，这个对的，付出就应该回报，这也是一定的，因为种花得花，种果得果。这都逃不出因果的规律，可是有的人迷惘，因为急于求成，不懂得时间会给出答案的。所以他痛苦阿，他做了好事却没得到回报，但是不是往往只看了眼前，史铁生说过，人是自私的人，常常记住自己的不幸，却忘了自己的幸运，这样做是不是对不起神明。没错啊，当我们生病的时候，才知道没病的时候是多么幸福，但是有的人就会抱怨起来，这也是一种普世的价值观，这就是潮流，但是站得高看得到全局的人就不会流于痛苦了。因为没有一个普世价值观，没有这个观点，人会越来越变得冷漠，会抱怨自己的人很快地也会去抱怨别人，随即就把全部责任都抱怨别人身上，到这个社会，才导致了人缺失了热心。没有正义感，看到路边的来人不敢扶，看到小偷不敢喊的事情，很痛心，一些不法分子借由别人的同情心去欺骗，这是多么让人心寒，但要把自己当成一股涌泉，用自己的去滋润这片干涸的大地，很多人都做不出来这种行为，我还是年轻人，可能我遇到的不够让我悲惨吧，我还没足够地被人坑过。所以我能说出这样的，但有一点，即使我给人坑大发了我都要秉持自己的原则，因为这贫瘠的大地需要我这口涌泉。</p><p id="source-b-005">我是不可或缺的，本来的正能量占少数了，我更是不能退缩，我看到了很多人在努力，有的人在歌唱、绘画、书籍、电影 大家都在努力，我看到了你们的努力，所以我也要努力，我要把这口井变成一个湖，我要滋润大地，舍我其谁。这是我的大环境以及我的坚持，每个人都在坚持，他们都跟我一起在行走，他们已经逐渐在作出贡献了，我要像知青一样的决心，我的信仰是佛陀，我的目标是为了这贫瘠的大地。今天爸爸打电话给我，原因是之前我跟我妈妈说过我要坐火车回去， 12点的硬座。爸爸知道就打电话过来了，问我为什么要坐火车，我知道要怎么回答，我就说没事阿，都买了，他说你不知道要等很久吗？我没回答，我不敢说我要省钱，但是最重要的一点就是，我想体会火车的感觉，而且是硬座，我知道这样很辛苦，爸爸的责怪，爸爸说你是读书读到脑子坏了吗？我没有像往常地反驳爸爸，因为我听得出来，父亲不想让我辛苦，儿子明白，儿子明白父亲对儿子的关心。但是儿子要去体验，儿子需要的是经历，我还年轻，我什么都可以去尝试，这一点不算什么，我也不会抱怨。我还有一个想法就是坐着火车去拉萨，我觉得我坐在火车上也是旅途的一段，儿子现在不怕苦，因为我年轻，我需要经历，我需要痛苦的磨砺，我才能明白父亲的经历，父亲也是苦过来的不是。</p><p id="source-b-006">明天我还是去买车票，如果买不到那我还是坐火车回去。然后给父亲发个信息。</p><p id="source-b-007">明天继续。图书馆的气氛真好，很适合我。早点起来就去 K书，在看自己的闲书之于还是要复习复习的。 别挂科了</p></noscript>
