    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>紧迫性。</h1><p id="source-date" class="diary-date"><time datetime="2012-12-13" title="原笔记创建日期，不一定等同于落笔时间">2012年12月13日</time></p><p id="source-b-001">早上。迷迷茫茫地起了床。稍微地懒床了。</p><p id="source-b-002">一天下来，做实验还是很充足的。</p><p id="source-b-003">更是证实了实践大于理论，但是实践也是需要理论来完成的</p><p id="source-b-004">其实，我并不知道自己在做什么，我只是沉浸在动手的过程，</p><p id="source-b-005">每一个细节中，我都注意去控制，最后做好实验的喜悦感是弥足珍贵的。</p><p id="source-b-006">然后呢 下午看了书，周国平的书，写下了一首诗，是人生意义上的第一首诗，自己读着读着也觉得很美妙。这都是我的切身感受。</p><p id="source-b-007">不虚构的，发自内心的文字。</p><p id="source-b-008">晚上下课的时候还遇见了一条蛇。我吓了一跳 赶紧跑开。</p><p id="source-b-009">这蛇是不是就像无常大军，要常常警惕要认识到无常的突然性，致命性。才能从中得到一种动力。一种精进的动力。不去空过 不去过虚妄的人生。面对人生 从而去完善自己的灵魂。</p></noscript>
