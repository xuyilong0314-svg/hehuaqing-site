    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>何静初 何道静</h1><p id="source-date" class="diary-date"><time datetime="2013-05-31" title="原笔记创建日期，不一定等同于落笔时间">2013年5月31日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">今天提前把自己孩子的名字给取了，静初，就像我的初衷一样，寻找自己，那种宁静的状态，自己的本来面目，什么是本来面目，怎么寻找到别人的本来面目，这是我赋予我孩子的目标，这是我一生的目标，也是我对下一代的追求，这个名字不管男孩子或者是女孩子都叫这个名字，然后第二个孩子就叫做道静，修行道上体会到宁静，我正开始在走，我不希望自己走得太快，我同样不希望我亲近的人太快，让灵魂跟不上，可以慢一点吗？可以吗？不要着急，现在我并不急，我的时间有很多，</p><p id="source-b-002">明天就要考证了，写完日就要开始去复习了，这是我必须要去做的事情，这我应该着急的，我需要学这个东西，写吧，我的灵感快来吧，给我一个引子让我来抒情一个篇幅，那么就写写我的幻想吧，我在想着未来的时候我给孩子取的名字，以后的日子我都无法预料，我却想起了我孩子的名字，一切都是不知道的，但是我就是会想，我认为这样挺有意思的，确实很有意思，有时候这样的一个寄望，这也是在勉励我自己，我也想着要出家的，我也有这个意愿，现在说这一些还太早，但是这样挺有趣的，这是一件好事，我需要好好努力，我的一切，当下就得努力，</p><p id="source-b-003">我现在心系着要考证的东西，我比别人晚一步，不能说我比别人的事情多，今天很多时间我都没有利用起来，比如说我每天都要练字，我把练字带到了下午的时候，接着晚上也在练，我还想着要健身，我的事情很多，但我浪费的时间更多，时间的不够用让我意识到自己的奢侈，没时间并不是借口，当说自己没时间的时候要先想想自己是不是利用好了时间，如果没有的话应该要检讨的，要反省自己，练字完全可以不用到晚上的，我却占用了晚上的时间，日记本应该在晚上完成的，这无可厚非。</p><p id="source-b-004">我很多时间都花费了在一些琐碎的事情上面，比如上网写日记的时候我会换换音乐，或者是看看微博，这些琐碎的时间整理起来是非常巨大的，我大部分的时间都是在浪费着，时间总是挤出来的，最近一个月都没有怎么看书，我这是怎么想的？一天阅读的时间最多就用了一个小时，我应该是这一种精神状态， 书是我的生活必需品，网络并不是必需品，网络带给我的东西没有多少有价值的，但是我却用了大部分的时间去浪费者，我一直都在反省自己的时间问题，我应该想好改正的方法。</p><p id="source-b-005">电脑少打开，网络也少打开了，如果说什么对我最有用的是我写日记的软件，我这个傻逼刚才又差点让自己带过去了，心就是这么地漂浮不定，找不到自己的定位，我应该有自己的专注力 现在我在写日记 我就应该是全神贯注，我的灵感才会跟着我，我该在做什么就是做什么，灵感断了。</p></noscript>
