    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>此时此刻 手足无措</h1><p id="source-date" class="diary-date"><time datetime="2013-09-22" title="原笔记创建日期，不一定等同于落笔时间">2013年9月22日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">已经不知道要做点什么了，我反反复复 反反复复，鼠标键上 我不知道我想点到哪里，我没有什么目标，内心中是空荡荡的，我想应该来和你说说话，填补我内心中我的空缺，我的心又一次唤醒，我站在这里，好像没有离别一样，为什么我会惧怕这一切的，当她说起我是不是心中有事的时候，内心汇总的那种骄傲，我只是愿意不愿意，都是指向别人的，我的骄傲是坏事的，我从来也不是一个会主动去联系别人的人。</p><p class="diary-omission">〔中略〕</p><p id="source-b-002">我不是一个渴望爱情的人，我还会言过其实地说，我不是一个渴望理解的人，这未免言过其实了，我想绽放，像樱花一样，随风而来随风而去，从容地并且是璀璨的，我不希望不朽的爱情，我希望的是片刻绽放，因为深知这时间的残酷，我反而会觉得欣慰，此时此刻。</p><p id="source-b-003">此时此刻~我想你是一个寂寞的人，而你又是一个不愿意承认寂寞的人，你说你是一个能忍受孤单的人，而你现在却是寂寞了，你惆怅表达的文字很粘稠，你不像是一个豁达的人，你可能是一个玩弄文字的人，说起寂寞吧，你希望你的微博是有人评论的人。综合以上，你是寂寞的。</p><p id="source-b-004">我找来找去，我找来找去 何处才是我的彼岸。 -- 汪峰给我感动 还有许巍 这两个人是陪伴我寂寞岁月的人，这这里感谢他们。</p><p id="source-b-005">你承认你渴望寂寞 ，渴望理解吧。 还有希望。</p><p id="source-b-006">祈祷 不动明王 度母 加持弟子，让我远离心魔。</p></noscript>
