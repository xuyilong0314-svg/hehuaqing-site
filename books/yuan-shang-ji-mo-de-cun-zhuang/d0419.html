    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>缓慢地，从容地</h1><p id="source-date" class="diary-date"><time datetime="2013-06-20" title="原笔记创建日期，不一定等同于落笔时间">2013年6月20日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">真的很差劲，我为什么都是那么急性子 没办法改正 在对待别人的态度是多么地恶劣，在对待百万的时候我很恶劣 事后我马上反应过来，但这于事无补的，伤害别人就如在钉子在墙下留下印迹，虽然你已经拔出来或者是你已经意识到自己错误了，但是痕迹已经留下来了，我意识到起嗔恨心是多么愚蠢的事情，我要改正自己的行为，为什么会对百万恶言相向呢？因为本身对 CF的爱护，为不希望他被别人欺负，但是像他那种人是不存在吃亏的，因为他的为人处世很好，我比不上她，修行就是这么一回事，在生活中的处世，他是一个包容心很大的人，他不会记仇，他心是纯净的，我显然比他不如，还有他是一个很大度的人，他不会计较 他本身是一个很省的人，但是他能为了朋友喜欢的东西去付出，这让他的人缘是很好的，而我太尖锐了，我总以为自己是对的，但我不以为我是对的，现在看来我是一个思想尖锐的人，但是我看不起别人 我有强大的自我执着和分别的心，我用自己的观念去看待别人 这显然是非常不正确的一种做法。然后我会看不起别人 殊不知这让自己的清净心以后受到来了污染，沉默是金吧，沉默吧，发现我现在的话太多了，而且都是说一些没用的话语，看书的时候也是不认真，今天下午就在地上睡着了，挺困的，最近的状态一直都是不好，森调的实习周真的挺累的，但是也是最有意思的，因为有动起来，这是有意义的事情。爬山也是很有意思的事情。</p><p class="diary-omission">〔中略〕</p><p id="source-b-002">上次我要做火车回家的，但是我爸爸说这样浪费时间 还要去转车，但是我认为这不算什么事情，这次回家我就静静地，做火车回去吧，慢慢地回家，不用那么急 我不明白现在的人为什么要这么急 我们平时浪费在刷微博在看网页聊天游戏的时间还不够多吗 ？到底我们的时间用在了什么地方有什么营养？还有就是我们为什么要这么快 ，这么快的原因就是让自己多争取个 1两个小时上网吗？我相信这是不可取的一种行为，从我自己去改变 让自己停下里 沉静下来 才更像一个人 不被时间节奏所影响的人，这就是一种修行，从容的修行，我大致想想的话 如果我7号回去的话也是在家里休息可能跟家里的人聊聊天 还可以吃吃饭，我喜欢那种离家里越来越近的，旅途可以坎坷，但我还是从容的，辛苦一点地回家这更是有意义的，尽管这有点累，我所在什么地方哪里就是家，这世间我容身何处 何处有我的法身，我也包容虚空，因为我就在这片空间 没有来去，没有来去。此刻就是此刻，我曾离开哪里 也不曾去哪里，渐渐地自己的世界观建立起来了，不用急切地，这是自我的一种领悟，也是自我需要修行的课程，每一刻都观察自己的起心动念这是一件很难的事情，就好像我发嗔恨心在说百万的时候，我拿时候控制不住自己，事后我马上想起来了 这也是我的进步，慢慢来我会做出改变 我会越来越好 这是我对自己的期许，人本来也应该是这样的，我现在写出来的也是很好的，我现在的状态很好呢。</p></noscript>
