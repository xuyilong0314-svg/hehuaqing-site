    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>十步杀一人 千里不留行。</h1><p id="source-date" class="diary-date"><time datetime="2014-09-15" title="原笔记创建日期，不一定等同于落笔时间">2014年9月15日</time></p><p id="source-b-001">从儿时记忆里面 我印象最深刻的有这几本书:四本童话《安徒生童话》《格林童话》《一千零一夜》唯一的一本小说《鲁滨逊漂流记》。 我还记得 我总是独自一个人的，我会在楼梯下面玩叠纸牌，然后把它给推倒，从头再来。 我也会把家里的瓶瓶罐罐重新分类 摆整齐来，我还有一个画面便是，在家里二楼阳台，我看着对面山野里面小朋友自由奔放跑的身影，我是没有资格出去的，我是妈妈的伴，妈妈是我的伴，尽管心中有无限的向往，也就这样，渐渐也养成了 不怕寂寞的性格，即使自己一个人呆在偌大的家里面，那时候确实是这样的，我也不会害怕。自己一个人玩 看看童话书。</p><p id="source-b-002">如果追溯一下 我最有记忆的是 陶渊明的“采菊东篱下，悠然见南山 ” 的悠然自得 李白的“十步杀一人，千里不留行 ”的快意洒脱 还有就是唯一一本的小说， 鲁滨逊漂流记，他不喜欢安逸的生活，他喜欢冒险，他离经叛道，他不愿意在父辈的荣耀里面度过余生，三次出海，被困荒岛 28年2个月19天。 从此 远方一直在诱惑我，诱惑着我 即使道路危险。</p><p id="source-b-003">我时常有一个画面 我是像李白一样的剑客，以决绝的姿态行走江湖，快意人生，我像鲁滨逊一样冒险 不远万里只为了陌生人。最后</p><p id="source-b-004">如陶渊明般 归隐山林，寻常人无处寻，有缘人自来的生活。</p><p id="source-b-005">他们只是在我脑海中 并没有再出现过，然后我们四个人遇到了悉达多 我现在追随了悉达多， 喜欢冒险 爱自由的习气没有改变，一直在路上， 也总是离经叛道 ，我发现离开父母 踏出那离经叛道的一步 意味着我一生都不同了。像一匹野马 嗜自由如命，一旦被套上枷锁 我便红了眼。 它属于辽阔的戈壁与草原 一旦它有御寒的皮毛，它会走向雪山。 它一生奔波 为了找到自由 当有一天他独站须弥山巅 将万里浮云一眼看开。 发现自由已经破碎了。这仿佛是在说我 在说我必须要经历的寻找 祈请 他不再红了眼 枷锁与他和平共处。 因为孤独的人不需要期待 他可以一个人来到千里之外。</p><p id="source-b-006">我的道路 诱惑又充满陷阱。</p></noscript>
