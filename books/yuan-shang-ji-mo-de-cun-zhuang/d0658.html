    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>第二次。</h1><p id="source-date" class="diary-date"><time datetime="2012-10-22" title="原笔记创建日期，不一定等同于落笔时间">2012年10月22日</time></p><p id="source-b-001">hey，今晚我又与你相会了，日记里的我。你有想我吗？今天你都做了些什么呢？</p><p id="source-b-002">今天晚上我主持了新老生交流会。最糗的就是 学长们都走光了。</p><p id="source-b-003">主持不够好，内容安排得不够好，没有及时地调动气氛。要吸取教训。</p><p id="source-b-004">杨舒婷 表达能力，主持得都不错。 安排得不够充分就对了。</p><p id="source-b-005">嗨就好，开心就够了。</p><p id="source-b-006">忙碌吧，别浪费时间。</p><p id="source-b-007">又与你共度今宵，你今天对自己还满意吧？ 只有你自己知道。</p><p id="source-b-008">晚安。 休息吧</p></noscript>
