    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>父爱也是月光</h1><p id="source-date" class="diary-date"><time datetime="2013-07-08" title="原笔记创建日期，不一定等同于落笔时间">2013年7月8日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">父爱像是月光，也默默，不动声色地笼罩，最温柔的月光。回到家里就可以吃到可口的饭菜是最幸福的事情，长大后 我会一直流浪，爸爸会在原谅，他会思念远方的我，他不会说，但是我知道，我也不会说，因为他知道。父子间的纽带不是建立在语言上面，爸爸就似月光一样，在我累的时候，什么也不用说，就是给及我宁静，让我无后顾之忧，父亲一辈子都是在护持我，能有这样一个父亲是我这辈子最幸运，父亲对我爱说就是佛，垂怜我，受伤的时候会爱抚我，心里想到 我要开始流浪，父亲在思念一个远方的人。想到这个画面，很残酷，也美丽，也很温柔。陈杂味道各中你我，如人饮水冷暖自知。</p><p class="diary-omission">〔中略〕</p><p id="source-b-002">火车上面，众生像阿，第一次做了火车是这样拥挤的，这还是好的春运时候才是最恐怖的，很累的是在火车的时间，在我前面的三个小孩两个大人，我拿睡袋给他们睡了，这是我的本性，人与人帮助是应该的，我得到别人的帮助，我本来是坐票的后来也有人分给我座位，一路上遇到的贵人总是很多的，现在回想起来觉得没得做挺可怕的，但还不是这样就过去了，这种困难对我来说还是小事，只要睡一觉就行了，尽管时间有点多，路上看书也是看不下去，下次还会不会坐火车，面临更远的旅程，是五台山，我还是选择硬座的，希望我是幸运的能让我坐到靠窗的作为，我们两个人都是，心中祈愿我的朝圣之路，菩萨加持弟子，我还是会硬座地到五台山的，这种苦我并不以为意，明天是梦参老和尚的 100岁大寿，愿老和尚你能吉祥如意，常住人世度众生，暑假我就要去五台山了，看有机会能见一见老和尚，见一见人瑞，问一些问题吧，有缘的会停下来驻足看着你，没有缘分的人就是在同一场谈话中对不上，火车上我跟对面的几个人就是有缘分的，他们一定也是帮助过我的人，</p><p id="source-b-003">看到那个没得做的人，我很是难受，那时候我也很累，没有办法我只能装作看你不见，我不够悲悯 我还是没有能奉献自己，刚开始给他们睡袋时候，我也是很挣扎的 心中尽管有美好的愿望要帮助他们，但是怕会让人不信任，我的脸长得也不会像坏人，我也是值得信任的人，在世界的平面上 与每一个人相交都是有缘分的人，发现一路上帮助我的人是很多的，生命中的贵人也时常在我遇到难题的时候帮助我。</p><p class="diary-omission">〔中略〕</p><p id="source-b-004">晚上是奇妙的一个夜晚，差点就没能上火车了，还有发微信了，爸爸看到了，我才知道自己的错误 爸爸还是那根柱子啊 细节我还是输给了我爸爸的 爸爸真的是厉害角色 哈哈。</p></noscript>
