    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>无时无刻在等待别人的赞美。</h1><p id="source-date" class="diary-date"><time datetime="2014-05-15" title="原笔记创建日期，不一定等同于落笔时间">2014年5月15日</time></p><p id="source-b-001">还是一样 一直想让别人夸耀我 “你看那么多书阿。很博学很努力阿。你们要多多向他学习。”然后我就这样回答。没有 我只是看了一点点而已或者还可以这样说。我有好几箱书 这只是冰山一角而已。</p><p id="source-b-002">我很厉害哦 我别人更加有知识哦 更加优雅高雅</p><p id="source-b-003">无限的自大 傲慢甚至是 总是在期待别人的讚赏 这样显得被动 在别人掌握中</p><p id="source-b-004">真正的智者从来不会炫耀。而看过一千本书也不一定就很了不起</p><p id="source-b-005">专注 然后关照自己 ！觉知</p><p id="source-b-006">晚安 生性急躁 傲慢 的人</p></noscript>
