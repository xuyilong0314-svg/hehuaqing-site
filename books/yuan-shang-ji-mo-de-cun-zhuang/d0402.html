    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>笨鸟~~~飞了。</h1><p id="source-date" class="diary-date"><time datetime="2013-07-07" title="原笔记创建日期，不一定等同于落笔时间">2013年7月7日</time></p><p id="source-b-001">笨鸟尝到了甜头了，努力的感觉的真很棒，很快地就做完了，有努力就是不一样，真的是不一样了，我也不用担心要给比人抄袭，这是自由，原来这就是自由，努力过的自由，真的很踏实，不用侥幸了，努力的人才会有自信，也只有自己的付出得到了果实才值得别人尊重，我不用去抄袭别人的，我不用等待，我给了自己尊严，这个自己给自己的，努力过得到好的局面是多么值得让人高兴，对此我应该赞扬一下自己，很少会想到赞扬自己，这次要赞扬一定要赞扬，给了自己的信心，以后做事情也是这样，坦诚的感觉是美妙的，不用靠别人也是美妙的，多么美妙的感觉，为此我应该得瑟，多多得瑟，要保持 一定要保持下去，从自己身上拿到尊严才是真正的尊严，很少会有这样的体会，本身我读书是不努力的，很少会有这样的情况，回想起来很少有这样的情况啊，为什么会这么高兴呢？值得庆幸的是我的努力得到了回报，这种感觉多么美妙，这种感觉也只有我自己偷着乐就行了，这种喜悦与别人无关这是自己给自己的。做一个努力的人吧，身为一只笨鸟你要做到就是努力，比别人都努力，不亚于任何人的努力，在别人不努力的时候你更还要努力，不是与别人比，是与自己比，我知道了自己是笨鸟了，昨天发现的，何华清 你真的要努力，不亚于与任何人的努力，因为你知道的，天资平平，是在没有什么东西值得骄傲的，你只有努力才行，不要再有任何优越感了，你要知道 自尊只有自给的。</p><p id="source-b-002">早上的时候我又被当面地，呵呵，多骂吧，帮我消业障了，心里渐渐就不会升起什么不愉快的感觉，人就是这样 不是每个人都是能对你满意的，现在我要淡定我不要声张，因为这并什么了不起，每个人都会的 只是我的速度比较快而已，很多事情我都是愉快都度过，我要放下，只有自己的心清净了，世界才是清净的，我也不是别人能改变我的，修行就是这样，修行就是在逆境中才能升华，升华自己的品格，世界上没有什么东西可以让你悲伤，悲伤是自己给自己的，毁谤佛陀的人，佛陀是不受伤害的，一个圣者是不会被淤泥拘谨的，不要理会，你看现在不是很好嘛？我拿出我的真诚，我的心中没有任何悲伤，这是我的成功了。晚上十二点火车，我可以做自己的事情，我先把日记写完了，今天也就轻松了，还有要练字，这是每天必须要做的事情，不要说没时间，大多时间我都是在浪费，浪费自己的如果我把自己的浪费的琐碎时间拼凑起来，不要找借口，永远不要找借口，今天在考试的时候写字也是歪歪扭扭的，自己都觉得过意不去了，手就是反复地在颤抖，自己拿笔还是没有力道的，写毛笔是需要力道的，写钢笔字也是一样，手腕的力量，能不颤抖。</p><p id="source-b-003">我也是要努力的，我自写得极烂了，我要努力 付出自己的努力还有要坚持下去，这是自己的选择，要自己走下去，尊重自己的，尊重自己的期望，不要让子失望，不要迷惘。可以成功的只要想坚持，我一直都是在强调，我要坚持 要坚持自己的信念。、突然就没有什么东西可以写了，灵感确实没有了，可是呢，要写呢，应该写点什么东西，说自己引用的问题吧，心中也是有虚荣吧，很多引用别人的都是当成在自己的东西了，我这是在标榜自己，也是在剽窃着，自己心中的东西就足够了 改掉这个习惯 或者是署名上去，不要把别人的东西偷到自己的身边来，这也是一种剽窃，实在不知道要写什么了，一直都是来来回回 今天的事情也算是多，今天才正午时候，没有什么东西写是一定的，也是有一个习惯就是晚上写，晚上的时候灵感才会多吧，赶紧写玩了，东西收拾一下就要回家了，一学期就这么过去了，时间太快，谈不上仓促，不急不缓地也就这样了，没有什么特别精彩的，但是也算是充实，这也就够了，暑假要要去北方额。</p><p id="source-b-004">没有梦想何必远方，我即将去远方，远方在哪里 远方在我的心中，想起了一句诗，佛在灵山莫远求 佛就在心中 我的远方也在自己的心里，我不能确定因为这始终是模糊的，因为还没有找到 我才要追寻，我生命的答案，只有在自己的心中才会有所思索，不知道明白在哪里了，在泉州了，或者是哪里呢？然而我的心是思想的，有一种兴奋，久别重逢的亲人们 还健在呢，以后我可能会在远方也可能会在 ，故乡的人说我在远方，我的心在远方，又很近，不明所以的人都会被我搞混，为什么我这么肯定 因为也是不明所以的那个人，心中的远方在哪里我说不清楚，说说心里的那个远方吧，那个姑娘吧，不管是粘人的或者是独立的，我都是觉得不适应的，也不是心中的哪一个，如果让我说更爱的是哪一个，我更爱云了，我只是想看看她，我真的会去看看她，找个时间就约定吧，真的见一面就知道爱不爱了，好久不见 真的想见一见了，只是朋友 只是寒暄而已，心里并没有什么怀念了吗 为什么想要去见一面 或者是说什么呢，我不知道 我现在的心绪是芜杂的，我也不知道自己是怎么想的，我要去五台山了，我要去了，我也不知道要怎么去说， 7. 我还是不要去打扰她了，自由是要付出代价的，自由是可贵的东西，射手座不是爱自由 是自私自利。</p><p id="source-b-005">对远方的盼望往往多与身边，他想去远方，他不知道远方有远 也不知道哪一天能到达，在他没有到达的时候他失去了身边的，他还是义无反顾地去追寻远方追寻自由了，自私的人，冷酷的射手座，是阿，射手只能是射出去的箭 不知道在在哪里，作为箭他只能去寻找远方的故乡。寂寞原上的村庄。</p></noscript>
