    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>无感 之事</h1><p id="source-date" class="diary-date"><time datetime="2014-09-03" title="原笔记创建日期，不一定等同于落笔时间">2014年9月3日</time></p><p id="source-b-001">并不会有很多烦恼 也不会说没有。</p><p id="source-b-002">今天又是没能开始学习英语 连放弃的想法都出来了</p><p id="source-b-003">很容易地得到了报名费 而自己又是有这方面的倾向 为什么自己不能够好好学下去可能是因为静不下心来 自己的总是很容易在做决定 我总是在无尽的等待 生命是如此简单 而我应该好好学习的我不应该要有所推迟 万事总是开头难的。 为了能够走出去 为了能够帮助到更多的人 比我优秀的人尚需要学习 而我不能懈怠 我应该想的是 我还有那么多的时间 我还是可以利用一年只有 4个三月 而又有多少个一年呢。 三个月后的世界已经改变了 是否我会直接走出去 离开我的家乡 离开我的家人 去一个陌生的地方。</p><p id="source-b-004">身体不禁颤抖了一下 是吗？ 是要发生的是吗？ 如果我想要环球的话 那么我应该要好好地学习啊 如果我想到印度 法王的身边工作的话 那么我应该要好好学习啊。</p></noscript>
