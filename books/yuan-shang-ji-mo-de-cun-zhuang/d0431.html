    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>台湾也是我的乡愁</h1><p id="source-date" class="diary-date"><time datetime="2013-06-08" title="原笔记创建日期，不一定等同于落笔时间">2013年6月8日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">小的时候看的的电视节目都是台湾的，家里以前的电视频道可以收到台湾那边的信号，那个叫做 “天线”从小接受的也都是台湾的，很多东西都潜移默化地，今天看到了吴念真的文字想哭出来，吴念真是来自台湾南部的，离我们也是最近的，语言也是相通的，包括文化都是，以前那种街坊的那种情感，那种互助的场面的，我想到就很感动，我对这土地爱得深沉，对文化也爱得极深。我的乡愁就是文化的乡愁，乡土关怀 ~我很难过乡土的文化已经没有了，渐渐地我们对这片失去了那种热爱，从前的农耕时代每个人对土地都有一个观念就是 生于它，死于她。为什么古时候死的人都会还乡，因为爱这片土地爱得深沉。灵魂已经扎根，永远不能改变的是血脉的感情，不能改变的是土地的养育，我对这片土地爱得深沉，我不可以肆意破坏，我应该好好保护他。我很痛心文化的丧失，关怀这个词语已经越来越远了。</p><p id="source-b-002">我有几个喜欢的词汇，其中有一个是 “街坊”街坊对我来说是一种关怀，是那种这户人家有难，每个人都来帮助，是一种无私的感情，是对同胞的那种爱，是真实坦诚的，一方有难 八方呼应的那种精神。</p><p id="source-b-003">渐渐一个个村落遭到开发了，一户户人家进驻了钢筋铁泥之中，一个个防盗门成为了一个个隔阂，也是枷锁，每一个人开始保护自己，人开始各自为事，我最怀念的是关怀，我喜欢每一个人都是那么热心，我不知道那什么词汇来表达我的感情，那种感情是多么地美好，现在我才知道我对这片土地，对这些人的热爱，如果我要做一个说故事的人，我要讲的是人文的关怀，街坊的爱。</p><p class="diary-omission">〔中略〕</p><p id="source-b-004">今天在爬山的时候，我很惭愧的是，我对立林有了偏见，我在别人后面说他的是非，说是非首先自己是错误的，我已经错了，我发现自己是多么地狭隘，我的心胸不宽广，我容不下一个人对我的毁谤，我怎么能包容更多得众生，我分别了他的善恶，我判定了他是一个不好的人，然而第一个烦恼的是我，这样是没有智慧的，我在思索着发现别人的错误，我已经先污染了自己的内心，我要惭愧我不能这样对待他， 不管别人怎么来对待我我都不能报复别人，一切都是因果，一定是自己做错了 如果自己没有错误的话 要忍辱，不要回应，一切都会平息的，要善巧方便，度众生是需要人缘的，我要好好修行，修正自己的行为，而不是看待别人的错误。关注自己的内心，不要去看任何人的错误，看了就是错误的，众生都是对的，只有我是错的，我不需要去争辩 我很惭愧，我用分别心看人，我怎么嫩而过看到本质， 无争！！</p></noscript>
