    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>孤独是必修课</h1><p id="source-date" class="diary-date"><time datetime="2013-05-04" title="原笔记创建日期，不一定等同于落笔时间">2013年5月4日</time></p><p id="source-b-001">孤独是必修课，谁都需要这一门必修课，再亲密的夫妻都有同床异梦的经历，不管怎么样灵魂总是独立的，有自己的世界，特别是精神世界一定是独立的，灵魂没有独立的人无法独当一面，趁早地学会孤独是让自己能面对突如其来的变故能应付，朝朝暮暮的夫妻总有一天会有一个先离开人世，如果自己没有灵魂，依靠别人别人是自己世界的轴心，那么失去了对方自己的世界怎么转动，学会孤独是学会用自己的轴来转动，用自己的轴来转动人生，让自己真正意义上地活着，能独当一面的人一定是忍受过孤独人 或者是体会过孤独的人，灵魂只能独行，每个人各地都需要有自己的生存方式，自己的那个轴，不依靠别人不依靠外物，以自己为心中的那种精神，只有这样才是健康的人，把拐杖抛下吧，让自己奔跑起来，回到属于自己的田野中去，回到自己热爱的生活方式中去，让自己快乐地生活，让自己无所顾忌，能忍受孤独能忍受失去外物的精神力量，才可以抛下一切自由地奔跑，让一切束缚都见鬼去吧，包括束缚本身。</p><p id="source-b-002">为什么要像生产链生产出来的产品一样，完全是没有必要的，每个人都可以不同的，只是你怎么看待这个世界，对于这个世界你认为什么是对的，什么的错的，自己拿捏得好，完全可以活得很快乐，前提要有精神的力量，想要做独特的人一定要在某一方面是卓越的，否则这只是喧哗取宠，而这卓越也是在某一种层次，我不说 ~！因为每个人的定义都是不一样的，轻易给出定义是种不负责的行为，如果你想知道我定义的话，最重要的还是自己对自己的定义，我有对自己的定义，我知道自己想要的是什么。自己想要的心态是什么，自己的人生观是什么，八九不离十了。我的定义，我所要过的人生，我所要走的路我都是不一样的。！我是独特的，渐渐我会强烈起来，我的灵魂 我灵魂带给我的力量。</p><p id="source-b-003">妈妈是最了解儿子的，自己不知道的一些方面妈妈都会很细心地观察，我妈妈一直担心我以后没有进取心，我的原则是很坚持的，对他们来说可能会有点固执，有一点迂腐，但是我就是这样的人，妈妈说我对名利很不在乎我也承认这点，我就是这样的人，我要做的也是这样的人，我并不摒弃繁华，繁华表面内心应该是清静的，这也是我对自己的定义，我不能辜负我的名字，我也不能辜负我的意志，我是一个宁为玉碎不为瓦全的人，在一些底线面前我是不可能去打破的，五戒是我的原则我的底线，佛教是我的底线让我放下全天下可以，放我放下成佛的信念是不可的，但是我的这种信念并不是坚固，我在打坐的时候痛苦我就会屈服，宁为玉碎不为瓦全的精神应该落实在生活中去，这才是修行，修行是在人世间的，人世间才有佛法，在烦恼中有菩提，在逆境中才能成就，逆流而上并不好受，但相比随波逐流我更愿意逆流而上，怪人也好特立独行也好，我就是我，是不一样的，世界没有第二个何华清了，我不能让辜负何华清，因为只有一个，是世界唯一的我。名利场不适合我，我还没有进入名利场，可能我会说得轻巧，以后现实是怎么样的，我都充满自己的信念去面对，我不应该害怕，不要跟我说现实多残酷，如果你不委曲求全是不行的，那么我的回答是怎么走都会有路，我的信念很坚定，我不应该畏惧，我很喜欢现在的何华清，很有自己，我的信念会一直延续下去，因为现在是何华清的人生，我自己走出来的道路我很清楚。</p><p id="source-b-004">今天早上和妈妈在谈话，我自己很惭愧，妈妈说我回家的时候 不管心里有什么痛苦有什么郁闷，都不想表面出来，因为儿子回来几天，妈妈不应该摆着一张脸，不应该把自己的情绪传染给我，我说得太轻巧我，我很惭愧我并不是妈妈，我怎能说出这样轻巧的话，是那么容易放下的吗？并不是这么容易的，如果我的妈妈这样对我 我想我会很伤心的，我不能理解我妈妈的心情，如果我说理解的话，那么我的是假话，我怎么能理解呢，因为她的世界跟我迥然不同的，我只想要安慰一下妈妈 想用自己的能量去感染我妈妈，这是我希望的，妈妈愁云惨淡的时候我很难过，母子之间到了这种境地实在让我很难理解，这个时候我应该理性，不要偏向任何一方，我很难去判断自己的对错，我只能静静地听，也只能是静静地，唯独有静下心来才能明白，这样才能够跳出来看到自己，看到自己内心所思所想，可以变成一个局外人去观看，然后事情本身会教你什么是对的，应该怎么做才是正确的。</p><p id="source-b-005">一回家我的生活规律就发生了改变，在家里没有什么压迫感，我就会睡得很迟才起来，我还不够坚定，就在作息这件事情上面，我是不够坚定的，也没有什么意志力，我在学校的时候还好好的，但是在家里就不同了，在家里就会有无所适从的感觉，感觉做什么都不对，会感觉到无聊的感觉，以后在工作的时候我应该怎么办，在工作的时候自己的时间意味更加少了，那时候我自己控制的时间才是最重要的 在家里的时候我都不能控制好自己，这是初步的，在家里的时候我很少看书，看书的时间都被一些琐碎没意义的事情占据了，一天下来也没做什么，看书应该是无时无刻的一种学习状态，是灵魂的一种状态，是与别人灵魂的交流。 我深知自己看的书还很少， 不知道的人总是以为我看的很多，真实的是我在刻意标榜自己，我不标榜自己，而且是在自己毫无所学的时候。我认为自己还是一个浅薄的人，视野不是一个开阔的人，在家中这几天的日子中就很明显了，在家中这几天我就是一个无聊的人，我深知这样不行说实话！我真的一无所有，最多就是写了一段时间的日记，然后就是看了十几本书，我没有什么！ 不要标榜自己，独立起来，灵魂只能独行，孤独才能让自己从内心中挖掘 圆满。 最圆满的智慧都是在内中挖掘的。 本来就是这样的，自在的 自由地！</p></noscript>
