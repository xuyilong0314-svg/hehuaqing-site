    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>没有无可救药</h1><p id="source-date" class="diary-date"><time datetime="2013-04-09" title="原笔记创建日期，不一定等同于落笔时间">2013年4月9日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">自己身上的种子开始在发芽，我也播下了一个个新的种子，用自己的正能量去播种。用岁月去灌溉，也帮助被人播下种子，最后大家都成就佛果，这是我最希望看见的，这个世界充满和平，这个世界充满爱，没有战争与饥渴。世界大同这是我的愿望，没有阶级的差别，我希望每一个众生都能脱离苦海，脱离这个六道的苦恼，阿弥陀佛。我应该好好做自己争取自己能感染别人，如果 我这一生就为了一个人的解脱而活着，我都是愿意的，我说这个的时候心里也有一点虚，我还常常在对别人的言语，别人的一些行为起分别的心，扪心自问是不是呢？没错啊，哪里有不可救药的众生呢？我以前也是无可救药的一个人，外婆成就了我的名字，并且重新帮我拉回正道，我的一生都是跟她有关的，我很不孝，还会跟外婆顶嘴，我心中也充满了对外婆的不满，如果我是外婆我应该会很痛心才对，我很是不孝顺，外婆比我妈妈帮我的还要多，我能信仰佛教也是因为我的外婆，如果没有我外婆的不懈努力我还是在沉迷中，我最爱的外婆，我总是惹你生气我很不应该呢。我是一个不孝子孙，那一次我竟然让我的外婆哭泣，之后我在洋洋得意，我怎么可以这样？我要忏悔！我应该忏悔，我外婆挽救了我。我心爱的外婆，外婆是一个有原则，一丝不苟的人有时候情绪是可以理解的，大家不敢接触之后，大家对外婆的误会加深了，我是没有什么资格去指责外婆什么的，我现在才明白自己的不是。</p><p id="source-b-002">没有不可救药，只是自己放弃罢了，刚开始的心是狂热的，我总是能热心地去，当遇到了困难我就想退缩自己，这就是退失了道心，我道心也总是在退失，我没有坚持的心，佛菩萨就是不舍弃一个众生才能成就菩提心的，菩提心戒就是要发菩提心，要不舍众生。</p></noscript>
