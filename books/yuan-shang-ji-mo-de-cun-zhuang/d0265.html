    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>心生迷惑的时候</h1><p id="source-date" class="diary-date"><time datetime="2014-03-07" title="原笔记创建日期，不一定等同于落笔时间">2014年3月7日</time></p><p id="source-b-001">现在时候的我 心里有迷惑 我现在为了游戏在着迷 。</p><p id="source-b-002">一天我都没有做些什么 实际性的事情 一天也都是在浪费时间 明天应该是阅读的时候 晚上尽情吧 如果心里有迷惘就去冲破这迷惘。</p><p id="source-b-003">时间一天天浪费 今天在厕所的时候从小窗户看到食堂路上的 即可休眠的树 突然有一种奇妙的感觉 好像是很美丽的样子 很新奇的感觉</p><p id="source-b-004">这感觉让人觉得听美丽的。</p><p id="source-b-005">感恩所有 感恩一切教导我的人。</p></noscript>
