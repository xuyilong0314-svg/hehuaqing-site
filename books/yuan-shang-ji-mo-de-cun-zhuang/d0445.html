    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>坚持就看得见</h1><p id="source-date" class="diary-date"><time datetime="2013-05-25" title="原笔记创建日期，不一定等同于落笔时间">2013年5月25日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">今天学校没电，早上去了市区，有一个这样好的朋友，他知道我没钱了，什么东西都不让我付，而且让我感动的是，他本身也是舍不得花钱的一个人，在对待朋友没话说，很大方的一个人，他以后也会是一个了不得的人，这一点上我跟他比很惭愧，他这一点需要我的学习，他很包容，也很和善，是一个善良的人，我需要向他学习，他也是我的老师，跟他相处不会有压迫感，他很柔和他是我的老师，我很高兴遇到了这样的一个人，这是我的幸运，真的很幸运，他身上有很多闪光点值得我去关注，也值得我去学习的，在某一些方面他胜我太多，我并没有觉得自己比他好，我觉得他好极了，是一个值得我学习的人，善良的人是可爱的，热衷于和朋友分享的人是受欢迎的 ，不给别人压力，包容别人，不计较的是美好的，他身上的优点，都值得我去学习，每一人都是老师，而我并没有什么，我是一个满身缺点的人，胜过别人是自己喜欢思考人生，与生俱来的天性，我是一个佛教徒，我只是在某一些方面能给别人信心，这都是佛陀的慈悲教育，并不是我了不起，而是三宝的慈悲教育。</p></noscript>
