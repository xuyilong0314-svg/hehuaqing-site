    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>病榻上的一天</h1><p id="source-date" class="diary-date"><time datetime="2012-10-09" title="原笔记创建日期，不一定等同于落笔时间">2012年10月9日</time></p><p id="source-b-001">特效感冒药 吃了还是没用阿~ 睡得眼睛都睁不开了</p><p id="source-b-002">神舟精盾太热了。。。。 真心的热。</p><p id="source-b-003">明天就要篮球赛了，扔了包袱，打团体篮球赛。</p><p id="source-b-004">我明天是健康的，快乐的，幸福的 状态很好 投球都进！！！！</p><p id="source-b-005">没有职业规划，没有目标，今天的森林植物没有上，也没有预习 或者是自己重复内容</p><p id="source-b-006">自己说过培养兴趣，兴趣即天赋 天赋就是兴趣。</p><p id="source-b-007">觉得今天空过了</p></noscript>
