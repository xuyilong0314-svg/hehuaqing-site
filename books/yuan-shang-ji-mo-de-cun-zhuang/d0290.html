    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>毫无作为总失信</h1><p id="source-date" class="diary-date"><time datetime="2014-02-09" title="原笔记创建日期，不一定等同于落笔时间">2014年2月9日</time></p><p id="source-b-001">经常会面临的是昨夜美好计划被今晨的赖床给打断，很多时候也并非不思进取，更多的是自己无法克服自己的心，很多时候都是浪费的，应该感觉是忏悔的，每次都会觉更美好的时光是在明天，或者明天可以试一试 明天可以背经很多时候都是在推脱，都是在给自己找点借口，都是情有可原的 ，原本猛烈的发心到了现在会少些许，其实是隐藏到了内心，这段时间我是敏感的，一切都是那么新鲜的体验，好像是生离死别一样。内心开始没有安住于禅定的状态之中，就是现在，我内心还是想要打电话给她的，但是内心的我执，或者会带点愤怒，挺可笑的，你看看现在内心中会繁殖了，繁殖了各种的报复的方式，多么都自以为是，其实 内心中觉得自己受到了委屈，这可怕的我执。我现在继续打了第七个电话，我内心是不想让她接到的，因为我想要报复，每增加一次 让别人增加一次的自责 这又是来自你的无明，倘若内心真的是关心对方的 并不会在意自己打的几个电话而不被接到 你只是想要知道他的情况。 自私与无私的情感 自我的情感，所有的爱情都是通向自我 大抵也可以说是自以为是罢了，我现在属于被愤怒但是会擦觉的人 当觉得自己是可笑的时候 一切就自然的发生了，不会在自己的内心当中停留。</p><p id="source-b-002">多忏悔 觉知 定功课！</p><p id="source-b-003">觉知的力量 不会让自己处于情绪的陷阱</p><p id="source-b-004">忏悔 会是行进的力量。</p><p id="source-b-005">定功课 坚持！</p><p id="source-b-006">愿一切如法的功德 回想给我的父母 心中美丽的心愿能够实现</p><p id="source-b-007">倘若你想真正地出离 那请带上勇气去布施。</p></noscript>
