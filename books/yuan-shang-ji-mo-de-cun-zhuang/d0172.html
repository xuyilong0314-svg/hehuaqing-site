    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>ipad 你来了。</h1><p id="source-date" class="diary-date"><time datetime="2014-06-15" title="原笔记创建日期，不一定等同于落笔时间">2014年6月15日</time></p><p id="source-b-001">差点就把你给忘记了。</p><p id="source-b-002">大部分的时刻也都不是全心全意对待你。</p><p id="source-b-003">有时候迷失自我的时候 竟然忘记了很重要的事情</p><p id="source-b-004">就如我每天都坚持的订阅号码 因为你的到来我忘记了很多本应该做的事情</p><p id="source-b-005">又有某一天 我会开始习惯你 可能不那么地爱护心疼你</p><p id="source-b-006">都说人生只如初见好</p><p id="source-b-007">人很无常 说起人 很有讽刺意味 在某些方面 我们是不及低能动物 我这里所讲述地是智能我们有时候甘心被摆布 宁愿堕落 宁愿像井底蛙 但世上也只有那井之蛙 让人传唱 它被讽刺 而你只能被过时 被淹没 想得到传唱都显那么难求。</p><p id="source-b-008">然后 开始会有一部分人。开始想尽心计 写到这儿也有点混乱</p><p id="source-b-009">说自己学习的情况吧。第二节课 并不那么如意 但是更勇敢一些</p><p id="source-b-010">心里到底还是有一股力量 还是来自于佛法的 我的生命源泉</p><p id="source-b-011">多少次都未能与你梦中相见 寻觅寻觅</p><p id="source-b-012">用平等心对待 切勿傲慢</p></noscript>
