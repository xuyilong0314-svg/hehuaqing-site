    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>虚伪的阅读</h1><p id="source-date" class="diary-date"><time datetime="2013-02-19" title="原笔记创建日期，不一定等同于落笔时间">2013年2月19日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">在说出自己文笔很差的同时你是不是一个虚伪的人，你嘴上说很烂，但是别人说的种种你都在内心暗暗的肯定，我知道你，你的文笔确实很烂，你写一篇文章的时候 总是不能围绕主题 总是跑题很远 总是会言过其实 总是写不出一篇好的深刻的，其实也不应该这样责备 我错了，不管写的好不好都是与自己的对白，这对白只有我们知道 我们的语言就是由心生，我们之间并不需要掩饰 你就是我 我就是你，在我面前你大可以坦诚 不管什么羞愧或者是难以启齿的话都可以对我说 我们可以共同分担 我会一直提醒你 你自己内在的缺陷 你内心中你一直以为你是一个会写文章的人呢 其实不是 你不过是多看了几本本，你没有什么了不起的 我觉得你总是在炫耀自己 炫耀你是一个读书的人 在豆瓣的时候你刻意地在新浪微博 写上自己看了某某一本 这本身你就是虚伪 这种行为也是我讨厌的 你没有必要炫耀 你内心的虚荣心无法使你进去阅读世界，你总是带着虚荣心 我在这奉劝你 不要以为你看了几本书 懂得一点点你就觉得了不起 况且你读的书甚少，放假的时候你安排的十本书你没有如期的看完 什么愿意呢 阅读在你心灵的地位还是很低的 你的求知欲望还是很弱 可能你觉得这消耗时间又可以提现自己是文艺青年的一种行为 其实你是一个二逼青年不就是买了几本书 看了几本书。</p><p id="source-b-002">这个问题上我认为你的虚伪的 我对你坦诚相见我也行为你能虚心接受我的意见，你是为了自己在阅读你是为了在灵魂的层次上找到共鸣 你并不是为了虚荣为了炫耀 如果为了这些你大可以不必了 因为这是对别人灵魂的亵渎 。这段时间你的自控力一直很差，除了每天准时和我说说之外你就没有真正的留什么时间给自己，你阅读的时间少之又少 装模作样我真是鄙视你！！也快要开学了 应该调整自己的生活状态 早睡早起 然后给自己一点时间 让自己可以体会那种闲暇的心情 那种格外美丽的心情。今天一次奇葩的事情发生了在我身上，今天和泰和维在 SM吃晚饭， 维执意要去泰家 我本身不想过去 我觉得去的意义不大，然后就磨叽磨叽了，也就要去了，泰的朋友们带路 其实他们不知道路的 然后说要走高速 我们走到了高速 他们却是迷路了，这是一个不去的转机 我们干脆掉头回家 我们从福浦上了高速 然后从高速到了家里 第一次从一个街道 做高速到自己的家里，这个事情要记录下来，这也是一次经历，可能不会发生的经历了吧。德松来了，我们的共同爱好是篮球 这就是我们之间的联系 所以说 三观一致才能达成共识 成为朋友</p></noscript>
