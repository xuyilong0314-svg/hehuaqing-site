    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>多情乃佛心</h1><p id="source-date" class="diary-date"><time datetime="2013-02-28" title="原笔记创建日期，不一定等同于落笔时间">2013年2月28日</time></p><p id="source-b-001">多情乃佛心，记得刚开始在和凯云交往的时候，我总是在纠结一个问题，我是否应该跟他结这尘缘，我志向是出家，我要舍弃心中的小爱，去成就大爱，其实我心中是爱她的，但是我一直都不肯承认，尽管我们是男女朋友，我心中还是放不开，我觉得这有问题，我向往爱情是不对的，我心里想她美丽，却说四大皆空。记得是在悟空传里面看到，这不是违背了自己的心意？心口不一其实作用不大，徒增烦恼，多情乃佛心，都是一颗颗赤诚的心，让她飘散在凉风中，我应该要忏悔，到了现在我她说话的时候我还是很不自在，我是一个伤害别人的，何来如意，心如意才能真正的如意，对自己而言是虚伪的人，在看悟空传的时候很多话语都有一种触动，就刚才这句我记忆最深。我可以说我是一个欲望陈杂的一个人，我很多时候能控制自我，因为有戒，那些时候手淫也是因为心中没有戒，现在心中有戒了不一样，佛七带给我的帮助也是莫大的。心怀感恩，有时候不要勉强自己把？不勉强自己并不是纵容自己，是听听内心的声音，自己需要的是什么，总是我希望，但愿，不应该说这个词，这个词有中距离感，应该说我要去完成，我要去付诸行动，比如我想去西藏，我不知道经费够不够，如果可以我应该去打工，不要找借口了好吗？在郊区怎么了，食堂的许多工作都是能让你去做的。</p><p id="source-b-002">比如说瓦罐就能去尝试，是不是因为自己内心中没有力量？羞愧，是自己过不良那一关把？我应该能省下更多钱，我认为赚钱并不是可耻的，不用怕别人的嘲笑。一切都是自我的心在作祟，虽然我现在在说这些，一切都要等到明天才能实行。我现在不说，就看你明天的表现，让自己去做自己心中不愿意的事情，这就是修行，乐意的事情哪里来的磨难呢？不要再说什么了，现在的课时都是能让你去付诸实践的，自己把握，或者是说你明天就这么去做。跟7聊天，在大一的时候我就认为她是很适合我的人，因为价值观很相近，而且她也能接受我的总总，不一样的想法。她妈妈也是信仰佛教的，跟我一样是佛教徒，不要执着，一执着就会变味。现在这样也挺好不是吗？在初中的时候我就对你有好感了，总是因为自我的所谓的虚荣或者是尊严，我们走得远了，以前我们都是一起离开学校回各自的宿舍。那时候算是我纯纯的爱意把。心中也没有想要占有什么，只是觉得那一段路能走慢一点，更慢一点。因为我享受那一小段路，对于感情我是一个腼腆的人，每个人都是一样把，在自己纯真的时候，那种纯纯的感情，一切好像都那么顺理成章，好像有某一种东西在牵引，一路上遇到的一些人事物都是是安排好的，然而结果都是由我去创造发生改变的。</p><p id="source-b-003">今天下去打球的时候心情就挺好的，好得失看轻了一切，能和气地去竞争，我觉得这更加愉快。我需要检讨的还有就是看到 360上节目我觉得很不耻，其实是心中充满了别的公司对之的评论，实际上我生活总受到了什么影响了？显然没有，我受到别人的观念，然后自以为是夸夸其谈。这就是一个人的观念，我说不出这是一种什么感觉，但是我清楚地知道着是怎么一回事，这种就是分别心！这就是观念是不理性的。完全没有权利。应该不退转，我发现你现在好像有退转的迹象？你的心绪渐渐被世上的一些东西吸引过去了，这不是真实的自己，什么叫做不浪费时间，时间要用在对自己有意义的事情上，才算是不浪费，对你来说那些笑话的连续剧或者是游戏的视频对你吸引力很大吗？其实不是 这是你个人的一个习气的串习，一切都是自我意识作用，是一些种子在渲染自己的行为，然后自己控制不了自己，这就为了行为，应该要赶紧念佛，念佛才能保持精进，念佛就是念佛法僧 戒定慧。</p><p id="source-b-004">只有常常在善所缘中才能保持不退转的心，才会在菩提道上不会走偏，在自己做出的行为之前应该要提早发现，提早发现了才会遏制，把自己引回正道，心是一个相续的过程，为什么赌博的人一直都不能改掉自己的坏习惯，因为串习习惯了，赌博的心也是相续的，才会有这样的现象，一个人的行为也是这样，一直坚持去做某一件事情，然后有一天不做了，没有坚持了，逐渐地第二次第三次就出现，然后坚持就中断了，随着时间越来越久 这个习惯也就渐渐没有了，养成习惯就是心的一个串习，心的延续，你保持一个好习惯一个好的原则，都是一个道理佛法甚深唯信能入，只有深信佛法的真实才能修有所成，要有信心，对佛陀的教法有信心，我相信佛陀的教育，我也相信弥陀的愿力，我有信心。我也坚信佛法的真实，佛陀是实语者，不妄语者。唯信入善思量，证菩提。为什么要那么在意字数，这样不是失去了意义，我只是与自己对话，但也不是那么说，我说坚持要写差不多也要些字数，有时候我都是路乱扯。</p><p id="source-b-005">多情乃佛心，是对利益众生，对每一个众生都视为自己的亲人，为之无私奉献，这才是多情，佛陀是世间最多情的。多情乃慈悲，而不是世间的自私的爱欲</p></noscript>
