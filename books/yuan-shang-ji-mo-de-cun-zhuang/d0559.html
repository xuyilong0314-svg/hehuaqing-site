    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>坚持是为了能回首</h1><p id="source-date" class="diary-date"><time datetime="2013-01-31" title="原笔记创建日期，不一定等同于落笔时间">2013年1月31日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">每天至少会写下1500字，尽管写的是杂七杂八的，但是都是自己有感而发，每个时期自己的想法，自己与自己的对话都如实写了下来，等到有一天回首看一看旧时光，看一下自己的进步，看一下自己的初心，现在这些美好的理想，美好的坚持都是以后在我人生路上的动力，我的精神食粮。在没有出社会的时候我没有面临任何的苦难，社会的现实我也体会不到，所以我有现在美好坚强的想法，现实如果磨灭了我的意志，使自己变了我最初反对的人，我会回头，因为人经常走得太远了却忘了来时的路，忘了来时的目标，这对我来说是不可妥协的。</p><p class="diary-omission">〔中略〕</p><p id="source-b-002">不知道为什么最近都不怎么喜欢出门，十本书要在假期看完，除去今天我剩下 2.5天，这是非常简单地，只要足够专注，沉浸在书籍中，这种进度是怎么快的，今天去趟安海，在学校的时候我就想要去了，今天是月末的最后一天，去看看，然后回家专心地去阅读，精神食粮是远远超过物质的，物质带来得快乐来得快去得也快，只有在书籍中去体会，那种缓慢的思路引起的精神愉悦感，是绵绵不绝的，通过自己的再阅读，精神世界一直充实，看花花是美的，看人人好的，当下就是净土，当下与佛心相应。</p><p id="source-b-003">觉得自己的心越来越柔软，为什么会这么觉得，因为心宁静了，心变成了柔软，心清净了，感动就会多，真的很愉快快，自从了书，写了日记，内心就越细腻，越去体会，生命是美好的，如果有人问我，你幸福吗？我肯定是幸福的，除了物质生活的无忧无虑，我的内在生活也是充实的，所以我快乐我幸福，在时间上面我有紧迫感，我对时光也是珍惜的，未来二十五天我的是这么定，但是有的事情还是会消耗去自己许多时间，人际关系是要做的，我更要把握好自己的时间，能让自己独处的时间自己更应该要好好珍惜，好好利用。独处的生活更能去思考，在热闹中我逐渐感觉的到聊了不适，因为话题的不同，每个人都会有吸引力。</p><p id="source-b-004">一天下来就是会去写一些东西，如果让我写一天我也是能写，比如说我现在看到杯子我也写得出一些文字，这也都是我的感悟，我的感觉还没有完，我不知道今天会几点回来我先写下一点，这是我的坚持，每一天的坚持今天去了饭阿那里，和丽珍聊了一会天，很愉快记忆都回来了，她说到一个我忘记的了，一次我和有家通宵回来那天在考试，我们又睡着了，丽珍叫我们起床吃饭，可能是通宵的原因我也忘记了，今天想要去学校，没能进去看看学校，我也不知道改变了多少，想去看看秀汝阿姨，也没有看成，园阿也没看成，有缘的无缘的都是这样都是一样。今天一天也算是浪费了很多时间就这么把</p></noscript>
