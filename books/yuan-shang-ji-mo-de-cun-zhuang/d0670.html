    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>国庆日回校了、</h1><p id="source-date" class="diary-date"><time datetime="2012-10-07" title="原笔记创建日期，不一定等同于落笔时间">2012年10月7日</time></p><p id="source-b-001">今天晚上见到了她。觉得吧，没有想象中的，那种感觉，觉得还是平平淡淡的，好像没有那种 相见恨晚的感觉。 我无权干涉你的生活，其实爱情就是心甘情愿，我也说过 你是值得的，他就会来的，心甘情愿地为你。 顺其自然吧，不执着，做好自己就行了。 爱吃蛋的江敏 -----晚安 祝你好梦。 我能感受得到，我们之间的变化，你好好休息</p></noscript>
