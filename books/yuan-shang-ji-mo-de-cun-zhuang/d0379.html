    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>寄情于文字</h1><p id="source-date" class="diary-date"><time datetime="2013-07-31" title="原笔记创建日期，不一定等同于落笔时间">2013年7月31日</time></p><p id="source-b-001">又快要打破自己的规定了，去五台山路上在手机上面还会有写些东西的，到了五台山的时候就没有了直到昨天晚上连一个标题都是没有的，昨晚肚子痛得很，没有心思了 直到今天还是会有所疼痛今天拉了多少次的肚子了，但愿明天能好起来，生病的时候才会想起自己健康时候多么幸福 人无时无刻不是幸福的 知足的人儿少之又少，包括我。我是那个执迷不悟，通常我在自我鉴定中发现不足而懊恼 师父说我把事情都复杂化了 这是一种正常的现象我的意志力一直都不是那么好的 我通常也都夸大我的 平时在学校是五点多的时候起来的，我一直都用这样的借口 在对自我严格上面 松弛无度 太过于紧张 又太过于放松了 我苦恼的根源不知道中道是什么东西 我现在多想一些是好事情 我内心中的波澜尽管汹涌 我以此走向沉静的高峰 也可以是谷底 内心中充满着力量，而我呢 身上是什么样的力量。</p><p id="source-b-002">坚持的定力谈不上吧 那么久时间的日记也因为这段旅程结束 先前所表现的决心也是给自我瓦解 或许是我有所预料 之前就这么说过 不是我找借口 如果我在路上了 那么好好在路上 家里面 梦里的延伸自然是要继续的 我不需要自责 开始规定自己写的是一个小时 之前写的两千个字的烂东西 已经是告别的 提取自己心中的精华 一句话抵得过2000字的繁琐 不要那么啰嗦 之前文字的历练已经要告别 开始写出一些让自己容易欣喜 纯粹是因为喜欢 穷着思变 知道自己的不足加以改变某种方式 会让内心中某种东西能真正呈现，那么开始的每一天都是一小时 多是偏向内心呢，当是安静一小时给自己一个空间，生活中挤压 现实中多么现实的东西开始向我聚拢 心中的净土 以及沉静的力量寄情于文字吧。</p><p id="source-b-003">有春夏秋冬 有美丽的你。</p></noscript>
