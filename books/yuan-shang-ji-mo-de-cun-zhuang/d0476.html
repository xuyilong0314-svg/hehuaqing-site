    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>理想主义者.</h1><p id="source-date" class="diary-date"><time datetime="2013-04-24" title="原笔记创建日期，不一定等同于落笔时间">2013年4月24日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">我是一个理想主义者，是理想主义的忠实信徒，不要告诉我要面对现实现实阿，要做自己想做的事情，首先你在某一方要是卓越的，机会来了才可以抓住，要有个性的前提必须是一个卓越的人，卓越的人才允许有个性，平庸的人哪里会有个性可言，如果有的话那充其量是乌托邦，充其量也只是强撑出来的，而且会受到现实生活的迫害，想要有个性必须是卓越的，做一个不平凡的人，就是做自己想做的事情，我喜欢山，我是大地的孩子，我走上了林业的道路，我的专业知识很烂，烂透顶了，而且总是能给自己找点什么借口，我以后要走的道路也因为专业很大关系，我要向着这个目标，物质我可以很少就满足了，我想把更多的是奉献给这片大地，给我身边的人，我力所能及的事情，我必须要有梦，要有希望，我希望成为一个外在卓越内心平凡的人，如果要卓越必须是要努力的，</p><p id="source-b-002">我要承认我在学习方面确实差强人意，上课总是不能集中精神这也就罢了，下课不懂的也不会去问别人，不懂的还是不懂，很多需要了解的都烂在肚子里面，经常都是在检讨自己这个问题，进展也一直不大，学习方面我确实很差劲，记忆力也很差就现在而言，学习上面总是力不从心，理科方面的专业我更是力不从心，我想我还是想想怎么种好树，就算不是卓越的至少也是要懂些东西的，或者是一个种树的人，或者是一个卖花的人，在资金流动之间漂浮，平安无事，会平安无事的，一天的时间内要为自己多争取，要争取一些时间让自己利用，是有用的东西，看电影或者是看书，给自己带来精神上的享受，</p><p id="source-b-003">我是一个理想主义者，我抱着对这个大地的爱，看到母亲伤痕累累的舍不得，我应该尽自己的努力，没钱没关系，我希望我的爱能在大地上绽放，我的目的就是为了要改变环境，喜欢母亲的身上能有生机勃勃而不是乌烟瘴气的工业文明，工业文明没有停止的一天，因为人类在贪心着，没有度的索取，现在大地的自然循环已经被破坏了，资源已经被开发利用濒临枯竭的时候，我真不希望有一天大地真的枯竭，人们苦苦无助并以泪洗面，平安无事，会好的，会好起来了世上有千千万万我这种人，对于林业来说，我没有身份没有背景，我只是怀揣着一颗梦想，作为一个理想主义者，你不必跟我讲现实，真正的理想主义者是看透了现实，但他仍然敢做梦，我的梦会指引我的方向，我的信仰让我人生的更加明亮我知道自己的对错，我很明确地知道什么是正确的，所以我敢做梦，也乐于享受做梦给我带来的享受，桥都坚固，隧道都光明。</p><p class="diary-omission">〔中略〕</p><p id="source-b-004">我要多多感谢我的父母，父母给了我选择的机会，我是一个再幸运不过的人，世上没有人比我幸运，如果有的人，那么就是你了，看不看懂都是无所谓的，因为这是发自内心的满足感，物质方面我已经是非常地满足了，父母供养给我的一切使我无后顾之忧地去看书，我可以五点半起来看书，而不是五点半起来工作，我非常的幸运，在精神方面我有信仰，我在书中在电影中寻找自己的影子，我也能具备的那些品质，我一直都在挖掘，因为有了这样的环境，精神与物质上面的满足，我对未来总是乐观的，我总是心怀希望，环境的因素对一个人的影响是非常大的，有的人迫于无奈，我就是那幸运的人，非常非常非常地幸运，我发现我很幸福也非常的快乐，我总是能在生活中找到乐趣，找到了志同道合的爱人，还有志同道合的朋友，这又是多么的幸运，我身边都是一些支持我的人，义无反顾地走下去，不要想过去不要奢望未来，此刻你是快乐的，你能应付你生活的周遭，该来的会来的，不管是好的坏的，我都接受，我接受这一切带给我的，好的坏的只是一种方式，重要的是自己的内心，是否明白自己在做什么。</p></noscript>
