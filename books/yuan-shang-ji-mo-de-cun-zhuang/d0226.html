    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>大 糗了</h1><p id="source-date" class="diary-date"><time datetime="2014-04-20" title="原笔记创建日期，不一定等同于落笔时间">2014年4月20日</time></p><p id="source-b-001">昨天晚上并没有如实地睡在帐篷里面，后操场太吵杂而且地面都是沙土，不易入眠。还好残福有跟我过去 要不我那天晚上就要成落汤鸡了，这么多决定性的东西 都是在一刹那发生的，人生的贵人同理。还有跟月吵架了，我发现自己的内心出现了隔阂 真的出现了隔阂了，发现自己好像是错误的，其实不想为这些事情烦恼，因为一切都是会顺其自然的，我一直都是在迷失，迷失在过程里面 我一直都没有做好自己的本分，一直都在浪费时间 我对这样的自己很难过，但是这样并没有什么用处，原本心中的梦想是出家为僧，但是因为出现了某一人，我始终都在改变自己的想法，开始在怀疑自己，没有什么能够阻挡我出家的心 是这样的吗？没有什么能够阻挡我想没有什么能够阻挡我要睡觉的心。</p></noscript>
