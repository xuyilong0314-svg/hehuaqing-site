    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>活在当下的非实用主义者</h1><p id="source-date" class="diary-date"><time datetime="2014-05-19" title="原笔记创建日期，不一定等同于落笔时间">2014年5月19日</time></p><p id="source-b-001">我专注当下，我希望当下就能够做得更好！但我并非是实用主义者，我是一个专注的当下的理想主义者，永远都在描述自己的理想国。也永远都是是在向往着。我又开始着自己的我慢了，好像自己很了不起 总是很废话，真的废话很多 应该改变自己的这个缺点 话多不如 话少 总应该记住 你时常暴露自己的我慢 言多必失。很多时候你都是没有觉醒的， so时空因缘都是在变化的，就像是我以往那种心，我发现我的录音已经不见了，曾经撕心裂肺的录音，自己要出家的志向，至少这件事情我学会了 天机不可泄露的。大师父就是能够照见。当一切都是往事 也只有这么静静地看 在这变幻莫测的岁月流年里面 保持在自己心的安定 。</p><p id="source-b-002">今天出去进水果 过程我没有感到那么辛苦，很多事情都要去做 我们也没有做那么好，今天只有一单的生意，但是我们却很喜悦 起码这是成功的了。</p><p id="source-b-003">不亚于任何人的努力 不管是做什么都是一样的 明天一定是要早起的。</p><p id="source-b-004">明天还得去进货 尽管是一点点的 我们都要去努力 想走得更远 只有去努力 一直去争取 自己能够做到的事情。</p><p id="source-b-005">立林不给我复印 我开始心怀芥蒂 我心里开始在说他的小气 我刻意想引起他的注意力 其实这就是缘分而已 只是这样而已 其他多出来的东西都是我的妄想 我的不满是没有缘由的一切上师加持 祈求上师加持我的事业 祈求一切上师。</p><p id="source-b-006">感恩一路上的上师 使我没有偏离正见 在任何的时刻我都能忆念三宝 不管什么。</p><p id="source-b-007">三宝是我唯一的向往。</p></noscript>
