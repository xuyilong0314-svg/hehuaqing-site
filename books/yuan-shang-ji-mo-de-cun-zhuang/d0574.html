    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>福音</h1><p id="source-date" class="diary-date"><time datetime="2013-01-16" title="原笔记创建日期，不一定等同于落笔时间">2013年1月16日</time></p><p id="source-b-001">今天第一次接触基督教，一群很纯粹的基督教徒，他们信奉的是主，没有任何理由的相信，之间谈论了很多，我也问了他们一些基督教的问题，我是佛教徒，我信仰的是佛教，我洞彻的佛法比基督教更超越，本质一样是好的，一样是宗教，他们也是永恒，但是他们都是全凭耶稣，信耶稣就可以得永恒能成为神的儿子，我觉得不实际，因为来得太容易的东西往往都不实际，他们认为耶稣是创世神，神是可以改变他们的命运的，不管怎么！但是他们也是有基础的，有信条，会去遵守耶稣的信条，是有原则，这比那些没有信仰的人好得太多，他们也是反对世俗的物质的，反对那种永远追求物质的心，他们说的话我也是给予中肯的，是好的，原则上是好的。还有一点就是他们在祷告的时候，我听到了真诚的，我有感受得到感恩 ~在他们认为一切的一切都是主给予的，没有主就什么都没有，但是佛法告诉我们凡事都要靠自己，要看自己去领悟，看自己去修行，才能得到，他们是偶像主义，高高在上的。今天晚上我还是无法畅所欲言，有顾虑，他们也是对他们的宗教有信心，他们自己组成的一个小团体是一个不错的，有积极向上，从那些歌词都可以，基督教缺乏的是佛教的:平等。</p><p id="source-b-002">因为他们始终都觉得神创造万物，神是不可逆的，我尽量地跟他们说，不触及丰满，发心度化他们，基督教是不具足的，虽然说本质上是好的，但是层次上是有差别的。我该想想法子要怎么用善巧方便来引导他们。我要先打破他们的那种信。其实以后跟他们谈话，我不想掩饰，我要表现出我对真理的渴望，晚上我说到西藏，我最初的目的就是冲着纯净，那种纯粹的佛教信仰。他们也是试图让我摆脱那种佛教的观念，他们跟我说佛教是坏的，说有佛教的，都是一些穷的国家，因为他们没有因果的观念。他们还是学得很浅薄的，很多中心思想也没有想明白。信仰的价值核心。</p><p id="source-b-003">今天爬山的时候意外又遇到了那个流浪汉，跟他做了聊了一会，我问他现在有没有工作，因为口齿不清跟他说很多话我都听不大清楚，但是我认真地去听，我刚开始跟他说，这样下去也不是办法阿，他说是啊，他好像每天就是游泳爬山，当时有一个想法，让他去晋江，我想尽己所能帮他一把，尝试帮他找一个工作，想帮他出车票，都后来他说他有工作，就是每天游泳还有钱，我想那应该也是一个好心人，一个有同情心、慈悲的人。我说你现在的家产就是身上的东西了吧，四海为家。其实这样的人，也不能说他不幸福，他们生活在生活最底层，经济也最差，但是他们没有包袱，了无牵挂，什么都没有了，也就那点东西，以天为被，以地为床的日子。要深刻的反思:我们在拥有物质的时候，不能起贪念，执着的心，应该也要有随时放下的情怀，了不起的是在功名利禄上面还能保持那种流浪汉的那种洒脱，是那种心态。</p><p id="source-b-004">临别行，把自己中午要吃的烧饼给了他，三个烧饼是小事，我能给予的就是一丝人间温暖。祝他好运。 今天去买烧饼的时候我给了那个老阿婆一生肯定，相信要也是很高兴的，人生途中多给别人信心，多给被人肯定，不论职业都是一股另他欣慰，一股想要做得更好的心。</p><p id="source-b-005">南平早上很多人都是爬山，散步，生活节奏挺慢的，挺好。如果生活本身都随着物质奔跑，那会很累，而且内心空虚，那些常常会想着去踏青的人，精神上面相对是富饶的，因为他懂得去亲近大自然，没有忘却大自然，能体会大自然的那份纯净，也相信大自然的纯净能使自己的烦恼减少一丝。还有另一方面就是锻炼能得到的是健康，爬山的老人年轻人是个半的，这是值得惊叹的，因为很多人到了老了都喜欢在家里看电视，不想出门，不然就是打麻将，打牌，这显然对生活没有什么帮助。身子骨越不动是会越老的，就好像机器不用，零件会生锈，身体也是这样，头脑更是如此。 九峰公园还聚集着一群跳舞的老人们，青春洋溢，那天还看过，一对满头白发的老翁夫妇，手挽着手，这就是白头偕老，这就是爱情提炼的纯粹。</p><p id="source-b-006">爬到了山上，在那里静静地坐着，准备看书，一对 60几岁的夫妇上来了，老奶奶跟说，坚持地上来了，她还很欣喜地跟我说，她就要做太奶奶了，我感受得到她的快乐，我也为她高兴，我问她以前，她说以前很苦阿，吃的都是一些糟糠的东西，我还问了他关于知青的问题，她说有阿，那时候的知识分子都来乡下接受再教育，她说那些知青刚来的时候手里都水泡。那时候的知青的愁苦，我也能感受得到，一个个壮志凌云学了知识要报效祖国，但一个个都去教书了。那种不得志的愁，跟以前许多诗人都是一样把，只是他们不敢写下这一篇篇诗集，如果能写，那也会是一个文艺复兴的格局阿，受到的苦难都可以化成丰富的灵感写出来，只怕比前人更加强烈，但没办法。她们给了我一些花生米，给我填了点肚子，我不矫情，我欣然接受，接受被人的供养，并说谢谢是极好的。 那时候在山上躺着的感觉是极好，先看看书就翻翻，不想看看书看看天空，看看旁边的树，或者是躺下睡一个大觉都行阿。</p><p id="source-b-007">下山的时候，听到了一个声音，好像在吟唱，刚开始听错了，以为是佛教的什么的，在吟咏，后来看了是一个大伯在放一个录音机，很大声，唱的是一首关于高原的赞歌，我一直在旁边静静地听，我想他会不会现场来一曲，后来知道他录音机里的是他自己唱的录下来的，他在听有没有什么错误，我其实是被他的二胡吸引的，我想感受一下我们中国古典的乐器带来的艺术，那一刻我觉得他就是一个艺术家，他对每一首歌都很认真，一遍遍地听，看自己哪里错误了，哪里需要改，我一直在看他的那种谱子，大伯以为我很喜欢，他说想学，把那谱子给了我，我欣然接受。接受这份礼物，一个艺术家，一个唱曲的大伯。我问他是不是每天都会在，他说几乎是，这就是他对这音乐，这艺术的热爱，他也是一个精神饱满的人今天一天的经历很精彩，遇到的人事物都很精彩，我今天的文字是很顺畅地一直写，人生需要经历，文字需要经历，文字需要思考，需要与现实的碰撞，今天去爬了九峰山，遇到了流浪汉，遇到了要做太奶奶的婆婆，还有落下了那个理头发的那个小伙，也是谈得来的，说了几句话。后来遇到了拉二胡唱小曲的大伯，遇到了一群可爱的基督教徒。今天真精彩，真美好，呆在宿舍看书之余，还是要出去看看外面的世界，才会有新的思想，新的见解，对这个世界有更深刻的认识</p></noscript>
