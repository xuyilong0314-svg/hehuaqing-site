    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>但愿 你一生平安</h1><p id="source-date" class="diary-date"><time datetime="2014-04-02" title="原笔记创建日期，不一定等同于落笔时间">2014年4月2日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">晚上泡茶 惬意 我发现每个人心中都有英雄的梦想 我们讨论了好些方案 我们希望将一切付诸行动 不仅仅是一种形式 爱鸟周 不只是一个形式。</p><p id="source-b-002">跑过去跟CF说 :不管纸糊的鸟窝能不能够成功 哪怕是有缺陷的 但是如果将这种信念传递出去 这就是值得的 世界就是因此而改变的。</p><p id="source-b-003">我所做的事情不一定是此刻就有成效可能在未来某一刻就发芽了，我相信信念，更是坚持信念 。</p><p id="source-b-004">一切众生本具佛性我现在能够去体会到。 听到 白华森大道的时候 唤醒了 某些时候美好的品质 那时候的精神状态。</p><p id="source-b-005">为什么现在不具备这样的状态 因为我现在被一些外界 所影响 还有更重要的是心魔 内心的障碍才是最主要的原因。</p><p id="source-b-006">我们接触这个世界 都是通过我们的意识 其实每一时刻都是一样 环境并没有改变什么 是自己的心出现了问题 被自己的懒惰 被自己给打败了。</p><p id="source-b-007">我可以称那个时间段为往昔岁月 我也将回到往昔岁月 我不能说某一次的消沉是不好的 消沉是为了让我看到更加积极的一面。</p><p id="source-b-008">佛陀的所有教言 不管是通过什么样的形式都是为了让我们回到往昔岁月 那本来不生不灭的状态。</p><p id="source-b-009">明天就要去黄山了 愿一路的旅程能够平安 如意 愿一切上所有行为都具备慈悲 具备柔和 。</p><p id="source-b-010">你可以更慈悲更柔和。</p><p id="source-b-011">每一段旅程都是一次 看电影的机会 包括现在的你 小心注意你的心 不要入戏太深。</p><p id="source-b-012">我会离开你几天希望你想我 希望你能够时刻记得 完好无缺的你。</p><p id="source-b-013">之前的日记写到了两千多个字 现在少了那么一些废话 开始跟随自己的心 不会跟字数过不去 开始不会想炫耀自己有多少的成绩 这是更加真诚的文字了我想应该多多写自己生活的每一天 看已往的经历是多么有趣的事情 那时候原来是这样的那时候我心态是这样啊 如果那时候我的心态变化 会是怎么样的一个结果 我不知道 就像我现在写着这些文字 也是为了以后我那个我做准备的 这是我的财富 也是我能够为之坚持并且是有意义的事情 唤醒自己的心慈悲的心是没有敌人的今天的这几节课自己的心不那么地安静 我自己知道 我现在想起了爸妈 我想给爸妈打个电话 思念是 牵挂那些遥不可及的而产生的情绪 我认为思念成分应该是 带一些忧郁的 虽然不能此刻就触及 但是知道他在那里 你可以去想象。而思念去世的人 可能会有些悲伤疼痛 但是你总会忆念他的好 可能还会说 为何生前 无法贴心呢。</p><p id="source-b-014">那么应该睡觉了</p></noscript>
