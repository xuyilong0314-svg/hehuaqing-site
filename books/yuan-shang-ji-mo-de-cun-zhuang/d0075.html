    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>穿越悲喜的迷雾</h1><p id="source-date" class="diary-date"><time datetime="2014-11-26" title="原笔记创建日期，不一定等同于落笔时间">2014年11月26日</time></p><p id="source-b-001">我很伤感，比没有得到女友家人的肯定 更加的难过。</p><p id="source-b-002">这真的让我感到悲伤，莲师 你听见了吗？ 我的大悲心哪里去了呢，我不是一个好的弟子，上师始终不来找我。</p><p id="source-b-003">没有获取世间名利，这不让我感到悲伤</p><p id="source-b-004">没有获取爱情诗意，这不让我感到悲伤</p><p id="source-b-005">没有获取健康长寿，这不让我感到悲伤</p><p id="source-b-006">没有上师来寻找到我，这让我悲痛</p><p id="source-b-007">这是我的执念，又或者，这执念是假的。 到底什么是真的呢，只有风的足迹</p><p id="source-b-008">我每天都会祈请 祈求上师能够来找到我 寻找迷路的羔羊</p><p id="source-b-009">我在这里等待，这是上师对我的考验。</p><p id="source-b-010">此刻寂寞孤独的处境 使我受益 让我知道 上师多么稀有 就像祈请莲师一样 祈请上师。</p><p id="source-b-011">我的信心是繁星中的一颗。 我每天都会祈请 上师带领我穿越悲喜的迷雾</p><p id="source-b-012">看到寂静的花。</p></noscript>
