    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>嗨，来了，在你跟前</h1><p id="source-date" class="diary-date"><time datetime="2013-12-02" title="原笔记创建日期，不一定等同于落笔时间">2013年12月2日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">有多长时间了，在空房间的里面寂寞吗？在外漂泊的我状态明显不佳，常常都会迷失自己，忘记了你，或者是说故意装睡，故意地逃开你的眼光，没有反思的一天天里面，你得到了什么呢，每天都祈祷，都会在祈祷度母给我加持，也有迷惘，自责是少不了的，多久的时间没有敲打键盘，记得有一次说过，当遇上爱人的时候，我的灵感全无了，灵感已经是消失殆尽的了，在这么一个夜晚为何我来找你，重新想要找回那一种感觉，很多时候都会怀疑自己，怀疑自己的坚持，或者是说就此放弃罢了，坚持是有那么一段时间，有一年的时间了，我常常会炫耀说这是我最宝贵的礼物，我最不能失去的就是我的日记，每天自我的独白，可是呢？荒废了至少有快 70天了吧，仿佛就是一瞬间，但是与你相聚的日期看来，我很少回到我的庄园，马云云:找不到梦想的时候，就去找吧，有时候找到自己应该坚持的，但就是没有坚持下来，我不能放弃与你的聚会，灵感的总是容易消失殆尽的，如我阅读之前自己写的东西，天啊，这些竟然是我写的，那时候的语言，自我的语言是这么奇妙，灵感是这么一回事，真的是这么一回事，坚持是一件不容易的事情，如我无法坚持每天固定的时间醒来，如我废弃你快要一个季度，应该要懊悔吗？不是的，有那么一段空白我又回到这个村庄，是否我会更知道什么是独白，为何而写，</p><p id="source-b-002">我总是在炫耀我的字数，甚至我会去百度 “长篇小说有多少个字 ”发现有五十万字的，每天都是在拼凑，仿佛字数是一种象征，又能代表什么呢？我只不过是说了一大堆的废话，如两千字里面有一句真诚的，不夹杂私心的文字那应该是多好呢？那么我得从新回去看看，那么这 2000个字是有那么一点意思的，有时候你会很彷徨，或者是说已经是在迷惘的荒野度日，发现此时是我想要的，这种空间，与你幽会。谢谢你呢，我现在很平静，我再是以一个凑字数的身份，不是一个心不在焉的丈夫，那么贴近自己吧。</p></noscript>
