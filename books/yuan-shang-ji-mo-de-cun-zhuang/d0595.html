    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>那眼。</h1><p id="source-date" class="diary-date"><time datetime="2012-12-26" title="原笔记创建日期，不一定等同于落笔时间">2012年12月26日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">在公厕里面遇到了个流浪汉，他对着镜在梳头，我不打扰，在外面等。他出来了，我说:有什么可以帮助你吗？他说不用。我看见了他的手，残疾。我递给他二十块，让他收下，我说:我这不是同情你，这是人本有的关怀，他收下。我说人都会有低谷期，他说是。我说:不要放弃，我只能帮你到这，再见，转身走了.在桥头的那时候，我看见他艰难地用手腕提起包来，我心中那种感觉，看到苦难的，那应该是慈悲心把。我一直往回头去看，我希望他走过来，我想拉他一把，我一直没有等来。找了个借又，上厕所吧，我在走近的时候，我一直在回顾，我希望看到他，我希望拉他一把，我心中有种预感，我会遇到他。</p><p id="source-b-002">在厕所，我看见他，是他，他竟然在梳头，一个无家可归的人，一个衣着破破烂烂，他竟然会梳头，他会在意自己的形象，我觉得他不应该是流浪汉，我在外面等，他还没出来，我先去上:厕所，我知道我会等到他。我看见他，我拍拍他的肩膀，他一阵战栗，是不是他经历了什么？他经历什么苦难，一个陌生人跟他打一声招呼，他会战栗。我现在还记得他的双眼，浑浊但不失意志力，我说你吃饭了吗？他说:还没。我看见他的手残疾，我让他不放弃生活，我让他要去工作，我说一只手也能有工作，他说干不了重力，他说他能扫地，但是他连扫地的机会都没有，我不知道他的未来是怎么样。我跟他说，人生都会有低谷期，你不要放弃，他点点头，我希望好运能照耀他，拉别人一把，其实是取悦自己，我们在奉献的同时，自己是愉快无比的，那种爱的流露，是真实的快乐，不需要弄虚作假。</p><p id="source-b-003">我应该感谢他的，我并没有帮了他什么，我只是帮我自己，我自己心灵的救赎，自我心灵的漂洗，我越来越充满来，我懂得感恩，去关怀。 二十块不算什么，我希望我的愿力能给他力量，我希望我的语言能让他去努力生活，摆脱困境，我只有二十块，我只能帮他到这里，物质是有限的，但我给他的精神力量如果他接受了，他会走出来，一个努力活下去的人，加以奋斗，绝对会活得下去，不至于做一个流浪汉，吃不饱 穿不暖。感恩。</p></noscript>
