    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>下厨是一种艺术</h1><p id="source-date" class="diary-date"><time datetime="2013-07-05" title="原笔记创建日期，不一定等同于落笔时间">2013年7月5日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">后天就要回家了，应付完最后的三场考试就行了，只要不挂科就行了，想起来这学期没有学什么东西下去，这让我情何以堪阿，真是一个不爱读书的，对于林业我是没有什么兴趣，下厨我更有兴趣了，或者是做设计，心中也没底，或者是开一间自己的店面，我应该去学习，或许这是我喜欢的也说不定，下厨是一件幸福的事情，并不是贪求，我只是把下厨当成一种艺术，我希望做出的料理是美好的，是别致的而且是素食的，现在写自己的愿望也是美好的额，即使是不能实现的，这是多么美好的事情，或者是摆设东西，不知道有哪一种职业是合适我这样的，或许结合一下，暑假开始下厨，在我心里厨艺是以后一种艺术，是一种能带给别人快乐的艺术，现在说起来还是很早的，但是有一种遇到兴趣时候的兴奋，心里给我的答案是真的吗？如果是真的我要忠于自己，真的有一股兴奋，做一个厨师吧，有一点点兴奋，能找事使自己感兴趣的事情是美好的，源源的动力，还有放假的时候让自己家里的庭院弄起来，家里有庭院的应该要好好珍惜才对，我想想要种点什么树，种一些花花草草也是多么惬意的事情，我喜欢的生活就是这样的，或者可以提升自己的，自有一个愿望就是在自己设计的庭院里面看书，喝茶和往来的朋友聊天，然后拿出自己做好的点心给大家品尝，这是一幅多么美丽的，多么让人向往的画面啊，这都实现了我的兴趣，看书，喝茶，下厨，还有可以写写东西，这都是我的爱好，那么应该要说说我以后从事的是什么工作了。</p><p id="source-b-002">发现对自己的未来从事的行业是很模糊的，不知道自己要从事的是什么，对于林业兴趣也是不大，上大学是一件美好的事情，因为让我有那么多的时间，自己在利用，看了些书 自己的视野开阔了起来，这是一件幸运的事情，也是父母一直的支持，原本的我已经是没有读书的了，再次要感谢我的父母，很多事情都是这样，我本以为是对的东西，就好像高中的时候 不想读书，想去报自考，这是一件多么愚蠢的事情，但是我意识不到自己的愚蠢，我爸爸也是没有读书的人，他没有容许我的自我决定，我被否决了，我的人生有是另外的一副景象了，如果当初答应了我，我的人生又是不同的了，要知道一个道理是:自己有经验的时候不能让自己的后辈干蠢事，总有一天会醒过来的，毕竟每个人都有愚蠢的时候，每个人也都不例外，该有的时候是长者决定还是长者吧， 当自己到了一定的程度，自己的人生观建立起来，才可以选择自己的人生 才会知道自己想要的什么，而长辈是一种义务 有权利让他不做蠢事</p></noscript>
