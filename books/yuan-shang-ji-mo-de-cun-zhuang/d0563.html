    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>以爱之枷</h1><p id="source-date" class="diary-date"><time datetime="2013-01-27" title="原笔记创建日期，不一定等同于落笔时间">2013年1月27日</time></p><p id="source-b-001">我的思念随着无常飘向远方</p><p id="source-b-002">· · ·</p><p id="source-b-003">先后有几次爱情的经历，我这人是不负责任的人，想起别人的时候就叫，没有想到的时候就一个电话也不给去，还在嘴上说是心里想，心里在乎，其实不然吧？你心里根本就没有挂念，没心没肺来形容你的爱情观是很贴切的，后来觉得在爱情时候我是没有自由的，觉得爱情不是好东西，总是在束缚自己，现在看来爱情本身是没有错误的，只是自己的贪嗔痴作祟，才让爱情这酒，变得苦涩，爱情应该是美丽的，缠绵又如何？人生就是来来去去的。最后一段恋情的分手就是因为我觉得束缚了，是心束缚了，自己跟自己过不去，还要在对错上面让自己占便宜，说得好像都是别人的错，这种对爱情的态度我很鄙夷，不够勇敢又不敢解决，内心的自我都被自己给掩埋了。 但是事后松了一口气是真的，我有了自由感，说明对象不是理想的。就得放下，各自东西飞对谁都很好，无情的人，极不可爱，我并不是表面上的那样，其实我内心也是很多妄念，一直在跟自己的妄念过不去。</p><p id="source-b-004">想什么也是妄，随遇而安，遇到什么都接下来，我的人生现在才开始，到了六十岁也是开始。人生刚开始的心态应该是积极向上的，我身在何方，就是故乡，是坟</p></noscript>
