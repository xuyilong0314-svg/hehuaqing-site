    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>既然无处可逃，不如喜悦。</h1><p id="source-date" class="diary-date"><time datetime="2016-05-19" title="原笔记创建日期，不一定等同于落笔时间">2016年5月19日</time></p><p id="source-b-001">恰如其分，此刻所发生的一切都是缘分使然，平等地看着，我从未想过我的工作会是在花店，在每一个当下所体验的各种都将流逝。但凡可见都不是永恒，既然无处可逃，不如喜悦。外婆总给我劝戒的是，要对得起别人，对得起老板所交代之事，有这样一位长者是我的幸运。</p><p id="source-b-002">很久没有写日记 也没有重新写起来的动力，现在的心绪大不如前，在于修道上我都是退步的，就这样吧 明天见</p></noscript>
