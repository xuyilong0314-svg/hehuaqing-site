    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>我需要一场雨</h1><p id="source-date" class="diary-date"><time datetime="2013-04-17" title="原笔记创建日期，不一定等同于落笔时间">2013年4月17日（原笔记创建日期）</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">有时候感觉很颓废，什么都不想做，有那么一丁点儿惆怅，总会让我想起什么东西，我随之写下，眼神无力的感觉，一切都。。。有那么一丁点儿惆怅，算是矫情吧。天闷闷的，累计着暴雨的力量，我更希望伴随这是场伴随电闪雷鸣的暴雨，电闪雷鸣能让我更能回味童年的感觉，从没有感觉时间会那么快，发现自己什么事也没做，不知所措之余，也只能说看今天有如梦醒。童年印象最深刻的就是闪电扑向我的房间，那时我正在开电视，还是一台破旧的老电视，闪电来到我的房间，过后是一片寂静，电视已经没有声音了，黑屏的！我不敢动弹，深怕再有闪电来把我也抹杀掉，第一次感受到这片苍穹的力量，实在震撼 ~我想这是我长大为什么喜欢电闪雷鸣了吧？好像更能贴近童年，那种纯真的感情，对大地的那种感情，我更是喜欢雨天，儿时的雨中作乐，那时候我好幸福的，无拘无束能在雨中奔跑可以在雨中肆无忌惮地，衣服淋湿了也不算什么，全身淋透了也不算什么，索性拿起沐浴露在庭院洗了澡，这就是童年，这是我喜欢倾盆大雨电闪雷鸣的原因，好像这能更接近童年，更能拾回一颗童心，下雨或者是电闪雷鸣我心中都会很平静。真的很平静，我很享受能通过大自然的方式给我童年的体验，雨后一切是清新的，把我的心也会清晰一点，心情很是愉悦，我喜欢雨我喜欢那自然的狂野，电闪雷鸣的震撼，我的大地我的爱我的情，我的童年我的心。</p></noscript>
