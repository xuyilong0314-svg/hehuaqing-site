    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>我要是有兄弟</h1><p id="source-date" class="diary-date"><time datetime="2014-04-26" title="原笔记创建日期，不一定等同于落笔时间">2014年4月26日</time></p><p id="source-b-001">我坚信的一点就是 生命中一直有上师在看护我 加持我。 以致我要堕入深渊的时候 让我及时脱离出来，并且将这一份回忆当做礼物送给了我。让我不再堕入其中。 感恩一切上师的加持。从小与观世音菩萨特别感应，我的观世音菩萨送来的孩子，我也坚信一点 我一生都会为了佛法而生，我这一生不管是在哪一个位置 我都有着代表佛法的那一面。如果我有一个哥哥的话，堕入空门是容易的，但是我没有，这一切艰辛都在考验我，考验我的道心 我真的是否能够如实成为自己 你努力多少，我曾经发愿说 当我法华经背下的时候 就是我出家的时候，而我现在却没有在努力。很多时候 我却是在荒废着 我知道很多双眼睛都在看着我 也在看护我。 感恩一切上师的加持 感恩父母的恩惠 感恩这生活中的周遭 一切的一切 都是对我的磨砺发现自己开始对自己的外表开始在意，你并不应该这样 这显然没有任何的意义。 但是今天你知道了 自己是不畏别人的话语 ，你始终都是自己 知道吗？今天我让 月梅 告诉他们家里我的存在 船到桥头自然直 在当下的时候你应该承担 你不应该让一个女孩承担心中的沉闷，这是基本的一种承担的能力，我不希望你是三心二意的人 你未了的缘分 你应该好好思索 是吧船到桥头自然直 精进！</p></noscript>
