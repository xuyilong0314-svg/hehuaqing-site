    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>Liekkas</h1><p id="source-date" class="diary-date"><time datetime="2013-05-21" title="原笔记创建日期，不一定等同于落笔时间">2013年5月21日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">柔美的声音，纯净的声音触动我的心灵，音乐给我享受的，北欧的声音让在亚洲的人，在中国福建南平听到，音乐是无国界的，音乐是美好的象征，音乐是情感的表达，听音乐是一件美好的事情，我更偏向于听没有歌词的，哼哼唧唧的，旋律很重要，旋律是主干旋律会告诉你这是一首什么曲子，不用语言的，我听 Magic Waltz时候就觉得一股欢乐在我的心中荡漾，脑中能浮现出 1900在旋转弹奏的那一段，多么美好，在波涛汹涌的大海中能诠释这般优美的曲子，不愧是海的儿子，一辈子在海上面，音乐让我相信这是真实的真正有一个 1900，音乐让我相信，音乐是一种精神层次上面情感的表达，很美丽的表达方式，渐渐我的爱好明显起来了，对艺术越来越有那种感觉，也想去了解明白，因为 1900我爱上了钢琴曲，热爱音乐给我的那种感动，让我同他们一起在 建立起来的情感中。</p><p id="source-b-002">脖子很痛，打球的时候打到脖子有落枕的感觉，脖子右侧的经都浮肿起来，健康的时候不能体会病痛来时的痛苦，人要知足，身体没有病痛是最幸福的事情，如果让你回复健康可能你什么也不想计较了把，也不会去想今天有什么事情不开心，说到不开心的只有下午跟志伟的小小争执把，我说不要抽烟了，公共场合特别是房间里面，他说你不想闻到烟味我要一直迁就你吗？这是什么逻辑，他还只是一个小孩子的心智，我并没有怪他的意思，我可能上辈子是欠他的，今生他让我吸二手烟，我把他当小孩子的，他起码公共场所不能吸烟都不知道，认为这是理由当然的，宿舍里面也只有我跟他计较这个，没有人愿意说出来，每个人都怕得罪人，也只有我会劝他不要吸烟，听不听都是他的事情，如果我不劝他我心里会过意不去，刚开始我也一直在纠正林翔的一些错误，或者是教他学习一些人生，或者是拿本书给他看看，后来发现根本没用，我也就放弃了他，如果他不改变我也没办法，这是他的人生，他与我有关的事我有机会跟他一起探讨某些问题，与我无关的是他的人生是自己的，每个人都有自己的选择权。</p><p class="diary-omission">〔中略〕</p><p id="source-b-003">但愿明天的脖子能好起来，但愿我的火气能将下去，但愿我的修行能前进，但愿我的愿力无穷尽，但愿每一个众生安乐，但愿你们都幸福快乐佛光普照。</p><p id="source-b-004">很惭愧刚才有一只虫子爬在我的脚上，我很粗鲁地对待了他，我把他追到了地板了，不知道他会不会痛，我想他肯定会的，试想自己从那么高的高度下去会是什么感觉，我想说抱歉，自然反省让我不淡定，我内心会觉得害怕，我想我应该这么做用手轻轻把你带入地板，可能你想跟我做朋友。我的朋友我想跟你说一声抱歉，我弄疼你了，也让你惊吓了。 希望你的原谅。虫儿 ~不管对待什么都要快乐起来，不管对待什么人都要微笑，不要板着脸，每一个人都是可爱的，你给予别人的是什么，别人回馈的就是什么，你给别人带来快乐，快乐也会回到自己身上。</p></noscript>
