    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>溪源庵</h1><p id="source-date" class="diary-date"><time datetime="2012-12-20" title="原笔记创建日期，不一定等同于落笔时间">2012年12月20日</time></p><p id="source-b-001">早上八点，稍稍到了点干粮，我带了个背包，在背包的同时，是不是有怕麻烦，不愿意多拿一点东西，尽管这有点重，但是在自己的理念里面，大家一起拿会比较好，分担。 如果在谁背背包上起了分歧，那岂不是更糟。</p><p id="source-b-002">就今天的活动而言，就是爬了一天的山，走走聊聊，看看大自然的风景，听听水流的声音，其实这很惬意，这种惬意的体会不是人人都会有的，相对于人多，我更喜欢的是独处，自己一个人细细地品味，听听自然的声音，音乐本身最高的境界就是自然，而大自然因缘和合所发出来的声音可以称为世间最动人的声音，尽管这是生灭的，因缘和合的 缺少了任何一个环节，都会导致变化。</p><p id="source-b-003">今天在走路的过程中，心中的那个我还是想要抢占本我，内心的观念总是影响着自己，我们常常把内心的观念强加在别人的行为上，即使别人的行为是无可厚非的，我们不清净的观念一掺和，就失去了理性的判断，往往人之间不能互相理解就是因为 把自己的观念强加在别人的身上，每个人的价值观世界观是不一样的，我们用这一尺度去衡量是不理性的，而且对人对己都没有好处，应该要抛开不理性，抛开内心的观念，不要被这个我觉得，我认为，我我我我我我，迷惑了字以至此，没有思路，就此停了。</p></noscript>
