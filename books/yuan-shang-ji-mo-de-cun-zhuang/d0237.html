    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>无能者无所求</h1><p id="source-date" class="diary-date"><time datetime="2014-04-09" title="原笔记创建日期，不一定等同于落笔时间">2014年4月9日</time></p><p id="source-b-001">真的就要毕业了，三年的时间我真的没有浪费时间吧，某些时刻。</p><p id="source-b-002">跟妈妈在聊天 突然觉得自己 好像什么也没有做的样子 即将要去面对生活，我希望自己是富有的 我希望我从事有创造性的行业，我愿意马上看到结果 把过程的无奈，显然这不切实际。如果给我机会 继续读书 我还是会继续的 我还有太多的东西没有学习现在我并没有谈论出家的事情，没有什么事情是简单的，太简单得到的东西往往失去也快了 就像是我摔碎的手机 就像我一次次索取不知道感恩，很多时候我都不着调，没有回头路的，也没有从来的机会，平静地面对自己吧，和自己谈谈，如果你不愿意读这个专业 为何你不去学习自己喜欢的东西。这是你应该学习的。我所剩下不多的时间里面 我能通过无常创造出什么东西来。 你应该去从事什么样的行业 回到香巴拉 梦中的香巴拉。 为何听到鹿港小镇会流泪 因为感触 因为我是一个离开故乡的人，我在这里轮回生死 我在迷惘 忍耐的力量是最伟大的，我去爬黄山的时候 某些时候我用一种坚韧 无我禅定的心 去行走的时候 我不感觉有伤害在我的身上。梦中的香巴拉 我会回到那个地方 那极乐的土地。</p><p id="source-b-003">我所做的这些 不管有多少人能够看到 我都愿意去做 愿意去坚持 念念不忘必有回响 因为我相信 唯一受我影响的那个人 他有影响这个世界的力量，我不是为了出风头 或者是为了控制欲望 我只希望传达一种美好的 一种光明的力量。 这就是我的信念我的坚持 只要我能用我的身体 表达一些美好的东西 包括我的行为 我的一个微笑。</p><p id="source-b-004">我的微信公众号没有多少的人 我希望很多人关注我的微信号 我希望将美好事物 传递出去，度母加持弟子 让我的心愿能够实现 我借以这个平台 我做一些我应该做的事情 应该为之奋战努力的事物，我为微信公众号 是不是认真对待？问问自己 我每次都要在临时的时候才开始处理一些 我原本应该准备好的素材。 你没有什么脸面说你是一个很努力的人 如果你认真对待 你应该可以准备 你可以做得更好 你可以准备更加充分 你的努力会给你带来好运 用心 一定要用心！不要害怕 不要害怕未来 安住当下。做好现在应该做的事情。 不要心有期盼 做自己认为对的事情 耕耘不一定会收获 鸟儿也不一定会飞翔 但也不一定不能。顺其自然。因果</p></noscript>
