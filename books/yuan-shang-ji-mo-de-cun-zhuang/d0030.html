    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>辞职之后，在青海</h1><p id="source-date" class="diary-date"><time datetime="2015-10-04" title="原笔记创建日期，不一定等同于落笔时间">2015年10月4日</time></p><p id="source-b-001">好久没有写了，过了毕业的时间差不多也要一年的时间。这一年里面有很多变化，遇到了上师，真的已经满愿了，闻思修最近也是比较少，一直都在路上两三天慢悠悠，二三十年却是一刹那。想着自己度过的那些岁月， 7岁前大多没记忆， 23岁前大多不深刻。如果虚度此生，我不知道是否还有能力再回到人道。上师说回去好好修行。我一定要谨记，相续都是靠自己建立起来的，所有的违缘，片段都是滋养生命，需要虚度此刻，不要虚度，不要作无谓的事物，学会缄默，学会为这个世界默默地祈祷，佛教对待信仰便是，你就是道路，你将引导自己走向你所作之道，落入世风里，就将轮回，时刻都要保持专注与觉察。当你遇到一位真实之师，那么就不应该再等待，等待修法的时间，当你被一切无常的事物迷惘时，至少你要知道，你要祈请上师，上师加持你。我的经历是比较丰富的，而从这些经历当中，我仿佛看到了我未来会发生的问题，我想找一个寂静的地方来修法实际上是没有任何意义的，这不过是自我的伪装诱惑，修行是此时此刻，我们通常会有一堆的理由，但是无常的死主会因为你的虚伪懦弱而感到欣喜。真相是什么，我还不了解，但是遇见你知道我还能在这薄情的世界里面深情地活着。不要去期待，期待这个世界会带给你什么，期待自己能为这个世界做些什么才是自己可以控制的。你连自己都无法掌控还奢望控制别人？抱有这想法显然是愚蠢至极。</p><p id="source-b-002">不要再混乱地生活，上师加持我，让我拥有觉察与专注。</p></noscript>
