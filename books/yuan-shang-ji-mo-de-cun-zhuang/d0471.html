    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>浮躁 出师不利</h1><p id="source-date" class="diary-date"><time datetime="2013-04-29" title="原笔记创建日期，不一定等同于落笔时间">2013年4月29日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">今天第一次地开车了，也是第一次正式地上路，然后伴随我的是出师不利的局面，年轻人就是狂妄自大了一点，撞上了自己家的大门，也是挺牛逼的一个行为举止，在小巷的时候没有什么事故发生，反而是在自己家的门口，因为自己的狂妄吃到了苦果，在第一天的时候找个世界就教会我不要狂妄自大，现在不用谁来告诉我，我自己也是能明白的，做人要低调不要狂妄，自己只是一个新的车手，我爸爸都不敢像我这样开，狂妄自大的年轻人呵。</p><p class="diary-omission">〔中略〕</p><p id="source-b-002">今天发生了撞墙，我很是尴尬</p><p id="source-b-003">也不想让他们知道我的糗事，确实是够尴尬的，第一天开车就发生了这样的擦伤。</p></noscript>
