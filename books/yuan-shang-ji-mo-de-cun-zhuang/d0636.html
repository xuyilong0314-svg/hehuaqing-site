    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>我需要一种美丽人生的态度</h1><p id="source-date" class="diary-date"><time datetime="2012-11-15" title="原笔记创建日期，不一定等同于落笔时间">2012年11月15日</time></p><p id="source-b-001">今天，去参加了朗诵的比赛。</p><p id="source-b-002">原先的自我感觉良好 就得到了一个垫底的分数，</p><p id="source-b-003">心里没有在乎。我表达了 席慕容的意境。</p><p id="source-b-004">因为朗诵 反复地读诵，逐渐明白了 那支笔是什么。</p><p id="source-b-005">我们何尝不想慕容，一辈子的种种努力就是因为别人的称许与微笑。</p><p id="source-b-006">走到最后剩下了 满目迷茫的面孔与一条不能回头的路。</p><p id="source-b-007">慕容先生既然给我们表达了这种经验，我们更应该吸收。</p><p id="source-b-008">上台的时候，紧张。很紧张，脚都在发抖。 一阵头晕目眩，</p><p id="source-b-009">是太紧张而没有 念好诗，我对于成败并不重要，因为我有去努力。</p><p id="source-b-010">我只是愧对 席慕容。 一首这么彻悟的诗 竟也让我读成这般</p><p id="source-b-011">自嘲一下 也就过啦~ 哈哈。</p><p id="source-b-012">人生需要一种 态度， 《美丽人生》</p></noscript>
