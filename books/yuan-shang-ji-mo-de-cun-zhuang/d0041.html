    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>检视自我的心</h1><p id="source-date" class="diary-date"><time datetime="2015-02-28" title="原笔记创建日期，不一定等同于落笔时间">2015年2月28日</time></p><p id="source-b-001">你现在看到的是自我的执着，原本一切都是空无常的，突如其来的，这一切是否你的预想，一切是那么地不确定，所以你被自我执着也桎梏了，不论在哪一方面，你现在不是一个自由自在的人，你总是在患得患失，迟早会失去的一切情谊，就如同这般，看到自己愤怒的心，我把喜欢愤怒喜欢过了，看到自己的情绪在滋生在爆发，在行动，这一切多么地有趣，可亲。这是何华清所散发出来的，而它的起来来于空性，让自己自由自在。让慈悲的力量散发出来，你并不需要得到什么，你能知道的也仅仅是一部分下来，每个人会挑自己喜欢的那部分去理解，总有悲伤的地方，这就是人生 人总是在不停的复刻 陷入轮回。跳出来看看自己 看自我的心 沉浮不定的胸膛 甚至胃部都有些悸动。你所悸动不过是你的期待，因为你认识你是一个对他人好的人，别人理应对你有所期待，对自己有一些表示，甚至是拉一拉自己的手 表示支持 表示应该恢复如初的友谊。</p><p id="source-b-002">就像你的长叹气 就如同自我的心不在状况。因为你执着于你对别人很好，所以你期待 得不到期待的 你就开始不自由 就开始 甚至会放下狠话，这不是你的作风。人应该自由自在 不要期待任何人会对你做出何等回应。即使没有预想的没关系，最好不要预想 这是最好的一种自由。</p><p id="source-b-003">就像一个客栈 总有人入住 有人离开 这是对于无常最好的教言</p><p id="source-b-004">致自由自在 致二峰 致自我 致期待 还有 愤怒、等待</p></noscript>
