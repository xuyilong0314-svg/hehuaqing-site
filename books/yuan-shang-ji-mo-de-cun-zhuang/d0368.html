    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>我坚信未来是美好的</h1><p id="source-date" class="diary-date"><time datetime="2013-08-14" title="原笔记创建日期，不一定等同于落笔时间">2013年8月14日</time></p><p id="source-b-001">他们欺负还是一样地在吵架，吵了二十年了，我爸爸已经改变很多了，如果再要求更多的话那也会让别人心冷的，最近我妈妈有些任性，我不知道她心里烦闷的是什么，现在我的心情也是不好的，因为情绪是能相互影响的，我也是很低落的 爸爸那边是没有什么错误了，他现在改变的已经是很多了，每天都是板着一个脸 我也不想看到这样的一个场景，这就是婚姻的代价吗？两个价值观不一样的相遇就是这样的结果，我觉得这次有些不妙啊，我爸爸有些不耐烦了，他已经改变很多了，应该要知足 吵架是因为我爸爸的朋友来喝酒，人都是会寂寞的 有时候朋友来聚一聚 喝一喝酒都是可以的，这是他的交友方式，想要改变别人这是不容易接受的，人不容易知足，人不容易被人改变。然后吵架 冷战，我不知道以后还会发生什么样的事情如果父母真的是离异了，那么我就自由了吗？不可能把 为什么我会有这样的想法，这并不是自由 自由是内心中的宁静。我真不知道自己要用什么来说服他们，我不要为了别人的烦恼而烦恼了。我还是谈谈自己的事情吧，最近跟阿冰聊得火热的，我不适合她的我很清楚，一个喜欢流浪的人注定是没有爱情的，而我也是习惯的了，其实如果说爱情的话，精神上的，最好是不接触的，精神上的交流，如果这样聊下去，我们之间就又要那个啥了，哈哈。</p><p id="source-b-002">我就是一匹野马，真的是很野的马，多么向往自由，内心的宁静是我一生的追求了，然而这不是一件简单的事情，很多事情都是如此地自然地 我要顺气自然 我要顺自己的因缘，这本来是不可强求的，小伙伴双密在朋友圈的那个说说让我紧张了一下，如果对象是我的话我会很尴尬，我还是多想了，这是一件吃力不讨好的事情，我会喜欢跟陌生人一样的邂逅，彭硕是我在凤凰邂逅的女孩子，比我长了两岁吧，我们那两天是柏拉图式的爱情，就像一对好久的恋人，我也是嫌弃她的外貌我不想和她联系了，当时如果我想和她发生关系的话 我也是可以的，与生俱来的那种定力也没有让我这样，即使我是一个不能自我控制的人，我对于别人还是保留在婚后吧，我已经是受戒的了，我能破戒了，在网路上面充斥着色情太多了，小孩子早早地就被污染了，这是一件多么让人无奈，</p><p id="source-b-003">在写的过程中我突然又想起爸妈，他们力的位置是很近的，其实他们的心也是很近的，不过是吵架而已，我妈妈为什么要搞分居，这样只会让一个男人失望，这不是一个明智的做法，如果他们到了这把年纪的时候还是这样，我以为他们都成熟了，吵架是正常的，但是冷战不说话是最伤人的，就像我叫我妈妈吃饭一样，她并不理睬我，而我是怎么样的心情可想而知，我也一直都看到爸爸的改变，我今天晚上还是不吹空调了，家里的电压应该是受不了的，这样也就算了吧，吹吹风扇也是可以的。</p><p id="source-b-004">我心中有一个画面就是他们两个都离婚了，我谁也不想跟，一个家会有三个方向，我会出去外面生活，真的让我浪迹天涯的时候我肯定是思念故乡的，回来的时候房子已经是被拆迁的了，我已经找不到回家的路，心中的这个画面就使我有浓浓的乡愁，在这个世界上承载我的是什么，是社会的名利场，我知道这样的生活是很艰辛的，每一个人都是不容易的，每一个人也都是那么难堪，多少人受尽磨难，而又能苦尽甘来，每个人只是纯粹地去争取，在名利场混淆的话，那么什么时候能够有快乐，什么时候才苦尽甘来，用自己生命最宝贵的时间去赚钱，然后用生命中最不宝贵的时间去享受那所谓的自由，我这种说法肯定是要让别人给唾弃的，这是一个多么胸无大志的人，也有的人会说这是一个没有踏出社会的人，他怎么会知道社会就像狼虎，来不及争斗就被蚕食了，就被这现实给吞没，现在所写的都是那么地悲伤，我为了全部的不快乐的人悲伤，失去自由的人悲伤，功利主义是大集体，我常说心中想要的是什么，世界给你的也是什么，然而每个人都是功利主义的人，这自然是一个功利的社会。</p><p id="source-b-005">成为一个名利场开心吗》我们总是在追求新的东西 有哪几个人是在追求少的东西呢，我在想是否有人深夜这个世间跟我在想同样一个问题，我不知道 我是一个孤独的，每个人都是在千里独行 至少在梦里。我也相信也有人跟我是一样的期盼，我期待这么一个知音，跟我一起说说这个世界的模样，跟我说说梦想，跟我一起做梦，跟我一样是奋不顾人的，其实人都是会孤独的 不管是多么强大的人都是会感觉孤独的，只是适应了孤独 能与孤独相伴了，不害怕孤独而已，这个年代已经没有多少梦想了，承载一代无知的 不曾有梦想的人</p><p id="source-b-006">还好我有我的信仰，信仰是我的生命，我的生命原动力就是信仰给我的，我生活的一切都信仰带给我的改变而所产生的，我能去那么多地方我能去徒步 我能激情 我可以像个年轻人一样 一个年轻生命该有的那种乐观，我对生活是充满信心的，我对未来是向往憧憬的，对困难会随口一句 年轻人伤的起，不疯狂就不是青春了，我有自己的信仰就会永远都会有青春，我要像个孩子一样 天真地永远都不会有烦恼。 未来是美好的 我坚信我的未来是美好的 一切会让我如愿的，世界你听到了我美好的愿望了吗》我希望一切都是美好的 未来都是美好的 我坚信 请围绕我 我将吸引你们</p></noscript>
