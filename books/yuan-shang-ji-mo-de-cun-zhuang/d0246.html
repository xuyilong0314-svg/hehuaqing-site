    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>手机碎了</h1><p id="source-date" class="diary-date"><time datetime="2014-03-27" title="原笔记创建日期，不一定等同于落笔时间">2014年3月27日</time></p><p id="source-b-001">五楼的距离</p><p id="source-b-002">你的心情是如何</p><p id="source-b-003">觉得一切已经发生了 那么我应该不要去在意了。</p><p id="source-b-004">我想我是出离了 一切的不方便也变成方便了。</p><p id="source-b-005">这就是真正的出离。出离了自己的局限性</p><p id="source-b-006">我想我会省下狠很多时间</p><p id="source-b-007">我想让自己静一静 所以不想要交电话费。</p><p id="source-b-008">或许是一切都是变淡了吧很多事情都不是那说的</p><p id="source-b-009">心疼吗？</p><p id="source-b-010">这是无意的。</p><p id="source-b-011">一切都是注定好的 在我手上的 福报都会溜去</p><p id="source-b-012">最近是很不正确 真正的不正确。</p><p id="source-b-013">前一个半小时的时候我还在劝别人不要玩手机 而现在却是这样的情况</p><p id="source-b-014">我发现心不会有多大的波动 只是觉得有些许不方便</p><p id="source-b-015">我想这是好的 让自己安静下来。静下来看看自己。</p><p id="source-b-016">就这样子了吧。</p></noscript>
