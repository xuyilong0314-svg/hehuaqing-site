    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>怎能忘西湖</h1><p id="source-date" class="diary-date"><time datetime="2013-04-05" title="原笔记创建日期，不一定等同于落笔时间">2013年4月5日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">凌晨的时候下了大雨，帐篷湿了，我们逃离阵地，时间尚早，黑压压一片也是寂静的，虫鸣都不得闻所有都在睡觉，只有我们在亭子下笑着，笑着青春的疯狂，很糗的第一次，因为这样的不具足我们能体会到西湖宁静的美丽，没有人影，只有微微细雨，三三两两走在路上，因为不具足我才能看到真实的西湖，雨中的西湖是没有妆容的，多么宁静淡雅，杨柳依依甚有一股悠然自得的气息，那时候我还不是很困，身体是累极了，但是感觉太好了，这才是西湖的真面目，人开始多起来了，西湖开始学会沉默，她已经不在了，她的本来面目应该在宁静中，人流中的嘈杂，没有半点美好，急急忙忙中如何看到极致？索性不逛了，一瞥其美丽也就不贪心了，留给别人吧，我是自私的。觉得晚上的文字很是有文绉绉的味道，好像是感染了西湖的味道，这女子身上特有的艺术气息感染了我，渲染得我竟不像我了，平心静气之后，自然地想去修饰，并非矫情，这是对她的尊重，她向我展露真实的容颜，我不忍心辜负，顺了自己的意决定好好写写这位美人。毫无保留地释放自己的情感，我心中爱你美丽，怎能说四大皆空呢？</p><p id="source-b-002">我确实不忍心去否定她的美丽，但这确实是会归于空寂在这之前，我有义务，作为一个真正目睹你的人，我不能保留自己的情感，此刻我抛下理性，我要无所顾忌地赞美你，美丽的人儿，我没有被你迷倒，因为你并不需要蛊惑人心，你的美是清新脱俗，让人感受分明，澄清无染好似湖面，波澜中是我的不平静，我的一次次悸动，需要懂你的人好好善待你，你所在的城，也是很美，树木的年份诉说着对这座城市的情感，其他的城是无法比拟的，你所在这座城的美是由时间的沉淀而来，是经济的膨胀发展所不能相比。美得宁静淡雅这是最让人热衷的，因为平淡不会迷失人的理智，只会让每个人更加地去理解与感受。听着佛音，写着关于你的回忆，没错当你出现在我的日记中，你就属于我了，写那么久的日记，第一次没有急切，一切是慢悠悠地，敲打着键盘，很是宁静，觉得都是在回味，非常的美丽。我能明白为什么诗人能写出人人传诵的诗句，因为这美丽的地方，一切流露出来的都是真实的，心就是行万里路的意义，我明白了。我发现我又提升了。不知道何时能再与你相遇。</p><p id="source-b-003">怎能忘西湖！</p></noscript>
