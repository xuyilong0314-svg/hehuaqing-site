    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>这个点还没有做功课 =</h1><p id="source-date" class="diary-date"><time datetime="2014-04-29" title="原笔记创建日期，不一定等同于落笔时间">2014年4月29日</time></p><p id="source-b-001">天边，现在可心不在焉的有很多不想，不想写日志 我想现在就到床上，让自己睡去，越来越没有熬夜的习惯，这让人感到绝望， 为啥会写下绝望这个词绝望:失去了，没有机会了，绝望还真的会另人悲伤 ，可不是 没有希望的日子 肉体也形同虚设我实话 真不想写日志 感觉没有什么写的。要么来讲讲沙县吧。</p><p id="source-b-002">经常都会去沙县小吃，经常都是吃拌面，而且经常是大碗的！大碗的，味蕾比较不挑剔吧， 说实话 真不想去她家里面，这是很大的实话。</p><p id="source-b-003">你的思绪经常性在跳动，你多久没有好好地 好好地不受打扰地和自己聊聊天，审视一下自己。</p><p id="source-b-004">专心才能入道 定能生慧 熟能生巧 其实是定。</p><p id="source-b-005">现在 不要让任何东西来打扰你，不要去看 其实你自己心里清楚 没有人能够强迫你，如果你不去理会 根本也不会产生多大的结果。</p><p id="source-b-006">一天到晚 一天到晚 我都在做些什么，看看电影 或者是看看书 或者是。。。 我可以有很多事情做 而我一直在浪费自己的时间。</p><p id="source-b-007">一直都很纠结，应该站在思想的高墙上面 判断自己能够做点什么 应该要给自己定功课的。 我发现我的功课还没有做，我一天正念就在此刻是清明的，我想我应该完成自己的功课 没有任何的理由一天都挺忙的 早上忙着看电影，下午忙着挂鸟窝，残福协会的，然后就买了瓜子 和同学一起看电影，然后下去吃了个饭 然后无所事事到了此刻 就这么简单</p></noscript>
