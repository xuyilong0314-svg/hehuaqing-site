    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>迟来的日记</h1><p id="source-date" class="diary-date"><time datetime="2012-10-07" title="原笔记创建日期，不一定等同于落笔时间">2012年10月7日</time></p><p id="source-b-001">好像之间的感觉 有了一点变味。其实把直白当成了复杂，想多了自然就失去了某某</p><p id="source-b-002">气氛有点尴尬，不必多说。 如果是她 最深处的红尘里 一定会重逢。红颜知己的话也行</p><p id="source-b-003">有感情也不一定是要爱情。 今天看了豆友的 日记其实就是心甘情愿，如果不能心甘情愿的付出，一定要计较一个 谁让谁，谁联系谁。那，这种可以叫做爱情吗？ 找个志同道合的人 以及智商理想比较一致的人我心中那个并不会难过 真的 我所谓。我觉得 缘分就是这样，顺其自然人生如果作弊 就没意思了。 我要的是过程总的体悟 而不在于成功本身。你懂的晚安，世界 。我是幸福的 我是快乐的 我是知足的 我是 最幸福的人 我更是一个健康的人</p></noscript>
