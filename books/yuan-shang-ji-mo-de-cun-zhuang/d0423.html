    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>成为一个讲故事的人？</h1><p id="source-date" class="diary-date"><time datetime="2013-06-16" title="原笔记创建日期，不一定等同于落笔时间">2013年6月16日</time></p><p id="source-b-001">每一个作家的背后都是有故事的，可能他更会叙说故事，每个人都会有自己的体会，体会有时候也是极其澎湃的，但不是每一个人都能表达出来，能表达出来的就名为作家了，首先她得会讲故事而且是生动的，我心隐约有一个想当一个讲故事的人，我想我应该去从事演讲的，现在还是都没想，让自己先璀璨起来 否则故事没有，烂习气一大堆，今天都没有努力，等会把梦三国删了吧，在我还没有训练成功之前我要给自己营造一个好的环境，今天又发现自己对学业都没有上心，我说我以后想要做的林业，我根本就没有底气，对于林业我处于那种一知半解的人，我只具体的概念但是我不知道具体我能做点什么事情，有时候会发现自己什么都不会，如果我想做一个讲故事的人，那么有一些咨询我是需要知道的，我要去读历史，透过讲出来的历史会更加让人能理解，因为本身知道前因果，这样说会有言过其实的感觉，智慧还是不够的人 是无法发现自己的错误，学佛了知道因果的概念，能否让自己超越起来，我应该超越自己的，</p><p id="source-b-002">我在想我放假的时候日记应该怎么去写，电脑是带不上去的了，写在纸上，我不应该断，这不是我给自己的理由，那么我就写在纸上面，原本我是等练好字才写纸上的，但是现在看来是不行的，练了挺久的我只掌握了拿笔的方式，我还差得很远，力道控制不住，写字都是歪歪扭扭的，也没有稳定下来，但是不要急，我仍然需要去努力，只要开始就不要结束，只要愿意的话我都是可以的，只是借口而已，我发现，我总是会因为借口做不成很多事情，克服自己吧，我可以让自己强大起来 也可以让自己堕落，怎么选择都是自己的事情，而你只有一个人生，</p><p id="source-b-003">不说民族性的东西，大和魂我是很支持的，大和魂如果用词汇来说就是要璀璨，必须要璀璨的，并不是每一个人都能璀璨，所以说这是灵魂，樱花的美丽始于开放，凄美始于开放，死亡始于开放，大和民族民族深知这些 他们也接受这些，我很欣赏这种精神，这是一种灵魂也是一种梦想，凯旋的只有拿破仑，失败的人也不可耻，只要有去战斗不可耻，我可耻在对学业的态度，作为一个学生我的姿态是不对的，我甚至没有去战斗过，是没有战斗的欲望，</p><p id="source-b-004">前程在哪里？在我的脚下，在我的所作所为中，如果我想吃桃子我现在种桃子，我悉心照护，终有一天是会成功的，也可能不成功，因为你在南极种桃子，在定目标的时候应该要理性，不要依着自己的性子去做，这样注定会是失败的结局，要客观，要感情地去战斗，</p><p id="source-b-005">问我自己吧，你喜欢林业吗？并不喜欢，我没有兴趣。那你喜欢什么？我喜欢说故事 我想一个说故事的人。你知道你要怎么去实现的所兴趣的事业吗？我现在要多看书，我要看向世界，我要接触很多有识之人的灵魂，我要向他们学习，我要向这世界学习，那么多说吧，并不是说废话，我要说的是重要的话，我应该要好好学会表达，让自己的观点能清晰起来，我的表达应该让别人听起来不费劲，这是要学习的 还有我需要的是幽默感，有幽默感的演技是让人乐于接见的，包括我也是一样的。</p><p id="source-b-006">记得上次我在讲堂的时候，在打佛七，那个在国外的法师，她的演讲就很精彩，非常地经常，我的心随着他的语言在流动，同时我也在思维，我演讲是不要带草稿的，我说这些还太早，我现在才刚开始在沉淀的时候，才刚开始沉淀，学佛我也才刚开始，没有一个指导的老师，我现在只能先改变自己的心态，我不知道自己的次第在哪里，自己看不一定能看出实相，佛法不是世间的知识，佛法是出世间的智慧，我缺少一个团队，我需要一个灵魂导师能知道我修行上的错误，教我从哪来入手，祈求有这样的一个法师能来帮助，善知识会有的，智慧也会有的，福报也是会有的，我经常都在留恋游戏，今天早上就是这样，我的争强好胜让我失败了，失败的结果是让我失去了一整个早上的原因，我今天必须要书给看书，即使再晚我都要去看，我的时间不多，但是我却这样浪费，我要有所觉悟才对，我不能这样碌碌无为，我对自己过不去，我也不能让自己这样舒坦，苦其心志 今天下午的时候明显是没有力量，竟然是睡着了，然后就爬上床上大睡了，浪费的时间很多，而离放假的时间也快到了，我得赶紧地，我要看的书还没有看完，我还有好几本的书没有看，我要加紧自己的步伐，不要让自己堕落，要能控制自己的思想，这是成功的定义，没有意志力就没有未来，记得这是在豆瓣上面看到的，我坚持每天写日记收货非常多。</p><p id="source-b-007">上次在竞选干部的时候，我用的 PPT是有创意的，当然了，这不是每一个人都能接受的，这也事实，我觉得我的时间不够，其实也是我的问题，我准备的东西有点多，我根本没有表达清楚，就是不清不清楚，这是我的第一次演讲也是一次失败的演讲，我还是需要一个个舞台的，或许下学期的时候我可以去尝试在 CF的部分中做出一点东西，我喜欢一个舞台 演讲的舞台，那么我要开始去尝试，我随便讲讲吧，做一个讲故事的人，在故事中透露我的思想，我的感觉能与其他的有所共鸣这是我所希望的，做一个有感染能力的人是需要一种磁场，一种气质的，如果我继续沉浸在猥琐的事物当中，我的气质可想而知了。</p><p id="source-b-008">心中想要做什么事情，就去尝试，如果有想实现的目标 那么就朝着这个目标去走 不是每一个人都是要相同的，做一个不同的人，不是一个奇葩的人，可能在别人看来会奇葩，坚定自己的方向，如果想讲好故事 要让自己先精彩起来</p></noscript>
