    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>不确定 现在是一个怎么样的状态</h1><p id="source-date" class="diary-date"><time datetime="2014-04-12" title="原笔记创建日期，不一定等同于落笔时间">2014年4月12日</time></p><p id="source-b-001">不确定 现在是一个怎么样的状态作为我的女朋友一定会很不开心 我是一个奇葩，有时候我只活在自己的心中，或者是我更愿意 做一些喜欢的事情 刚一开始我们会腻在一起，这是必然的。有些话还是不愿意去说，其实我就是这样的我 你遇上怎么样的人 就会有相应的际遇，会有不同的心悸时刻，会有不一样的风景 可能去不一样的地方。</p><p id="source-b-002">会突然地意识到自己是不努力的 你如果真正想要去学一个东西 如果是不专注是毫无办法的，说好要在今天篮球赛里面 保持禅的心 那时候早就忘记了，当我提起自己的真心的时候 会有一些东西来干扰。</p><p id="source-b-003">我面临的是一个尴尬的局面 我是喜欢上场也是 本性的一个显现，我喜欢这项运动 而且我想进球 可以是很帅的样子进球，我喜欢掌声 我恨不得全场都在为我鼓掌，这让我很被动 让我总是无法专注 甚至说 我不能好好去传一球 或者是去防守或者是得分，很多时候你努力就去争取 然后你开始在抱怨 抱怨自己没有表现的机会 你在意自己在场上的表现别人看到 甚至你还会想要有一些女孩子会对你心生欢喜 人的期待总是花样百出 而心开始被动 开始出现一些情绪 如果他们再叫我去打球 说明我有别人需要的地方 如果没有的话 那么肯定是有原因的 抱怨是什么。 对自己不肯定 对自己没有信心而去责备他人的情绪 我要避免这种情绪。这是真的。 我抛下了执着，我离球场的距离有 5层还有一段阶梯 一段路 我的心不必停留在那里 更不需要 停留在下午的那些故事。</p><p id="source-b-004">消灭所有的期待</p></noscript>
