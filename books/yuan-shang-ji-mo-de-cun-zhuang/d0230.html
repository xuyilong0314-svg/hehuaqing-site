    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>开始不以绝对</h1><p id="source-date" class="diary-date"><time datetime="2014-04-16" title="原笔记创建日期，不一定等同于落笔时间">2014年4月16日</time></p><p id="source-b-001">不想说点什么吗？</p><p id="source-b-002">哦不，还有一大堆的衣服没有洗，再不洗 明天没有裤子穿了 = =。 一天的考试也就这么过去了，不快也不慢，说起这话的时候我还在考场里面煎熬，而现在却是悠闲地坐在椅子上敲打着键盘，说起考试回想起来 中国最重要的两场考试我都没有参加，一个是中考一个是高考 如此奇葩的学习经历，竟也上到了大学了 = =，我总是能够接受到一些好的东西 好的影响，我想命运是如此，说不定我还能够专升本 我继续读上去，我期盼这样的到来，我能够顺顺利利地的读到大学也是非常幸运的，我现在遇到的人事物都是因为身边的串联起来的，接触到的都会是不一样的，可能我到不了仙岩，可能我接触不了密宗，我的一生都被启发。</p><p id="source-b-003">我一生的改变是在每一个点上面，只要你愿意 没有什么是不行的，</p><p id="source-b-004">一句话 一部电影 一首歌 一本书 一个人 都可能对你现在的生命造成翻天覆地的改变</p><p id="source-b-005">现在我开始不以一种觉得看法去看待。</p><p id="source-b-006">我是以一种更加宽广的</p><p id="source-b-007">比如说 月说到它的朋友喝酒 给人造成伤害</p><p id="source-b-008">开始我说 因为人格也是有问题后来我发现 这样的事情也在之前也在经历 某一刻我觉醒了 就像我现在 每个人都可以 没有什么不同的~</p><p id="source-b-009">看待事物开始 突破二元 突破桎梏 是对这个世界的 也是对自己的。</p></noscript>
