    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>只是怕不能继续</h1><p id="source-date" class="diary-date"><time datetime="2014-05-24" title="原笔记创建日期，不一定等同于落笔时间">2014年5月24日</time></p><p id="source-b-001">只是怕不能继续</p><p id="source-b-002">只是害怕失去佛法</p><p id="source-b-003">却不见得精进</p><p id="source-b-004">心中有魔鬼</p><p id="source-b-005">颠倒着</p><p id="source-b-006">二元对立着</p><p id="source-b-007">太多知见分别</p><p id="source-b-008">宁静不了的心</p><p id="source-b-009">在每一个行动中</p><p id="source-b-010">发生着</p><p id="source-b-011">从自己的观察中可以看到自己的生性急躁</p><p id="source-b-012">并也不能这样说</p><p id="source-b-013">生性只是一个习惯</p><p id="source-b-014">如果你愿意逆转的话 随时都是可以的</p><p id="source-b-015">漫长的朝圣之路，只怕不能继续。</p><p id="source-b-016">人身难得 在每一刻都可以觉醒的。</p><p id="source-b-017">· · ·</p><p id="source-b-018">现在自己正在创业，正在做这某一些事情，</p><p id="source-b-019">失望确实是有的 因为自己不够努力吧</p><p id="source-b-020">总结一下</p><p id="source-b-021">1.购买方式可能是错误的</p><p id="source-b-022">2.宣传不到位</p><p id="source-b-023">3.水果的质量别人不放心</p><p id="source-b-024">第一创业 挫折时难免的 但是这并不是一无所获</p><p id="source-b-025">发现自己更加自信从容了 突破了自己</p></noscript>
