    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>不能辜负是自己</h1><p id="source-date" class="diary-date"><time datetime="2013-03-01" title="原笔记创建日期，不一定等同于落笔时间">2013年3月1日</time></p><p id="source-b-001">觉得没有什么事情可干，点击网页浏览时，也不知道自己在看什么，书也看不下去，心灵没有什么可以依托的东西，这个状态很是难受，好像非要找点事情来做？而又找不到？心就是静不下来，看什么不是什么，听什么不是什么。心也不知道安住在哪里，刚才也浪费了好多时间，有时候会有什么都不干的想法，无聊的时候也不想去写日记。让自己处在无聊的状态，偶尔这种情绪还是会有的，一个春节来了 阅读也不成阅读的样子，没有那种求知的欲望，是没有那么地强烈，分分秒秒过去，自己能把握的也不多，分分秒秒自己创造了多少东西？显然没有，感觉有点烦躁就对了。做什么事情都觉得是浪费时间，但这个浪费的定义又是些什么，在浪费过多的时候来一场觉悟？能说浪费是没有意义吗？显然这样说会自相矛盾的。总是在矛盾的时候有点奇怪的想法，沉浸在自己的世界中，因为你走开了我也一无所获，灵魂处于空虚的状态，想空白空白不了，想要嘈杂嘈杂不了。矛盾的状态，中道更是不行了。写了自己此刻的心情，这也是最有价值的，以前在写日记的时候激情可是四射。三四千字也是写下了，那时候的一些回忆都能写出来，好像是灵感渐渐没有了，尽管如此也要坚持下去。</p><p id="source-b-002">不断挖掘有时在灵感来了写微博，写出一些想法，但是想到要发布出去别人会看到，会加以修改，然后修改到自己都不认识，索性就不发布了，要迎合众人的口味是不容易的，如果刻意去修改的话，思想往往都变得面目全非，席慕容的一首诗有一句话记忆尤深“把向你借来的笔还给你吧 ”。我需要的是坦诚，不用修饰，不需要把自己掩饰得道貌岸然的样子，你就是一个大俗人，不要装逼好吗？文绉绉的像个啥样子，重点你的本来面目并非如此，你所表现的思想都是别人的，你终究还是一个大俗人，而且是靠别人思想的庸人，丝毫没有主见、创造力。请不要掩饰，帮自己掩饰所有的烦恼，是一种亵渎，把所有的顾忌烧成灰烬，还给一个真实的自我，一个对自己足够真诚，对自己能直言不讳，至于别人？见鬼去吧。</p><p id="source-b-003">我能理解席慕容写的那篇，能读到是偶然的朗诵比赛，那首诗读了好几遍，我能理解她的心情，他的这首是在后来写的，她是说自己为了迎合众人的口味而去写文章，自己真正的想法往往都给掩盖住了，她最后觉悟了，把向别人借来的笔还回去，把真实的自己重现出来，她的文字才会有灵魂作为一个真诚的写作者，对于别人评论是不需要放在心上的，一个真正的写作者是不用去解释的，因为这是自己灵魂的直觉，不同的东西才是可贵的东西，不要在乎，一篇好的文章别人自然会去揣摩，这是别人的事情，解读都会有不同。如果你在写日记的时候，还想着要掩饰自己真正的想法，那么我应该鄙视你。为什么非要这样那样？你认为塑造一个不像自己的形象，会如此坚固吗？不管你塑造的是什么东西，再美丽的形象都是没有意义的，首先对不起自己，对自己不肯定的表现，你如果是一个有尊严的人，应该不加以掩饰自己，这是对自己最大的尊重，更是对别人莫大的真诚，然后别人如何去揣摩，这是你不需要烦恼的事情，只要你的灵魂表达得够到位，一切都是无足轻重，灵魂的真诚是凌驾于一切之上，灵魂最不应该学会的是虚伪，万千世界的树叶没有一个脉络相同，人也一样，这是大千世界美丽的展现，在释迦摩尼佛的教法中，法门是无量的，因为不同所以博大精深，因为不同所以足够精彩，所以有方便法门这一说，因人而异，因材施教。佛法是富含创造力的，在锤炼自己不同的脉络走向，也许 ....也许..这都是属于你的！</p><p id="source-b-004">不能辜负是自己，辜负自己就是辜负佛，因为你就是佛。每一个人是独特的，也都是充满光辉，可能表现的方式不一样，我要遵从的是自己的内心，心中因为有佛陀的教法，我知道哪里是一个尺度，在人生路上我充满欢喜。人活着是不断挖掘自己，每个人的宝藏是无限的，人的想法是无限的，如果行动力跟得上，创造力就是无限的。艺术家为什么称作艺术家，他先肯定自己，然后尊重自己的从事，然后去挖掘，他每每完成一部作品会觉得自己的灵魂被榨干，但是灵感是源源不绝的，尽管我不是艺术家。你每天写日记，尽管你不知道自己要写的是什么，但是你总是有灵感写，就算是胡扯你也是能扯到一定的字数，我相信自己的创造力是无限，我一直在坚持自己的写作行为，确保自己的灵感不会枯竭，在我还是菜鸟的时候我应该要保持自己的动力，想要清泉就得挖一口井，我现在就是处于挖掘的过程，我还没有挖到泉水，但是我知道终有一天我的井水会冒出泉水，只有坚持每天挖，在有限的时间中，用自己的劳动力去挖掘，一点一滴这能感动一切。你要服从自己的意志知道吗？你这个懒惰的家伙，人生就是挖掘再挖掘，在挖掘的过程中，也应该去帮助别人，督促或者是鼓励，这是一个合格的挖掘者，不光自己要成就，别人也需要成就。这是慈悲。</p><p id="source-b-005">明天要去打工了，昨天晚上的想法在今天实现了，感恩八圣吉祥颂，感恩三宝的加持，三百块的工资，我很高兴，高兴的是自己能迈出去第一步，这是我应该去坚持的，而且工作的时间安排又是那么地如意，我每天只要早一点起来，这也是顺我心意的，因为自己也不想多睡，人睡多了就会懒惰。坏的习气不断地受到渲染，更加壮大。感恩三宝，感恩一切成就我的人，明早 5::50就应该起床了，好事成双就是这样，符合自己的心意还能有经济收入，这是多么好的事阿。工作也是严格我懒惰的一个方法，自己一定要坚持，因为早上这段时间是不会有什么冲突的，如果说有冲突的话，就是自己懒惰不想去了。记得要坚持。世上没有比我幸运的人。感恩所有。</p></noscript>
