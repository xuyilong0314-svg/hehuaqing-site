    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>更高的天空</h1><p id="source-date" class="diary-date"><time datetime="2013-08-08" title="原笔记创建日期，不一定等同于落笔时间">2013年8月8日</time></p><p id="source-b-001">要飞向哪里属于我的天空，漫无目的地走着，发现我是一个年轻人，为什么我会怕这操蛋的社会给我带来的压迫呢，年轻的时候我可以奔跑 我可义无反顾，为什么总要证明自己呢，青春被狗给吃了 也比吞没在名利的泥潭中好阿，我需要多少东西才能生存，我需要多少东西才能获得别人的尊重，我需要多少东西才能享受生活。我需要多少东西才能后顾无忧。我需要的是什么，到底需要的是什么，上一辈的人过着绝望的日子，他们一定是对的吗？如果我突破我去奔跑，我注定漂泊，我注定一生不羁爱自由。我注定......去可可西里看看海吧，伸出双手拥抱这个世界吧，青春最能肆无忌惮，为什么要把那么多的压力加在身上，我父母现在也过得很好啊，他们现在所争取的一切是为了我，那我呢？我应该为自己争取阿，我所向往的生活，我是勇敢的吗？为自己的未来准备，我要把我所向往更好的天空理论化 并且我要去实行，我选择自私一些，选择为了自己的生命 我不要平凡的一生 不希望与大部分的人重叠，不愿意随波逐流，我是叛逆的，但是我是一个好孩子、 我的理想，现在记住我的理想，有一天看到这样的文字 那时候如果你已经被现实社会给压垮 你过着自己不愿意过的生活 当你不快乐的时候 那么你走吧 走得远远的 去远方，去你理想的远方，若干年后的你 看到这段文字的时候 你一定要去奔跑 一定要不顾一切 去过你想要的生活，21岁的我 给若干年后的你以信心。</p><p id="source-b-002">记住 不顾一切不要回头，理想是更重要的 信仰是生命 您要像梦想一样自由 像天空一样自由，去寻找你生命的意义，未来的你是怎么样的一个境况，我们约定好吗 当你被理想压垮的时候 去奔跑 挣脱这个牢笼梦马，如果你抛弃了这个名字，记得现在的我在为你打起加油。</p><p id="source-b-003">梦马，不要忘记理想 不要忘记你所爱的。 一生要为了自己而活着。</p><p id="source-b-004">梦马，不要忘记你的信仰 站在这片天地 你要仰望。 以梦为马。 知道吗？不顾一切知道吗？</p><p id="source-b-005">‘ 当你被现实给压垮，去吧 飞得高一些 自私一些</p><p id="source-b-006">举起火炬 以梦为马 不为千千万万人所动，奔跑 不要停歇</p><p id="source-b-007">我为你加油打气 你是藏红色的 是奔放 浪荡不羁 你是大地的儿子。</p><p id="source-b-008">给未来的你 给未来你那个胆小懦弱的你 给未来被现实压垮的你 给被套上枷锁的你</p><p id="source-b-009">致。</p></noscript>
