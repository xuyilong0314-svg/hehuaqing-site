    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>灵感不止没有</h1><p id="source-date" class="diary-date"><time datetime="2013-04-02" title="原笔记创建日期，不一定等同于落笔时间">2013年4月2日</time></p><p id="source-b-001">现在人的状态很不好，下午的时候就去打球 现在人的精神很累阿，头晕晕的，第一次用手机写日记。我想现在写完回宿舍就睡觉，今天也没有什么事情做，觉得一天也没有做什么事情，本来下午要看书的，和灿福一起去打篮球，用手机写日记还真不习惯。现在什么也想不出来要写点什么，我现在的状态就是灵感全无，就连拿出一个主题的灵感都没有。荣誉是对个人的肯定，但是现在把荣誉说得太庸俗，可以接受自己的荣誉，但是如果把荣誉当成了是一种名利的追求，要死，我的灵感都哪里去了，我现在根本也不知道写的是什么。不要说我觉得，就是这样的你认为的话就说出来，说出来就肯定自己，对自己说出来的话要肯定。要对自己负责。这段话我也不清楚自己在写些什么，确实现在不适合写日记，在这种嘈杂的环境确实很难写，没有一丁点状态。如果我在外面的时候还是这样的状态。我怎么写，明天即将是要踏上安徽的旅途火车之上，或者我在去西藏的旅途，这都是没有问题的，这是环境的问题。这样的环境本来就是不应该这样。我觉得现在的一切事物都是追求名利，把一切都建立在物质是苦楚的，刚才说到了聚会的事情，是不是自己没有本事就不应该参加聚会吗？这都是那么地势利着。</p><p id="source-b-002">虽然写的很烂，但是还是用手机写完吧，这些都是真实的我不需要自己，这本来是自己的日子，为什么非要写得跟文章一样优美，我要的是真实的感觉，这样想的时候感觉好多了，明天就要去安徽了，一切都能顺利，我的青春是无所畏惧的，这就是初生牛犊不怕虎，这都是好的品质，自己以后面对困难的时候 也要具备这样的精神才对。今天晚上因为自己请假的问题有一些顾虑，这是不是对的？应该有这样的顾虑吗？从学生的角度旷课是不对的，但是因为年轻时候的疯狂 我觉得这无可厚非的，确实是这样的，人生有多少个这种时间，我在想只有大学有这么轻松的日子了，现在我是一个成年人，我现在有自己的观念，走了自己的想法 很多事情都可以去做，而且现在又是最自由的日子。在大学的时间过得好快，一切仿佛都想是一幕幕电影，不知不觉就到了这一步了。远方的远就在眼前了，那时候还是青涩少年，现在已经不是那个堕落的少年了，现在我拥有了爱情，我拥有自己的信仰，渐渐走了人生的意义，一切都是这么自然，那个时候我当然不会想到我现在的模样，而且是每个人都不觉得，然而我也不知道自己以后的模样，确实是这样没错，当十年后的一天我看到了这篇日记，我惆怅，以后就在除夕的夜里看看自己的日记，现在想来真的很高兴呢。</p><p id="source-b-003">我把每一天的时光都记录下来，我可以回味，人的记忆是有限的，而且是越老越记不得自己的回忆，但是我用今天的坚持刚自己在以后记忆衰老的时候看，这是一件多么有意义的事情，当有一天我不写日记了，那么就是我死了，虽然我今天并没有什么值得写下去的事情，但是我的想法并不像生活这样一成不变，我现在写的文字，多少是生活中的事情，但是这些灵感都来自生活，生活的这些事情，一些谈话。 今天和福打球的时候我故意让了他 故意不防守，我们之间的距离总是相差不大，这样我们的积极性都给启发了，这是好事阿 如果我用自己身体的优势去赢球，赢别人太多，这样有意思吗？如果一直以这种状态我认为没有人想与你一起游戏。输赢不重要，主要是要快乐，打球是快乐的 是一次次进篮筐的喜悦，是对自己一个高难度动作的满意。这都是有激情的，在互相谦让 我们更好地有了快乐 不要太认真，别人也是需要去表现的。用手机写日记的一个弊端就是 没有分段，但是这样也挺好，这一切只要自己看得懂就行了。我现在所有的思想都在生活中慢慢实践。我决定了哪一条路，我未来就会向着这条路去行走。这是真理他 我也相信自己，我心中的的一个个愿望。还有我喜欢旅游，我找到合适我的伴侣，这一切都美满，吸引力法则就是愿力，只要心存善念，我都能完成自己的愿望。</p><p id="source-b-004">因为我总是能感恩，我能肯定自己是一个懂得感恩的人。看 因为感恩我得到了我想要的，一切都没有刻意，我也没有执着 就这么顺利地，我完成了我人生的一个个目标 一切都在顺我心意，这个世界以及这些人都在成就我。我要感恩这一切。我现在很幸福，我是世界上最幸福的人。</p><p id="source-b-005">到了现在才分段，其实分段的意义不大，因为这又不是写文章，这只是日记与自己的对白，不用讲究，也就将就 我当然看得懂我写的，现在记录下的心情都是不同的 当有一天我看自己日记是怀着一种心情，自己又看到了我现在的心情，以前的那个我在哪里？已经不复存在了 现在我以一个当下的身份 写着，我的身份在被刷新，我一直在相续，就好像是河流一样，我用是在缔造一个个 又在失去一个个 过去的我在哪里寻不到，未来的我在哪里？够不着。那我在哪里？当下即是。 智慧无时不刻都在就等，只是差了发现而已。谁没有智慧都是。确实都是。当下就是净土妄想从过往与未来寻得本心，是妄念与执着。活在当下，仿佛更能明白这句话的意思了，做好每一个当下，对过去未来现在更是没有分别的。过去心不可得未来心不可得 现在心不可得。一切都现有。从当下出发 有时不需要计划。因为没有哪条路是不通的。应该是这样吧，到哪里就会有一条新的路，不用计划了 也不要提前去担心什么没有做好，如果要方便的话就是要靠自己的人缘，有人缘的人到了哪里都是方便的，只要想住下，或者想做点什么事。都是可以顺心如意的。</p><p id="source-b-006">我是最真实的案例，我一件件事情都已经给我满意的答案，要感谢前人给我的经验，以前和云交往的时候，我总是在干涉她的人生，我并没有这种能力，因为这种变形的好心确实成我我们之间破解的原因，我希望她能找到一个更好的人，我现在很幸福，生活的一切，我希望我的幸福能传染，带给她快乐 。我绝不虚情假意。我是真心的。</p></noscript>
