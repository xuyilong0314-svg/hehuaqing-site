    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>不要试图标榜自己</h1><p id="source-date" class="diary-date"><time datetime="2013-05-01" title="原笔记创建日期，不一定等同于落笔时间">2013年5月1日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">从海上钢琴师这部电影我开始喜欢上了钢琴，喜欢上了音乐我喜欢那种感觉，是发自内心的喜欢，特别优雅地，我到钢琴上边试了一下乱弹一通，我在幻想我能像 1900那样能无师自通地成为一个钢琴艺术家，但是嘈杂的琴音让我从幻想中醒来，并不是每个人都能成为艺术家，总要有人倾听。作为一个喜欢倾听的人，我很幸运能得到这样的，记得那时候我在和李慧说朗朗的时候我很牛逼哄哄地，那时候我并不知道李云迪总是要在别人的视野中才知道自己的狭隘，真的很狭隘而且一副不懂装懂的样子，总一种自以为是的态度，这种是让别人看出你马脚，以前的时候觉得自己看书别人没看书就会觉得自己很了不起，觉得自己是优越的，以前懂一点点的音乐那时候只知道朗朗，这是比如的说，这都是狭隘的表现，狭隘的人是不能体会艺术的魅力，或者是从书籍中找到自己想要的，和作者的那种共鸣，那种感同身受。</p><p id="source-b-002">狭隘的人视野总是不宽阔的，总是在井底之下看到的蓝天只是一口井那么大，外面的世界是多么地精彩多么地魅力，完全是看不到的，除非打破自己的狭隘跳出来，才能学会欣赏，真正的懂得音乐是怎么一回事，或者是从别人的书籍中看到自己的灵魂，自己的灵魂与对方在交流，灵魂的碰撞产生的火花，这样的阅读才是有意义的，如果是向别人炫耀你有多么了不起你看的书很多，这完全是一种傻逼的行为，就是自娱自乐的行为，而且从对别人傲慢与偏见，渐渐地灵魂开始萎缩开始地不属于自己，或者是躲起来了，我说过人一狭隘，就不会有视野一切都只是看起来而且，井底之蛙是没有未来的，即使他是肥硕的，但是跟苍鹰是天地的差别，苍鹰学会捆绑行李，奔向远方，他知道没有飞翔翅膀会老化，雄心会被磨灭，他捆绑行李，奔向远方。我是那头苍鹰我愿意做一只苍鹰，不为搏击长空，只是为了寻找自己的位置，自己能停下歇息的那棵树，那个位置，足下的土地。只是为了寻找人生的意义，如果你向别人提起人生意义的时候。那个人没有泼你冷水愿意倾听的话，那么请感谢这个人，这是来之不易的，有愿意倾听的人是多么美好的一件事情，每个人都需要梦想，这个世界在见证，倾听的人在见证不要给我什么意见，只要支持我，支持我就行了，我只有一个人生，如果你信任我，让我飞翔，让我飞翔，现在我不知道自己的这段话说的是给谁听的，有一点像父母有一点向是 77，一半一半。</p></noscript>
