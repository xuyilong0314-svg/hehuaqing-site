    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>八点钟和九点钟的人生是不同的</h1><p id="source-date" class="diary-date"><time datetime="2013-04-30" title="原笔记创建日期，不一定等同于落笔时间">2013年4月30日</time></p><p id="source-b-001">八点钟和九点钟的人生是不一样的，每分每秒都是不一样的人生，这一秒你到了这里可能你就失去了生命，一个小小的等候都是让人生不一样的，当初如果我和林还是交往的话，她现在可能还是继续读大学的，刚才看到她的说说里，字里行间是后悔的意思，让我又一句感觉惭愧，每一个改变人生都是不一样的，当初我没有变坏的话我也不会接触佛法，当然今天也不会是今天的自己，这就是人生的轨迹，生命的某一段经历都，其实不能说是某一段，是时间流动的每一时刻，都是在改变人生的一个个契机，我是一个讨厌框架的人，我也讨厌一大堆规矩的人，但我又是一个佛教徒，我的讨厌的规律是这是世俗对人的愚弄，我讨厌这种我希望每个人都能还原一个真实的面目，能做自己能活出一样的颜色，然后这个世界开始缤纷起来，色彩总是异样的，因为这样才是一副美丽的画册，不一样的烟火才是美丽的，不要掩藏自己因为每一个人的颜色都是不同的，不同的颜色美丽了烟花，渲染了天空，取悦了在桥上看风景的你，什么都是有关联的，时间总是在流动我们青春逝去，但也美丽了我们，时间的流逝中我们创造了许多美丽的，但也破坏了许多。</p><p id="source-b-002">每天都是从新开始，这时这刻我同样在创造自己的人生，我的人生在我的文字之下，显现出来，写日记的时候就是记录然后抒发自己的一些想法，今天妈妈说我还没有出社会的时候我还是不知道苦，我其实是明白的我那天做兼职的时候我就能体会到那种感觉，至少知道这是不容易了，我们都是幸福的人，大家都是幸福的人，身边的人我说不出哪个是不幸运的，好好珍惜这种时光，我认为在这种好的时光中没有得意忘形，也是能学到东西的，起码是学到了感恩的心情，也更知道来之不易的幸福，福报总是很快地就用完了，就好像那天一样，我们工作了一个下午，吃了一顿饭就没有了，比较一下就知道福报的关系的，并不是心中执着这个福报，只是让自己明白不要挥霍，挥霍的人尽管再的福报都是会消失不见的，这是人生的一个铁律，感恩这一切带给我方便幸福的人儿，轨迹就是这样不同，今天如果去唱歌了自然志林不会来找我，而且我们不会吃肯德基，也不会在里面聊天，其中聊天的内容肯定也是不一样的，这就是八点钟和十点钟不一样的人生，然后经历之后的感想，以后想要怎么做的想法也是不同的。</p><p id="source-b-003">77相貌并不是出众的，说起来还有点肥胖的感觉，特别是大腿，这次不一样我爱的是她的内心，刚开始我想和她在一起也是因为内心，我从来没有想过外貌的事情，我不需要一个花瓶，我需要的是一个有灵魂的人，应该是有所作为的人，能支持我走下去的人，这种人的陪伴是一生的，耳朵里听着曲儿很符合我现在的心情，有点丰富的感觉，是一种积极向上的感觉，美丽的旋律在我的心中开了花了，灵魂的恋爱才是恒久不变的，再姣好的容颜都会因为时间的流逝而消失殆尽，但是内心是改变不了的，内心的美丽是会随着时间的沉淀而改变的，灵魂的美丽只会是越来越香醇的，平淡淡的爱情会是香醇的，而热烈的爱情过后就是厌恶，人生若只如初见，何事秋风悲画扇。</p><p id="source-b-004">等闲变却故人心，我喜欢有灵魂的人，灵魂只能独行灵魂，我爱你，爱你所在的位置，爱你足下的大地，两棵在各自生长，但是给及对方无限的力量，看到对方共同在进步，要时时刻刻知道自己都是改变，在当时当刻，人生只有当时当刻只有这一短暂的现在，无数次地在生死，无数次都在轮回，我现在保持好的心态，当时当刻我就是一个人格圆满的人，如果能将这种心情带到每一个当时当刻那么就是成功，我所理想的爱情时能互相扶持，互相进步的，互相进步才是最重要的，人生是计划不了的，有一个目标坚定的目标，然后在当时当刻去完成自己应该完成的，人总是很脆弱的，看看地震中丧命的人儿，他们计较什么都不知道，然后就死了，我所认为的及时行乐就是，赶紧去做自己喜欢的事情，去完成自己的梦想，在一切发生在当时当刻，这就是及时行乐</p><p id="source-b-005">今天和77只是第一次正式的约会就我们两个人，我们不会有陌生感，是没有那种隔阂的感觉，因为我们在灵魂中已经探寻了各自的，我觉得很是自然地，我们如此合拍我们就是这样，爱人就是给对方一个空间，不要是一样的，牵着她的手我没有什么紧张的感觉，仿佛这就就是我本来应该做的事情，我现在并没有沉溺在情爱中，我自己明白我很是理性地，爱情是需要理性的，我并不希望她把我当成了全部，我更希望她是一个独立的人，我们各自都有对方，但是我们都要有各自不同的姿势，枝条间是不一样的，如果两棵都是一样的生长姿势，那么两棵树之间一定不会有缠绕也不会有交集，人生需要不同的风景，不要因为自己的爱好，自己认为是对的就去要求别人，让别人变成你想要的那个样子，我以前就犯过这种错误，现在我明白了，每个人都有不同的人生，自己建立一个框架让别人生长是自私无比的。</p><p id="source-b-006">谁都愿意按照自己想要的轨迹生长，不要去强加给别人框架这是自己要记住的，没有框架之间是绝对自己有的一些原则，只要没有越过原则这都是允许的，开创自己的未来 自己去创造一个不一样的人生，如果说我的作用是什么，我是一个帮你的人，我可能给你一点建立，或者是分享你的快乐悲伤的人时间所有的的相遇都是久别重逢，如果问我现在能放下这一切出家吗 我的答案并不去肯定，我很满意现在的生活 我没痛苦 但是不思维苦是不会有愿力的。 时间留给我时间思考，人生路上 我们相遇着。 我们别离着 我不是唯一，世界唯一的是你</p></noscript>
