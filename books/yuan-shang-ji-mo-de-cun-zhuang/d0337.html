    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>像个孩子一样</h1><p id="source-date" class="diary-date"><time datetime="2013-09-21" title="原笔记创建日期，不一定等同于落笔时间">2013年9月21日</time></p><p id="source-b-001">今天干了一件蠢事，跟无敌在一起的日子里面，一起 2的时候，把垃圾桶给踢破了，我想着是一段美好的记忆，有时候我就像个孩子一样，这是我的一种享受，我仿佛会回到童年，很多清晰不清晰的都记录在这里，以后的你回忆起现在你会怎么想，刚才的那种心情跟小时候是一样的，小时候我并不是能到处去玩的人，小时候是一个孤独的人吧，现在同样是孤独而立的，我是孤独的人 却不是冷傲的人，孤独是我内心最后的力量。为什么总会说自己是孤独的，我真的是孤独的吗？我并不是孤独额，信仰给我的力量并不是孤独的，而身边也是有能理解我的人，就说微博吧，还是保持自己的态度吧，中秋的假期就这么结束了，那么歇一歇自己的心吧，这几天也是有些收获的，看了金基德的电影，(刚吃了小鲍的花生，觉得肚子好难受，胃酸的感觉)我的肠胃还是不是很好地，那么就结束了 孤独的人。</p></noscript>
