    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>长智齿了</h1><p id="source-date" class="diary-date"><time datetime="2014-11-06" title="原笔记创建日期，不一定等同于落笔时间">2014年11月6日</time></p><p id="source-b-001">从两天前的夜，那时候还在吃着泡面 然后被智齿折磨着 半夜也醒过 在逆境中 看自己的脆弱不堪 忆念本尊的时候的力量呢，倘若来了更大的痛苦 我是否能够忆念起上师本尊，我现在还未受灌顶，我一直都在准备 让自己准备好弟子相，接受上师的教法。</p><p id="source-b-002">一直都是在如梦地旅行</p><p id="source-b-003">提醒你，不要当真</p><p id="source-b-004">一切的欢愉 不过是无常</p><p id="source-b-005">悲喜都应该超越。 愿今日善功德回向于一切众生 如母的众生</p></noscript>
