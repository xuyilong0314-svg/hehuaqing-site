    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>硬件问题</h1><p id="source-date" class="diary-date"><time datetime="2013-03-29" title="原笔记创建日期，不一定等同于落笔时间">2013年3月29日</time></p><p id="source-b-001">是这样的吗？切确地说我并没有专注于学业上。我很干脆的承认了，但是我又我为自己辩解了，是不是有点矛盾，不管怎么样我还是行的，我不清楚这是一种什么样的感觉，有点失落的感觉又有点不安。李霞说这是硬件问题，少来。你们这是对的，是相对。我肯定不想托付于她，一副很了不起的样子，但是我也是虚伪，我应该有点什么说些什么的。我这是在学习，没错我的硬件确实有问题，这是我的局限性，今天李老师帮我说出了我不想承认的问题，为什么现在改名叫做李老师了，我学到了东西，我确实学到了东西。</p><p id="source-b-002">空谈误国，我总是觉得自己沦落在空谈的领域，我给自己一个个承诺，接下去应该怎么做，然后自己却是没有去实行，一副浮夸的模样，我很讨厌，说实话我今天很失落，跟竞选没有关系，就是发现了自己一直知道却不想承认的软肋，就现在上课我也很不在状态，也没有认真去听，本来说自己的作业要自己做的，现在呢。不想去思考了，随便抄袭别人的就糊弄过去了，然后自己也过得去。实在是不要脸的行为阿。臣服与自己不是什么好事，时时纵容成了习惯，自己反而发现不了了，今天才发现了，我纵容之下的结果，我确实挺难堪的。为自己感到羞耻。我对你的要求不一般，你也知道我常常都会提出，然后你信信地承诺，之后却是无所谓地毁约了，这事情做得让人想吐。你想改变点什么，我应该向自己施压，我写日记的时候我老是想着换行，就是因为字数吗。你这个傻逼。</p><p id="source-b-003">很久没有这样的感觉，这是好事，你要意识到，个性是可以的但如果把不学习当成个性，也只能说是头脑发热的象征，我并不在乎别人是怎么样看待的，我只想知道你要如果去作出应对，这就是你的缺点，你总是一副无所谓的样子，对学业无所谓。你立志要为这个环境带来点什么，但是你在这本课上面学得一塌糊涂地，你确实很浮夸，我就是当你浮夸，这两者之间是我苦恼的，在进取心上面要跟自己好的一面比较，如果你想做点什么，请你付出点什么，然后坚持下去，就像你坚持写日记一样，文字的确发生了改变，写作的灵感已经相应地提高了。自己终于也知道要写点什么了。看书的时候总是翻页书就是不耐烦的象征，我承认我不耐烦，但也不是我总是能被书里再吸引过去。今天下午是再累，在自习室看书的时候竟然睡着了，就像这香一样，我无法掌控这烟的去向，我不知道它会向何方，又发生什么样的改变，我对自己念头的轨迹也像看这烟一样，所以你纵容了自己的硬伤，纵容了自己的各种缺点，觉得这是无伤大雅的，然后说什么局限性，不能面面俱到，这都是在妥协这不是在修行，修行是不应该妥协，对自己决不能妥协，我的念头总是飘摇不定，妄念繁生。虽然是很美丽，而且让人着迷。却让人捉不到边际，心应该要安放在哪里呢？制心一处 无事不办。</p><p id="source-b-004">然而这心又在哪里，总是漂浮不定，总让我无所适从我应该如何去掌控，我现在的内心也是有许多的想法，比如说我想到了西藏我的念头就到了西藏，我想到了美国念头就到了美国，有什么比念力的速度更快吗？恐怕没有了，在遇到苦难的时间，心中忆念佛菩萨，菩萨的大威神力就来帮助我们度过一个个难关。</p><p id="source-b-005">哦~这是在太美丽了，我看到了回光返照，当蜡烛燃尽时，火焰总是最强盛的，佛法是如此，末法时期，修行很难，我又不想继续轮回，然后随着自己每天的放逸，失去了自己更是没有看到自己的弱点，把弱点当成习惯，当成看不见，总是会纵容自己，对我来说这就是末法，即便佛陀在世，我同样是末法。如果我精进修行以世间为道场，就是正法重现。佛法是没有界限的，超越时间空间的概念，当一念即使。当下一念就可以成佛。不要这样死气沉沉，拿起你的激情，不论是什么困难你都是去克服，人生是一场修行，没有苦就不是人生，没有烦恼就没有人生，真正的人生是跨越自己心中的个个坎，如你所说你是世上最幸运的，不管是遇到什么你都是是如此幸运，有人帮你指点，让你去思考，很感谢这一切的指导，在逆境中才能明白自己，才能认识到自己，烦恼即菩提，跨越过去就是养料，就好像我的以前我的无恶不作，现在的无善不做，这就是一个跨越，恶的事情我是不会再去做了，这就烦恼和菩提 之间的关系，一切成就的人哪一个不是在失败中找经验，哪一个不是在逆境中胜利的，如果让你一帆风顺，我不愿意，趁年轻的时候多烦恼一点，才能彻悟，没有哪一个成功的人不是苦过来的，我现在是幸福的，我还没有出社会，对于面前的路，我不应该害怕，去承担没事的，不管是什么苦都得挨。我敢做世上男子汉敢做的事，没有人比我更勇敢，没有人比我更有勇气，对，这是这样，满怀激情地生活，哈哈！！！</p><p id="source-b-006">我喜欢鲜艳的红，我喜欢激情，我更是喜欢挑战，我应该抱以无所畏惧的狂野，去面对荒芜世俗之事，没有什么，我就是这么有信心，我思故我在。我就是一个王，在我的世界我就是王，我要主宰我的国土，我要成为王，迷茫不是你的风格，你可以马上找到解决之道，因为佛光永远照耀着，来吧，我接受挑战，我不怕，我全部不怕，我来承担，哈哈！！我的精神世界是超越于他们的，他们又怎么能懂呢。热爱生命，要热爱生命阿，生命给你的一切都是对你的恩典，不管是快乐或者是苦恼，你都要全盘接受。不要贪心，本应该这样，只有超越自己，才能成为王，你不会感到孤独，因为当下即是，一花一世界。一切都会在广阔的胸襟中。 卡拉卡拉！！</p></noscript>
