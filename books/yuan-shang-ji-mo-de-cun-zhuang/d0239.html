    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>我在黄山你寂寞了没</h1><p id="source-date" class="diary-date"><time datetime="2014-04-07" title="原笔记创建日期，不一定等同于落笔时间">2014年4月7日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">我应该怎么来描述这一趟旅程。</p><p id="source-b-002">一切好像是注定的，硬座的火车票不管用什么姿势都别想安然睡过一夜，一路磕磕碰碰，也磕磕碰碰地睡着，浑浑噩噩也到了终点，当然睡意得先抑制住，然后应该要爬山了。一路上花了差不多 1000，穷游啊 真穷游阿 舍不得吃贵的东西 纯粹是为了看看风景，一种学生能够消费得起的方式，我们也是自得其乐。</p><p id="source-b-003">我是美国队长，也可以称我为统领，我带领一个队伍 我尽量让自己显得更加民主，但是某些时刻都是自以为是，想左右大家的想法， 结果我的想法还真有左右的能力，所以说一路上学到的就是去承担更多的，为团队做的事情， 我想我的经历是美妙的，现在搭起帐篷来也是顺风顺手了，不那么羞涩地怕别人看到，而是大大咧咧不管不顾地，就这么着了吧。</p></noscript>
