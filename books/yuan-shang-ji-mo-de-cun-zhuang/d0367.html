    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>可以置身事外吗</h1><p id="source-date" class="diary-date"><time datetime="2013-08-15" title="原笔记创建日期，不一定等同于落笔时间">2013年8月15日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">其实我对妈妈都是拿自己有理的地方在讲，我有什么资格，我也是做得不好吧，作为一个不求上进的人，她说我不要有钱可以，但是我处处都是用钱的，我做得不好吧 让妈妈也是没有安全感的，我给不了任何人安全感，我不知道自己的情感里面有多少家的成分，远走天涯是我所理想的生活，对别人来说是梦幻的，但是对我来说是要勇敢的，我是否有一颗勇敢的心去选择自己喜欢的，我并不喜欢我学的这种专业，我更喜欢我给别人治病的那种感觉，未来是从事什么工作我也是不清楚的，我对我的未来一无所知，或者我真的就做一个医生也是说不定呢，我心中老早就想好了我那些规划，我心中的那些设想是否会成为现实的场景，我想这是可以的，我真的是希望我朝着这个方面去发展的，那么我得认真对待我的每一个病人，现在是以病为师，我的第一个病 阿义我的姐夫 或许会成为一个转折点，做好我应该做的、我现在已经是在充字数的状态了，我想马上就写好 2000个字 我好去做别的事情，我想听听音乐。</p><p id="source-b-002">在家里的生活规律已经是发生了改变，已经彻底不健康了，晚睡晚期，人开始变得懒惰了，从我看书的数量来看就知道我有多懒惰，两个月的时间就被自己给浪费了 以前的那种状态已经是一去不复返了，那时候我能叫我们的小伙伴起床，而这个时候我却是睡得比谁都晚，那时候我早上六点多就起来看书了，我不想用这种网络的工具，现在手机买来也是改变了我的生活状态，对我来说着是多么颓废 多么没有意义的一段时光 我不知道我熏进去的有多少东西，讲堂在打佛七了 外婆已经是不叫我了 ，她很失望了吧。 我内心中也没有想去的意愿，这是怎么了。我的生活 我的生活 就这样了吗</p></noscript>
