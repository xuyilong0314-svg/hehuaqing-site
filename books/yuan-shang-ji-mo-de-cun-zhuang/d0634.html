    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>锅碗瓢盆</h1><p id="source-date" class="diary-date"><time datetime="2012-11-17" title="原笔记创建日期，不一定等同于落笔时间">2012年11月17日</time></p><p id="source-b-001">今天，去了超市买了 锅碗瓢盆，菜阿。各种东西2508的损友们，洗菜的洗菜，剥玉米的剥玉米，烧开水的烧开水，拿面的拿面。吃着老干妈干拌面，啃着瓜子，喝着麦片 [好激动][好激动]我们都怀有一颗小资情怀 ~无处不在充斥着诱惑，我必须 把持自己。</p><p id="source-b-002">严格要求自己，不让自己好过 要学会惩罚自己，不对自己宽容。</p></noscript>
