    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>就现在而言 没有更糟糕的情况</h1><p id="source-date" class="diary-date"><time datetime="2014-08-21" title="原笔记创建日期，不一定等同于落笔时间">2014年8月21日</time></p><p id="source-b-001">太多太多的事情 从我说要出家的那一刻 一团糟 总是一团糟 一切都是我糟糕换来的。</p><p id="source-b-002">很多时候我都不应该透露的秘密 现在变成了我的阻碍 原本应该很好的结局 现在变成了我的违缘.现在所有的痛苦，都是我成道的资粮 每个人都各自的缘分 停搁多久的时间没有与自己对话，身上的所有业障 都现前了，违缘一直都在增长往昔所造诸恶业 皆由无始贪嗔痴 从身语意之所生 一切我今皆忏悔多久没有写了 从五台山朝山回来 却是没有得到任何的利益 生命已经那么艰难了 是艰难吧 过几天我再看得时候 也不是事情了吧， 一直以来我都是在徘徊我所犯的错误就是让自己 成为一个怪人 佛陀阿 加持我吧 佛陀啊 加持我 佛陀 加持我弟子很痛苦犹如中箭的鹿生命中如此多不堪违缘一直在增长一直在我身上发生这一切都是我所造的业也让我的父母生了痛苦我不应该留恋 不应该如此地执着此事、如果生命中毫无痛苦的话那也不必修行之所以是人我应该如此受次磨难坚固自己的信心、</p></noscript>
