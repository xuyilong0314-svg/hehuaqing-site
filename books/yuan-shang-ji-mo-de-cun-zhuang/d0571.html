    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>明日是回时</h1><p id="source-date" class="diary-date"><time datetime="2013-01-19" title="原笔记创建日期，不一定等同于落笔时间">2013年1月19日</time></p><p id="source-b-001">明日便是回家时，也无欢喜，也无忧。将要告别这个规律的生活，第一学期的生活，这半年的经历，我的大学模板渐逐渐建立起来了，时间的分配，也建立起来了，更好的是有了写日记的习惯，虽没有想过要当一个作家，但这对自己独白的形式使我受益匪浅，真的很多，以前的语言逐渐串联的起来，跟自己也谈得来。这一切的改变都归功于佛教，信仰了佛教是我一生最大的福报，这是生命对我的恩典，让我坚强，让我认识自己，感恩。 总结一下吧。九月一号的入学，到了现在半年了，光阴就像白马过隙，稍纵即逝的感觉让人感叹，刚进来认识了宿友，大家都相处得很好，期间跟志伟吵过一架，但是后来也好了，我们对彼此都不是爱计较的人，从刚开始上课的情况到了到了后来的情况:</p><p id="source-b-002">刚开始上课非常认识，每一节课都很认真听，到了后来我是做自己的事情居多，看自己的书或者是把弄手机。期末考的时候心里没有底，这是必然的，就是心里巴着老师按常理出牌。明天剩下化学，随便填一下就出来，奔上回家的路。一年期也没有什么好总结的，能总结的也很简短，就是看书多了，看书的习惯渐渐地培养了起来，这是我最大的收获，阅读能与各种有思想的人交流，神交，精神上的交流，让自己的灵魂更加有内涵，更加扎实，过程也是很享受的，就好像现在自己在写作，本身的快乐也是不言而喻，文字从自己的手中敲打而下，说到文字，自己的练字生涯又失望了，是没有一个系统性的学习方法，还是没有耐心。这自己应该很清楚，是把，远。</p><p id="source-b-003">以后你的名字就叫做远了，远方的远，我将这样称呼你，</p><p id="source-b-004">那个在遥远的云端看着玩，我的灵魂，我的远。</p><p id="source-b-005">这个月看书也不多，我觉得那个起点也是因为，上次电脑坏了，不能联网心里很着急，因为不能写日记了，但是也引发我对计算机的那种希求，然后时间多出很多都在上网，这两天还玩了一个网页游戏，并也有为之着迷的情况，人性就是这样，一对自己松懈，他的本来的陋习也就出来，但是这一观点还是不够圆满，因为本来就是空，陋习本来也是空，法法本空，没有好也没有坏，就是本性，就是明心见性，但是我离领悟这一点还差远了，本身的陋习不断，这两天因为快递的事情也心生烦恼，因为没有送来就有点问题，好还刚才解决了明天就拿，这是不是预示着我，在这个寒假期间，我要多看书，这是本书都给干了，这是我应该要做的，告别了这规律的生活，因为还有书，对，因为还有书如果，一刻闲着。这个假期就是检验自己阅读习惯的建立，并在阅读中的喜悦感。成事在人，挂不挂科还是得看老师，这也是我无法改变的，看着办，考也考了，心中也不必有太多的想法。</p><p id="source-b-006">不够专注一直是自己的硬伤，本来在写日记，又跑去优酷闲看了，远，你怎么看，我适当的看一些节目开怀大笑本身并没有错，现在的媒体的内容都是毫无顾忌的不管内容是什么，也没有归类，现在上网的年龄段年纪是越来越小，是学习能力最强的时候，媒体传播的是什么信息是什么内容，带给人的也是成正比的，远，你还是从改变自己开始，你整天说一些空话干什么呢？这不是充字数，这是跟心灵的独白。回去之后，见一见故人，好好呆家里，看看书，没有什么不好的！ 也无欢喜也无忧。平安。</p></noscript>
