    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>最后的九天</h1><p id="source-date" class="diary-date"><time datetime="2014-11-29" title="原笔记创建日期，不一定等同于落笔时间">2014年11月29日</time></p><p id="source-b-001">一天一张照片 这是两三年留下的最后的一点记忆。</p><p id="source-b-002">时间很快 20年的光阴，关于在学校的时光即将要结束。 一路上有一些遗憾，有一些书没有看完，有一些人没有去珍惜，也辜负过一些人。但从来不会想去后悔，不思过去，也不念未来。当下才是最鲜活的，生命应该是流动的，而不是驻足。来的时候接受它，去的时候放下它，混浊的水你让它自然流动自然会清澈，只是时机还未到，这个世界没有恶意，因为最大的恶意就是自己，如果自己不烦恼，没有人能够让你烦恼。超凡脱俗很难，如果一副不食人间烟火自命清高，也罢了。 应该是更加地谦卑，自然。</p><p id="source-b-003">有没有一身永远不必更换的衣服，永不过时，我想这套衣服便是自己，便是赤裸的自己，坦诚的自己，像小孩的天真，最原始的赤裸的状态。 用一生来发现生命那股源动力。</p></noscript>
