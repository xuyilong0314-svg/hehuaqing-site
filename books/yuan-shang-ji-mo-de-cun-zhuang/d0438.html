    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>发现自己越来越执着，皮相</h1><p id="source-date" class="diary-date"><time datetime="2013-06-01" title="原笔记创建日期，不一定等同于落笔时间">2013年6月1日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">最近一直都在为了自己的皮相在执着，一直都知道自己的无常，看到自己的胸肌和腹肌没有了，开始有人会说身材不好了，我在意别人的反馈，我开始执着我开始会想锻炼，脸上面只是有一个小豆豆，我就很执着，以前我不是这样子，为什么会执着，因为我觉得长得还好，我喜欢别人的反馈，开始执着，我认为这是真的，然后我开始执着，我开始会在意自己今天要穿的是什么，穿这样是不是好看，是不是有搭配，我执着已经够多的了，我开始执着我的皮相，给自己一个棒喝，让自己醒过来，我所执着所追求的东西都是无常的，我在追逐无常，我注定是失败的，我是赢不了无常的，面对无常我只能用我的心胸去接受，而不是去执着，因为这是一场还没有打就注定会输的仗，没有一个人能跑过时间，也没有人是不老的，也没有人一直都是身材很好，不走形，生老病死是这样可怕，每个人都用尽自己的力量去摆脱他，但是结果却是已经预见了，没有人是不老的，当他发现追求了一生，但却输了，他会很懊恼，很烦恼，他不想输，但是无奈将成为带入坟墓的附属品，这是悲哀的人生。</p><p class="diary-omission">〔中略〕</p><p id="source-b-002">今天和灿福在追逐打闹的时候，听超在说我们两个像傻子的时候，我那时候内心中充满了不满，我认为他假装正经，我们反感，然后我内心中起了烦恼，那时候我并不能当刻调节起来，我一直在修行，我开始学会不做反驳了，不反驳就过去了，不反驳也是智慧，每个人的看法都是不同的，别人眼里的我是怎么样的，这与我无关，因为我知道自己的怎样的，这么想真正地这么想我就不会悲伤，我就不会起烦恼来让污染自己的内心，</p><p id="source-b-003">还有今天在打球的时候，他们一伙人都一起出去吃饭了，没有加上我，那时候我内心中也是很烦恼，我发现自己被孤立了，我发现我是脆弱的，我不是自己所想的那么强大，当我认为自己被别人孤立的时候我的情绪波动了，我开始烦恼了，我开始想多了，为什么别人不叫我。原因是这样的，我是不喝酒的人 ，就没交我了，当时我也不在宿舍了，如果他们那时候又叫我的话 我也会说不去，结果是一样的，但是我却起了烦恼。</p><p id="source-b-004">然后我问灿福说他们有没有叫你，灿福说他不想去，叫了他也不去，因为很无聊他们讲的话很无聊，我不喜欢他们无聊的对话，我不想去。多么厉害阿， ~他是我的老师，我应该像他那样，知道自己想要的什么，知道自己朋友是怎么一个样子的，他不会想要别人的反馈，他比我高尚，他身上的品质太多我需要学习的了，灿福是我的老师。确实啊，我心中这样想的是，自己应该是面面俱到的 不管和谁都是玩得来的， 我也应该受到别人的关注，那么我开始烦恼了，我不是这种人，但是我却希望别人来反馈自己，我错了，错得很离谱，这点灿福给我上了一课，不同一个话题的，在餐桌上更是没有话说，其实今天下午的时候我就想得到被人的反馈，我很惭愧。！</p><p id="source-b-005">皮相是无常的，不执，找到自己的内心！</p></noscript>
