    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>承认，我在意</h1><p id="source-date" class="diary-date"><time datetime="2013-04-15" title="原笔记创建日期，不一定等同于落笔时间">2013年4月15日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">我承认，我心中有疙瘩很不舒服，林有意地孤立我，这次我的直觉也是对的，好吧，我接受这个事实，内心当然有疙瘩了，我跟他们大抵上不算是一类的人，我没有这话奉承说话的能力，没兴趣就是没兴趣，我不想去参与其中。我开始分离出来他就开始孤立，这样我也清静，不知所终的友谊不是真的友谊，彼此之间没有共同的价值观自然谈不上一块的，我要接受这个事实，疙瘩就疙瘩把，没有发生什么相安无事是最好的了。体会到了被排外的心里，我接受，这是因果，我之前也是在背后恶语相向。我甚至说让志伟搬到别的宿舍去这种话，我很惭愧应该忏悔，每一个种子的播下都是如此的，我现在这样也是清静，我本来就是可以独处的那种人，只是心中的疙瘩就是被人孤立的那种感觉，说没有不舒服是不可能的，但是习惯就好，生活还是照旧本身没有什么共同语言也就这样，我是很珍惜每一段缘分的，我有另外一个原因就是大家都在说的人脉网，如果带着私心去交朋友，这是我不耻的，不应该是这样的，把不舒服说出来，就把自己的疙瘩抹平，这样好多了，我注定不是那种趋炎附势的人儿，把不开始的说出来就行了，那就揭过去了，生活还是生活还是照旧，做好自己做最真实的自己，不要学会讨好，自己并不是这样的人，故意要伪装成这样的人表示跟他的亲近，这是一件很恶心的事情。</p><p id="source-b-002">感觉眼睛又进度不少啊，近视眼就是麻烦，老早父母亲就跟我说了。记得那时候我第一次配眼镜是在初中，我爸爸跟我去配眼镜，给我配了一个很土眼镜，但我并不喜欢那个眼镜，我也就很少戴，最后好像是故意把那折断，我爸还真是随便，随便让我挑了，我从小也不想挑贵的东西买，所以也就没说什么，这个现象很不好，便宜但是不喜欢的东西买回来不去用，这没有意义啊，东西的堆积也是这样的吧。</p></noscript>
