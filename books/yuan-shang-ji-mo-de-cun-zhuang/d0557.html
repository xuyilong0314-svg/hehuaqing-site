    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>何为梦想</h1><p id="source-date" class="diary-date"><time datetime="2013-02-02" title="原笔记创建日期，不一定等同于落笔时间">2013年2月2日</time></p><p id="source-b-001">说道坚持梦想，坚持，我个人很想要写得一手好字，字帖也买了，很多东西也都备齐了，备齐了为此我还买了两把钢笔，毕加索的钢笔很漂亮，这两根笔跟这我是一大不幸事，我没有坚持，也没有找到好的方案，短时间见不到成效我也就放弃，原先我还笑世超了着，现在终于可以嘲笑自己，我毕竟是比他差的，因为我取笑他之前并没有想过有一天我会放弃，我没有坚持，字理所当然肯定也没有写好，所有事情都是相对的，老天是不会辜负你的，老天就是这个真理，就是自然规律，我没有付出我的回报是没有的，这也是肯定的，其实这些每个人都知道，人人都是没有恒心却懦弱胆小的，我觉得要成大事的人一定要具备的是坚持，我现在唯一坚持的也就是每天写日记，这也是这段时间陪伴我最久的了。古圣先贤也告诉我们，要想要成功必须坚持，念佛也是一样，念佛要有功利要时时刻刻都专注在念佛上面，心心念念都是要在功夫上面，人的妄念很多，我们常常都会忘记，一天天的懈怠了，刚开始可能能察觉都来后来的麻木忘却，没有坚持也不可能会成功的，广钦老和尚在泉州修行的时候在山上多年未下山，一点点的时间慢慢过去，在山上度过了十几年衣服破了好几身，吃的就是一些野果，大师的坚持是为了成就佛道，大师深知其中的力量，大师开悟了，神通示现，这都是因为坚持的力量和高度的理想。</p><p id="source-b-002">这是每个人都懂得的道理但是真的心甘情愿去做的却是少，不然怎么说有分别，在坚持上面要执着，在坚持这上面是不可以对自己善巧方便的，因为当我们在坚持的时候，内心的妄念让我们停下，比如说那么晚了。今天那么累，不然就算了吧。你一定要有勇气对自己的妄念拒绝，坚持这种事情有了第一次势必有第二次这是一定的，客观规律。我们的身体就好像是机器，我们在运作这个机器是不会停止的，因为人会新陈代谢，刹那生灭的身体是停不下来的，如果我用身体去织布，但是有一天我停下来了，这步就是失去了他的延续性，意味着这块布是少了一块的，是不完整的，我对自己提出了警告，在写作写日记上面，每天都要坚持，如果提前有约会你没能在 12点之前完成的话，必须要提前写。</p><p id="source-b-003">这就是我给自己的定义，我给自己的原则，这次我一定要保持，因为这本身是愉快的，与自己保持一个联系与自己对话，是可以获益很多的，很多时候都是在自省的状态下，回味今天的事情，在这一刻我们都是客观真实的对待自己，就好像对待一个不认识的人，一样的用真实的眼光，不会去包庇，也不至于偏执，我自从写了日记收获很多，写日记本身的坚持就是好的，对文字的敏感程度也比以前高的人多，今天我跟表弟弘名说，这是我每天记录自己的日记，因为人本身的是健忘的，我想在我老的时候，能有回忆的资本，这些都是的时光我的一辈子，在将来我会把这给我的儿子孙子看，你看爸爸以前，爸爸以前的生活我与自己的对话我都如实地写下来，一路的坚持，自己的心路历程，这是一个见证。</p><p id="source-b-004">今天跟外婆说话的时候，我承认我的偏执，这就是你的偏执，你很自以为是，你也自己说过，没有别人的经历我们是无法去说别人的过错的，没有在深夜痛苦的人，不足以语人生，我能做的是换位思考地去站在别人的立场，是安慰被人，而不是打击别人，在表达你的善意的同时，你也要用方式，每个人适用的方式是不同的，今天你应该要感到惭愧的，首先让长辈留下了眼泪，让长辈生气了，我还自以为是的豁达，确实，我没有经历过我说什么都是没有用的，你心中还有一个观念，是外婆太执着了，外婆学佛还学成这样，这样哪里是学佛，在说出这些话的同时，你先问问你自己，你是否做得好，你自己做好了吗 ？每个人都是站着说话不腰疼，今天这件事情上面，我看出了你的偏执，你的自以为是，我厌恶你自以为是的笑，你认为你自己很有智慧吗？你以为你自己很豁达？你以为你自己的才是佛法？错了，错了都是错的，你分别心还没有放下，你不够慈悲，你明明知道外婆的性格你还是故意去气她，每个人的承受能力，敏感程度不同，你的善巧方便实在是很烂，你说我只是想让她快乐，你看到了她的快乐了吗？</p><p id="source-b-005">你在给他增添着愁苦，至少你还让她流泪的，就这点你是不可饶恕的，在别人面前你始终有一个我，你在说别人错误的同时你本身就是犯了一个错误，你不能再自以为是，你以为自己很有修行，错了，你根本就没有下过苦工，你以为你的智慧很好，不是，你通过了阅读一些书籍，可能让你懂了比较多，但是这是别人的东西，别人的东西阿！ 做人一定要谦虚，你把自己看做你是世间最平凡的人，你没有什么了不起，你首先要学会倾听不要急于表达自己的意见，沉默是金。 你不能自以为是。 你应该学会换位思考，经历这种东西是每个人的，所以每个人的都是不同。我只能尽可能地去理解，去安慰。说我的坚持，我的日记一辈子我都得写下去，首先是自省，其次是记录逝去的时光 最后 思想的提纯。 英语也是一门很重要的学科，现今很多东西都是英语很多基本的单词我都不懂，这是我多年以来没有学习的一个弊病，我尝试着补！ 在大学选择好自己的兴趣爱好，还有就是 我现在的这个专业其实我也是有兴趣的，那么在学业上要学习。 这是前提保证，这是现实生活。</p></noscript>
