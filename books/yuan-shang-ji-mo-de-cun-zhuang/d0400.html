    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>我欢喜妈妈的欢喜</h1><p id="source-date" class="diary-date"><time datetime="2013-07-09" title="原笔记创建日期，不一定等同于落笔时间">2013年7月9日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">放假后的第一天很快也就过了，今天去当义工的时候面对众人的赞叹，很是惭愧，我并没有大家话中的那么好，我只是做一个佛教徒应该做的事情而已，我做的是不好的因为我不够资格有这样的赞叹，我只是少数去帮忙的人，在他们的人群中我属于是少的，不由得也觉得讲堂的年轻人很少，太少了否则我不应该有这样的赞美才对，年轻的佛教徒真的很少，而佛教徒没有年轻的是不行的，只能说讲堂的人是少数的，我最高兴的是妈妈听到每个人的赞美那种欢喜，也是我的欢喜，这才是我的欢喜 我能报答妈妈的没有什么，我是一个平凡的人，这言不其实的赞美对于我是惭愧的，对妈妈来说是多么值得高兴自豪的啊，我接受这样不实的赞美，我不为所动，但是为了妈妈的欢喜而欢喜。妈妈是观世音菩萨，爸爸是韦陀尊天菩萨，爸爸守护着我，而妈妈的让我在慈悲的环境中成长，渐渐地家里被佛化了，其实没有规矩 就是潜移默化地。</p><p id="source-b-002">家里渐渐就佛化了，开始做菜，做一个幸福的厨师，下厨是一门艺术，对我而言，并不是奢华的食材，我的目标是在普通的食材里面做出最美味的料理，这份料理是心情，是一份情绪，是浸染在爱里面的，搭配上精致的餐具，这是我所向往的生活，院子里中一些生灭，在繁华落尽时候看，让自己也升起无常的概念，让自己能够在精进，做一个生命的艺术家，我只精致的料理，这是一门艺术，可以简单的，做一个幸福的人，尊重厨师，做自己想做的事情是最美好的，庭院是我的专业，兴趣是我的料理，阅读伴随写作是我的业余。佛法是我的芬芳，这是贯穿我的生命 可以是平淡的，乐在其中的，有福报的，跟是有智慧的，我认为有品位的生活不是奢侈，而是一种别致 不与世俗而同的优雅，看过去你就是一个慈悲的人，今天我的微笑是好的，给人微笑就是一种布施，微笑的布施，我带给别人的是我一个欢喜的心，这是在广结善缘，人是需要微笑，一个微笑可以让人心生欢喜，带给自己同样也是欢喜 一颗愉悦的心情，这是多么美好的事情呢，还有今天在切姜的时候切到了自己的手，第一次是这样的情况，口子还不深，是不是在跟我说厨艺是不简单的，需要自己认真对对待，这是多么美好的开示阿，我应该庆幸自己找到自己的兴趣，</p><p id="source-b-003">今天去看了小学生的暑假作业，连我都不知道说的是什么意思，表弟说出题目的人有病，我说:我也这么觉得，这题不要做了。</p></noscript>
