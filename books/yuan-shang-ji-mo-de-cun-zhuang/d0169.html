    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>焚香许一醉</h1><p id="source-date" class="diary-date"><time datetime="2014-06-18" title="原笔记创建日期，不一定等同于落笔时间">2014年6月18日</time></p><p id="source-b-001">香炉与心粉 到时</p><p id="source-b-002">一起使用开始了陪伴的旅程</p><p id="source-b-003">于我而言 我需要 感谢之</p><p id="source-b-004">然后应该是供养十方诸佛</p><p id="source-b-005">香粉总会断灭 因为沉淀的不够多 芬芳不至于沉醉</p><p id="source-b-006">人有一事便真正地多一事 诚然是公平</p><p id="source-b-007">有所求地时候 我必须在这门口</p><p id="source-b-008">姑且说这是养吧 养香炉</p><p id="source-b-009">内心会有期盼 期盼说 这是极好地 如果能够成为一个好的香炉</p><p id="source-b-010">内心还是期盼的 多一点香灰多沉淀</p><p id="source-b-011">怕是控太小 不好呼吸 他便灭了</p><p id="source-b-012">太多有所有 也太多快乐 都是为了快乐</p><p id="source-b-013">这又会有所选择 这是有意义的吗</p><p id="source-b-014">是应该默默坚守等待的吗。</p><p id="source-b-015">等待一个炉的渐渐成长 其实这便是了</p><p id="source-b-016">喜爱焚香 这一切于我而言 这种等待是值得的</p><p id="source-b-017">生命的诉求有时候就是这样</p><p id="source-b-018">路漫漫 事物如此人更是</p><p id="source-b-019">即便是催化的过程也仍然需要等待</p><p id="source-b-020">不是吗？</p><p id="source-b-021">盛开就永不凋零 蓝莲花。</p></noscript>
