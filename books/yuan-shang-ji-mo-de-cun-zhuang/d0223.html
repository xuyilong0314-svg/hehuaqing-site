    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>往日时光</h1><p id="source-date" class="diary-date"><time datetime="2014-04-23" title="原笔记创建日期，不一定等同于落笔时间">2014年4月23日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">这一切都只是在感慨，因为现在听的是 《往事日光》 那时候你看到现在的这些文字 我希望你能够 听一听，愿你唤醒这些写下轻松安逸文字的往日时光，虽然我不会知道在那时候你经历的是什么，身在何方 心里想的又是什么，我想应该不会改变的是心中那光明的星。</p><p id="source-b-002">我是悉达多的学生，我很幸运 一出生都是富足的，我有许多的供应，我的幸福光明是很多人都无法想象的，有的一出生就是疲于奔命地生存，至今为止我还是生活着，我的大学生活，一直以来都是那么轻松。我认为这不是一件好事，就现在而言 我发现自己还是太过于安逸了，我接触到的东西都是前世给我带来的，一些珍贵的。这很有利，我应该是要满足的，当然我承认自己很幸运 就现在而言我有许多时间，这是我无上的财富。如果我好好珍惜的话 以后不至于后悔。愿我永远保持一颗清明的心，不管是现在或者是今后，我唯一的祈求就是我的信仰能够一直在我的生命中，我期待它有一天的开放，为此我愿意付出我的一切，付出一切使我不迷茫，这并不昂贵的代价，我祈求一切上师都能够加持我，看护我。</p><p id="source-b-003">周而复始，轮回伴随 无常伴随，有时候狂喜 有时候暴怒 或者是抑郁。来自这个变化无常世界容易变化的我。</p><p id="source-b-004">我并不喜欢这样的感觉，不喜欢失控不能自我的感觉，这让人有很深的挫败感。</p><p id="source-b-005">通常我的灵感都需要有一些来引导，就好像我的修行 我需要一些引导，如果这段时间我能够好好努力，我相信我自己不会后悔的，现在容易得到的东西往往会是后来的感慨，当这些文字成为往日时光的时候。我现在正是微笑着，也请你给我一个微笑 给往日时光。</p></noscript>
