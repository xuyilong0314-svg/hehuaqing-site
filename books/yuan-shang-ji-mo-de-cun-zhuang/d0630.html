    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>起波澜你就输了</h1><p id="source-date" class="diary-date"><time datetime="2012-11-21" title="原笔记创建日期，不一定等同于落笔时间">2012年11月21日</time></p><p id="source-b-001">赶紧道歉是真理。</p><p id="source-b-002">这件事还真是我不对。道歉一定要说的。</p><p id="source-b-003">这要改，得改。长记性了。</p><p id="source-b-004">不能与别人的发生一点小事就毁了缘分。</p><p id="source-b-005">渡人渡己。</p><p id="source-b-006">其实都是在帮助自己，对别人的心境起参照 才能学习</p><p id="source-b-007">别人都是镜子刚才我公开地道歉了。但是我为什么句后还要不服气地加一句，他再说一句看看。其实就是自我的放不低，谦卑。 大丈夫 要有大丈夫的样子，哪里有这样的！ 该批评！！！ 这次很好地看了自己的内心，有进步这是可取的低声道歉并不可耻，觉得别人会看低自己 才是被自己内心打败了 这才可耻这只有自己听到，但是在自己的清净心已经输了，始终还是败了。</p><p id="source-b-008">这个时候就是观照自己的心，看自己心里的妄想，执着有多强烈。</p><p id="source-b-009">如果说自己做错了 都羞于承认，不敢说一声道歉，不敢低声下气。</p><p id="source-b-010">那么自己就被自己的执着败坏了。</p><p id="source-b-011">修行就在世间。</p><p id="source-b-012">如果连自己的过失都不敢勇于承认，那么。以后旅途上别人对我们的冤枉，那该怎么应对</p><p id="source-b-013">心境是慢慢在成长的，迈向生命的圆满。</p><p id="source-b-014">往昔所造诸恶业</p><p id="source-b-015">皆由无始贪嗔痴</p><p id="source-b-016">从身语意之所生</p><p id="source-b-017">一切我今皆忏悔</p></noscript>
