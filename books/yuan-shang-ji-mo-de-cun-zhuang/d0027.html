    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>有多久没见你</h1><p id="source-date" class="diary-date"><time datetime="2016-01-02" title="原笔记创建日期，不一定等同于落笔时间">2016年1月2日</time></p><p id="source-b-001">自从上次的时候是两个月，几乎很少地再跟你产生联系了。在这期间我从 yeebin出来到回去，现在也快要有一个月了。工作的进展也不是很如意，从务实的角度来说，我甚至是不尽职的。从务虚来说我更是在修法的道上很是惭愧，翻开过去的篇章，我把求到加行的法视为我的期望， 而现在我遇到了最好的上师，而在修法方面却是一而再地懈怠。</p><p id="source-b-002">今年是2016，死磕自己，不要再这样松懈下去。我没办法不去想自己所有遇到的事，现在也已经是语无伦次了，我不知道自己说是什么，就好像是现在我这样纠结的时刻。想说说我最近的工作，只有花店的事情，做事没一个大局的观念，老杨说得对不要凭借自己的一股劲去做，当然我还是会继续理性化，只是应该更有逻辑地去做。受益良多，我不是一个适合当采购的，当然我更喜欢的事是偏向于设计的。</p><p id="source-b-003">我应该好好修加行，而不是这样一味沉浸在过去，如果一来才可能突破我长久以来的习气，实际上我是一个自以为是的人，自我太多时 都会做一些傻事，不要期待结果不一位着不在过程里保持热血与激情。那么加油，梦马 我相信你，一定要跨过去 一个个的坎 只有自己 我相信你。</p><p id="source-b-004">死磕！我甚至不知道我明天能不能醒来。</p><p id="source-b-005">改掉不好的习气，我总是淫欲念头很多，上师加持我！</p><p id="source-b-006">愿我不在自己的话里 失信。</p><p id="source-b-007">这一点点片段，这就是一些凭证，我的心。 我所保留的，我所该忘记的。都在里面，都是数据。</p></noscript>
