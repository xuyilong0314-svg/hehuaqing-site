    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>自寻烦恼</h1><p id="source-date" class="diary-date"><time datetime="2013-01-07" title="原笔记创建日期，不一定等同于落笔时间">2013年1月7日</time></p><p id="source-b-001">人阿，就是天生的不满足，就我而言，昨天电脑坏了，日记也没得写，什么都没得做，整日就想办法把电脑给修好，打了好几个电话，又是在淘宝弄阿，昨天晚上还捣弄到了两点多，这一切都是为了啥阿？我当时是这样想的，就是为了写日记，如果能修好，只要能开网站就行了，但是今天晚上本来要放弃的，到了后来又随便倒弄一下，结果就把驱动装好了，然后呢？开机时间没有以前的快了，开机很慢，觉得不满足，为什么人得耐心会那么，本来的时候家里的电脑很烂，就随便凑合着用，这件事情，我更是看透了何华清，表面把自己打点得很好，很有耐性，也不执著，但是其实内心中的那种种我都看透了常常在一些无所谓的事情面前纠结，还没做事没耐心是一个难题，这个难题应该要攻克的。修好了电脑，是很高兴吗？在这事件之间我看到了真实的自己，我仿佛在看一个人，让我想想，起初的时候在两台电脑之间来往，心中急躁得很呢？但是好像很淡定，等到修好了，内心一阵狂喜，刚开始坏的时候他就告诉自己说这就是无常，可以去补救，但是不可以陷下去，你如果一直在情绪中行走，是很难分辨眼前的人事物的，理性随之失去是必然的。这些都是自然规律，要懂得。慢了就慢了吧，还能用就行了，回去的时候再重装一下也行，可千万别捣弄了。明天把要邮寄的东西寄回你家吧。</p><p id="source-b-002">嗯~突然想了起来，今天妈妈打电话过来，我在修电话，没跟妈妈说两句就挂了，这是不是预示着以后我的行为？以后我要工作了，跟妈妈说话通电话的日子就越来越少了，如果我在工作的时候，妈妈想跟我说两句话，我就说 我现在在工作，等会给你回电话，但是在事情结束之后，又投入了另一个的事情当中，把妈妈的电话浑然忘了，我在想，这一段话会不会出现在我以后的日记里面，我先刚看到这样的，仓央嘉措说过:世间除了生死，还有什么不是闲事？ 父母恩重如山，难以回报。所以，应该自省，我不希望这段文字会延续到以后的日记中。</p><p id="source-b-003">眼睛难受得厉害，仿佛就要闭上了。是不是真的用眼过度，先前看书都是在昏暗的环境下看的，而且在上网时候光线也很暗，我这桌子的光线是最不好的，明天好好保护眼睛，书就不看了。眼睛实在是受不住，身体给我的预警，应该要懂得，我们一生都是每时每刻的行为累计成的，人生是一幅画，一副五颜六色，好多好多的悲欢离合。如果没有悲欢离合就不是人生的，人生起起落落，潮起潮落，何必在意一些得失。</p><p id="source-b-004">父亲，我的父亲是一个沉默寡言的爸爸。我们很少有交流，常常打电话过去也就短短几句话，最近也很少打给他了，我觉得我爸也是跟我一样的人，是那种不会嘘寒问暖的人，现在我也比父亲高了许多，记得小的时候睡觉都是躺在父亲的大腿上睡觉的，爸爸的大腿很粗，我躺着很舒服，我和爸爸小时候是非常亲密的，但是我们之间还是很少话语，因为很少话语，我能体会我父亲的一个表情，一个肢体语言， 我都知道。他想做什么，</p><p id="source-b-005">爸爸的胡子很硬，记得我小的时候，爸爸 用胡子蹭我，和扎人，但是我很喜欢这种感觉，因为这是爸爸对我为数不多亲密的动作，又长大了一点，爸爸就不会对我做这个动作了。我很主动地去蹭爸爸的胡子。 小时候我的枕头就是爸爸的大腿，因为爸爸的大腿很粗，而且很软，想枕头一样，我都躺在爸爸的大腿看电视，直到睡去。儿时我的枕头是大腿，哈哈。父爱无言这个词在我爸爸身上彻彻底底地体现出来了。妈妈常常说，如果我回家一趟，我爸爸就赶紧去买一点东西给我吃，买东西给我补身体。我爱你爸爸。这句话我不会说出，因为你懂得，我也懂得。因为我们父子是无言的情谊。</p><p id="source-b-006">前天梦到了爸爸出了车祸，我从梦中醒来，我对自己说这就是无常，但是内心中那种看见父亲受了伤的感情是多么难受，那种难受能使我从睡梦中醒来(我是很少从梦中醒来的)感恩，给我了幸福的生活，要感恩的人很多，成就我的人，诋毁我的人阿。我都要感谢你们，你们让我在人世沉浮，让我看得见自己。你们是明镜，照亮我的痴心，感恩，真的感恩，我是多么地幸福，父母给我创造了多少好的条件，不要辜负了任何人。我的人生没有什么好抱怨的。我会更强，我会更强，因为我越强，我能庇佑的众生就越多，我需要很多钱，我需要地位。我需要这些东西，我是一把伞，我要为众生遮风挡雨，我要宽容。我要包容，我要慈悲，我要舍得。何华清你可千万不能自私自利。你要为别人着想。这是我的思想，我要付诸于实践，这才是我的东西，这才是我的灵魂。灵魂既超越又现实的东西</p></noscript>
