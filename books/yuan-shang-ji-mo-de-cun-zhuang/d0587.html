    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>悠闲地度日</h1><p id="source-date" class="diary-date"><time datetime="2013-01-03" title="原笔记创建日期，不一定等同于落笔时间">2013年1月3日</time></p><p id="source-b-001">每天都写一两千字的日记，渐渐形成了习惯，如果我每天坚持地写，写到大学毕业，那应该可以出一本书了。一本关于自己，我并不伟大，生平的经历少少，如果说真的有什么可以作为谈资的也就是初中的那一段，那一段不算光彩，可以说是腐烂，堕落的一段日子，他们说 16班我改变最多的，也是变得不可思议的，阿君说 “信仰把我的灵魂洗了一遍 ”现在比较有来往的初中同学也就 琦一个人，我是一个不喜欢聊天的人，觉得没有面对面的谈话是尴尬的，懂我的人，都知道我是一个用心去思念的人，而不是语言。虽说我没有常常去思念，这样说来有点自相矛盾，但是我是那种久别重逢仍然会敞开心怀的人。</p><p id="source-b-002">不联络并不代表着彼此的感情淡了，如果因为少了联络，感情就变得淡了，那么这样的感情还是比较经不起考验的。该用什么形容词形容我的这种行为呢？至今我也不懂，我也不懂得介绍自己，或许就是因为不懂吧，所以说的不必多，懂的人自然懂了，不懂的人，不懂也没关系，不是吗？今天打了几场游戏，其中有一场，两个人互相责怪，互相不服气，但是这只是游戏，有什么好争论。或许不应该这么说，因为话头不在自己身上，感受不到那种愤怒，但是很多时刻我们往往都把游戏太当游戏了，喜欢计较，殊不知这一幕马上就谢幕，但是心却一直挂碍，一直使得烦恼挂心头，不得自在，这又是何必呢？我一直以旁边者的立场说着这些话，但真正有智慧的是当改革到了自己面前，当舆论到了自己头上，还能像一个局外人。</p><p id="source-b-003">一天就是看看书，上上网，看看书，时间过得也快，其实算是一瞬间吧，一眼万年并不是夸张阿，这也是极具道理，现在好像也不想提起道理两字，觉得文字运用得多了就没有力量了。平时还是多说说人话。拉回正题，现在要说的是时间，时间是过一天少一天的，我觉得数日子是愚蠢的，殊不知 一天天地过，身体一天天地衰老，我们的死期尤为近了。还有什么值得高兴的呢？常常找借口，为什么找借口呢？因为自己内心还是有一起原则，内心不想浪费时间，只好说一些借口，给一点慰藉，让自己不会谴责自己。</p><p id="source-b-004">还是没能体会到无常带给我的讯息，在这个状态还觉得不错，还是容易迷路，在娑婆还是容易迷了路。无常是让人警惕，能提起精进的力量，这就是烦恼与菩提之间的关系，无常固然是不好，光阴的流逝，身体的败坏，世界的无常，这些都是可以给我教训的，这些哪一样不是佛法，唯有痴迷的人，才会感叹，但是也是无可奈何，真的，有时候无可奈何，世间很多无奈，往往自己眼睛又争得大大的，眼睛容易进沙子，磕眼睛阿。躺在床上，敲打着键盘，写着自己的一些感情，尽管这些没有都是从别人的经历看来的，但是能有所领悟总比浑然无知好吧。我一直也是注重实践的人，练字练了一段时间还没有一个月，首先进步了，就是拿笔的姿势渐渐地对了，写字也开始趋向于正楷，尽管这差距还是有点大，赌霸跟赌圣有差别吗？争什么都不知道，导演都没意见，人家电影也照播，争什么呢？人就是喜欢争，有也争，无也争。这也争，那也争。反省，反省。究竟谁对了，都不重要，一部电影都有好几个名字的呢。</p><p id="source-b-005">我是不是清高了一点？装清高，但本身并不清高，不不不，本身没有什么清高，做自己罢了，我不喜欢阿谀奉承，但是别人阿谀奉承关我什么事呢？眼睛小一点好的，别人事情，我们还是没掺和，难得清闲，若是无是挂心头，便是人间好时节。大德的智慧，顺其自然，心无挂碍便是好阿。写到这里，真不知道自己在写什么东西。没头绪，也写不下去。以后写日记吧，并不是要到了某一个时段写，我写的这也可以算是随笔， 随便写写的，也有包含生活，也有思考生命，灵魂，也有偶尔来的灵魂，这些都是我以后的祭奠。 给自己一份答卷我希望的是，在我还没有体会到社会现实的时候，给自己留下一点东西，让自己以后看看，别让自己忘了来时的路，看看自己的决心，我要证明的是自己不是天真的，而是自己的本性，人的本性，证明给自己看，打败自己，降伏自己，答应自己一辈子不随波逐流，要追随我心，要有自己的原则，要有自己的终极目标，我所做的都是为了众生，师父在交给我这句话的时候，我当时时常忆念，到了现在呢？为这句话付出实施的又有多少呢。说明一个问题，没有充电是完全不行的，一定要亲近善知识，我现在没有这个条件，甚至连一个谈论问题的人都没有的时候，那么与书为友。</p><p id="source-b-006">其实有很多文章可以写，比如与书为友。书籍是人类进步的阶梯，这句话明确地说，我忘了是谁写的，但是这句话是对的，谁说的都无所谓了。</p><p id="source-b-007">还有就是不要刻意，不要为难灵感，一旦刻意，写什么东西出来都是不流畅，不自然了。</p></noscript>
