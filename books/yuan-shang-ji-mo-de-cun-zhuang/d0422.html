    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>摆东西的人</h1><p id="source-date" class="diary-date"><time datetime="2013-06-17" title="原笔记创建日期，不一定等同于落笔时间">2013年6月17日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">我对自己的所作所为是很不满意的，我现在不知道要写出的是什么了，我尽量在胡扯，因为我要写到 2000子这是我对自己的一个期许，但是真正质量的又有什么呢。开始在写我应该要有所改变，但是想想又是这是在写日记，我与自己对话 为什么要粉饰，就像日常生活一样吧，这都是真真实的，真实的东西是最美丽的额，即便是口语化的 但不要忘了这是日记。</p><p id="source-b-002">发现自己很喜欢设计之类的东西，也不是这么说 我很喜欢的是摆设东西，经常我都会改变我桌子物件的位置 我是一个很容易厌烦的人，我喜欢的是改变的就好像我的书 我经常都会向倒弄，这也是我的兴趣之一，我在这之中的时间过得和很快，渐渐地变成一个有趣的人 因为有创造力的人就是可爱的，这是让我很满意的一点，这算是我的一个兴趣爱好吧，这个爱好是始于小时候，儿时总是很喜欢倒弄瓶瓶罐罐，小时候没有玩伴，我的玩伴就是瓶瓶罐罐的药品，我会把他们摆整齐我会把自己想想是一个开店铺的人 一个卖药的的人 然后我就开始在到弄了，这个小小的游戏一直都延续在我的生活中，暑假期间在家里也会把自己房间里面能利用起来得东西都摆设一番，一个力求空间圆满的人，可能会感觉自己的摆设很严谨，因为我很喜欢整齐但这并不刻意的 这是从小的习惯，。我现在才发现小时候的一点小东西有多重要 是足以影响一生的，就好像我喜欢摆弄东西一样这一点是一个教育很好的启发点。</p></noscript>
