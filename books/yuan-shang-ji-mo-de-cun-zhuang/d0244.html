    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>第一次玩麻将</h1><p id="source-date" class="diary-date"><time datetime="2014-03-29" title="原笔记创建日期，不一定等同于落笔时间">2014年3月29日</time></p><p id="source-b-001">第一次玩麻将，挺有意思的。</p><p id="source-b-002">第一次胡了 第一次有喜悦的感觉 第一次有那种狂喜的感觉 大笑并且是情不自禁的。</p><p id="source-b-003">当时就出离了自己的那种喜悦 开始作为一个局外人在玩牌 并不是沉迷在里面</p><p id="source-b-004">玩牌需要技术 但是遇到的人 摸到的牌却是很重要的</p><p id="source-b-005">你不知道下一张牌会在什么时候出来 让对方胡了或者是自己胡了。</p><p id="source-b-006">一切都是那么偶然地 就这么偶然地。</p><p id="source-b-007">你去体验很多事情才会有更多的领悟。</p><p id="source-b-008">梦三国就这样 赢了输了又如何 也就这样 浪费的时间也是不少</p><p id="source-b-009">人生一瞬间的事情 不要浪费时间 不能等到白发苍苍 目茫茫才知道很多事情没做</p></noscript>
