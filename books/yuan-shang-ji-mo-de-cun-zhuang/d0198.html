    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>看到自己的控制欲望</h1><p id="source-date" class="diary-date"><time datetime="2014-05-20" title="原笔记创建日期，不一定等同于落笔时间">2014年5月20日</time></p><p id="source-b-001">看看自己的控制欲望，在我不理会啊月的时候 我总是理所当然的 今天晚上她去给朋友请生日，我内心的控制欲开始来到我的内心，使我动荡不安，就是这么一回事。我总是霸道以为 只有我能这么做，我在某些方面想要控制别人听自己的话，然而理由就是为了别人好，这一切很暴力、来自自私的心，自我膨胀的心，这不仅仅会让自己痛苦而且也会让别人痛苦的。这显然不是一个好主意。放下内心的那种自私 这种完全没有任何意义的自私我慢都是毫无意义的。这些陋习时时都藏在自己的身上，我应该深观自己的内心，这个世界没有谁能够改变谁，强迫就是暴力，这种欲望很无厘头，而且没有人能够接受，佛陀从来也不会去强迫一个人，现在就是修行的时候，关照自己的内息。开始在一层层地扫楼，一间间的宿舍在宣传，上师祈求这能够成功，愿违缘能够减少，能够看到胜利的曙光，我们要更努力不亚于任何人的努力，我们可以做得更好，完全可以做得更好的。只有一步步去突破他 才会有成功。知法一丈，不如说法一尺，说法一尺，不如行道一寸转化了我显然是不用那么多的时间 而我可以去转发它。</p><p id="source-b-002">我浪费了很多时间</p><p id="source-b-003">上师加持我！</p><p id="source-b-004">刚才的修持有一点平静。 当我现在又去观看的时候 我发现 已经不同的看待 羞耻的也是不同了。</p><p id="source-b-005">转化成为助道资粮。</p><p id="source-b-006">你发现你不用去证明了！</p></noscript>
