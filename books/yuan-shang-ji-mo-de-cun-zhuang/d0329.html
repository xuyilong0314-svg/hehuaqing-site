    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>出离吧 到彼岸去。</h1><p id="source-date" class="diary-date"><time datetime="2013-10-10" title="原笔记创建日期，不一定等同于落笔时间">2013年10月10日</time></p><p id="source-b-001">一周的修行，在圣寿禅寺，第一天晚上我就梦到彩虹，这是瑞祥，七天的修行中，听闻的空性法门让我受益良多，在我的心中我是那么感动，那么感恩，在去之前家里出事情了，我没有那么淡定过，师父说可能是心里的预感吧，我想可能是这样的，但是我从未有这样的心，连我也是为之惊叹的，我不知道自己的心已经是到这个程度了吗？我是发愿出家的，这一次更加是强烈更加唤醒我的心。诸佛菩萨听我的祈求发愿:我不出家谁出家？我不弘法谁弘法？我是永远向着远方独行的浪子，我向彼岸方向走去，最后一天晚上我梦到了我找文殊菩萨请发，然后我遇到了师父，教导我的师父，我与大和尚内心中有那种熟悉感，我想着是前世的，我不惧怕大和尚，反而我很喜欢亲近大和尚的，我心中出家的心愿是不会消散的，我有一个女朋友，我想让自己投入感情当中，因为我能断，我渐渐地变成了自己的样子，诸佛菩萨的加持让我更加自信，是在我佛前唱蓝莲花的时候，总是在梦里，我看到了自己无助的双眼，我的心又一次，总是在梦里看到自己走在归乡路上，慈悲伟大的佛陀啊，请接受弟子的祈愿，我发愿出家。</p><p id="source-b-002">我尝试地把自己最珍惜的东西供养出去，我问师父说，我没有鞋子穿怎么办，师父说 我没有鞋，要不我的给你穿，在这个世间徘徊，我应该更加爱，更加地相信，慈悲伟大的佛陀 请接受弟子真诚的祈愿，我内心很坚定。我能放下所有吗？我的爱情能放下，然而我的父母呢，我能放下吗？那天在火车上面，一个出家师父说让我不要出家，在家人比出家人好，其中他所说的一些都是通俗的佛理，我是轻易可以把他驳倒的，但是我并没有，我认为这是诸佛菩萨对我的考验，更让我坚定了出家的念头。</p><p id="source-b-003">揭谛揭谛 波罗揭谛 波罗僧揭谛 菩提萨婆诃。</p></noscript>
