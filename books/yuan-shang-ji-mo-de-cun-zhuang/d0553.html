    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>多是苦涩为甘甜</h1><p id="source-date" class="diary-date"><time datetime="2013-02-06" title="原笔记创建日期，不一定等同于落笔时间">2013年2月6日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">父辈的青春是在改革开放的时候，父子俩从来也不会聊天，父亲跟更是不会对我说什么历史，他的过往，唯一次是在他喝醉酒的时候说他在菜市场卖过菜脯干，他学了两句哟呵声，我笑了，那时候我还小。记不得是几岁了，妈妈说父亲早年的时候很苦，比母亲还要苦。据说父亲在我这个年纪的时候双亲都已亡故，底下三个弟弟父亲是长子，父亲是一家子的顶梁柱，他需要照顾 3弟弟，父亲对弟弟们的感情跟父亲是一样的，二叔和我爸爸吵架的时候，我爸爸任我二叔打，我爸爸不还手，我到现在很佩服我爸爸的宽容，至少对兄弟他像父亲一样，无条件的宽容，现在的爸爸生意也不是很好，兄弟之间也有隔膜，三叔去世之后和他们一家子的人也没有来往，跟二叔家也是没有怎么来往，四叔也已经是家不成家的样子，我们这一脉并不兴，就现在而言。这样的环境父亲是不得不坚强的，父亲的经历我大抵都没有听说，只知道那时候的父亲也没有读书因为没有钱，而且家里少了一个女人很多事情都要担在父亲的肩膀上，父亲的肩膀是很宽的。父亲是苦过来的，父亲对我的爱也是不流露于形的，父亲家里的什么水电都能自己维修，很多生活中的基本适宜都是爸爸在弄，我只是负责打下手，父亲有太多我不会的，在制酒的过程中，父亲总是比我有耐心，也做得比我好。</p><p id="source-b-002">父亲是在改革开放的时候富起来的，到了现在生意也一落千丈，现在自然没有以前的潇洒，我并不知道父亲是怎么样想的，但是我能体会得到父亲的郁郁，这也是常态的，跟股票是一个道理，没有永远的涨，好坏参半。现在父亲算是低谷期，但是儿子却是有信心，至少现在我的事情他是不用操心。</p><p id="source-b-003">母亲在父亲刚要富起来的时候嫁给他的，据说父亲那时候还有一段退婚的经历，本身无父无母也无拘束。妈妈以前也是尝尽苦日子，一样是家中长女，很多事情都需要妈妈的负担，妈妈也只是小学文凭，妈妈的是外表坚强内心脆弱的人，她儿时经历的苦难使她能在制衣厂坚持了那么多年，在我初中的时候妈妈更是为了忙于奔命，因为我常常假装生病，而妈妈就会给我送药过来，父亲总是能识破我的诡计，但也不便多说我什么。</p><p id="source-b-004">那个画面一直在我的脑海中，我从宿舍的下来中间隔着一个一个铁门，所上锁的，妈妈从这边送药给我，寒暄几句妈妈就回去了，父母的爱总是无私的。妈妈一直以来的坚持使自己的身心疲惫，从小到大都是这样，现在的生活相对以前来说都是好的，首先是我越发的成熟，父亲也会开始体贴了。</p><p id="source-b-005">就是妈妈跟外婆之间的关系一直处于不好的状态，其实我的心很难受，我不希望这样，因为这两个女人是这个世上对我付出最多的女人。</p></noscript>
