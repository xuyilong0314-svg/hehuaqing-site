    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>笨鸟飞吧。</h1><p id="source-date" class="diary-date"><time datetime="2013-07-06" title="原笔记创建日期，不一定等同于落笔时间">2013年7月6日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">今天考试很是沮丧，书到用时方恨少就是沮丧，沮丧的是没有看书的结果真的很难受，真的不够努力，作为一个学生我没有尽到自己的本职，到了学末的时候我才想起这样的话，今天晚上注定是要晚睡的了，现在发现自己的记忆力真的很差劲，看了多少遍的试题到了考试还是一无所知，这是对我不努力的惩罚吗？真的不知道说自己什么了，考试的时候我才开始后悔，到了学期的结尾，我这种觉悟怕是太早了，头脑真的很不好使，记忆力真的有够差的， 到底是一个什么头脑，记忆真的很差劲，太差劲了，我这样说自己也是无济于事的，像我在记忆一句诗的时候我都要看好几遍，我才可以写出来，我的记忆力差不是一天两天的事情了，这很糟糕，我也没有办法，没有自我修养的当然什么都没有，表面上我好像都没有问题，但是问题真的很多，我的脾气是不好的，我经常会控制不住自己的情绪，要改正自己的缺点，为什么总是这样，今天在考试的时候我在说不想要考试作弊，因为这样很累，但我却让自己失望了，自己我的错误自己要承担，最基本的我没有承担的精神，要自己负责自己的因果吧，如果真的不会挂科也是让他挂的，我心里起码是坦坦荡荡的，我不会为了自己能作弊成功而心存侥幸，宜兴就是一个诚实的人，他不怕自己挂科，起码他是诚实的人，因为他不曾畏惧因为是自己的，心存侥幸的人总有一天是会受到惩罚的，来的两个学期我都没有东西下去，真的没有学什么，我总是在徘徊者，徘徊者，我总是进不到里面去，本身我是不够努力的人，或者是说根本没有努力人，我的修行就是这样，这样是修行吗？任意自己在课堂上面找借口，不想上课看自己的书，没有记错我有好多次这样说自己的，但是我却没有改正过来，到了学末的时候我还是在说这个，我荒废的时间也不是少了，我不是一个称职的学生，我没有自我的归属感，或者是说我属着自己的心意，</p><p id="source-b-002">我是左右矛盾的，心里告诉我要尽自己的本分，然后有又一个人说 随着自己的性子吧，做你喜欢自己的事情，忠于自己是不是应该有底线，忠于自己的人生是需要尽自己的责任吧，这样说又是矛盾了，忠于自己是疯狂的，不顾别人的，我在这两者之间很迷茫，因为没有选择，我其实在哪里做得好了，我也是一个喜欢玩游戏的人，我也看书，我也曾在书中获益，始终觉得自己不够好，找不到属于自己的一个性格，</p><p id="source-b-003">我到底要忠于自己或者是抄袭，这是我明天要面临的问题，如果我怕挂科的话我还是看书吧，自己努力一些，经过了前两次我觉得心存侥幸的人是很可悲的，因为担惊受怕，而我就是一个这样可悲的人，挂科有什么事情，明天坦诚地面对自己，尽管不会做也要有尊严地走出来，走出来就是了，挂科就是补考，没有什么好说的，心态对了，我要做一个真诚的人，我不想畏惧了，既然要靠的是自己，我要看书 我要努力看书，我发现自己的记忆力差，我要理解才是，我的理解能力不应该是这么差的，我一定可以自己面对的，老师已经是画了重点了，这在别的学校是没有的情况吧，明天我一定会做的，我一定能坦诚都面对自己的试题，我要有信心。诸佛菩萨加持弟子，让自己无忧 吉祥。</p><p class="diary-omission">〔中略〕</p><p id="source-b-004">今天考试的时候 字完全写得不成样子了，我很急切 这是我内心暴露出来的 作弊的时候 我内心是狂跳的，我的狂跳的，而我侥幸的开始是我写不出字的时候，人心是如此复杂 在境界中我不能控制自己，修行的路还很远，走下去 坚持。</p></noscript>
