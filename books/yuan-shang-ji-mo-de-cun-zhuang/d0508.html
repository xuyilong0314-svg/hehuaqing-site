    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>扩散正能量</h1><p id="source-date" class="diary-date"><time datetime="2013-03-23" title="原笔记创建日期，不一定等同于落笔时间">2013年3月23日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">我们一家现在是非常的和谐的，没有像这么和谐过，因为我的改变，也可能是爸妈渐渐也老了，渐渐明白了人生应该是以何种姿态去呈现，一家人都很融洽，我已经是一个成年人了，我很像我爸爸年轻的时候，爸爸现在发福了，已经变了一个样子，我觉得我爸爸现在这个样子也挺好的阿，很有福气的样子，很有福报的样子呢。我所有的一切都是父母亲给的，然而我也要抚养他们到老，他们成就了我的身体还成就我的生活上面的，如果没有他们的帮助，我会想要精神追求吗？我现在明白了，当别人经济上面有困难，生计都无法保障他哪里有时间去追求真理呢？所以说人是要有福报的，有福报才能去修行，才有修行的机会，光师的意思正是如此。我应该培福报，并不是为了生活物质，而是为了更好地求法，释迦佛出离的时候留下了一个王国给他们的家人，不用担心他们的生计问题，这就是在示现把？佛陀的一生所为都是有意义的，他用行为告诉我们最深层次的真理，确实是需要福报的，因为有福报才能去接触到佛法，是这一个基础，刚才宗来说他女朋友的妈妈要生产，好像要难产的感觉，问我要念什么佛号，我告诉他要念观世音菩萨，观世音菩萨大慈大悲救苦救难，发大愿，一切众生遇到了困难，都要去营救，菩萨的大悲我很是感动，感恩。宗说念念看，希望能帮助他。</p><p id="source-b-002">而我否定了他，心中如果没有信念，心中没有百分之百坚信是不可能听得到的，众生始终是贪婪的，非常的贪婪总是希望能得到好处，而不用付出任何。我让他不要念了，因为念了没用，顺利还好，如果不顺利还要怪罪菩萨。在祈求的时候要问问自己是否将生命依托给菩萨，那种信念是可以超越时间空间的限制的。</p></noscript>
