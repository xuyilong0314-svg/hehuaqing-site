    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>也是看客</h1><p id="source-date" class="diary-date"><time datetime="2013-04-06" title="原笔记创建日期，不一定等同于落笔时间">2013年4月6日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">回到了学校，觉得这次的杭州之旅过得很慢，因为大部分时间都没有睡觉，压缩了自己的时间，觉得这两天过得很愉快，虽然挺累的，两个包实在重。但路还是一样在走一样地都完成了旅程，我不算是去过西湖，我体会到了西湖，跟去过不一样，我能体会为什么诗人写西湖会这么矫情，昨晚我也矫情了，不不不，这不是矫情，这是对他的赞美，这是对西湖的肯定，我当然不吝啬赞词了。昨天晚上写作的境界很好，写得很流畅，一个个思路也就这么出来了，有一段时间写日记的经历，因为西湖的美景或者是因为旅途的疲劳，让我的写作水平提升了，我很是高兴，在西湖收获更多的是我把，终于我学会了赏景，了无人烟 才是西湖的本来面目，上天下了场暴雨让我起来，是西湖把让我起来把，因为想要把她的美丽呈现出来，所以下了大雨让帐篷湿了，尽管这手段有点小凶残，但是让我领略到了真实的西湖美景。哪里的旅游业发达就是在毁了那个地方，不知道是在看地方本身还是在看人的呢？想要人可以去招聘市场，那里有蓬勃的生命里，每个人的生命相加也是一部中国史。</p><p id="source-b-002">我也是慕名而来的人，我也属于那个嘈杂的人。我同样是打破宁静的人，我有什么理由去责备别人呢？显然我没有这样的资格，我也给她带来了嘈杂阿。我一瞥间的西湖是最美丽的，我现在不用去赞美什么，我需要做的就是记住这一刻的美丽，昨天晚上我也已经记录了，在我的自传中有一个叫西湖的美丽女子。然后就这样了，不能忘却是西湖，可能还会再来一场邂逅，也可能相忘于江湖，我不是这样绝情的人，我会怀念的，你已经是我生命的一部分，不可推脱的一个人，就这一切的不完美才有这样的完美。</p><p id="source-b-003">时间不多了，我不想换颜色，我觉蓬勃的绿是生命里，我现在的颜色就是生命，我热爱生命我感谢生命，生命万岁，万岁生命。我想去原野寂寞上的村庄，我想到这个村庄等一个个志同道合的人，一个个跟我一样有趣的人，精神决定着一切，我决定着自己的生命，就好像我现在的灵感，我敲键盘的手，都是在我控制之下，形成了一段段文字，这都是我的回忆，我灵感提炼出来的甘甜，这是我的生命，我在主宰自己的生命，写日记的时候，是我一天中最宁静的时候，也是最看得见自己的时候，因为宁静，这也是通向旅途的，通向一个寂寞原野上的村庄。每当写日记的时候我才是最真实 ，才是最坦率，最怀有赤子之心的时候，不需要去忌讳什么，在这个村庄，我想做带什么就做什么，我是一个充满自由的人，在这个村庄我可以痛哭，我也可以狂笑，我可以骄躁，我可以平淡如水，我可以千杯不醉，我什么都可以。但是不会迷失本心，因为我同样是这个村庄的看客。这个村庄的一切行动都在我的原则之下有条不紊地进行着，我正在创造，用自己的愿力创造出一个村庄，会有越来越多的人来到我的村庄，有的可以是长久待下，有的可能只是一个过客，但真相就是每个人都是过客，只是时间的长短。我内心却不愿意诚心，我不能说谎，我心中爱它美丽，嘴里怎能说四大皆空呢？</p><p id="source-b-004">一切都是永恒的，一切也可以不是永恒也可以瞬间消失，这是岁月的问题，当下一刻就是永恒，拥有了当下就是拥有了一切，当下我在这个村庄生活，当下我看到了自己，当下我认识到了自己的所思所想，你孤单吗？并不孤单，一切开始在顺其自然地进行，我肯定了自己，我就不会再感到彷徨寂寞，因为这村庄最重要的是就是我的信仰，村子中央供养着佛，我日日膜拜，我日日怀着佛陀的本愿，有时候我做得不好，但是我仍然在一砖一瓦地建立。我在寂寞原野上的村庄，一砖一瓦搭建我的信仰，搭建我人生的意义。</p></noscript>
