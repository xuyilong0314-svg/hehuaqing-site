    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>蛇年除夕之夜</h1><p id="source-date" class="diary-date"><time datetime="2013-02-09" title="原笔记创建日期，不一定等同于落笔时间">2013年2月9日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">今晚是龙年的最后一天，一年的时光过去了转眼之间，太快了，转息即逝就是千年这是真的，二十年不过一日，不过现在我在当下这一刻，历史在无声无息种种重叠，随着因缘的长河流逝而去，我的足迹我看不见，只能回忆回忆一段段曾经，今天就做一个总结吧。总结我这一年的得失，总结自己的精神，一年以来自己变化了什么，又失去了什么。</p><p class="diary-omission">〔中略〕</p><p id="source-b-002">今年的开端就是要面临高考的最后一学期是冬天，那时候我还是和云在交往，在我的高中时期我们一直分分合合地，在高中的时候我每每先要发奋图强但总是一会儿，我都坚持不了，就跟我练字一样，因为没有一样东西能强迫我自己，尽管这种东西是需要自己去争取的，我也没有强迫自己，因为我懒惰，说得白一点就是怕苦，高中的时候我本来是理科生后来转成文科生，再后来转成了理科生，又转成了文科生，我这四进四出跟赵云有没有有一比阿？人家那是在打仗人家在救人，而你呢？半文半理的，跟半男半女一个样，不是人，学也学不成一个样子出来，这就是我高中生涯的课堂，在课堂上面就是玩玩手机聊聊天阿，在高中以下的时候我被大多数的老师都批评过，我承认我不是一个称职的老学生，我也不是一个称职的男朋友，到了后来考试无望了呗，竟然出来了单招考试，跟保送是一个意思的，说单招可能比较好听，我高中和大学都是通过这种单招上的学，我然以我这种成绩是混不下去的，书都没得读的，我没有经历过中考和高考，最后也是考上了选择了林业技术学院，没有人跟我是报同一间的，跟没有人跟我是同一个专业的，我家里还是比较尊重我的意见的，我也如愿地考进了这间学校，期间还是要感谢很多人，我的学业之路真的很不容易。</p><p id="source-b-003">父亲给我报的高中保送我才能在高中，没有过早的到社会中，人生的每一个时刻都是转折点，每一个人也都是你的转折点，这些转折点都是到了若干时间以后你才能发现，时间你仔细去发现很多时候都是，在世上我们都是相互联系我坚信，因为联系我知道有你。</p><p id="source-b-004">高中时期有阿飘，这个教语文有点像痞子的老师，是一个比较有个性的老师，我跟他现在也没有怎么联系了，还有就是达生，达生就是冷暴力，他不会跟你发什么脾气，但是他就是会折磨你，不见血的。还有就是阿男呗，阿男挺有责任心的，但是就是脾气也是很爆的，我只怕会使她气坏身体，这真的不好。教历史的淡定哥，教政治的批判哥，我很喜欢批判哥，我喜欢讲实话的人，有时候真的会怀念那一段在旧校区宿舍的时间，我们常常说在学校最幸福的就是在宿舍的时光，大家聊天竟扯淡。我的高中时期结束了，是单招，然后我和云的感情也结束了。我用一点点文字来祭奠这段时光，来得很敷衍，再过几年我相信陈埭会是我的乡愁，一个个怀念的人儿，一段段时光会浮现在我心头。</p><p id="source-b-005">我写日记是高考放假回来开始写的，有一句没一句开始在写，顺利到了南平，第一次开学是爸妈载过去的，放好了行李到了武夷山逛了一天，我的辅导员叫做梦妮，我开始在心中发我希望遇到一宿舍有缘人，希望每个人好好相处，大学最要好的也是在一起生活的宿舍友，到了大家觉得同学渐渐模糊了，没有固定的教室没有固定的座位，什么都是没有固定，大学时流动的河，只有这儿一簇小草是相依相伴的，大学的老师是不一样的，有可能教了一学期还不知道你的名字这是可能的，也有可能自己上了一学期的课不知道老师的名字，在大学都是成年人了，模式改变了，给了充分的自由。我的学校的社团活动我都没有去了解，是我没有认真去了解不是没有，然后我开始了阅读，我开始买书，在上课或者空闲的时候看书，渐渐喜欢上了看书，说一说我爱情的萌发阿，是敏她是我第一个有好感的女生，我们有挺多共同的话题，我也知道她对我有好感，接触久了吧，就把这好感扼杀了，我们两个是无缘的，最后一次是她邀我去图书馆我没答应，这样是不是让她很突兀？在大学期间我收获最多的是每天的写作和看书的本能，我想去认识更多，我想去了解历史，这些都是书籍给我带来的，我的思考逐渐不同，我渐渐会站在别人的观点，我也越来越坚强，我更努力了，这些都是我的感谢，我很庆幸，感恩一切成就我的人，这片大地，我热爱的大地。</p><p id="source-b-006">一年就这么过去了再几十分钟，现在对于过年没有什么感觉，每过一年自己的寿命就减少了一岁，何乐之有？今年我没有群发短信，我不想，我希望几个谈得来的一起坐着聊聊天更是切实际，为什么现在对于过年没有什么感觉 ？是文化传统，没有那种气氛，</p><p id="source-b-007">今年就没有跳火堆，等到若干年后一直没有的话，这个习俗就没有了，然后我的儿子永远不知道这是什么感觉，我记得最深刻的是在古厝的时候，叔叔们都还住在一起的时候，那其实是最有意义的一年，现在每人一个家，也都没有来往了。年不再是年，人不再是人了，唯有感叹，奈何？ 一年就这么结束了，该庆幸、感恩、敬畏、 谢谢，新年快乐，新年吉祥 一直有你们的陪伴。</p></noscript>
