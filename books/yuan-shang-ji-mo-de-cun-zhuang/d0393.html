    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>我的孤独来自于那时候</h1><p id="source-date" class="diary-date"><time datetime="2013-07-16" title="原笔记创建日期，不一定等同于落笔时间">2013年7月16日</time></p><p id="source-b-001">不喜欢应酬。我在想以后怎么在职场混，混什么，别混了呗，以后的工作岗位可是由不得你，很多事都是如此我也没有办法阿，这操蛋的社会 这操蛋的体制真让人受不了，有些人顺从了过上了操蛋的生活，有的人享受这种操蛋，既然被强奸了还是顺从享受就是来了，为什么现在会写出这样操蛋的日记呢，晚上的饭局我很不喜欢，这是对于我来说，上一辈的感情还是需要连续起来的，渐渐地亲戚很少了，独生子女多起来了，兄弟之间的分享缺少 更不用说手足之情了，我对这没有体会我也不清楚自己能写出什么，我只能说说我父辈的手足情谊，他们娶了各自的老婆，也有不同的命运，他们兄弟之间少有联系，未曾看过他们在特定场合之外的闲聊，这是他们的兄弟相处方式，听妈妈说以前的故事 他们兄弟间是不和谐的，在我懂事以来他们兄弟也谈不上亲密 也算不上和睦，按理来说过早就失去了父亲，应该会更有凝聚力才对，他们未曾景仰我的父亲，古时候有一句话 ，长子莫若父在他们之间没有体现出来，父亲也不是一个爱计较的人，他也不曾在他们的兄弟间显示他作为一个长子应该有的威信，我父亲在他们之间也少有威信吧，这只是我看来而已，其实情况也不是这样，现在四个兄弟现在也只剩下 2个了，只有两个人能决定事情，决定整个家族的走向，其实家族之间已经是没落的了，人丁的稀少，少得可怜呢，</p><p id="source-b-002">从小我跟辉辉跟强强之间的相处我也是作为一个大哥，我甚至还会殴打他，怪不得他会在 QQ骂我，这也是有原因的哦该，那时候我不够成熟，因为他们大人之间的事情也是对我潜移默化的，记得我想过我要赚大钱我要报复，我要垄断他们的生意 因为妈妈我第一次学会了仇恨 但是妈妈及早帮我化解了，我妈妈是一个伟大的女性她教会了我不能去恨，人一旦恨了就会失去自己，从小我都是压迫强强的，一直以来都是，我以前在班级的形象也是不好的，我总是欺负弱小的同学，我失去了所有人的友谊，不管是谁，除了跟志林还好一点我 其他的人都不跟我玩，我也没有地方玩，我的范围一直都是在家里，我的童年其实是没有朋友的，从此我学会了孤独，以前的朋友玄楚还有庆祥我们之间已经没有联系已经以前是多么好的朋友 经常会到他们家里去玩，那时候还小，我就很霸道，一直以来我都很霸道，这不是在家里，我以前写过我的小学初中时候，</p><p id="source-b-003">到了转学的地方我都是自以为是的，我也失去了所有的朋友 那时候我没有朋友 我多么希望有一个人你能垂怜我，那时候我只是想引起别人的关注，起码是阿姨的，我还记得阿姨的面孔，不知道阿姨还在不在呢，希望她过得美好，照顾我们不容易，那时候她总是帮我煎药，我总是能一口气就喝下去，阿姨会怕我苦小时候也不是怕苦的，感恩阿姨的付出她给予我的比对我们中任何一个人都多，尽管我那时候没有朋友，我是强硬的我招惹了所有人，原本每一个人都可以是我的朋友，我却失去了所有的朋友，这是有原因的，因为我会物质去交朋友 我用自己的一切去诱惑，其实我是吹牛皮的，我总是会被人问难，以前班级在吵架的时候会有分派，我好像是站错边了。然后吵架的一方和解了 我反而成为了那个不被待见的人，</p><p id="source-b-004">这一直延续到了初中，初一时候我也是欺负小的同学，记得刚开始时候我总是让学斌给我抄，小测的时候我总是会偷看，记得是英语单词，那时候各自很矮坐在了第三个位置，第三个是我的位置可见我那时候多么矮小，我跟明川是一个班级的，我们并没有一起照顾彼此我也是被孤立的那一个，我怕被别人给欺负了，我保护自己是用强硬的方法，记得那时候我也是没有朋友的，真的找不到半个朋友，在宿舍的时候我朋友也是很少的，根本没有朋友 原本跟宏伟在一起的还是玩的很好的，宏伟用自己的好脾气让大家都接受了，他小时候肯定不是自私的人，我小时候是这样自私，个性后果也是一样的，这一切都是怨不别人，我自己村里面的人都相处不好更不用说别的了 我不记得那个人的名字了，那时候他让我和志林之间打架 我们之间都舍不得用力地去打对方，那时候我是遭到众人排斥的，不管是谁每一个人都是这样，我没有任何一个朋友，我度过了我最不快乐的初中时光，没有朋友的日子我也是挨过去了。我更加懂得了孤独的滋味，我能忍受没有朋友的日子 我也不会跟我的父母倾诉从来都没有，我总是把苦楚吞在心里，那时候我能体会到孤独我能接受孤独了，这可能也养成了这样的习惯，</p><p id="source-b-005">我搬出了外宿 我到了内宿，我开始让自己变坏我去接触那些坏的学生 那时候我开始懂得怎么趋炎附势，我知道人物之间的相处，但是内心中的那种霸道还是没能改变，那时候我在跟婉妮交往的时候我跟大家的关系都不好了，跟阿坏他们是一群的，那时候并不是我们深交的时候，那时候我开始抽烟了，我抽烟的目的是要跟他们有共同的话题，我开始学坏 我浑身解数地跟他们靠近，最后我们还是没能避免地打上一架，那一架是我懂得怎么跟人相处的开始，腊肠上来踢了我的椅子，那时候我跟 WN在讲话，我直接给腊肠来了一拳 事后他说那一拳可真重，我第一挥拳是对自己的兄弟号称自己的兄弟，还有明川没有想到他也会起来来打我，这些事情我都是深藏自己的心中 未曾吐露出来 打架时候并不会有痛楚 只是心里痛了一下 真的痛了被自己的兄弟打了，那是一件众叛亲离的事情 我一定是做错了什么事情，那一次之后我才懂得怎么去交朋友，其实我是懂得了怎么趋炎附势 自从我学佛之后我才知道了要忠于自己，初中的那些朋友也都散了 玩不起来了。</p><p id="source-b-006">高中的时候我跟了秋杰我把他当成了兄弟 自己的大哥 但是这个大家未免霸道 我心中不免排斥，因为在初中的时候我总是害怕打架 我要给自己找一个靠山 我以为这是我的靠山了 我渐渐吊起来了，这是一件多么可笑的是是事情 这是我的清楚 我心中永远的阴暗面，然后我跟志伟他们一起了 我们成为了好朋友 我们一起去网吧 我们一起去吃饭 我们都是在一起，然后我们又走散了，然后是跟东煌了，经常去他们家里 我看他身上仿佛看到了我的影子 是我的影子后来我们又走散了 还有一封，还有二烽他们 明华他们呢，这些都是我的好友 德松他们，有时间 专门写一篇我的朋友 发生在我生命中的事情</p></noscript>
