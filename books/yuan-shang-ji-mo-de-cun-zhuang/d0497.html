    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>原上寂寞的村庄</h1><p id="source-date" class="diary-date"><time datetime="2013-04-03" title="原笔记创建日期，不一定等同于落笔时间">2013年4月3日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">原上寂寞的村庄，住着一个孤独的王，村民所剩不多。确实散发着理性的光芒，足以照彻世间的所有阴暗，似是蜡烛，要有火才能点燃。到原上寂寞的村庄，寻一个蜡烛，为了点燃心中的理性，理性是智慧的延续。用蜡烛点燃心灯，用理性的光辉照亮自己的宇宙，用智慧的力量改变这个大乾坤，有多少的努力就有多少的收获，为此我并未付出多少努力，我觉得我作出的努力是很少的，要用不亚于任何人的努力，我承认我输给了前人，前人的精神都是可以效仿的，学诚法师说不不比今人，比前人，前人精神是多么可贵让我们值得效仿，历代祖师大德都是在这一个原上寂寞的村庄，确实是寂寞的，但是寂寞却是好事，我认为寂寞可以让自己更能贴近自己，更认识自己，从而回归自己。然后你走出这个寂寞的村庄，心始终能与自己共鸣，不至于在荒芜的世俗之事放荡，不会去随波逐流，足够宁静地面对每一天的生活。</p><p id="source-b-002">我现在的程度还是处于那种很烦躁，最自己没有力量的时候，时好时坏的状态，并不能长久保持，这也说明我的修行还是很差劲的，有时会过度地放纵自己 ，比如说旷课把，有时会觉得无所谓，只要去做自己喜欢的事情有何不可？但这修行已经算是失败了，不要向自己妥协，如果成为了习惯，养成肆意乱来的习惯可很糟糕。</p><p class="diary-omission">〔中略〕</p><p id="source-b-003">等会就要去安徽了，我想那里应该也是下着雨把。我心中却是很平静，没有一定要去哪里，哪里都行，只要是自己去体会都有不同的味道，每个人地方的文化只要你想去体会，只要你想去感受 都是能有不同感受的。我这一刻想起了那时候我不想读书我去找工作的画面，那时候我如果顺利找到工作，也直接进入工作 我想我的人生就不一样了，很庆幸的说 我没有真的去工作，这要多多感谢我的爸妈，我如果那时候就执迷不悟的话，我现在更是不会有这样的体会，我应该也不会有写日记的习惯吧，更何况是看书呢？ 感恩一切，感恩所有</p></noscript>
