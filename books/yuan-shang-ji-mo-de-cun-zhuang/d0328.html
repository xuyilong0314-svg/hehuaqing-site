    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>如此自然，收放自如</h1><p id="source-date" class="diary-date"><time datetime="2013-10-11" title="原笔记创建日期，不一定等同于落笔时间">2013年10月11日</time></p><p id="source-b-001">第一次是这样的状态，我没有紧张的感觉，一切是收放自如的，这是佛菩萨的加持，在佛菩萨的那一次供养之后 我开始放得开了，在台上的时候我都不是紧张的，而且是幽默的，自嘲的，我的风格开始在成形了，我也开始在自己内心世界里面开发出自己的智慧出来，这是佛陀的恩泽，要度众生，这是每一次机会都是要把握的，我努力地去呈现我的自身的东西，这是我的精神状态，我发现我越来越是好了。这是自信，自我的肯定，我发现自己之前看到的书 都是在此时此刻有用的，我之前的一切累计都是为了这一刻弘法应该是呈现在自己身上，当别人看到 对其有兴趣 有因缘的话 别人自然是会看到好的，这就像是福报与智慧一样，我想着是我最好的呈现了。</p><p id="source-b-002">祈祷佛菩萨的加持 让我有这样的力量，让我淡定 让我自然。</p><p id="source-b-003">感恩诸佛菩萨</p></noscript>
