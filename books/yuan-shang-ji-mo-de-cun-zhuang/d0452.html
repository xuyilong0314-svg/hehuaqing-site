    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>要爱 不要纠缠</h1><p id="source-date" class="diary-date"><time datetime="2013-05-18" title="原笔记创建日期，不一定等同于落笔时间">2013年5月18日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">爱是美好的事情，当爱成了纠缠那是痛苦的，我是喜欢自由的人，今天晚上和鹿谈了一些有关于爱情的东西，爱情不应该是束缚的，但是长久以来的，不管是历史或者是现代，都有很多悲剧，很多的不圆满，寄情于对方的人总会受伤的，没有了自我，有了对方，又有什么用呢？爱是要建立在自己的基础上面，在自己的灵魂上面，先懂得自己是怎么样的人，然后去表达，接受对方包容对方，要有自己的空间，在这个世界上不要为了谁谁的期盼，也不是为了谁活着，不要那么伟大好吗？你根本做不到，那么就把自己的分内的事情做好，这是最重要的，如果能偶遇，那是一件很美丽的事情，如果不行的话，那也没办法的事。分内的事也包括一个恋人的角色，并不冲突，只是说恋爱不是全部，你还需要友谊，需要很多朋友，有自己应该做的事情。不要为了一个人失去了全世界，这是愚蠢至极的，这不是爱，这是不理性的行为，每个人都想得到反馈，谁都想成为对方的重心，但是重心却是要负责任的，也是痛苦的，对我来说也是不自由的，相处方式很重要，要懂得相处，也要找到适合自己相处的人，先认识自己然后认识对方，不要纠缠，爱情是相互的！</p><p id="source-b-002">这次我让她帮我出了钱，我们之间的那种隔阂渐渐在消失，不会那么客套，我希望的就是这种状态，我们现在相处得非常好，是融洽的，我不会去想以后会怎么样，因为现在的状态可以是以后的状态，我对爱的理解，要爱，不要纠缠，给对方空间让对方去做喜欢做的事情，这是最好的爱情，也是最有利于对方的成长的爱情，爱她看到她的成长而感到高兴，爱能让人成长，这是我想要得到的爱情，也是我爱情的观念，。</p><p class="diary-omission">〔中略〕</p><p id="source-b-003">厂长每天都来帮我哦抹药，很是感谢他，他比我记得还清楚，我本来是不打算要抹得，谢谢有这样一个朋友，谢谢有这样一个支持我的人，和我一同进步的人，两个人互补就能进步， CF是一个脾气很好的人，这还不知道，性格很好的人，不喜欢计较的人，也是一个包容的人，我一定要好好帮助他，帮助他的成长，在他之上我是比他好的，但是很多方面我就输给了她他，他身上有很多品质值得我去学习，向对方学习，朋友是一面镜子 ，请爱护一个能对你坦言的朋友，有一个镜子中一样的朋友是幸运的，我就是一个幸运的人，</p></noscript>
