    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>你看见了自己的了吗</h1><p id="source-date" class="diary-date"><time datetime="2013-09-11" title="原笔记创建日期，不一定等同于落笔时间">2013年9月11日</time></p><p id="source-b-001">以前我是在那个位置上的人，那时候我也是紧张的，那是我的第一次面试，我也没有那么地好，已经是一年的时间，一年的时间中我得到了什么，我逝去了什么，我知道自己的想要的是什么吗。或者说我做到了我之前想做的了吗？我想我还是一直在进步的，是啊 我现在的语言能力也是提升了许多我一直都是在学习的，我知道时间总是会过去的，一年了，一瞬间的事情，若干年后我会回味现在的生活，这是一件多么有趣的事情，时间总是在流逝中过去的，好像没有做什么事情一样，这一年我发生了什么改变了 看看过往吧。 睡觉了， 开始新的生活</p></noscript>
