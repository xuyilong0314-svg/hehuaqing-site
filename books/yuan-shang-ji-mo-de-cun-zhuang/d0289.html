    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>春寒，独立春寒</h1><p id="source-date" class="diary-date"><time datetime="2014-02-10" title="原笔记创建日期，不一定等同于落笔时间">2014年2月10日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">梅花独立春寒，寒冬中我听到了芬芳，清雅传香。我与风中的那一抹香，为何因缘，待我来时绽放，闻她芬芳，引我深思是因缘，是一段美丽的互相吸引，夜黑的时候 我曾经细细看，待到天明我却只是找一个角度，为她安放手机，见她最美好的时候 也只是通过镜头的聚焦，我是让她遗憾的，可惜的是我尝不到她芬芳里的情绪，都说万物皆有灵性，又有谁能说她没有情绪，我很想听到她的情绪，我想独立春寒应该是孤独的吧，当一切都散尽的时候 是否是开悟的那个样子，独立春寒，不需要比较因为是独，天上天下唯我独尊，思绪已经飘到了温州上空，就在仙岩顶上。</p></noscript>
