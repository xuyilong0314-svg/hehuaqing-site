    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>来吧 亲爱的人</h1><p id="source-date" class="diary-date"><time datetime="2013-09-20" title="原笔记创建日期，不一定等同于落笔时间">2013年9月20日</time></p><p id="source-b-001">多久没有这样激情的岁月，这算是吧，玩英雄联盟的时候是有这样的感觉，是在一起玩的那种感觉，以前是这样青春过，这种感情是一样的，不是游戏里面的激情，而是那种一起的感觉吧，我还是要写日记的，因为内心会有记挂的，若是在以前我肯定是不会这样的，之前给自己的定的是 2000个字，现在 也没有遵守自己的定下的，改变了，那么就随心一点吧，但是不能少的是，人是必须经历幼稚 不成熟的，最后会变成什么样子，也说不清楚，我想我现在是孤独，这种孤独感是内心深处的那种宁静吧，我说是孤独 是不是有些矫情，但是寂寞不是孤独，人在睡梦中一定是孤独，通向死亡的路上一定是孤独， 同床异梦是孤独的，心有所属是孤独的，因为这一切之属于自己的，若干年后我会更孤独，孤独给我的是坚强的力量。信仰使我不孤独，但不这不属于我说的孤独的范畴。就算是我从人群中，热闹的人群中，一阵欢乐过后 我依然是孤独的，在漫漫长夜中我们会感到寂寞。我想我们会一起死去</p></noscript>
