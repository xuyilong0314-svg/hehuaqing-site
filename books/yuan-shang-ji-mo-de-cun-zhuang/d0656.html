    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>看阿，又是一夜不眠夜</h1><p id="source-date" class="diary-date"><time datetime="2012-10-24" title="原笔记创建日期，不一定等同于落笔时间">2012年10月24日</time></p><p id="source-b-001">hey，今天.</p><p id="source-b-002">我并没有迟到，会不会怪我太晚来了</p><p id="source-b-003">其实</p><p id="source-b-004">我早早地想起了你</p><p id="source-b-005">我觉得吧，</p><p id="source-b-006">你最近越来越懒惰了，起床都起不来了。</p><p id="source-b-007">说好的看书呢？ “元芳，你怎么看”</p><p id="source-b-008">元芳也表示对你 很失望阿。</p><p id="source-b-009">就你的化学老师说的吧，你现在不懂就放弃，更加不懂。</p><p id="source-b-010">你听得懂，但是听不下去，你...</p><p id="source-b-011">其实把。</p><p id="source-b-012">在逃避，我并没有说错吧。</p><p id="source-b-013">什么文科生，理科生。这是借口。</p><p id="source-b-014">说好的，重新开始呢。</p><p id="source-b-015">说好的呢？ 说好的勿忘初心呢？</p><p id="source-b-016">你都忘了，每晚我都要来与你相会，</p><p id="source-b-017">每晚，我与你共同来反省。</p><p id="source-b-018">你烦不烦呢？ 你不烦我都烦了...</p><p id="source-b-019">陪你反省也就算了，烦我也不说了，那你总得有点改进吧？都要</p><p id="source-b-020">大学，大学，大学</p><p id="source-b-021">反对堕落，反对逃避，反对消极。</p><p id="source-b-022">好吧，我们两个也该共度良宵，有一天，你将消失。</p><p id="source-b-023">直到有一天，我不必跟你反省，你就消失了。</p><p id="source-b-024">而我，就出现了。真正意义上的出现。</p><p id="source-b-025">晚安吧，不跟你扯淡了，我们共度良宵，</p><p id="source-b-026">春宵一刻值千金！！！</p></noscript>
