    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>裘妲袅</h1><p id="source-date" class="diary-date"><time datetime="2013-03-09" title="原笔记创建日期，不一定等同于落笔时间">2013年3月9日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">练了一天的车，太阳晒多了很人疲劳，灵感被晒干了，事实就是我写不出什么东西来了。除了练车我今天很出彩，练车各自回各自的窝，我在捷龙下车，去超市采购一些宿舍要用的东西，身上就剩下三十块钱，我以为周勇会有钱，在算钱的时候我问周勇借钱，他之剩下了六十块，结算了一下商品的价格是八十五块多，然后剩下了 5块钱，都不够打车回来，实在是很糗差一点东西就没得买了，然后剩下五块钱选择公车会去把，</p><p id="source-b-002">刚到九峰山下的时候，我在一个路边摊要坐下，用脚扭动了椅子坐下，然后我看到了老板的表情，他走过来，那时候我心里也知道他要干什么呢？不出意外的他赶我起来不让我坐下，他说我用脚踢椅子他就是不让我做，这件事情我确实是冒失了，当时我就没话说了，我确实是没有什么理由反驳他，可能上辈子他要在我的小摊上坐下我不愿意把，我毫无怨言，当下我转换了自己的心态，我认识到自己的错误，自己刚才那个动作确实是冒失没有礼貌的。总是等不到车，周勇遇到了一个熟人，是个女的，周勇向她要借十块钱，很糗，花钱到没有钱坐车的程度，曲折过后也就是一连串事件，我的今天才那么精彩，本来我是不想去买的，但是通过阅读，我知道自己的是自我的心，我想要去改变自己的弱点，引来一连串的时间，人生的每一个选择都是足以改变人生轨迹的，我想改正自己的弱点，我经常性地去克服，渐渐自我的心渐渐消失了，我现在很疲劳，很想就去躺在床上睡觉，衣服也不脱。不知道为什么会这么地疲劳阿，就一天的练车吗？显然不是阿，这种程度也是不足让我这么狼狈的阿。</p><p class="diary-omission">〔中略〕</p><p id="source-b-003">明天还要看1000题的题目，之前我妈妈告诉我要提早去看了，我还是这样，长辈的经验是足够自己去听取，看你现在要临时赶工了，这是最不好的做法了，那么多内容要集中在一次性完成，总是不好的，精神紧绷的同时，消耗更多了，我这个毛病应该要克服的，总是把对自己劝诫的话当成是耳边风，这样可不行，这样的习惯带到以后往往都是一次次的失败，然后在自我忏悔中，难受。这可不是一个心中充满智慧的人所应有的行为。三人行必有我师，妈妈虽然记忆力没有我的好，但却妈妈是用勤劳去完成的，而我却是急急忙忙赶出来的，这是我不踏实的表现，如果我踏实虚心地听妈妈的意见，我现在也不会这么地狼狈不堪，这次经验可是要记住，不能再犯这种错误了。以后遇到形形色色的事情还是会有很多，说这个的关键就:虚心听取别人的经历，别人的意见，然后对照自己的内心，你会产生新的想法，防患于未然是最明智的选择。明天又要消耗很多脑细胞了 1000题阿</p></noscript>
