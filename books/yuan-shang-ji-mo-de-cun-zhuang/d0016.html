    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>又十天</h1><p id="source-date" class="diary-date"><time datetime="2016-04-19" title="原笔记创建日期，不一定等同于落笔时间">2016年4月19日（原笔记创建日期）</time></p><p id="source-b-001">很慌，时间是那么宝贵，我应该制止自己言过其实的行为，我总是在兜售自己偷来的概念，并非自己有的。总是好为人师到头来却落得什么都没有，记录下这一个的经验，压力总是自己给自己的，我对自己很松懈，甚至这几天我什么都不想做，我嘴上说很慌，但是行为却是另外的一种体现。</p><p id="source-b-002">今天是雨水，很快春天也就过了，我却是还是在原地不动，一天天过去，我甚至也不知道自己能够做的是什么，我说自己喜欢某某某，想从事某某某，但我的行为却是出卖了自己，我一动不动如同死狗，连片刻的安宁都没有，在 iPad、iPhone上，在向外面寻求，以免被片刻的宁静击溃。好像所有的行为都是在麻痹自己，妈妈都要回家了，我还是没有多大的进展。</p><p id="source-b-003">深吸一口气，我现在的表情应该是呆滞的，面色也不好，睡眠也差了。这一路来都是顺风顺水并没有遭遇遭遇什么挫折，而此刻我面临自己要做的第一份工作，我又是主观意识强的人，我开始在选择，知易行难，现在却是知难，好像有很多选择，恰恰是最不能选择，你真的喜欢设计的工作吗？你能够不计成本地去做并且坚持下去吗？前一段时间的画画已经过去了那么多的时间，别人都是在进步，我就是一个没有毅力的人，这段时间我原本可以做很多时间，但我也是浪费了。</p><p id="source-b-004">现在自己什么也不想看，一个字都不想看，在混乱的状态，先让自己静止下来。我也相信这是上师给我的加持，这就是人生，没有丝毫的体验，轻易地吐露一些建议是不尊重的。不尊重他人的处境。在于嫂子的境遇肯定是比我惨的，知道她现在所遭遇的，而我又说一些心灵鸡汤之类的话，我觉得自己很惭愧，我到再放鸡血的同事，我期待他人的认可。不得不承认，这还是你想发送的意义没有其他的。上师加持我、令我体会无常的真谛</p></noscript>
