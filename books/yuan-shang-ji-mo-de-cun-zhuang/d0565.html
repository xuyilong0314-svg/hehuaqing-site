    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>论何华清？</h1><p id="source-date" class="diary-date"><time datetime="2013-01-25" title="原笔记创建日期，不一定等同于落笔时间">2013年1月25日</time></p><p id="source-b-001">今晚帮人取名，然后分析自个名的大意 如下 1)何:疑问词(2)华:美丽而光彩，华丽、华贵、华艳、精英( 3)清:没有混杂的东西，纯净透明，与 “浊”相对，澄清(4)大意是:如何才能华艳却又澄清？( 5) 华艳于外 清净于心 是一种生活态度 是莲。取着无意，现今却与我相符，我志、心。 何其妙[哈哈]先说说我这个华字吧，我理解为这个我在俗世的成就，一个经验，光彩的华丽的。这个你还没有达到，你现在是靠着父母的赡养在生活的，你还没有出社会，没有经历，你自然也谈不上财富了，这里说的财富是生活上的，你现在还是一个大学生，在大学你受到了了良好的教育，生活上的经济父母给了你很好的条件，丝毫不输给你别人，你现在所学的专业也是以后你在社会的成就，现在是基础，现在你学的所有的知识都是供你使用的，能学多少是需要的你学习。能吸收多少，能应该多少是你的智慧，但是从前面推下来，最基础的是你先要学，不然哪里来的应用，这一切的一切都是基础，所以说你现在要做的是沉淀，还有就是智慧。能成为一个精英的人，对于精英的定义我是这样的，不只是在某一行业上面的成就，在心灵的方面也是要有所不同，是积极向上正能量的， 现在说说你。</p><p id="source-b-002">一学期过去了，你几乎没有学到什么东西，作业都是抄袭，上课也没有怎么听讲，在课堂上浑浑噩噩，有自己买书来学习，来看，这是可以弥补的，因为这些书籍让你也学习了很多，我自我的主次我是知道在哪里，这是相对的重要的，我以后的现实生活是需要工作，经济来源，对我来说我不是很在乎，但是对于家人来说这是，最重要的，灵与肉的结合，这是需要的，所以说要学。 显然我为了什么学是有目的。然后说你的这个清字，清澈、澄清、纯净透明、没有任何混乱的杂质，这对我是最重要的，即使没有了华，我也要清，这是一种境界，一种开悟的境界，心无染浊，清静自在，这是你要去修行的目的，这是你的一个方向。</p><p id="source-b-003">两个字结合起来，是华艳、清澈，这样看起来是冲突的，华艳又澄清，这怎么可以达到，我认识，你要先经历华，并在华中学习清静，不把华当华，不被华给占据，你才会有真正的清澈，你的一切修行也是要靠华来完成，他给了你经验，给了你机会，这就是你要度过的难关，假如有一天，你拥有了很多财富拥有很高的地位，那个时候，你千万不能迷失，你还是要保持你的澄清，否则你在这个无常的世俗当中会非常的痛苦，因为你陷进去了，你以为这个你的全部，其实不然，你本有佛性，但是因为无明，在迷惘中，你以为你得到了一切，假如有一天，你达到了那个位置，保持你的澄清，你才配得起何华清 这三个字。</p><p id="source-b-004">何华清，如何才能华艳而又澄清，这三个字是足够你思考一生的，中国的文字是博大精深的，在某一些方面是外国人没有的高度，如何才能华丽而又清澈，那是一种如何的心态，是一种什么心境，在尘世中不为尘世所染，那个维摩诘居士吧，大觉悟者，华贵的一个人，但是有一个开悟的，清静无污染的心，敬仰，这个问题是每一个佛教都解决的，这三个字，这个问题因为因缘巧合赋予你的身上，你更应该去追寻，命运给我的问题，我需要给自己一份答卷，何华清？ 真的听者无意，说着有心，妙哉。跟明白地是如何在世俗中保持清醒，不管遇到了什么环境都能保持自己一刻澄清的心，你的名字是我一生要去解开的问题，这个名字共同赋予了我和你，我们共同成长，让我们在欲望能看得清，在世间一切的苦难面前，站在高度，保持澄清的心态，去看。去看世间的一切。 上求佛道，下渡众生。</p><p id="source-b-005">(5)如何出淤泥而不染，濯清涟而不妖？( 6)这个问题赋予我一种志向，一种生活态度，一颗心，一朵莲。 真妙，原来我一生要面对，要追求，已经在我出生的那一刻，就赋予给了我。阿弥陀佛。那么，该是你去修行，该是你去修行了。</p></noscript>
