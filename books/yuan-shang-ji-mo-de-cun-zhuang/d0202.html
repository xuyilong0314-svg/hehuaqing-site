    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>明天即将开业了~</h1><p id="source-date" class="diary-date"><time datetime="2014-05-16" title="原笔记创建日期，不一定等同于落笔时间">2014年5月16日</time></p><p id="source-b-001">即将开业了 ，今天晚上忙着发传单，发传单的时候 反应不那么热烈。 不应该是沮丧的 不可能每个人都喜欢 或者是这样的形式。</p><p id="source-b-002">该做的事情已经做完 什么都结束了，只有等每一个人接单了，等待着第一个买家， 我觉得第一个买家 是免费的，不管买的是多少，不要抱着太多的希望 也不必沮丧 保持中道即可现在的人很累 发传单 还可以 。很多事情都要等做了才可以。 一切都准备就绪，一切都是如实的 一切都是可以精打细算的 。</p><p id="source-b-003">应该会有很多的。 一切上师加持我 ，黄财神加持我身 愿一切顺利 发心愿一切关注我 ，我应该引他们入正道 这样比赚钱更为重要。</p><p id="source-b-004">一切积极向上的思想 都将从我身上流传。</p><p id="source-b-005">今天看到自己修行的不如意 我还不够 平静 我还不够 淡定 我应该是知道因果的人 淡定淡定 不要急躁 不要让自己的行为成为别人的负担 更不是自己的负担。淡定 保持你的觉知</p></noscript>
