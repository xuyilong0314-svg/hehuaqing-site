    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>开业的第二天。</h1><p id="source-date" class="diary-date"><time datetime="2014-05-17" title="原笔记创建日期，不一定等同于落笔时间">2014年5月17日</time></p><p id="source-b-001">第二天无所进展， 突然发现广结善缘是多么重要的一件事情。 如果这一切建立在有所回报上面，那么也是一种差池 一种错误。带有惯性思维模式只是一条死路。我得提出自己的几个问题。</p><p id="source-b-002">1.宣传不到位</p><p id="source-b-003">2.描述不清楚。</p><p id="source-b-004">方法是没问题的 而且是一种新颖的方式 ，没有人在做 我只是在尝试，在校园还没有人推广用二维码扫描。</p><p id="source-b-005">万事开头难，这一切都没问题 我都能够接受 而且我也知道自己可以的 一定是可以的。</p><p id="source-b-006">无所畏惧 不仅仅是成功 而且是失败要认真对待每一个用户 人真多对待每一个用户，一切都不是简单 万法皆空 因为有空 可以去创造 谁能够与这个世界产生连接 那么他就成功了 一切都是息息相关的。好好努力加油黄财神 加持我身！ 一切上师加持我身！</p></noscript>
