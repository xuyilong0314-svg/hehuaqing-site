    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>我一直都在流浪可我？</h1><p id="source-date" class="diary-date"><time datetime="2012-10-25" title="原笔记创建日期，不一定等同于落笔时间">2012年10月25日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">我也是居无定所，确切地说吧，是心居无定所，我何曾又有过真正的定所。</p><p id="source-b-002">儿时，在父母身旁，父母就是我的家。</p><p id="source-b-003">上初中时，在安海，安海就是我的家。</p><p id="source-b-004">上高中时，在陈埭，陈埭就是我的家。</p><p id="source-b-005">上大学时，在南平，南平就是我的家。</p><p id="source-b-006">其实，我在哪里，哪里就是故乡，梦想在哪里</p><p id="source-b-007">哪里就是故乡。</p><p id="source-b-008">我吧，是存在于这片土地，我梦想在我嘴里，却远在天边</p><p id="source-b-009">我没有付诸实现，我这是在空谈，乌托邦。</p><p id="source-b-010">乌托邦主义者，这是你所希望的吗？</p><p id="source-b-011">答案很显然， 不用说，让风中的尘，树上的蝉，说给自己听吧。</p><p id="source-b-012">其实，我并不想听你说的，纸上谈兵，没有用功。</p><p id="source-b-013">没有用功！！！！！</p><p id="source-b-014">我对你的期望，你知道，我知道，乌托邦这你不值得拥有的</p><p id="source-b-015">是不是要惩罚你一下？</p><p id="source-b-016">今天晚上给我去睡客厅，不跟你睡。</p><p id="source-b-017">还有，惩罚你。 明天 你死定了</p></noscript>
