    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>自己便是自己的好友</h1><p id="source-date" class="diary-date"><time datetime="2015-05-28" title="原题所记日期">2015年5月28日 · 温州 仙岩</time></p><p id="source-b-001">有时一首歌会唤醒过去的回忆，因此深感事物无常变化，从执着永恒到把回忆深埋红细胞里的遗忘，这埋藏与唤醒的过程犹如梦境，它在某一刻如往日重现，就如同梦境的玄妙，过去的回忆它也不过是梦罢，那么回忆便是梦境的好友。思绪芜杂总比清明会多一些，写出当下流露的大抵都是片面之语，其实问问自己为什么天天写，答案是排解，需要把一些独白留在时空中，留下一部分的真实存在，那么时间轴便是独白的好友。现在的文字是当下的我，也是刚刚过去的我，画面没有昨日重现的机会，心绪在奔腾的河流中，它不再有相似的时候，那么文字便是重现的好友。</p><p id="source-b-002">今夜我赋予你戏子之名，你应该寂静，也应该热闹，因为人间是大剧场，谨记我们都是演员，我们在互相演绎中互相取悦，并以此提取生命的价值，那么演绎便是戏子的好友。我们能为拉开帷幕的生报以掌声，不也应该为落下帷幕的死报以欢呼吗？生与死都应该值得庆祝，值得我们互相道别与珍藏，那么生死便是我们的好友。</p></noscript>
