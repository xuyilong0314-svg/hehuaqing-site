    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>嘿，心爱姑娘</h1><p id="source-date" class="diary-date"><time datetime="2013-09-26" title="原笔记创建日期，不一定等同于落笔时间">2013年9月26日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">天空上是什么颜色，今天算是秋天的一个轻吻，告诉大家她来了，秋天我想是一个姑娘，她是孕育的，给人带来阵阵清凉的风，我喜欢秋天的日子，秋天也可以是愁云惨淡的，生命在每一次的轮回中，轻轻走过，我读过了 19个秋天了，我是生在冬天的，我是一个安静的孩子，我是大地的孩子，我是原上寂寞村庄的王，我是向往太阳的，和心爱的姑娘走在街上， 了解她，也要了解太阳，我们之间能走下去，是他的坚持，如果当时她没有说 得不到解答 不罢休的话，以我的脾气我不想理她了，缘分是一件很奇怪的东西，在感情面前，文字的流淌往往是不用通过大脑的，当感情汇成文字，这一切是是诚恳地，为什么我是她想要的人，可能我不是那么俗吧，跟别人都是不一样的，当有一天我被现实压迫地，不，我享受这份苦难，一个人的成长如果不通过磨难是很难会有意志，刚一个人用自己的精神战胜自己肉体的时候，那是一次突破，在徒步的路上我看到别人 惊讶地望着我们，我非常骄傲，我们是用脚步在丈量，用脚步在丈量生命的意义，生命总是在双足之间，跨出去，一切思想的指令都是跨出去，我是一个犟脾气的人，我有自己的原则，虽然我的原则是会让人取笑，每个人坚持的不同，我的生命轨迹也是不同的，每个人认为的那种生活就是我想要的吗？</p><p id="source-b-002">并不是，如果我的人生轨迹要跟别人一样，那么我不用活了，因为别人已经帮你活了，这是我的年少轻狂，这却是我的坚持，我害怕有一天我被现实快打败的时候，我不能挺起腰杆，这让人笑话的腰杆，如果生命的状态就是活下去，让人能够穿上漂亮的衣服，可口的菜肴，我想这是没有意义的人生，这是我所鄙夷的人生，而将来我面对的可是生存啊，我所理想的那些东西叫做生活，尽管有一天我失去了所有的东西，我是否会放下我的原则，我是否会苟延残喘，我不，我绝不，人的一生长短并不是代表什么，有的人老去的时候发现自己的一生中没有做过一件让自己回味的事情，没有一件让自己都感动的事情，或者是为了自己一颗年少强狂，原谅我的年少轻狂，我想说现在我说的一切都是不重要的，经历来吧，让我去经历这一切，我生命中的一切可能性，我是一个年轻人不应该被现实给压弯了腰杆，我要有自己的骨气，我有自己想要的生活，我必须去追寻的，我所要的生活我要去争取，我所要实现生命价值我也会去实现，我最要给谁一个交代，我想是我自己，那么再给自己一颗勇敢的心吧，</p><p id="source-b-003">时间匆匆流去，我能留下的就是这些文字，就像是今天，我今天唯一留下的是我接受的知识，还有今天的人生体悟，就是这么多了，我是应该用文字记录下来这些东西，这或者是我以后死去有意义的事情，我不知道自己的岁月给我留下的是什么，我现在无法判断只是写下自己脑袋中的灵感 ，当有一天实现我的梦想，或者我没有了梦想 我回来看看我年轻时候的模样，这也是值得人欣喜的，那个未来的你。</p><p id="source-b-004">十年后的你是什么样的，你心爱的姑娘还在这里吗？除了你的信仰不变之外，除了你还是感到孤独之外，你现在所拥有的一切还是一样吗。十年后 你可能是一个孩子的父亲，我也不知道是男是女，也很有可能成为佛门的一衲子，生命中的一切经历我应该感到欣慰，十年后看到 除了信仰之外 孤独之外 还有什么是没有改变，我现在这个心爱的姑娘 ，或者是我的事业，你身在何处，无常给我带来了一切，变化给我带来了一切，也将夺走我的一切，一切是自然的相信因果，未来的你 我现在的造作成就未来的你，若干年后你是怎么想的。亲爱的梦马悉达多。</p></noscript>
