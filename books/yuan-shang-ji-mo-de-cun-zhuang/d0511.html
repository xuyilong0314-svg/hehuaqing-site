    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>耿耿于怀不如释放</h1><p id="source-date" class="diary-date"><time datetime="2013-03-20" title="原笔记创建日期，不一定等同于落笔时间">2013年3月20日</time></p><p id="source-b-001">今天是不是过于开放了，辩论赛的时候头绪也是极少的，有一次意识到了辩才还是很差的，应变能力也是不好的，这能在辩论赛的时候就能看出来，还有今天的辩论也是胡来，第一场辩论得自以为开放，但却是偏题太多了，事情的发展总是在进行时发现不了问题，只有在结束后才能发现自己的问题，觉得还是有收获的，自己的心理素质能很好地有一个提升，大庭广众之下语言处理得不怎么好，一个句子没能完整地表达出思想，导致了很多时间的浪费，没能好好把握时间这是一个失误，经过了三次的辩论，也是有收获的，在大庭广众之下，我能放得开，这就是我的收获，越来越能适应在别人面前表达自己的想法，这仍然是需要训练的，我组织语言的能力上面还是很不足的，只有在境界中才能明确地知道自己的程度，是否放得够开，我觉得这次我放开了，虽然辩论乱七八糟的，但是把自己想表达的也说出来了，这也是值得赞扬的，给大家带来了许多的笑声，这跟失败没有什么关系了，不管名次怎么样，我的目的已经达到了，这是世界依旧在教导了，教导这个世界所特有，我应该去学习的，每个人都是值得学习的。中说了要有上进心，我意识到自己的无所谓，这真的是对名次没有什么挂碍吗？</p><p id="source-b-002">只是我对于这个名次不重视，并不是我的心是豁达的，对啊，要有进取心，在没有知道结果的时候，是要去争取的要有勇敢斗争的心，这是斗志不想认输的心，不亚于任何人的努力，就这辩论上面我觉得我根本没有去付出什么，得到的名次自然也是这样。我应该要要检讨的，我对这件事的不重视也是不尊重这个事件的本身，自己既然没有全力以赴说明自己是不屑一顾的，而不是对胜利的豁达。在争夺第三名的时候，我已经是没有退路的，那个时候我有紧张感了，内心中不想赢是假的，刚才在那个事情上面我也是能豁达，这也是值得自我赞扬的，做任何事情都不要去抱怨，成功或是失败都是自己创造的。稻盛和夫说要做到不亚于任何人的努力，因上努力，果上随缘，这是自己应该去遵守的一个准则，这个世界多在教你，在塑造自己人格上面一定要努力，应该心怀感激，这一切的教诲，不管是顺境逆境这都是我的善知识，我应该向你们学习。</p><p id="source-b-003">现在咳嗽得厉害，好多天了还没有好，也是自己没有保养好，自己造成的，我明白了咳嗽的时候不能喝咖啡，而且是浓的，喝下去咳嗽得要死，希望明天咳嗽能好，现在跟 77更有默契了，我心里是对她有好感的，但是我觉得现在的关系挺好的，我也不想进一步，感觉没有勇气去说啊，怕被拒绝，自尊心还是很强烈，我这算是遇到了对的人，确实是对的人，我们之间有太多的相同了。云和我昨天晚上的事，我骗他说我有女朋友了，我知道以前自己的借口是害了她，让他一直耿耿于怀，我很惭愧 我知道昨天晚上我的谎言对她造成了伤害，但长痛不如短痛，我认为这是最好的结局了。然而我们一生再有交集的机会很少了吧，她去过她的生活，她还在晋江，我在南平，大学三年后我又何去何从，我不是她想找的那种人，我宁愿现在伤害她，而不是假的慈悲，这次去伤害她，是一个正确的决定，我做了这个决定我不后悔，因为事实是这样的，我们之间并不适合，我们之间的价值观都是很不相同的，以后我很狭隘我一直想要改变她，一直用自己的理由来限制她，我确实是真的对她好吗？我也说不清了。之间的种种都使我们破裂了。</p><p id="source-b-004">无法否认我确实对她是真心的，昨天晚上我不再做一个好人，既然你给不了别人幸福给不了别人想要的那么就果断一点，让别人死心了去过自己想要的生活，否则就是耽误，我耽误了她那么久，我们之间的记忆是在捷龙时候我们一起吃手抓饼，那个手抓饼很好吃，那是美好的回忆，确实是美好的回忆，这段回忆也是存在我的记忆中，在这里我只能说祝福你，祝你幸福我是由衷的，希望你能遇到一个对的人，我还带你去皈依了三宝，善云这是我强加给你的，你什么都不懂我强自给她灌输了，我知道这并没有意义，希望她能对此有亲切感，回忆永远是好的，不要带着恨，感情不再了，回忆还在，感情不在，责备也就不在了。晚上听了王若琳的歌，想起了那段时间在二舅那儿上班的情景，那时候每天骑着单车去上班，每天在骑自行车的时候我都很跟绿化带的树木打招呼，每天都是这样早上晚上都在跟他们打招呼，那时候的心态也是极好的，挺快乐的，最后自己也没有坚持做完一个月，那时候的我跟现在也不一样的，但是我觉得这很美丽，那时候的那种心态，那种欣喜的感觉都存在的。跟这个世界打招呼，即使他们只是草木，虽说他们是无情。</p><p id="source-b-005">为什么我会这么做是因为席慕容的那首诗，为了让你遇见在我最美丽的时候，我也在尝试给身旁的树木打一个招呼，说不定它也是等了我五百年，而我常常都在做自己的事情，常常忽略了外在的风景，生活越来越快，交通工具也是越来越先进，但是太快了却会忽略身旁的美景，不仅仅是看不见了风景，而且快得连灵魂也追赶不上了。先要体会这个世界的真实意义，还是要用最原始的方式，去看最原始的风景，去接触最原始的人，才能去体会这个世界最原始的面目，找回自己最原始的心。找个时间看看自己的日记，我也写了挺多的，看看自己的心路历程，想到这些我举得挺好的，我在做一件很有的事情，用文字记下自己每天发生的事情，写下自己的感受，每天都是崭新的，每一天的日记也都是崭新的。</p></noscript>
