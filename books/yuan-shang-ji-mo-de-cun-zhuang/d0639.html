    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>刍狗</h1><p id="source-date" class="diary-date"><time datetime="2012-11-12" title="原笔记创建日期，不一定等同于落笔时间">2012年11月12日</time></p><p id="source-b-001">天地不仁以万物为刍狗。</p><p id="source-b-002">刚看到这句话 好像是骂人的。</p><p id="source-b-003">原来这是 慈悲平等对待的意思</p><p id="source-b-004">今天读了《无后为大》</p><p id="source-b-005">环保意识和教育意识</p><p id="source-b-006">对我有所启发。更加地加深我我的思想</p><p id="source-b-007">环保今天算是做了，用绳子把坏的水龙头弄好了。</p><p id="source-b-008">书籍真是好东西，总能给你的生活带来点启发。</p><p id="source-b-009">精神食粮真的是重要的！！</p><p id="source-b-010">每天都有收获是最幸福的事情。</p><p id="source-b-011">每天都能对自己的人格完善更是光荣的事情。</p><p id="source-b-012">调服自己比降服千军万马更难！</p><p id="source-b-013">我必须勇往直前！</p></noscript>
