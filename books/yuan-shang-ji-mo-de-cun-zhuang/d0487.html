    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>麦穗</h1><p id="source-date" class="diary-date"><time datetime="2013-04-13" title="原笔记创建日期，不一定等同于落笔时间">2013年4月13日</time></p><p id="source-b-001">心中要有概念，在做一件事情之前一定要有一个时间的概念，时间总是在流逝浪费了就是浪费了，我现在写日记就应该专注于日记上面，我有个毛病就是在写日记的时候总会分心，时间充足的时候我总是会磨蹭，好多次都是拖延到了快 12点的时候才在压榨自己的灵感，但是压榨的灵感写出来的东西肯定是不好的，为了充字数而写的也是不好的，然而我又想了想，我并不想做一个作家，我只是想要写下自己的年岁，攒一笔财富，这笔财富对别人来说意义不大，对我的意义却是巨大的，老年的时候能看一看自己的写的日记，我认为是一件很美好的事情，不空过每一天，我自己在给自己定下一个个目标，一个个计划，我很好地完成。因为自己写日不好看，日记不敢用笔记录，只能用键盘了，这是我的一个硬伤，我何尝不想要自己的字好看，字帖也是买了的，自己却没有坚持下去，在我心中也是认为写在纸上的比较有感觉，而且最方便的也就是用纸写下，用笔记录不用顾忌没有电，或者是在外面旅行，没有电子工具，这是局限性，其实还是一样，渐渐也习惯了这样的方式，电子的方便是毋庸置疑的。</p><p id="source-b-002">就是携带不方便，如果用手机写的话，手机比不上电脑的键盘，保持现状，只要愿意总是可以的，只要愿意总是可以完成的，最糟糕的是自己不愿意去坚持，坚持下去就会看到成果的，我现在写日记跟以前写日记的时候差别也很大，现在用文字表达自己的情感更顺畅了，以前的速度也是没有现在这么快的，现在看到那些日记也是很喜悦，坚持下去竟也写了这么多了，我每一天都在坚持，我也都坚持下来了，不管是在什么地方，日记俨然成为了我的生活方式，规律而产生的力量是巨大的，自然会驱动自己前进的力量，这股力量会帮你排除万难，万难的名字就就是借口。我不会给自己找借口。这是一个好的开头，我还会找一些事情来坚持。我看书少少，真正的才华我是没有，这点我承认，我如果说出一些具有才华的话，也都是在别人的书籍中学到的，我很平凡真的很平凡，而我有时候又很狂傲，觉得自己是对的，其实对吗？我的错的，不说事件的对性，因为事物都有两面性的，我如果先肯定了自己，觉得别人是错的，那么我已经输了，狂妄自大的人是一事无成的，想到自己身上的局限性，并不是说让自己否定自己，学会肯定自己，要谦虚，成熟的麦穗都是垂头而下的，麦穗需要向别人诉说它的成熟吗？</p><p id="source-b-003">并不用，每个人都得到它的饱满，真正有才华的人是默默无闻的，真正有才华的人一定是有灵魂的，真正有才华的人生活必然是简单的，生活在繁琐的世俗纷争中，灵感会被打散的。我觉得自己看书是在炫耀什么，这是我的一个病态心理，刚开始我是在炫耀自己，渐渐不是这么一回事了，我能从书籍看到自己想要的东西，吸取自己的想要的，好像渐渐明白看书是怎么一回事。做人要谦虚，在别人都在出头的时候最好是装作什么都不懂才好。什么都不懂自己也清闲，当众人都没有办法的时候可以挺身而出，这是勇气，凡事不要强出头，要懂得分辨有才能的人很多，福的耐心和责任心一定是比我好的，这一点我需要向他学习，翔的学习比我好，我要向他学习，世超有幽默感人很好相处，炜是一个直率的人，心中的情绪会表达在脸上，林见的世间很多，他身上见到的东西很多都是需要我去学习的，每个人都是有优点让我们去学习的，别人的优点都是很多的，只是我们看不见的罢了。对于看不见的东西如果用否定是有失偏颇的。</p><p id="source-b-004">我身上的缺点很多，没有耐心、容易感到厌烦，学业上面没有上进心，心态出了问题，我很自大，会觉得别人不如自己，别人都是在堕落，只有我是正常的，只有我是对的，还有对别人的看法看得很重，很磨蹭有时候总是在浪费着时间，最重要的是要谦虚，要谦虚，要懂得谦虚，懂得不要轻易地表达出来，不懂得更是应该向别人学习了，太多人胜过我，我需要向每一个人学习，看别人的优点对自己是最有帮助的，一个人如果只会看到别人的缺点，那么他肯定生活得很烦闷，因为没有智慧总是看到不好的影响自己的心态，这就是没有福报的表现。一定要记住每个人都是有可取的地方，要谦虚要学习。</p><p id="source-b-005">现在自己把自己理清，认识到自己的错误，要怎么改正就有一个目标了，有了目标才会有前进的东西，完善自己的人格才不是空话，觉悟就是觉自己，只有自我觉悟才是办法，外界给不了自己快乐的，只有在自己的内心当中寻找一种态度，就是懂得看光明的态度，总是要向自己的内心中寻找自己不快乐的原因，问自己为什么，是不是自己的心总是在烦恼，是不是总是在看别人的缺点，是不是把自己看得太重，认为自己是一个了不起的人，认为自己是一个有个性的人，别人都是凡夫俗子，这种心态是致命的，可以有风格，但一定要具备态度。态度是自己的原则，如果是我，和一个有原则的人相处起来一定会很愉快，会让别人信任你，突然想到了那天上心理课的时候，朋友是否乐意找你帮忙，我的答案是很少，我给别人呈现的是一种什么姿态，这都是能看出来的，我并不介意，我明白自己的内心，这样就够了。每个人都可以是朋友，但知音却是少数的，这样想让很轻松，因为就是这样，萍水相逢就是缘分了，至于缘浅缘薄都好！与这个世界相遇，是我最大的幸运，因为这样才拥有了世界对我的爱，才能遇到你，写着写着想到了 77了。我很轻松，两个独立的人相处起来真是好！不必担心在做我自己的事情时会冷落了她，我们生活还是照常的，多的是生命中多了一个重要的人，生命中多了一个位置，就是有这么一个位置，跟自己联系在一起。我们之间的恋爱我们感到非常轻松，知音也是恋人。</p><p id="source-b-006">要保持一颗学习的心，然后不要浪费时间，在对的时间做对的事情，不必担心有烦恼，接受这个年龄，接受这个年龄段应该有的愚昧，愚昧是在帮助我前行，年轻没有什么不可以的。要有一个态度，态度最重要了 .</p></noscript>
