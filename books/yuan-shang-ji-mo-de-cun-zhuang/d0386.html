    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>倾听故事的人</h1><p id="source-date" class="diary-date"><time datetime="2013-07-23" title="原笔记创建日期，不一定等同于落笔时间">2013年7月23日</time></p><p id="source-b-001">希望值遇一个经历丰富 有故事的人 我愿做一个倾听的人 多少的磨砺的累加 仓含现在是一个怎么样的人 现在的模样是一段经历的铺垫。我们的故事没有重叠 我只是一个学生他已经是一个老板了 生活模式的不一样 我们在火车上 同去五台山上遇到了 妈妈的人生轨迹跟我也是不同 很多故事都是动人的 听了他们的生活经历。他们的奋斗史 我对自己的 前景也会有些许遐想 这些都会是我的题材 那么先做一个会倾听的人 这些都都会成为我笔下的题材 包括是我 发生在我生命中的故事我都想要写下来 这些是我精彩的人生 不管是自己的 或者是别人 因为 存在就是合理的事情 就是有意义的 美好的事情 世间什么不是美好的呢 一切都是那么自然不会重叠 每一片独特的叶子所绽放的光彩是不同的</p><p id="source-b-002">读书做笔记是一件可贵的事情 自己想记下的东西也都记下来了 没想到第一篇恰恰是我看过的了 很可爱的笔触 开篇的第一印象 后来到了外婆的生死 对生死意义的勘破 并不是全部 但是认知是可爱的 很真实 很实在的我 面对那些苦恼之后的看得透彻是我所喜欢的 真实反映新疆那些的生活 她同样爱这片大地爱得深沉 她对这片土地的感情也是如此 书籍就是生活的必需品 我看到火车上看书做笔记的人也是由衷赞叹的</p><p id="source-b-003">突然想到了那些过往的经历 跟仓含认识了好多年了 真的是很好的朋友 之间平时也没有什么交集 但是一相处起来就是这么融洽。这是我们之间的我缘分，也很感谢一个果德师给我们的凝聚力 给我们相处创造一个平台 一路上遇到的都是一些贵人 都是真诚相待的贵人 需要幽默这是为什么一直以来他能成功的因缘。就是一种幽默感 一种随和的与人容易相处的。我们各自是烂道友一直也都是在修行。其实现在习惯写着写着也都是挺好的。</p><p id="source-b-004">今天和下铺的那个聊天了 挺不错的从细节中也是能看出他的从容 从他给女儿拿海苔的动作中 真的很柔和的一个人 这也是学佛人的那种品质 他也是一个专注内心的人 他只会在有缘时候跟你说几句话 这是一种学佛人应该有的姿态 万事万物都是因缘和合的，没有什么事情不是 法是宝贵的布施不应该是轻易的 对你来说有思想的措辞对别人来说可能是毫无意义的，看吧 看自己的智慧。</p><p id="source-b-005">明天就要到太原了明天就能到五台山了 这是自己的朝思暮想吗？原本一直想去拉萨的 好像是自己的梦想 但是又改变了。所以说人是善变的呢 想去的地方都会有所改变 感情也是改变的 原本应该是他父亲的东西应该唤给她的 感情的事没有谁伤害谁的 只有是自己的那种付出 自己认为是否值得 这是一个重点 万事万物什么都是自圆其说的哪里会有什么对或者是错的 只是每个人的角度不一样罢了 佛陀眼里没有什么东西是错误的。一切都是自然圆满的 是心分别而已。</p><p id="source-b-006">心里在想要不要这么让自己停一下。这跟用电脑打字算艰难的吧 算是吧 但是意义是不一样的 已经是坚持那么久的事情了 如果有一天没有坚持会很不习惯 或者是 从新给自己定义一个模式呢。让自己完全是静下来心来写 一个小时。至少是一个小时 都是在自己的独白世界里面， 等朝完五台山就换一种模式。不是为了字数而写 是心中灵感 否则拼凑而来的文字大多是毫无意义的 都是自己措辞的堆积 字数不代表一切 但是先前的字数是自己给自己的一个信心 是自己的一个沉积这是必要的 那么开始真正的地写 不是为了一个目标 是为了 更能贴近自己生活本身 生命的含义。内心中沉淀的是日积月累的 每一天都会发发牢骚 对今天的看法发表一些看法，这是意义给分的事情 每天都很好地纪录下来。</p><p id="source-b-007">一切与字数无关 不由得要说 ihone的系统真的好。流畅度也是不一样的 感谢舅舅的馈赠 这都是生命中的贵人 感谢生命中给我帮助的人 曾经的 现在扥一切的 到五台山做一个尼玛堆 但愿一切美好。明天一切顺利在火车上就是吃吃睡睡 看书 手机 聊天 车程很快就过了 感谢一切。感谢万物</p></noscript>
