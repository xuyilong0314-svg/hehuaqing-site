    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>收拾残局</h1><p id="source-date" class="diary-date"><time datetime="2013-03-15" title="原笔记创建日期，不一定等同于落笔时间">2013年3月15日</time></p><p id="source-b-001">昨天晚上的标题是恪守戒律，今天贪嗔痴就上来，欲望就驱使了我，今天下午的种种都是控制不了自己，淫欲这种东西还是很难，确实很难，身临其境时，自己控制不了自己，还好在最后的关头有醒悟过来，这算是犯戒吧？我很惭愧。我只有在日记的时候灵魂才会浮现，才能认识自己，知道自己的位置，为什么就不能把写日记的时候扩张生活？常常不能严格自己，任由灵魂随意飘，自己的意志漂浮不定，然后就陷入了贪嗔痴的漩涡中，财色名食睡我样样具足，我还有什么好说的？我常常都在给自己收拾残局，现在在收拾下午的残局，现在在收拾以前的残局，而我在创造未来的残局。世上没有圆满的事情，只求问心无愧，你能问心无愧吗？相信在现在你是清醒的，现在你可能有万般的惭愧，但这已经是残局了，收拾残局或许有一定的转机，但是在你建立的一个个种子，已经是种下了，你总是在用贪嗔痴的水浇灌，这是相续的，一直都是在你的阿赖耶识里面，等到有一天它会发芽，你真的很可恶，每天都是这样，只有在这个时刻，你才明白自己干了什么，你现在想到的是要好好看书，然而今天一天是很空闲的，你又是在干什么呢？一天的无所事事！</p><p id="source-b-002">你的方向搞错了，知道自己自己知识很浅薄还不多去学习，你不是一直要培养看书的习惯，真的不能这样，一天下来你都是这样的状态，当我无法觉悟的时候我要杜绝这一切，让我的心灵静下来，很久没有这样的感受了，不要总是责备他，他是无辜的，超速而发生车祸，你能说着是车的错误吗？这是开车人的想法错了，这是我错了，而不能怪这个身体，好吗？每天都在反省，希望你能改正，而不是每天都在反反复复收拾残局，好不好啊？</p><p id="source-b-003">除非你是我，才可以与我常在，除非你是我，才可以与我昼夜常在。这句话说得真对，不管再亲密，都是有属于自己的空间，不说别的，睡觉的时候总是不能在一起的，灵魂只能独行，但灵魂可以共鸣，可以吸引。然后灵魂还是独立的，灵魂需要空间，真理是需要从自己的身上挖掘，每个人的真理都不一样，但终究是一样是清静的，被污染的人就是一不小心让心中的魔鬼占据，比如说下午的我，我不能自我。那时候我是毫无真理可言，那时候我只是一个动物，只有感性的一面，冷静不下来，这是污染自己内心的行为，因为行为的累加，一切都是在你下一刻或者是未来，这一切都是在做准备，就好像我现在严格要求自己，形成了一种相许的力量，那我就能认识到我自己，从而控制自己，控制自己的念头，才能随缘不变，不管外在的环境是怎么样的，内心始终是充满祥和充满智慧，我还不能做到像这样，我趋向于，迈向生命的圆满，我会好好地做，把在写日记时候的状态带到生活的状态中去，要给自己留一个空间，要与自己相处要与自己常在。你会发现你要的是什么东西，你的心不会飘摇不懂，你不会无聊不会浮躁，怎么选择都是看你。</p><p id="source-b-004">我现在躁动不安，整个人的状态很不好，头有一点晕晕的，真的不想动，也不想写日记，但是无可奈何的是答应了自己，应该要付诸行动，我现在唯一坚持最久的就是写日记，如果我连这都不能每天坚持的话我还能坚持些什么，写日记的时候就是胡说八道，也不知道自己写些什么，不知道以后的后人看到了我的一生会不会笑了，怎么会那么差劲阿，我现在如实把这一切写下来，这能还原一个真实的自我，也是给自己看的，会看到自己的改变，看到自己的人生轨迹，我在做一件非常有意义的事情就是写日记了，我每天都能把一天发生的点点滴滴用文字记录下来，只有印象笔记不出现问题，做印象笔记的客户也有一段时间了，变化真的很多，文字果然是越写越有东西，尽管这是在胡扯，但总归是能扯写东西出来，这是对我有用的，</p><p id="source-b-005">整天都在责备自己，真的挺有趣的，每天都有点什么事情让我说，然后就是一堆的因果，然后就是一堆要怎么改正之类的。然后每天至少都会扯一些文字，扯到 2000字才会罢休，该选个时间吧文字到 2500字，胡扯写出这些并不是什么难度，发发牢骚都是可以写的，写一些自己看的东西还是客观，因为没有什么理由包庇自己，先从认识自己开始，然后知道自己想要的是什么，改正自己完善自己。</p><p id="source-b-006">我是一个非常容易厌烦的一个人，对待感情也是这样的， 77跟我很多兴趣爱好都是一样的，这些条件表明了我应该去追求她，因为有共同的话题，这是非常适合当夫妻的，能找到跟你有共同点的人是不容易的，确实不容易，要有一个同样的兴趣都是少的，就像打篮球有那种热爱的也只有李明跟我一样，阅读的习惯也只有我才有，总之我非常有福报又能找到，而且这个人是我以前初中时候，纯纯的爱倾慕的对象，我记得那个时候我想要买个戒指送给她，那个时候我很不好意思，跟我现在差不多吧，现在的我好像很摒弃这种感情，或者是怕了，我很害怕束缚，我害怕没话说的尴尬，这是在重视被人的前提下，而现在 77就是这样，我也说不清自己对爱情的观念，我就是这样的一个人，而 77应该也是一个热爱自由的人，</p><p id="source-b-007">我觉得恋人之间是没有必要经常腻在一起，耐得住寂寞的感情才是永久的，如果把爱情当做是唯一，摒弃太多，这实在非常可惜，除了爱情比如说你还可以有阅读，运动，或者你的一些兴趣爱好，不要把爱情当做世界的全部，这样很伤，很伤的，前面我也是说过，除非你是我才能与我常在，这显然是不可能，难道没有听过同床异梦？能走向长远的爱情是有共同的价值理念，兴趣爱好，以及自由的空间。是包容，从上一段的感情经历中，我和云是两个截然不同的，我喜欢无拘束的状态，而我又总是忘记打电话之类，我觉得我们之所以吵架是因为她觉得我不够重视她，然而这大错特错，除非你是我，才可以与我常在，感情之间的度衡量错误了，悲剧就产生了。</p></noscript>
