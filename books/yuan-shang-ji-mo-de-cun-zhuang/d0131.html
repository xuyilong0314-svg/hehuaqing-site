    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>青春朦胧</h1><p id="source-date" class="diary-date"><time datetime="2014-08-26" title="原笔记创建日期，不一定等同于落笔时间">2014年8月26日</time></p><p id="source-b-001">青春很朦胧。</p><p id="source-b-002">而我呢青春总有爱情身影 我害怕束缚 害怕爱情 因为我很喜欢的是独处的时间，灵魂是孤独的，灵魂只能独行 确实是这样一天也没什么惊奇的平平淡淡的， 早上去了讲堂 吃了个午饭 然后就回来了 下午本来是在看书的 睡着了 晚上和干妈去了宝龙吃饭现在跟妈妈的关系比较好了一些 她最近的状态总不是 那么地好 我应该要好好体谅他才对我不喜欢多余的应酬 现在很困很累阿</p></noscript>
