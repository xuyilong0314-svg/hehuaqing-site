    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>我终于可以嘲笑自己。</h1><p id="source-date" class="diary-date"><time datetime="2013-01-24" title="原笔记创建日期，不一定等同于落笔时间">2013年1月24日</time></p><p id="source-b-001">为什么会说终于可以嘲笑自己，想到这个的时候是在回来的这几天，在学校的时候我经常性地会去嘲笑，我并没有说出来，但是我的心里是轻蔑地，我看不起无所事事的人，你觉得你是一个看书阅读的人，你是不是觉得你高人一等？我为你感到羞愧，真的是羞愧，因为我看到了你回来的这几天你的生活，每天晚上很晚睡觉，为什么会那么晚？很多时间都是浪费，不是玩玩游戏就是看看一些没有营养的东西，还搜索了 H内容的网址，并在那天晚上看到了两点多，然后隔天的早上一直沉迷其中，还到厕所手淫，昨晚也说过，我原谅你。现在说的主要是之前轻蔑地态度，看不起人的态度，使我为你备受羞愧，你在那个环境你可能是好的，但是在家中这种轻松的环境中，你渐渐没有了时间的观念，渐渐地无所事事，在看书阅读上面更是一败涂地，一本书看了极久并没有耐心地看。 我名正言顺地嘲笑你，相信你无话可说，问题所在是你的态度，对别人轻视的态度，自以为是的态度，看看你自己，先认识你自己把。看了小王子，小王子一书中，我最为触动的是在每一个星球遇见的大人，是多么无趣，永远都为这无趣的事情忙碌，我不敢想象如果我失去了赤子之心，我失去了童心，爱，我会成为什么样子，是不是变成了当初我最反对的那种人，渐渐向现实社会沉浮呢？</p><p id="source-b-002">别怕，有我在，我会在你身边，拉你一把，你有佛陀，你有信仰，你应该要有信心的，你不能怕，不随波逐流是要付出代价，但是相信你不怕的，在你的内心中你已经做好了准备，做好了要接受苦难的决心，我在重申一次，别怕有我在，我是远，我在远方的远又时时在你身边，看了很多人的书，所有人的思想都是在苦难之下成长升华的，没有经历的人是永远不知道的，现在我对你有一个劝告，你少说话，因为有我在。你现在需要多沉淀，多看看别人的经历，学习别人遇到苦难时候的坚强，我们共同成长，你会成就我，灵与肉我们是在一起的，你成就我，我也成就你。即使我会抛下你，但是你成就我本身是比我本身更伟大的，我需要在你身上学习的有很多，你在这个世界中所遇到的，你所接触的，不管是你的欲望也好，谢谢你，是你提供我肉体，让我能在求佛道的路上能走得动，走得远，希望你要保持健康，我不会再晚睡，这样对你是不好的，对你是一种伤害。</p><p id="source-b-003">感谢你，我的欲望使你受了伤，我还时常怪你，甚至是折磨你。我们是共存的希望你能原谅我，一路以来谢谢你的成就，何华清。谢谢你在没有人的时候我就遇见了你，灵与肉，你是何华清，我是远。别人赞美的是你，并不是我，你也并不属于我，我们的相遇是一种缘分，我常常因为你的关系，在面子、在相貌、很多很多关于你的，只关于你的，我常常因为这些使我自己烦恼，我真是愚蠢，但是你别担心，我会庄严你自己，因为我们是相互的，我不会让你寒碜的。至今为止我才发现了我自己，华清，你的肉体在环境的一切反应，我都收的到，我用之衍生出了智慧，感谢。我知道，其实你是不得已的，很多事情都是由我做主，但是我常常都伤害你，比如说不注意健康，不管是生理还是心理的，生理上面会使你生病，心理上面使你加剧。抱歉，这一切都是我造成的，虽然我无法阻止你的衰老，因为这样，因为无常，我才得以悟道。谢谢你的成就，第一课我需要包容你，本身也就是包容自己，我会小心的，我会约束自己的行为。我的道路是需要你来成就的，你给我带来的痛苦，你的一切反应都我用来练心的，我已经不是我了，你是何华清，而我是远。你是注定有生灭的，尘归尘土归土是你的命运，而我要开发自己的内在宝藏。因为有你，别人不管是讥笑、赞扬、侮辱，都是你。</p><p id="source-b-004">从此我不会在意，好比我们看一片叶子，凡夫还是有分别的，但是这是无法避免的，包括佛陀也是。谢谢一直以来你的成就。 你是我的知音，第一个知音，虽然你不会说话，直到有一天，有人能透过你看到我。那么那个人就是知音。</p><p id="source-b-005">我的感觉又回来了，宁静的心又回来了，丝毫不为所动。与自己对表白，虽然你是你，我是我，但是我们还是一体的，我们互相扶持。同求佛道，下化众生。 事物的本质眼睛是看不到的。20岁才找到自己，有点迟，但是为时不晚，在我人生刚开始的时候认识到自己，认识到你。 感恩，感恩，感恩！ 如果有一天，有个人能透过“我”看到我，那么这个人就是知音。 如果有一天，你能通过“自己”看到自己，那么这个人就是自己。</p></noscript>
