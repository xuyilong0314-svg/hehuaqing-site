    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>过了那个年纪 会想哭</h1><p id="source-date" class="diary-date"><time datetime="2013-08-02" title="原笔记创建日期，不一定等同于落笔时间">2013年8月2日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">那时候有古老的房子，一代代人都居住的古老房子上有一片银河，这是我父亲眼里的，而我的眼里呢，我开始懂得数星星，那时候已经有电风扇。我们可以不用拿竹席去屋顶睡觉了，我错过了那个数星星的年纪，之后我看不到星星了，那时候我家里一年小山，还有一个湖泊，那是我开始可以漫山遍野地跑，那时候开始计划生育了，家里是独生子，倍加呵护 太多羁绊，我错过了满山遍野跑动的年纪，那时候我的门前不再有湖泊，只有公路，小溪是肮脏没有流动的小鱼时候，我错过了我的童年，我的童年是安静的一个童年，妈妈说我很少会哭，包括是孩提时候，我醒了不会哭 我只会静静地躺着、到了我可以走路的时候，如果我醒了，想找妈妈了，我自己会范霞床，我的童年是安静的。为什么写到这里会想哭，是祭奠我逝去的童年吗？</p></noscript>
