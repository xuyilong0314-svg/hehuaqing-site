    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>寂寞原</h1><p id="source-date" class="diary-date"><time datetime="2014-10-03" title="原笔记创建日期，不一定等同于落笔时间">2014年10月3日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001" class="diary-verse">迷宫.</p><p id="source-b-002" class="diary-verse">在寂寞原上</p><p id="source-b-003" class="diary-verse">只有一个村庄</p><p id="source-b-004" class="diary-verse">唯一的村长</p><p id="source-b-005" class="diary-verse">还有一些旅人</p><p id="source-b-006" class="diary-verse">人群是流动的</p><p id="source-b-007" class="diary-verse">像荒漠的细沙</p><p id="source-b-008" class="diary-verse">他们不曾停留</p><p id="source-b-009" class="diary-verse">村庄上</p><p id="source-b-010" class="diary-verse">一砖一瓦</p><p id="source-b-011" class="diary-verse">一沙一砾</p><p id="source-b-012" class="diary-verse">都由旅人搭建</p><p id="source-b-013" class="diary-verse">把有关旅行的</p><p id="source-b-014" class="diary-verse">关于远方的</p><p id="source-b-015" class="diary-verse">理想</p><p id="source-b-016" class="diary-verse">光</p><p id="source-b-017" class="diary-verse">把一切都刻在砖瓦</p><p id="source-b-018" class="diary-verse">用世界各地的土壤</p><p id="source-b-019" class="diary-verse">堆砌而上</p><p id="source-b-020" class="diary-verse">如生命铜锣的哼唧</p></noscript>
