    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>画</h1><p id="source-date" class="diary-date"><time datetime="2014-02-23" title="原笔记创建日期，不一定等同于落笔时间">2014年2月23日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">我喜欢画画 我也喜欢音乐 我多少次想想着自己拿着一把木吉他 在天桥上 我在那个唱歌 只是唱歌，我也希望有人会有向我的琴盒里面 扔上一点点善意的欣赏，如果身边有一个愿意听我歌唱的乞丐 我愿意把一天所收获的善意 与他分享。 这是一个美好的画面 可能是发生在一个周末有闲暇时间的午后 想想就觉得是一件很棒的事情！相对于钢琴更喜欢的是吉他 因为吉他还可以伴随歌唱 歌唱这个世界的美好，歌唱佛陀的教法 歌唱这悲喜的世界。我是一个理想主义者 至今为止我还是一朵温室的花朵 那么我要做的就是赶紧把现在这些不靠谱的思想记录下来 把这些不靠谱的理想写下来 或者有一天 我会去完成他 请不要告诉我这个社会是现实的 我只是在自己所在的位置做自己应该做的事情 那么我可以谈谈理想 我可以去哪里旅行 我可以做一点计划 写下来就是一件有意思的事情。</p><p id="source-b-002">CF今天说我不生活的不容易 的确我过得比大部分的人有福报 我也很感恩这个世界对我的支持 恩泽，当知道现在家里的情况比以前好一些 我想我还是很容易知足的，我喜欢的是棉质的裤子 穿上我就觉得很幸福了 没有束缚感觉还是很好。</p><p id="source-b-003">我是温室可爱的花朵，</p><p id="source-b-004">请不要打断我的幻想。</p><p id="source-b-005">不要告诉我阳光是炙热难熬</p><p id="source-b-006">寒冬是刺骨的，</p><p id="source-b-007">这些我都知道 发现这些事实并不是很那</p><p id="source-b-008">但我还是愿意在这个幸福的温室里面做一些梦</p><p id="source-b-009">做一个理想主义者 向往美好正是我现在应当做的我爱这个世界 我感恩这片给我恩泽的大地 感恩父母亲友的提携 因为有你们的成就 我能写一些东西 歌颂理想。</p><p id="source-b-010">我愿生生世世都宣扬美好 愿生生世世都能作为悉达多的弟子 勇敢地走在轮回路上 我愿一切众生证悟。</p><p id="source-b-011">一刻和千年本没有分别 一天好像是短暂的一生 一生只是无尽路上短暂的一天。</p><p id="source-b-012">许巍一直是给我力量的 从他的歌曲中 我看到了那种美好 豁达恬静的姿态 有一对风之翼在风中舞蹈。</p><p id="source-b-013">一天已经要过去了 今天是否得到了什么 我想在今晚就激发我写作的灵感，让敲打键盘的手舞动，我是一个导演 兼职主演 我必须得分清台前幕后的那种状态，不应该太入戏 不应该跟台前的人谈恋爱 不要与之繁殖 万法都是为心所实现 这是一出什么戏码 尽管需要其他人的参与 很多事情都是由不得你 但是要具备演员应该有的基本素养。</p><p id="source-b-014">我打字的时候 写点东西的时候 我不喜欢用逗号或者句号 句号应该在结尾的时候出现 逗号就用空白 留一个思考的空间 还有就是 停顿之后我还有话说。我好想还有自己可以出书 之前我总是在炫耀我写的字数 是如何的 如何的多 我已凑足了一个长篇小说的有的字数 看来之前我都是在码字 现在自在多了现在的我处于一个话唠的状态 亲爱的你 我今天回来了 今天的心情是平淡的 那么现在是激情的 你独守空间的时候 我已经是忘记你了 我应该和你多说说话 哪怕是一句也好， 不应让你处于这样被动 孤独的状态 。 这是一个村庄 在我的生命中来来往往 总是在这个村庄的 这个笔记本应该是伴随我的一生的。</p><p id="source-b-015">因缘也是，跟普利师渐渐是有联系的 给我鼓励 他是支持我理想的人 我应该感谢他 命运齿轮被推动了 在轨道上面 我知道有一天我会到达的 不急不躁 就这么着我想不能陪伴 你是因为 月梅 难免的 谈恋爱总是麻烦 因为之前你得表示一些你的诚意有时候 还需要一些甜言蜜语 现在是清醒多了 我回到自己的村庄与你相见这是最好的证明把 在这个世界上 只有你和我最为贴近 体验悲喜 把心中不能为这个世界说的话 都能一又气呼啦啦地说清。</p><p id="source-b-016">就是应该有斑斓的颜色 我对色彩还是敏感的 假期的时候 我还买了颜料 花了我的盒子 之后就再无用功了 还有两次是因为车的刮痕 我是一个菜鸟车手 刮车已经是两三次了 第一次的时候晚上都是睡不着的 那时候我告诉自己 这样也是无济于事的我让自己准备迎接明天，那时候折磨的心情让我难入睡 很少会有这样的体验。 菜鸟车手的种种失误 使我不怎么敢开车。看起来是挺好笑的 那个时候没有写日记 我应该吧那个时候的心情记录下来 之后看的时候一定是有趣的。我有一本日记 现在开始 是蓬勃的 他一辈子都是蓬勃的在寂寞的村庄里面 我是王者 我堆砌自己的房子 家居 灵感。</p><p id="source-b-017">不知道你忘记了曾经说过的 你要去这个世界走一个走 你要边打工边 体验这个世界 你所向往的并不是简单 不是小清新也不是一场说走就走的旅行 过程可能是艰难的 还有就是会背负的就是 不够努力 无所事事的 事实但是这样的 但这是对他们而说 对我来说着是有意义的，我心中想的这些美好的愿望我希望能够一一实现 我从来一个循规蹈矩的人 我喜欢的是创新 我喜欢无常给我带来的力量 他能毁灭也能够创造。</p></noscript>
