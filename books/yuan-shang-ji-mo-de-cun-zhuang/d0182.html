    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>你好陌生人</h1><p id="source-date" class="diary-date"><time datetime="2014-06-05" title="原笔记创建日期，不一定等同于落笔时间">2014年6月5日</time></p><p id="source-b-001">你好陌生人</p><p id="source-b-002">我正在叙述一段经历</p><p id="source-b-003">是夜</p><p id="source-b-004">等待朋友</p><p id="source-b-005">在路边看到</p><p id="source-b-006">唱歌为生的仨</p><p id="source-b-007">腿部有某些缺陷</p><p id="source-b-008">上前</p><p id="source-b-009">我与坐一旁的一个三十几岁的男子</p><p id="source-b-010">梦说:你们三个人是一起的吗</p><p id="source-b-011">小吴:是的</p><p id="source-b-012">梦:你们以此为生吗</p><p id="source-b-013">吴:是的</p><p id="source-b-014">梦:你们这样一天大概能够赚多少的钱？</p><p id="source-b-015">吴:存不了钱。</p><p id="source-b-016">吴:你是做什么的？</p><p id="source-b-017">梦:我是学生，学树木的。</p><p id="source-b-018">梦:你们做这样的工作多久了</p><p id="source-b-019">吴:说不上多久，怎么说呢？</p><p id="source-b-020">梦:已经很久了是吧。</p><p id="source-b-021">梦:你们以前也是这样的吗？三个人一起</p><p id="source-b-022">吴:我们以前有团队</p><p id="source-b-023">梦:那么现在呢？</p><p id="source-b-024">吴:脱离出来比较自由一些。</p><p id="source-b-025">梦:一路走来有什么感受呢？</p><p id="source-b-026">吴:谈不上什么感觉，已经麻木了</p><p id="source-b-027">梦:很辛苦吧，我知道这一切很不容易</p><p id="source-b-028">吴:......</p><p id="source-b-029">何:你现在只有三个朋友了吧，除了你们三有和别人聊过天吗？</p><p id="source-b-030">吴:没有了。</p><p id="source-b-031">吴:你很喜欢跟陌生人聊天吗？</p><p id="source-b-032">梦:我不怕生</p><p id="source-b-033">吴:你没有朋友吗？</p><p id="source-b-034">梦:我有朋友，我正在等朋友。</p><p id="source-b-035">梦:你怎么称呼？</p><p id="source-b-036">吴:我姓吴</p><p id="source-b-037">梦:我姓何</p><p id="source-b-038">吴:你可以跟我说你们怎么看待我们的吗？</p><p id="source-b-039">梦:不偷不抢什么样的工作都很好，我对待你跟对待别的人一样，没有什么差别，每个人都苦处。</p><p id="source-b-040">吴:.... (他把手放在我的肩膀，我也用手 放在他的手上，我能感受到得到他的温热)</p><p id="source-b-041">梦:很抱歉，我没有能力去帮 ....</p><p id="source-b-042">吴:有心就好了。</p><p id="source-b-043">梦:你现在生活就是生存是吗？</p><p id="source-b-044">吴:恩</p><p id="source-b-045">何:我朋友来了，祝你好运(我拍拍他的肩膀)</p><p id="source-b-046">当有一天生活变成了生存，你会感到麻木绝望吗？</p><p id="source-b-047">他们的故事以不同的故事演绎在很多人身上。</p><p id="source-b-048">迷失生活本来意义的人，生活演变成苦苦追求，成了一潭死水。</p><p id="source-b-049">多少的人麻木着？ 是你，是我？</p><p id="source-b-050">你觉得这一切离你很远吗？ 并不</p><p id="source-b-051">我原本的想法是等朋友期间借他们的麦克风唱一首歌的。</p><p id="source-b-052">我觉得总有一些人在提醒，我已经是那么幸运的人了，更应该要保持觉醒。</p><p id="source-b-053">祝他们好运。</p></noscript>
