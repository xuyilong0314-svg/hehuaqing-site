    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>感恩一切恶</h1><p id="source-date" class="diary-date"><time datetime="2013-04-10" title="原笔记创建日期，不一定等同于落笔时间">2013年4月10日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">今天发生最让我印象深刻的事情是，上土壤课的时候我上厕所没有跟老师说一声，就走出去。然而老师自然会责备我了，刚开始我的心态很不好，后来赶紧调整回来，认识到自己的错误，确实我这是没有尊重他，然后我又跟同学解释，我说了谎，谎言总是在那种时刻进行，不知不觉又顺理成章，自己也没有意识到自己在妄语了。要改正自己的态度，调伏自我，把我去掉什么都不剩下，就是无欲则刚，世上没有什么东西能拿我有办法，包括生死，我都无所畏惧，但是要把我去除，当把我去除那就是觉悟了，也是开始新的路程，每一天都是全新的，不管今天再怎么不顺我意，这一切都过去了，明天又是崭新的，我的人生才刚刚开始，明天争取做地比今天好，态度上要有改变，对这个世界的态度，对每个人的态度，面对自己的态度，都必须要全新的，每一刻都是全新的自己，我现在有所觉悟，现在我就是一个觉得人，不圆满是因为不能坚持，当下是最重要的，坚持每一个人当下人生肯定是光明的。专注于当下的人是不用畏惧自己的未来的，也不会追悔于过去。我现在还只是懂得活下当下，过去心不可得，现在心不可得，未来心不可得，什么都是不可得的，连当下都是不能执着的，这句话的领悟我几乎是没有，我还差得很远，又是近在咫尺的。佛在灵山莫远求，人人都有座灵山塔，向自己的内心去修行，不造作今天的过患，对！我又是新生的，如果时时刻刻都保持这样的心态，一直都安住于善所缘这样才是真正有境界，修行的人！</p><p class="diary-omission">〔中略〕</p><p id="source-b-002">来吧！来吧，给我一点刺激，一部分是精神世界，一部分是现实世界，给我来点痛苦把，给我来点磨难，我会越来越坚强，我的人格会越来越完善，我会懂得生活，人生没有几个大起大落是不能有所领悟的，这些领悟是任何人夺不走的，领悟可以分享，但是不能给及，这世间什么都是可以毁灭的，只有我的领悟是不毁灭的，是永恒的，因为现在我明明确确地生在在这片大地上，有一天我会枯萎，但是我的精神还是在这个虚空中，延续着带着自己的领悟继续去领悟，原上寂寞的村庄会越来越精彩，也会越来越平静。</p><p id="source-b-003">精彩的人生和平静的人生不冲突的，前者是别人看来是精彩的，后者是别人看似精彩但内心很平实，一切无碍。当有一天不要什么局限，什么都不要，什么都要，我是这片大地的儿子，我有义务为这片大地做点什么，散发我的磁场，现在我的磁场希望散发到虚空中，给那些内心有畏惧的人带来希望，我能给世界带来希望，也能给自己带来希望。 感恩所有，感恩一切恶！！</p></noscript>
