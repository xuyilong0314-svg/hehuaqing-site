    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>你能说他不解风情吗？</h1><p id="source-date" class="diary-date"><time datetime="2012-11-07" title="原笔记创建日期，不一定等同于落笔时间">2012年11月7日</time></p><p id="source-b-001">你。你能说他不解风情吗？</p><p id="source-b-002">我。我跟更愿意把20元的话费省下，</p><p id="source-b-003">买一本情诗，在与你面对面的同时，</p><p id="source-b-004">表达对你的爱意。</p><p id="source-b-005">说，小别胜新婚。</p><p id="source-b-006">我跟乐于把这爱慕之情表达得更浓烈。</p><p id="source-b-007">因为珍贵。</p><p id="source-b-008">对的，少，就会觉得珍贵。</p><p id="source-b-009">连一个声音，都觉得动听。一句细语，都会觉得浪漫。</p><p id="source-b-010">空间的距离，是考验一段缘分最准确的尺。</p><p id="source-b-011">耐得住寂寞。就守得住繁华。</p><p id="source-b-012">呵，我的爱人，我在呢喃。拿什么献给你。</p><p id="source-b-013">我的情诗，你的情郎.</p></noscript>
