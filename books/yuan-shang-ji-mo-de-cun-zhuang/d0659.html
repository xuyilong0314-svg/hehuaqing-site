    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>圆满结束，我的第一次主持。</h1><p id="source-date" class="diary-date"><time datetime="2012-10-21" title="原笔记创建日期，不一定等同于落笔时间">2012年10月21日</time></p><p id="source-b-001">第一次的素质训练会，圆满地结束了。</p><p id="source-b-002">准备不够充分，尴尬的开场白，以后这种错误不要再犯了，两人配合不够默契。</p><p id="source-b-003">错误中学进步，失败中求成长。</p><p id="source-b-004">明天又一次地主持，看临场发挥了。</p><p id="source-b-005">还有，今天没让你等待，不让你独守空房，等那分难熬的长夜。</p></noscript>
