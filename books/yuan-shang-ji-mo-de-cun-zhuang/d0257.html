    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>YiMeng</h1><p id="source-date" class="diary-date"><time datetime="2014-03-16" title="原笔记创建日期，不一定等同于落笔时间">2014年3月16日</time></p><p id="source-b-001">如果这个平台能够给很多人 支持，那么有愿意去做，如果只剩下一个人 我都可以继续做下去，不要因为现在的一时 激情 你要明确你的发心 说出你此刻的发心，为了做一个自媒体 为了传播一切对这些事物有帮助的内容，传播善知识。那么给自己的订阅号订下好的内容。</p><p id="source-b-002">1.一味佛法</p><p id="source-b-003">2.一纸文学</p><p id="source-b-004">3.一书传记</p><p id="source-b-005">4.</p><p id="source-b-006">晚上应该就要把这构思 出来 如果内容是一样的 那么设计起到了决定性的作用。</p><p id="source-b-007">今天是否在觉知的状态下生活得很好 发现种种行为还是在颠沛流离 心一样不知所踪。</p><p id="source-b-008">今天与一封聊了聊 最初的还是最好的 他现在的位置跟我是不一样的。</p><p id="source-b-009">但是心是一样的 像我们这样 心的距离也是少的 我们彼此能够互相提醒着 这是最好的友谊了我 应该上去打坐 然后我的英语没有如实地背诵 还有法华经 我在背什么就那么一点点 记忆力现在真的很差劲。</p></noscript>
