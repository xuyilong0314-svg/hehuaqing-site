    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>梦马在欲望中表里不一</h1><p id="source-date" class="diary-date"><time datetime="2013-07-20" title="原笔记创建日期，不一定等同于落笔时间">2013年7月20日</time></p><p id="source-b-001">时间总在流转，命运的长河总是无法停下，生命的流逝在刹那间 不管是谁都无法去躲避，我要感叹的是时间太快了，让我猝不及防，心一直都在流浪，总会发出一声叹息，用手机写日记完全没有灵感，只能是拼凑，我把日记当成一种每日必须完成，这成为了我每日的牵挂，就像是现在我在姑姑家，我必须早点写出来，就是一直写下去我的生命另外的一个呈现，作为一个的人，我与各色人种不期而遇，我在与每一个人重叠，多数人重叠在一起，我想走一条自己的路，我要选择自己的来路，我亏欠别人的东西有很多，我是一个贪心的人，我还是让 2舅给我买了手机，我的控制力只是表现在我没有欲望的时候，我不知道自己的，妈妈说我的是对的，我是一个表里不一的人，我嘴上说的跟实际行为是相违背的，我背叛了自己的灵魂，当时真的，我很难堪我不知道为自己辩解什么，我认识到了自己的错误，我现在还是在纠结自己的问题，因为手机的问题我的烦恼是增加了 我还没有得到就失去了，这是我的贪心我的贪念，当我不知所终的时候我就是陷入自己的泥泞之中，我陷入自己的漩涡之中我感到快乐了吗？</p><p id="source-b-002">我并不感到快乐，手机买来就是坏的，我又为手机的损坏在忧愁我在想解决的办法 我浪费了好多的时间，我是一个装可怜的人，我的确是一个可怜的人，在别人眼里我是一个怎样的人，在阿妈的口中已经表现出来我 我是一个嘴上高尚，行为卑贱的人，这些我并不会发表出来，这是我要自己看的，我并不是在赌气 我也没有必要去赌气，因为我就是具备这样的品质，你进故事考验一个人修行的成果，我心中明明不想要的，但我却被诱惑了，昨天晚上也是这样子，现在我换来的是一个坏的手机，我明天就要过去换，明天我生命的轨迹又不一样了，我不知道会遇到是样的人了，我会与谁不期而遇，这是我的人生，我心中并不是全部这样想 什么也都不要说了，</p><p id="source-b-003">作为一个卑微的人让自己降低了人格也让父母没面子了，因为一把手机鄙夷自己的灵魂是不好受的，我心中爱他美丽怎么能嘴上说四大皆空呢，心中的欲望原来一直都隐藏着，我因阿妈的惭愧而惭愧 这让我很受伤也让我阿妈很难过 这是一个双方都很难堪的一个局面，啊妈不可能不让去买，我其实也是不愿意去买的， 2舅已经要来载我了，因为不小心我多此一举 我要多跑一趟，晚上是不顺利的一个晚上，不明所以的我只能默默地，呵呵，晚上的一切都有点糟糕，啊妈最近的心情也是不好 我也很浮躁，家里充斥着一股不安的情绪，我知道化解的源头是来自于我，我应该让自己保持一个好的心态，我现在的心是不平静的，我因为一个把手机大悲大喜，这是手机带给我的，原本要拿手机起来使用，但竟然买到了一个劣质的产品，不顺利是理所当然的，这一切有违我的心 违背了自己的心 也让阿妈难堪，很多事情都不去想的话我会很快乐，但是人就是顾忌太多，把自己变成一个复杂的人，我又发现了自己的一个缺点，有的东西一直都是存在的 好坏都是存在的，很多事情多无可厚非的是让人悲伤，我现在就处于一种很尴尬的状态，</p><p id="source-b-004">明天就要五台山了，我没有一种兴奋的感觉，因为今天晚上的事情我希望阿妈不要跟我计较，尽管我已经是犯错误的人，然后车也是少开为妙，家里只是一个打工的家庭我不是富二代我不应该有富二代的生活，家里给我的一切都是那么美好的，我的一切亲人都是为我付出来了那么多，我要尽自己的努力去好好报答，内心中的困扰无从诉说也无从说起，我跟阿妈有代沟 我只是需要一个倾听的人，我现在连是一个沙门都不是，还不是那个声色犬马的悉达多，我只是刚刚开始，愿我的明天是美好的一天，明天一切都很顺利，都能吉祥祈愿五台山的旅途能顺利，做一个乐观的人不管身边的环境怎么样，我都要微笑我要保持乐观 我不是一个晒伤口的人，我只会在夜里自己慢慢地舔着，我学会了孤独我学会自我自愈，逐渐我变得强大起来，现在所遇到的困扰 当下这一刻就是永恒，没有什么了不得的东西，人生的忧虑是不能用大小的来分别的，当下这一刻的烦恼就是最大的，每一个阶段都会有坎坷都会有烦恼 不管是穷人 富人当官的都会有不同的烦恼，每一个重叠的人生路上 烦恼也是不同的 一切事物都是烦恼的对方，什么时候我的日记恢复阳光乐 那么我就越过了这道坎 我就战胜了自己 战胜自己的意志，</p><p id="source-b-005">迷茫的时候我希望有一个安慰的人 阿妈一直都是顺从我的人 很多事情都是这样的 也都是支持我的意见 也认同我的意见，今天给了我真实的声音，在她的眼中我是这样的人呢，其实我是吗，刚开始不是 后来是的 我要求的东西本来就不会多，给了我的棒喝一击 我认识到了自己的错误，深刻地认识到了</p><p id="source-b-006">我也知道自己欲望的可怕 我竟然会打电话去问 2舅要电话，这样是厚颜无耻的，我要求的是不是太多了 我太贪心了 何华清是一个贪心的人 请不要来玷污梦马 梦马不应该是这样的 或者是 接受吧，接受别人的恩典，要记住别人的恩典在自己缺乏的时候他给了你帮助 他给了你一切你所希望的 在以后的人生路上 尽自己的力量布施给别人，让别人欢喜 首先我要让自己的家里人欢喜 我要让我的阿妈欢喜 我意识到了自己的错误 我应该要诚恳去请求阿妈的谅解，阿妈是一个有志气的人 他说出了我的缺点我就应该去改正 而不是赌气 搬着一张脸 尽管她说我是在装可怜 我是因为手机没得买在叹气 这都好 这都没关系 我只要知道自己要做的是什么 知道自己的本心是什么就好了 让别人欢喜 也是让自己欢喜了。明天是美好的 一切都是美好 吉祥顺我心意的。</p></noscript>
