    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>真理 小事物</h1><p id="source-date" class="diary-date"><time datetime="2013-09-07" title="原笔记创建日期，不一定等同于落笔时间">2013年9月7日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">林夕叫我帮助他的时候我应该去给予帮助，他是班长，他叫我的时候，刚开始心里面都会想，为什么不叫别人，但是我突破自我的时候我会有所觉悟的，一切不是那么难，给别人使唤也不是那么难，这也不是使唤，这是一次帮助别人的机会，</p><p class="diary-omission">〔中略〕</p><p id="source-b-002">多少次我放弃了练字，一次次的失败会让我不敢触碰， 就好像是师父说的那样，不要停下不要坐车，否则朝山是会有阴影的，我想练字是我的阴影，因为一些特殊的事情，是吧，我是失恋的了，那段时间是我的消沉吧，可能我表面上没有看出来，其实我的内心是脆弱的，我也是会伤心的，但是我没有去想，但是不代表我内心中没有那种悲伤，那段时间我放下了很多事情，直到去五台山的时候我也是放下了，连同写日记都是放下了，那段时间是颓废的，对来来说是痛苦的，我一直都是要求自己的，坚持再坚持，</p><p id="source-b-003">那段时间我放下了所有，我不写日记了，妈妈说我在家里的时候我都是在叹气的，问我是不是失恋的原因，我说不是的，然而是吗？</p><p id="source-b-004">我想是的，我想应该去面对自己的悲伤，这才是真正的悲伤，不然一次次我不会想要和云和好，现在是活过来了，我是会失恋的表面上看来我是一个很强的人，我总是不会悲伤，我总是不会再微博或者是朋友圈发表自己的心情，原来我一直都是在隐藏，我不让每个人看到我的悲伤，因为我认为我不应该悲伤，我自我执着是是一个能放下的人，确实我可以做很多事情来转移自己的注意力，多久我没有发表自己的悲伤的，因为我发现内心中的安慰会给我力量，内心中的自己告诉自己不应该悲伤的，一切都会消失的，真的是这么地要强，我是要强的，我不会轻易吐露自己的悲伤，连我自己都被欺骗了。尽管这是后话了，我深深地把自己给包裹起来，我并不想让每一个人看到我狼狈地样子，看样子好像是这么一回事，是一个充满着正能量的人，我说过只有内心中的孤独能给我力量，一直都是我，无论我是怎么悲伤，我都会告诉自己 一切是会过去的，就这么我学会了把自己包裹起来，</p><p id="source-b-005">现在你的内心中是否真正地充满地喜悦，我想是的，是的，没错我内心充满地是喜悦，因为我允许自己的悲伤的，我是一个有七情六欲的俗人，我应该接受这样的自己，我才能改变自己，从而真正的改变，从自己身处看到自己的弱点才能做到真正的改变，我想我看到了梦马了，那个七情六欲的梦马，我开始在接受她，改变他，我要一层层都把自己拨开，看到真实的自己我，在真实的自我 弱点上面做出改变才是真正的，才是有力量的，才是实质的，我的练字我不敢了，真的，这是我的阴影了，多少次的失败，我想我应该面对的吧，因为一手好字一直都是我的愿望，你可以不用羡慕的是吗？如果你哪一天觉悟了。</p><p id="source-b-006">面对真实的自我，那个七情六欲的自我，你很自私，你没有那么高尚，你会悲伤，你需要安慰。面对这样的自我，你会发现你要怎么做，从一件件小事情上面，从你碰触到的感觉去理解这个世间，理解佛法。</p></noscript>
