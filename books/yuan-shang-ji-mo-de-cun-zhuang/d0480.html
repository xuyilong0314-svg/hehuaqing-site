    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>生命的决心。</h1><p id="source-date" class="diary-date"><time datetime="2013-04-20" title="原笔记创建日期，不一定等同于落笔时间">2013年4月20日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">没有人是不孤独的，枕边人也是有不同的梦，人始终要一个人面对孤独的，忍受得了孤独的人是有灵魂的，他心中还有自己的村庄，还有许多美丽的东西，有的人喜欢回忆，用回忆来填补自己的孤独感，也有什么喜欢忙碌，一忙碌起来就不会有孤独，我怎么对治孤独呢？我会跟自己说说话，在自己心中那个村庄中，看看外面的世界，欣然地看着，因为有人陪同，灵魂抽离出来在，现在我的灵魂抽离出来，我在自己的村庄中，与自己对话，我敲打键盘的时候，是属于我自己的空间，我在搭建这个村庄。我并不觉得寂寞，说什么时候我最感受不到孤独吧？那就是我写日记的时候，因为我正在表达，我正在倾诉，对象是自己，自我批评。自我改正，几回生死两茫茫，只有自己是永远存在的，永远在自己身边就是自己的，没有人愿意为你殉葬！只有一个人生，在我的世界也只有一个人，之间有通向彼此的桥梁，有时候你会来我的村庄坐一坐，有时候我会去找你聊聊天，但是每个人都是要各回各家的，切确明白地说就是你总会有私人的空间的，不要打发时间，学会与自己说说话。跟自己说话多了起来，人一亲近久了就会发现对方的缺点，我也发现了我很多都饿缺点，逐渐在完善，过程挺好的，看到了自己的改变很是高兴，因为人生就是每天进步一点点，这样我就很满意，脚踏实地地不去想太多虚幻！。</p><p id="source-b-002">发现，我是一个爱幻想的人，我会幻想我是一个股神，一个可以无限次卷土重来的股神，与这个世间分享我的所有，而且我是一个低调谦虚的人，我是一个喜欢幻想的人，然后幻想之后大抵都会觉得可笑，不应该这样，只是想想心中还是有自己的信念，想就想呗，懂得幻想心中有一个目标有一个希望也也挺好的，想多了说不定就写书了，不不不，我想的那天太牛逼了，无限卷土重来的股神这要有多牛逼啊，其实就是想呗，想归想我还是一样会脚踏实地的，</p><p id="source-b-003">我现在把学业给搞懂了才行啊，那天考试田间的时候就尴尬了，全部都是不懂的，惭愧是惭愧了，但是厚脸皮如我总是给自己一个理由，或者是装作不知道，总是掩耳盗铃，我最明白自己心中想的是什么，谁愿意什么都不懂的呢，不愿意的人付出了努力就懂了，不愿意不努力的人就像我这样，不懂也没办法，总是这样下去也不是办法阿，时间已经过去了一半我要想想办法的，不要再骗自己了，这不属于幻想的范畴，这已经成为了事实，多学一点东西，既然已经是学了这门专业，我的梦想又是改变环境问题，跟树木打交道，不要说自己不能面面俱到，这是一种基本的，作为学生最基本的条件，作为学生就应该有学生的姿态，对我来说主题是精神的，但是总不能挂科或者是一无所知阿，以后自己是要出去从事林业的，在单位的时候糗大了，可是没有同学陪你在那里狂笑的。</p></noscript>
