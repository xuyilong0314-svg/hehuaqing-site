    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>空荡荡</h1><p id="source-date" class="diary-date"><time datetime="2012-09-10" title="原笔记创建日期，不一定等同于落笔时间">2012年9月10日</time></p><p id="source-b-001">好久不见是一种期盼，一份柔肠，又掺杂着懦弱与不舍。 其实就不如不见吧，少了期待，多一份决裂，然后感叹，只是缘薄，再转身去等待那一朵花开。</p><p id="source-b-002">写下了这一段文字 是否忘了当初的承诺，不是忘了，是怕了，很佩服对爱情奋不顾身的人，好了 ，也别煽情了，好好地努力，订好目标。然后勇猛精进 不要犹豫 努力地充实自己 严以律己 培养自己的意志力 圆满人格和智慧 宽以待人 用慈悲去行事 记得 谦虚 谦卑</p></noscript>
