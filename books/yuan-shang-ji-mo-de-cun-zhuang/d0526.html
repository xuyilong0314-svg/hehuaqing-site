    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>第一次献血</h1><p id="source-date" class="diary-date"><time datetime="2013-03-05" title="原笔记创建日期，不一定等同于落笔时间">2013年3月5日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">今天去献血了，是AB型据说血库已经缺了半个月，我很重要滴 ~还有AB型的人只有百分之八，那么说我就是万中无一的绝世高手了，牛逼哄哄地。献血前跟舍友们说了有关于献血的问题，我觉得这个是没有好怕的，我是抱着一个布施的心，并不是别人的是吧？不管如何都是帮助别人的，不管他们的收费体系如何！</p><p id="source-b-002">现在肌肉有点酸痛，可能是抽血后的症状，打电话告诉了妈妈，妈妈很支持我的，不论在什么时候总有一个母亲是避风港有时候我宁愿是一个小孩子，妈妈的怀抱是温暖的，妈妈永远是支持鼓励的那个人，因为妈妈慈悲阿。妈妈说:保持身体健康，有机会再布施这样很好，献血也是有益健康的，我有这样一个好的妈妈，真的需要感恩，妈妈懂得了什么叫做布施了，我应该不让妈妈担心才对。然后我去冲一杯蛋白粉，妈妈不放心还是打电话过来问我有没有泡，我泡了，是给妈妈一个安心，妈妈需要安心，儿子健康有营养，莫过于是最大的喜悦，父母的恩情难以回报，妈妈的梦想就是我阿，妈妈的梦想就是我阿。感恩太多了，文字是不足以表达。</p><p id="source-b-003">爸爸今天也打电话过来，说的问题是入党，尽管我心里不愿意，我知道爸爸是为了我好，然后我有原则，我不愿意成为那种人，是不是我太固执了？ 77也有提醒我，父母之间要妥协，不应该是强硬的， 77已经没有父亲了，一切的固执在死亡面前是微不足道的，妥协并非违背自己的原则，可能是更好地去善待众生，因为自己想要遵守的原则为了就是不伤害众生， 77让我的固执有点松动，然而事情的发展不知道是如何，下学期的事情，下学期再说说。我现在也完全不用庸人自扰，对吧？继续，还有就是我要去献血的时候我问他们谁要一起陪同，他们没有人愿意下去，那一刻我觉得很失落，可能这事情微不足道，但是我到了下面的时候，是没有感到有什么，真的没什么，到了下面才知道一个人更是方便呢。</p></noscript>
