    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>见见</h1><p id="source-date" class="diary-date"><time datetime="2014-12-20" title="原笔记创建日期，不一定等同于落笔时间">2014年12月20日</time></p><p id="source-b-001">后天就要上班，我的人生第一份的工作，看到了公司的一些状况，我意识到我正在经历的是一个新的创业公司刚起步的状态，很多事情都是焦头烂额的，那么让自己保持一个学习负责任的态度，把别人的公司当成自己的公司，这是一个难得学习的机会。</p><p id="source-b-002">不论在什么时候，一定不要丧失了学习的能力，让自己像一块海绵，现在应该做的就是吸取别人现有总结的经验。</p><p id="source-b-003">每一段旅程都是安排好的，莲师加持我，这个时候我竟然忘记了，在红尘中历练自己。当我开始把钱存进那个银行卡的时候，我的一切就开始了，激活了。我应该有所作为，尽管我现在还不懂，但是我愿意去学习。因为所遇到的一些人，总会让自己自己的一些想法改变，如果自己没有定力的话，在红尘中的索求是艰辛的，因为总是填不满，总想证明自己，想要靠的是外在的一些事物，因为和豆豆在一起了，我发现自己对外在的需求有了一些改变，只是随缘吧</p></noscript>
