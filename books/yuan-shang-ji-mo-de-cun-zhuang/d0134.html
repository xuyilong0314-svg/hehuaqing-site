    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>念想如是</h1><p id="source-date" class="diary-date"><time datetime="2014-08-23" title="原笔记创建日期，不一定等同于落笔时间">2014年8月23日</time></p><p id="source-b-001">如果有我这个人的话 念头怕是假的人活着如夜间行舟，时而光华满目，时而伸手不见五指。人生极短 怕是来不及一声道别 凡人很难想象时间与生死， 认为该是既定的路程便是这样总是会希望自己的话可以得到别人认可 也总是认为自己的想法总是对的 对自我的执着没有少 并是一直在增加 并是为了给别人一个好好的印象 得到别人肯定 满是欣喜 反之却又是悲伤至极，这一切也就罢了 这对于无常来说并无什么 因为这只是生命的历程相续不再清净的时候 当懒惰的心升起的时候 是否能够唤醒 原本光明的不掺杂 愿我能够时时警惕 愿我能够时时安心自在 愿一切挂碍能够断除 愿文殊加持。我给了你多少个月的空缺 也没有弥补的方便 时光的流逝 文字是用来祭奠时光的，因为人怕寂寞孤单 怕一个人时候能够有所依靠 或者是珍贵的收藏 现在文字 开始不是那么珍贵 开始出现一些所谓心灵鸡汤 混淆视听的人 每个人都有故事 我们应该像看一场电影 可以发出一声赞叹 但是别妄想复制、每一个人都是朝着自己念想而走 因为比较才会有平凡 欲望是不安本分的冲动 该是谁的还是谁的 生命总是不经历 你会发现一切本来是稀疏平常 人人大惊小怪并是舆论了。 生命哪里会有贵贱之分 一切众生皆有佛性 敬天爱地 遍知一切的佛陀 知道我的心事 。</p><p id="source-b-002">回想起来 原本那天那般激烈 现在也只是在画意而已 原本我的那么执着 我便是错误的 要有面对 跨过他的心 一期一会 我们连说再见都没那么容易 好好珍惜应该珍惜的 当下的我说过父母的见地与我不同 也是正常 愿我能够时时回顾 愿我能够原谅自己的执着 要更加能为别人着想 感同身受。 我是站在父母肩膀上而有今天的 我承载的是上一辈人的艰辛 是时候我应该回报 是阿 连养育之恩都是不能回报 那么不谈菩萨道。</p><p id="source-b-003">一直在推翻自己的执着 原本以为出家修行是最好的 确实是这样 但福报因缘不具足并也是这样 先让我在红尘中去体验 让我回到法座上时能够 贴近我的孩子。 未来路漫漫 路漫漫。遇到了尼加师父 郎加师父 还有交巴师父 谢谢他们的热情款待 他们是我最开始接触的藏族师父 我也能够感受到 西藏人的那种真切 还有对佛法的信仰 并未执着 真的并未执着千万不要自以为是 不能自以为是。</p><p id="source-b-004">今天与朱茵爸爸 谈了也是甚欢愉 便也是谈的聊 也是包容心大的人 可能以后还真是跟他一起合作做茶庄</p><p id="source-b-005">我也希望是这样阿 愿是这样</p></noscript>
