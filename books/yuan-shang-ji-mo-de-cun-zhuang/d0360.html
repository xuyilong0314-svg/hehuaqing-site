    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>回学校。大二开始了。</h1><p id="source-date" class="diary-date"><time datetime="2013-08-29" title="原笔记创建日期，不一定等同于落笔时间">2013年8月29日</time></p><p id="source-b-001">这足以看到我的意志多么消沉，沉浸在网络里面 在游戏画面里边 在漫无目的里边，这一切多么不顺我心意。明日回到学校 以前的环境 开始一段为期至新年的日子，这次就不回家了，就呆着 意志的消沉，现在什么也不想写 我只想收拾东西就睡觉了。</p><p id="source-b-002">告别昨日的我 颓废的我</p><p id="source-b-003">确实是颓了</p><p id="source-b-004">开始新的生活。</p></noscript>
