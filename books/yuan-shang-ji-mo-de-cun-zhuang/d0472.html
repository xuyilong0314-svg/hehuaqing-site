    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>搭建王国</h1><p id="source-date" class="diary-date"><time datetime="2013-04-28" title="原笔记创建日期，不一定等同于落笔时间">2013年4月28日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">今天和77牵手了，自从上一任结束之后我就没有这样十指交扣了，我们相遇了，我真诚地面对了她，刚开始她很是害羞地，我懂得她的心情，很久没有见面的同学，现在成为了恋人，终于是这样了，我希望我们之间的爱情是平平淡淡的，我宁愿平平淡淡地，因为我更加热衷于这样的感情，两个独立的灵魂，各自生长着，各自有属于自己的天地，各自都有自己的生长空间 ，有属于自己的朋友，有属于自己的应该热爱的事情，生活不应该只是爱情，更多的是两个了灵魂之间的共鸣，这是我喜爱的相处方式，感情只有因为这样才会坚固起来，因为是两个人共同的建立，这样才不会有缺失，因为每个人都会有缺点，必须是修修补补，因为看到了各自的漏洞，有了各自的努力观察，这样才会有一座高楼起来，建立两个人的王国必须是两个人共同建立的，两个人的一起建立的王国才会熟悉，对方才会知道你的方式，才会知道你的习惯或者是你的脾气。现在逐渐没有了刚才的速度，逐渐快要写完了，心中还想松了一口气，我应该坚持的，这是我应该坚持的事情我就要坚持到底，不管是因为什么事情，现在我所为自己设立的习惯已经成型了，已经在我的内心中根深蒂固不会改变了，这是我的财富，这才是真正的财富，谁能把时光留住，我就行我用文字的方式，记录我的一生，以后拿给我的子孙看，这是你们父亲的一生，你们要学习，你们自己看或许我也有错误，但是，我一定有什么地方值得你们去学习，比如说我这些日记的习惯。</p><p id="source-b-002">渐渐写的字数多了起来，时间总是很快，我竟然要写到了二十几万了，在这之前并不是我想的那样，刚开始至有一句的，现在至少到了 2000个字，不管是在什么地方，我现在写完我才会感到放松，因为这是我要完成的，如果写日记我一定会很别扭，不管是在西湖或者是现在，总是能挤时间的，看把，不要说没时间，或者是什么，时间总是自己挤出来的，只有愿不愿意不是环境的问题，这是人格的问题是自己意志力的问题，只要心中有一个观念有一个准则</p></noscript>
