    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>深爱的旅伴。</h1><p id="source-date" class="diary-date"><time datetime="2012-12-30" title="原笔记创建日期，不一定等同于落笔时间">2012年12月30日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">我是一个没有奶奶的孩子，从小就只有外婆，据说，为什么用据说呢？因为很少人提起，很少人跟我提起奶奶，好像唯一的一次见到爷爷奶奶是在厕所，一张黑白照片，我妈妈让我保管好，但是我现在扔了，我现在才想起来，该死的。这应该是我唯一从未见过面的爷爷奶奶的照片了。爸爸一直以来也是一个话很少的人。记忆中，他从未跟我提起过爷爷奶奶的事情，死因也没有跟我说过，可能爸爸心中不想说吧，因为感情太深了，说不出口，也一定不想说吧。我爷爷是在坐公车的时候 不小心从车上跌落，不治身亡的。我奶奶死于乳腺癌，奶奶死在我爷爷的前面。这死因也是从亲人口中得知的。</p><p id="source-b-002">我在想，为什么爸爸从来没有给我提起呢？一直以来父子的话不多，从小养成的默契，他只要一个字眼我就知道他要做什么，这次回家我要跟我爸爸好好谈谈爷爷奶奶，爸爸是一个孝子，爷爷奶奶的忌日他一直都记得清，年轻的时候就失去双亲的父亲，那种痛苦，这种无法回报的痛苦，只能由现在的忌日来付出孝心，尽管爸爸知道不会来吃，爸妈有说过这个问题，妈妈有时候会抱怨， “哪里吃得到阿 ”爸爸叱喝了她说:如果真的有来吃的，这么简短的一句话，爸爸发自内心的孝心， 要是来吃呢？生时没能享受点滴，死后呢？爸爸只能做的也只有那么多了。</p><p id="source-b-003">曾经有一段经历是这样的，这次的拜祭是由我去，我用摩托车载着祭拜的东西，我觉得反正吃不了，也就是一个形式罢了，我没有把祭品一一摆上桌子，只是在那里摆放，把纸钱烧了，草草过了场子，在这里，要忏悔 .形式要不要？显然要的，这是一种对先人的恭敬。我 ... 回家被爸爸发现，我父亲外表粗犷但是内心是极为细腻的，我的做法显然没有逃过他的眼皮，理所当然地我被训斥了一顿。父亲，那时候是什么心情，是伤心或者是麻木了呢？对于这个不肖子孙。我觉得父亲这个叫法比爸爸更具有厚重感！像山一样。</p><p id="source-b-004">我的妈妈，十月怀胎开始说起，母亲跟我说过，她生我的那个时刻，母亲身体本来就比较虚弱，生我的时候比别人更加痛苦，因为母亲不够力气，医生做了一个决定，把妈妈的阴道口用剪刀，多剪了一道口子，我才足够出来，否则我会窒息，我问妈妈说有没有打麻药，妈妈说没有，妈妈说打麻药使不出力气，我吸了一口气，那是多么地疼痛，妈妈说那时候已经麻了，已经不知道什么感觉了。我觉得世间的任何形容词都不能形容这段痛苦，以及母亲的爱。同跟妈妈一个产房的还有另外一个人，当时妈妈在生育的时候身边没有一个人陪伴，但是另外一个一家人都在陪伴，妈妈当时看到的时候肯定很心酸吧，还有一个重点就是当时，有的人生下了孩子被偷换，所以妈妈那个怕，而且妈妈生下我，不能动弹，妈妈的心急如焚是可以看到的。</p><p id="source-b-005">妈妈从医院回来，那时候还是住在老房子里面，八九十年的历史的老房子，有过多少代的人了阿。妯娌之间的相处，就像往常的一样，失火不容，而不明智的丈夫总被妻子挑拨，这是一贯有的情节，但是这些都不重要，妈妈受了很多委屈，受了很多苦，在我说以后要报复的时候，妈妈说不行，上一代的人是上一代人的事情，不应该让下一代来承担痛苦，母亲也是一个宽容的人，她在我生命奠基了宽容的基础。小学的时候，那是童年，更早的印象是外婆。当我上小学的时候我对妈妈的印象是忙碌的，那时候妈妈自己在家里做制衣，记得学校的老师称妈妈是女强人，那时候我并不知道是什么，但是我知道这是在赞扬妈妈，我也是欣喜地接受，而这句话我从未跟妈妈提起过。妈妈是一个女强人，只有亲如儿子才知道，妈妈外表是坚强地，妈妈内心其实是柔软的，坚强久了内心就容易碎了。因为妈妈不懂得消化，妈妈都是硬撑。</p><p class="diary-omission">〔中略〕</p><p id="source-b-006">从南京回来的那年，是冬天，为什么会那么清楚地记得是冬天呢？因为这次没有跟去，一直没有看到雪，这是一个遗憾，但这又是一种想象空间，一样美好。在家里跟外婆，外公住在一起。外婆早上经常打一个蛋，鲜鸡蛋，然后用泡面用剩下的调味料，再把开水倒下去，这是一道十足的美味，好像也不经常喝，那时候外婆家还是小平房，我记得那时候是住在大门进去靠左边的房间里面。我记得我坐在床上，门那里有一个老旧的柜子，那时候外婆在外面的墙外有种了一些豆子，外婆说那很补的，外婆总是能有很多手艺，变着相能给我很多不同的食物，连鸡蛋也有很多吃法，外婆在煎鸡蛋的时候总会问我 今天要煎什么样子的。我依稀记得我最喜欢的一种就是把鸡蛋盖起来分成两半，本来是一个圆。变成半个圆的那种。</p><p id="source-b-007">觉得小时候的那段时间我都是由外婆照顾的，记得和小表妹争宠，争是人的本性，三个人一起睡，我就是要外婆脸能向我这一边。如果外婆没有朝我这一边我就不干。外婆很爱我，都说外婆很严，会打人但是我记得的只是外婆对我的好。还有九九乘法表是在大舅的监督下背熟的。</p><p id="source-b-008">那时候，有一段时间，住在我家，也是爸妈都去南京。在我家，一栋大大的房子 只有我和爷爷奶奶。一个印象最为清晰的是，外婆把地板拖得极为干净，我和外婆躺在地上休息，有一次我的后脑勺不小心碰了地上，因为地滑。在我家里印象最深的是我和外婆常常都躺在家里的黑线里面。还有爷爷的印象就不怎么清晰，在跟奶奶一起的那段时间，我不会想爸妈，竟然一点都不想，可想而知，我对奶奶的爱跟对妈妈的爱是一致的，因为我们留的同样的血脉，因为血浓于水的亲情。一段那时候外婆家里窘迫，开着一辆面包车，载着蛋黄派我们一去，我的印象是我在面包车休息的场景，还有就是 那段我妈妈被称为女强人的，晚上在送货。我在面包车里面昏昏欲睡。这是我的印象。</p><p id="source-b-009">还有听妈妈说，那时候晚上在送货，不管多晚两个舅舅都会一起来帮忙，妈妈说，他们怕这个姐姐会累死，会拖垮，这手足之情我一辈子是体会不到，我指的是亲兄弟之间，也是因为苦难能让他们如此团结，一起共度难关。每天养成了写日记的习惯，也越写越多，因为喜欢上了回忆，因为懂了思考。一切事情只是想起一点是一点。什么时候要专门写一遍关于我这些深爱的旅伴。他们在我生命里面都可以使一篇篇感悟。一篇篇甜美的回忆，不管哪一个。</p></noscript>
