    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>上杭</h1><p id="source-date" class="diary-date"><time datetime="2013-04-04" title="原笔记创建日期，不一定等同于落笔时间">2013年4月4日</time></p><p id="source-b-001">昨天晚上是预计要到安徽的，可惜的是买不到去的票，然后临时商量着要去什么地方，我们决定来到杭州，上有天堂，下有苏杭。于是我们搭乘了凌晨三点的车到了下午两点多才到，然后一晚上睡觉的时候最多就是睡了一个小时，一路上磕磕碰碰的总是不尽人意，自己内心还是每每可以让自己平静下来，缘分如此，今天遇到的这些人都是因为这个所谓的不圆满而达成的，没有所谓的不圆满，世上没有走不了的路，观现在犹如今朝，每时每刻都是在一个个不确定中，造成的，没有什么是意外，意外给你带来的是另一个机遇，来杭州就是另外一个机遇，在见识另外一个不同的，有缘的地方，有缘的众生，一切都是有缘的相逢。一路上都是如此地，遇到的人，一句谈话。一个握手。这些人都很我们有了莫大的关系。要用自己的真心去与别人交往，因为自己是真诚付出的，自然会得到别人真诚的对待，给别人一个微笑，这也就是一个广结善缘的机会，都是一个种子，一声谢谢。这都是善念，这都是一种心形养成的习惯。在自己的种子里面播种，一个个好的种子，终究会发芽成熟。</p><p id="source-b-002">确实，我不喜欢人多。人多嘈杂，我看风景的心态都变得有些浮躁，确实我们的人口基数很大，在别人眼中 我也是嘈杂的那一份子。我诚然也是这样嘈杂，然后我暗地地在抱怨，明明是自己的心态不行，原因也不在别人身上，总结出来，是自己无法适应，我内心其实也是嘈杂的，所以能与之相应，本身是这样的，这是能怪罪在别人身上的嘛？这未免也太自私了。这样等于自己的内心被这个环境所转，这样就无法控制自己的心，总是会因为外界的原因让自己的情绪起伏，快乐或者是烦恼都是这样。但这个世间是无常的，我们这般依靠外界的因素，会不能自主，这就不是灵魂的。就好像是我在睡觉的时候别人在摇滚，自己要睡觉收到了干扰，你会去称赞或者是不爽呢？如果你是其中的一分子，你会说你有一颗摇滚的心，热爱生命的心。如果你是睡觉的一方，你一定觉得这是傻逼的行为，在那里嘶喊个什么东西。这就是自己的内心因为环境或者是自己的立场让自己有失偏颇，自己偏执了，自己却不知道。这就是观念的局限性。我现在觉得自己好困，想找个好的理由让自己不要写了直接去睡觉，但是我却办不到我认为自己一定要坚持下来。</p><p id="source-b-003">不论是什么时候，我已经懦弱得总是输给自己，如果这件事情我不去坚守，那么我会看不起自己，如果让我找个理由，不可能不要说了，我不会答应你这个请求的，因为这是给自己的一个交代，如果你说这是在应付，这也是可以的，我不希望自己是找借口的人，哪怕却有其事，到这都是有时间的，就好像我现在很困，我可以不用写了，因为昨天晚上才睡了一点点时间而已。现在可以让自己直接去睡。这是无可厚非的，我不接受，我不愿接受这样的懦弱。这是无耻的 因为自己的贪欲来让自己放松，不去完成。我是做不到的，我写得再烂都是要坚持，不为了什么。我现在很困，但是仍有事情需要我去坚持，我要去完成，看吧我有在坚持，每天都会和你聊聊天，让你了解我，我了解你，你帮助我发现，我为自己改正。</p><p id="source-b-004">我现在认同的另外一个女性也就是雅惠虽然外表大大咧咧的，但内心还是很保守的。知道有所谓有所不为。我现在实在困了，我怕自己一只眼睛再闭上我今天的任务就没有发飙了。不可以睡觉千万要坚持住，这是自己的承诺，我不想去改变这就是我的选择，不忘了写日记，如果没有做错，我晚上的时间都是留给自己的。让自己与自我对白说说想法，以及一些只有自己知道就好的事情。今天很累，真的很累人，那个包重的要命，还有穿错了鞋子走了一整天，自己的受到了十足的破坏，现在睡在帐篷中，依偎着大地，这是自己的第一次这样亲近大地，听着外面的声音，挺好的，我并不会觉得吵，因为我就是这片大地，我是这个大地的一分子我觉得四周都很融洽，觉得这趟旅途给了我不同的意义，因为这样的意义是在宾馆体会不到的，这是我成背包客，驴友的第一次实践，睡在野外体验这种生活，如果我们顺利得到达了火车。坚持下去尽管你真的快睡着了，但是不要放弃任何一个完成自我的机会，今天我成功了，我就迈进了一步，我会有坚持的力量，每天都会去坚持，我每天都在进步。</p><p id="source-b-005">今天妈妈给我打电话他们是支持我的行为的我很感谢这样的自由 他们让我得到了我想要的生活都能实行了。由衷地感谢父母们。</p><p id="source-b-006">有时候一本书就是你们的共同点，今天在火车上面遇到的两个人都是经历文革的人也是了不起的。那个时候是那么地可怕。他们不敢再提因为 确实是心中无法痊愈的。还差一点点我就要完成今天的指标了，为了自己的坚持喝彩，我肯定自己，肯定自己的意志力我相信你会更好的，你应该把这种写日记的力量用在更广发得方面，六日不肯给自己理由 不肯放弃的那种精神 尽管情况狠糟糕，但自己却是坚持下来了，成为了我生命的一部分。心就是说每一天都要去定功课，当这件事情完成到了一定程度，就会变成生命种不可或缺的事情，每天都会自己提起念头来完成成为了生你的一部分任务就快要完成了。今天一天过得挺好，只是真的有点累人，明天还在继续。今天很顺利。人也要很感恩。一路上帮助我的人，只有一点点小事都是在积累 感恩一切 感恩所有。</p></noscript>
