    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>乞儿</h1><p id="source-date" class="diary-date"><time datetime="2014-06-16" title="原笔记创建日期，不一定等同于落笔时间">2014年6月16日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">今天晚上是听周杰伦 有些怀旧得感觉</p><p id="source-b-002">记得那时候开始有了电脑</p><p id="source-b-003">我从小就是一个乞儿 我乞求 友谊玩伴 那时候没有电脑 当然还是乞求电脑</p><p id="source-b-004">以至于去有电脑人家 伫立半天</p><p id="source-b-005">以至于后来会有对电脑狂热的情绪。</p><p id="source-b-006">还想多谈一点吗？</p><p id="source-b-007">庆祥and玄楚</p><p id="source-b-008">他们现在在哪里呢 我小时候的玩伴 我依稀记得我们一起说脑筋急转弯</p><p id="source-b-009">我借过他们的书至今未还 恐怕这也是我不好读书的原因了</p><p id="source-b-010">也不知道他们怎么样了。</p><p id="source-b-011">从小我霸道 但又像一个乞儿 乞求 乞求 乞求。</p><p id="source-b-012">倒也养成这般无牵无挂的精神 千里独行不觉稍有欠缺。</p><p id="source-b-013">生命的不停 钟摆不停 轮回不停</p><p id="source-b-014">如是轮回 沉浸中 我想 应该可以睡觉了。</p><p id="source-b-015">致孤独的乞儿 庄子。</p></noscript>
