    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>正式将这放下</h1><p id="source-date" class="diary-date"><time datetime="2014-05-31" title="原笔记创建日期，不一定等同于落笔时间">2014年5月31日</time></p><p id="source-b-001">一直固执地认为 不应该是放弃地</p><p id="source-b-002">不应该才对 没多久放弃多不应该</p><p id="source-b-003">现在是正式结束了</p><p id="source-b-004">在我删除照片地时候</p><p id="source-b-005">我的第一次创业</p><p id="source-b-006">我看到更多的是坚持 也看到自己的急躁性子</p><p id="source-b-007">总是在说空说慢 实行起来却没那么圆满 就是这样 无可奈何 不是吗。也并非是这样</p><p id="source-b-008">谈不到无可奈何 至少努力过 因缘不具足而已</p><p id="source-b-009">发现自己现在的毛病是缺乏承担责任的能力</p><p id="source-b-010">不够强大 总会把失败归于别人</p><p id="source-b-011">把自己描述得冠冕堂皇</p><p id="source-b-012">比如说 我时常在怪罪李明不够积极</p><p id="source-b-013">每一次都是阿福在提醒我。</p><p id="source-b-014">就这么结束</p><p id="source-b-015">现在的我位置在网吧 等待去福州的火车</p><p id="source-b-016">没有记错的话应该是 一点36分的</p><p id="source-b-017">希望等会有个睡觉的好去处</p><p id="source-b-018">等会就到仙岩了</p><p id="source-b-019">睡不着 听着逃跑计划的歌</p><p id="source-b-020">发现自己的嗓子 唱不了 我这种破喉音也只是唱唱民谣 许巍</p><p id="source-b-021">阳光照进回去</p><p id="source-b-022">现在不觉得困 不知道等会是怎么样</p><p id="source-b-023">此刻电脑自动关机了 我的充值金额消费完毕 就这样。 再见，准备上火车了</p></noscript>
