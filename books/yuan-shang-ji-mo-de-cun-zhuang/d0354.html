    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>寻找你想要的样子</h1><p id="source-date" class="diary-date"><time datetime="2013-09-04" title="原笔记创建日期，不一定等同于落笔时间">2013年9月4日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">我会去修改语言 会自己出版一本书， 给我孩子的， 他父亲的一生 他应该从他父亲身上学到的品质。 我认为教育是这样的</p><p id="source-b-002">寡欲。 20:38:43</p><p id="source-b-003">我原本想说你要出书是吗、</p><p id="source-b-004">寡欲。 20:39:26</p><p id="source-b-005">不是把孩子教成你要的样子吗</p><p id="source-b-006">远方的远 20:39:41</p><p id="source-b-007">我不会这样</p><p id="source-b-008">远方的远 20:40:01</p><p id="source-b-009">我想我的孩子应该去追寻自己要的</p><p id="source-b-010">远方的远 20:40:43</p><p id="source-b-011">如果我身上有他认为是对的 他自然会学。</p><p id="source-b-012">远方的远 20:41:37</p><p id="source-b-013">当然 他的父亲 一生也会犯错 他应该看他父亲的错误 而不至于自己去犯</p><p id="source-b-014">远方的远 20:42:09</p><p id="source-b-015">这是我认为的教育。</p><p id="source-b-016">这是我所认为的教育，这一刻我理解了教育是怎么一回事。我想我的孩子是快乐成长的，本来父亲就有一个不羁的灵魂。</p></noscript>
