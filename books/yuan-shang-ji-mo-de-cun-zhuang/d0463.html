    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>快乐，智慧的传递</h1><p id="source-date" class="diary-date"><time datetime="2013-05-07" title="原笔记创建日期，不一定等同于落笔时间">2013年5月7日</time><span class="diary-excerpt"> · 节选</span></p><p id="source-b-001">很快乐，最段时间跟可爱的小敏小芳舒婷他们几个，我们之间的友谊比之前更加快乐，第一次吃饭的时光这么地快乐，一群很可爱的人吃饭也是很享受的，开开玩笑吃吃饭是一件很幸福的事情，能找到这几个好友挺好的呢 ~这顿让我由衷地喜欢上了，吃饭不只是吃饭，更是在一起聊天的时光，时光荏苒有共同语言的很少，一辈子能在一起吃饭的也是很少的，我们之间坦诚相见我完全是真诚地展现了自己的本性，因为可爱的她们值得信任，真的像哥们一样地，我觉得很多一起吃饭的时候特别的香就好像大家都在一起吃饭的时候，就特别起劲，感谢他们的接纳，其实是真的没钱吗？并不是这样的，我们这样像一个家一样，真的就像一个家一样，在一起吃饭，互相地开玩笑，互相开着玩笑。世间真的是公平的，确实是公平的，这个世界待我不薄在我失去了一方面友谊的同时，我找到我真正的友谊，合我心意的那些人，一些可爱的人，现在的我很是高兴呢，这高兴虽然只是暂时的，虽说还不知道什么时候是个头，但是要珍惜现在，珍惜一下彼此的种种时光，这美好的时光不管多长都很好啊，不管时间长短这都是大学生涯中一段不可或缺的，一群朋友那么一段记忆在我的内心深处总有一个位置。因为无常我们更懂得珍惜，更懂得珍惜现在的时光，感谢这个世界，让我能体会到妙不可言的友谊，好像因为我和CF的加入更有动力了，五个人更有动力了，更有凝聚力了，真诚祈愿每一个人都能平安，一生平安。</p><p class="diary-omission">〔中略〕</p><p id="source-b-002">突然想一鼓作气的时候。灵魂就借然而止了，灵感不是自己能玩弄的，看吧，自己把自己的灵感给打散你了，这就是自己不专注的后果，让自己一鼓作气地写完，不管做什么事情都是应该要有这种状态的，如果没有用电脑，用笔写下的话，是不会有电脑让自己去磨蹭的，自己总是磨蹭着，然后本来应该要老早写完的日记就这么地耽搁，时间一点点过去，自己分心去做的事情也总是没有意义，日记分成了好几段的写成的，没有衔接，我的日记本来也是没有衔接，我总是在跑题，题目上面的事情可以只是谈了一小段，因为是一天的事情，不能事事都是深刻的，所以总是有一股跑题的状态，告诉自己这是日记，记录的也是自己现在的所思所想，今天所经历的事情，一点点小事情，留着以后的事情去看，每天的时光或多或少有点事情，这美好的时光，美好的时光总会过去的，时光荏苒美好的时光去了我也觉得很美，秋叶枯黄着，落下时，空中旋转着，跟春日枝条抽芽的那种景象是不同的，春日是青春的气息，秋叶更是绝美， 心美一切皆美！我爱你这片大地，我是你的孩子，亲爱的人们 我传递只会与吉祥给你们。 愿你们一生平安。</p></noscript>
