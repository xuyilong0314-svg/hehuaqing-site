    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>法喜充满，如意法师</h1><p id="source-date" class="diary-date"><time datetime="2013-02-22" title="原笔记创建日期，不一定等同于落笔时间">2013年2月22日</time></p><p id="source-b-001">今天到了讲堂打佛七。第一次主动来参加，手机就决定放在家里，没有人打扰更是好修行，一天的心情都是祥和自然的，很满足这种环境，人生一切的际遇就是这样，昨晚犯了戒今天才有想法来讲堂，今天的受益良多，很多语言都说不出那种喜悦，如意法师讲经说法很幽默，全场都是面带微笑地离开，每一个人都是法喜充满，佛法是最吉祥的宝物，我能体会到孔子朝闻道夕死可矣的感情，内在的品质提升了很多，佛法就是需要一大推善知识来扶持，每一个人形成了一个善良的磁场，每一个人都沉浸在佛法中，如意法师让我们要把心泡软，人就行一辈子就是与自己的习气与自己的烦恼作斗争，使之得到涅槃的安乐，学佛是需要善友，很多喜悦的感情现在都是写不出来。要很感恩，感恩很多人的机会，这次的缘由是因为去吃素食，然后有师姐的告知，本来我也是知道的 丽影也有告诉我打佛七的事情，我却是忘记了，在世俗的欲望中流连忘返，好友一路山有一些善知识在给予帮助 感恩很多人的成就，爸爸妈妈的支持也是至关重要的，因为有他们我才能学佛父母恩是最难报的，做一个不愧于心的佛教徒，我一生追寻佛陀的脚步，感恩，阿弥陀佛。</p><p id="source-b-002">手机没有带出门，来到道场仿佛我与这个世俗的联系切断了，没有人能联系到我，我也不用因为手机的原因时时分心，天大的事情都不需要我操心了 内在品质的提升才是至关重要的，世俗名利的追求终究是会成空的，一切的追求经不起无常的毁坏，世上人的苦苦追寻显然很是可笑，无奈世人看不清事物的本质导致越来越执着，不管是得到了多少都不知足，物质是有限的，而人的欲望是无限，如果才能得到一个饱和？如果一直都是贪心 永远都是没有到头的一天，只有知足的心 才能停止贪婪，无论如何我都成为了一个佛弟子，我很感恩三宝感恩这片大地，无论如何我都要修持戒定慧，无论如何我都要弘扬佛法，无论如何我都要遵循佛陀的脚步，无论如何我都要以佛陀为榜样成为天人师，一切有为法 如梦幻泡影 如露亦如电 应作如是观。佛法的浸染使我的内心得到了充实的意义，我知道自己的人生走向，当我迷茫的时候我能找到一条路，我有一个佛陀能指导我的路途。</p><p id="source-b-003">今天在打坐的时候，是早上我是想去上厕所，然后听到了楼上的佛号声我就上去了，进去也就找了个位置坐下，在打坐的时候临近结束我的脚很难受，就是因为打坐盘腿的原因血路不通畅而产生的疼痛，我告诉自己这个无常，因为这本身是无常，我脚一放下我的疼痛就会消失，这是无常变化的 是不真实的，所以我就告诉自己要坚持下来，后来也就坚持了下来，还有在中午吃饭的时候 第一次细嚼慢咽只吃了一点点东西但是却有了饱和的感觉，其实就是意识心在起作用，很难得第一有这么平静的心态 静静地去观察很多事情，今天的收获很多，内在的品质得到了一次大大的提升，佛陀的信念一直都与我同在，然后讲到下午的打坐，最后我就受不了疼痛就把腿放下了，这苦其实就是给自己修行，与自己抗争赢了就是自我的一次提升，在念佛的同时我希望我把这一切祥和带给别人，带给世间一切有纷争的地方，我希望世上有苦恼的人能值遇佛法，感受到佛法的殊胜，能进入祥和的涅槃境界，一直怀有感恩的，这是我希望时时刻刻都保持的信念，你应该知足，能离苦得乐 离苦就能得到利益，我希望把这一份喜悦带给众生，你现在需要努力做的就是精进修行，在与自己抗争的路上你要打败你自己，世间的一切都是让你修行的机会，你要好好把握，人生难得佛法难闻，如此殊胜的因缘能让你遇到，是你人生的一大幸运，现在妈妈和外婆的关系很不好，我应该要想想办法，一个是生育我的人一个人把我带入佛门的人，两个人都是恩重难以回报，我不应该让自己的私心站在那一边，要客观，你要慈悲也要善巧方便，每一个人都需要不同的方法，只有方法掌握了你才能算是真正的成功。</p><p id="source-b-004">希望佛法在这世间久住，我愿意用自己身心奉献与佛刹，本是西方一衲子，为何生在帝王家，顺治皇帝的出家诗感动了我，我记起了自己要出家的愿望，我的一生也是伴随着佛法而来，我一生注定是奉献自己的。我应该出家我应该找一个好地方去出家，我的心愿格外坚定了，我是一个有福报的人，在那么年轻的时候就能遇到佛法，我是一个极为幸运的人，世上没有人比我更幸运了。我要好好学。上求佛道 下度众生。珍惜接下来的两天时间，一切都是来得及的。 感恩一切！</p></noscript>
