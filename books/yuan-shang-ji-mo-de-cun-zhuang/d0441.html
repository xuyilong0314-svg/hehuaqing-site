    <noscript><p><a href="./">原上寂寞的村庄</a> · 何华清 著</p><h1>敲打键盘的艺术家</h1><p id="source-date" class="diary-date"><time datetime="2013-05-29" title="原笔记创建日期，不一定等同于落笔时间">2013年5月29日</time></p><p id="source-b-001">音乐家在弹奏钢琴的时候跟我在写作敲打键盘的感觉是一样的，我认为是一样的。钢琴家用琴键来表达他的情感，而我用文字来表达我的情感，我认为我也是一个艺术家，我为自己创造艺术，我为自己抒发情感我为自己骄傲，说骄傲会不会有点过了？并不，这对于我来说很值得我感动，我学会让自己感动，为自己创造感动的人是美好的，这美好源自于对生活的感悟，乐观地表达自己的想法，我享受这一片刻，每天都在享受说一些自己喜欢的话，我先学会了取悦自己，然后我学会取悦别人，还是不用取悦二字为好，带给别人开心吧，在我的字典里取悦并不是褒义词，但取悦自己却是一件好事，我乐观我，我享受这种感觉，在文字中最能表达自己的，也是最能保存下来的，只有数据还在我的文字就在，我的精神就会存在，我的灵魂一直都是永存下去的，总有一天我会把握写得笨拙的文字发表出去，这么一个人，一个男孩他叫做何华清，他为自己写了本自传，他觉得生活很美好，他不会遗憾，他一直快乐地，他最大的希望是把这种快乐传递出去，我的心路历程，真正开始写的时候算起来也已经半年了，三十几万的字，我坚持下来的结果，</p><p id="source-b-002">我还是不修改我的日记了，我最希望自己的原来样子，我可以看看我最早时候写的文字是怎么样的，渐渐地我的文字发生了改变，我一直认为我的文字很笨拙，我要表达的很多，我尽可能让这趋于平淡，平实得让每个人都能看得懂，那么我成为一个说故事的人吧，这是我的理想了吗？为什么每天都在写作，是不是我的潜意识里面想成为一个说故事的人，耐人寻味而且能融入别人心房的字字句句，感觉挺好的，每天都写一点出来，我不知道这是否我希望的哪一条路，对于这个我并没有很强烈的意愿，我还是做一个给自己写故事，为自己说故事的人吧，其他的一概我都不想考虑了。你思考过你的前程吗？嘘！我正往前程的路上 .你认为什么事情是最重要的？怎么说呢，现在吧，此刻最重要 ，最重要的是现在写的这篇日记，我正往前程的路上。</p><p id="source-b-003">今天心理课的时候，每个人要上台演讲，说自己的人生要做的十件事情，其实我并没有想做的十件事情，我认为在讲台上上就是我重要的事情，做好一个说故事的人，在台上你会发现如果台下没有人听你说话，是一件难受的事情，我发现老师是全国心理素质最好的人，我这是在调侃，只能说到最后的麻木了，有的人仍能保持蓬勃的心态，敬业的人就是这个摸样，热情一点吧，都热情一点吧，毕竟我们都是年轻人，不要成熟，更不要世故，如果你能说一句脏话那就更好了，当然我这是在开玩笑，脏话还是不能说的，青春不是没素质，这句话我早前说过了。</p><p id="source-b-004">看来我的思潮渐渐回去了，会写一点关于青春的东西，通常都在写世界的舆论，或者是对这个世界的看法，这每一件事情的看法，每一件事情都是有意义的，我都有话说，现在我不知道要写的是什么，要不说说今天早上吧，今天早上看书的时候很烦躁，书都看不下去，而且很困，书也不怎么看的懂，阅读的质量很低，很低，我都搞不清楚我自己这是在做什么，而且延迟了起床的时间，赖在床上不起来，是不是意志力又要开始衰退了，练字的时候也很浮躁，也不知道怎么回事，练字的时候也有浮躁的情绪，有的时候做得很差劲，上森林调查的时候也没有认真听，听不下，无所事事地也就玩手机了，光阴虚度了，紧接着就是谴责自己，每每都是这样，这种感觉很不舒服，也不是我想要的状态，我又不真诚了，其实这很舒服，不用听着玩着手机时间很快地过去了，这是一件很舒服的事情，但！</p><p id="source-b-005">我不能这么做，如果现在我是舒服的，那么以后必定是艰苦的，道理每一个人都懂得，但是做起来就不是说的那么一回事了，很多时候我都在自欺欺人，有时候我也想偷懒，而且还会成全自己，事后我都会谴责自己，这是一件很糟糕的事情，也是很矛盾的事情，我并不想这么矛盾，我要打破，但是需要时间，我意志力还是很薄弱，我是一个想做的时候热情十足决心磅礴的人，然后坚持一段时间后就软蛋的人，就这么一个人能成什么大事，我没有什么了不起的，毛病一大堆，也就是多看了一些书，也就是有信仰，但是我修行很差劲，我需要向别人学习，人就是这样烦恼习气多得让自己喘不过气来，而糟糕的是每个人都宁愿堕落下去，都想站着原地不动，们不想前进，前进是很累的，修行是很苦的，克制自己的路上如果没有决心，是不会达到自己理想的那个状态的你现在是什么心情？</p><p id="source-b-006">我现在就是想赶紧把字数写到 2000子，我现在不想写了，我在拼凑着字数，这一刻对我来说不是享受，时间有点晚， 我想洗个澡然后睡觉，或者是跟朋友聊聊天，头发长得让我感觉更糟糕了，一头乱发偏偏又很浓密，我得赶紧把我的头发剪了，还有就是去医院看病，最近的身体不适，不管是在哪一个方面都觉得有点毛病，或者我这是在杞人忧天，不，我不能这么想，不要让自己的病加重，那么就选择早点去医院看一看，看一看病好了，这是一件必须做的事情，明天就去完成，还有这一头乱发，我得赶紧把这头发剪了，焕发自己的光彩，那种激情，炎热的夏天加上这么多的头发，实在是挺糟糕的，差不多今天也要写完了，题目还没有写，其实不用什么题目，因为总是文不对题，而且跑题很严重，我还没有写一个主题，写成一个篇幅的，如果有的话就是昨天晚上的 自白</p></noscript>
