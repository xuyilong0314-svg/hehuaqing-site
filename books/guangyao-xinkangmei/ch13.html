</head><body><div id="root"></div><noscript><main style="max-width:760px;margin:auto;padding:40px 24px;line-height:1.9"><nav><a href="/#books">全部著作</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">广药新康美</a></nav><h1>第十三章｜新人怎样成为导师</h1><p>何华清 著</p><h2 id="source-p122l5">五级台阶</h2><p id="source-p122l6">那天，小芳第一次走进会议室。她环顾四周，看到一群人神采飞扬地在台上分享，有人讲成功案例，有人谈家庭故事，有人讲自己如何跨越拒绝。而她，只能坐在最后一排，手心里满是汗。她心想：</p><blockquote><p id="source-p122l11">“我什么时候，也能像他们一样，站在前面说话？”</p></blockquote><p id="source-p122l12">导师听她谈起这个想法，便鼓励她先试着做一点。</p><blockquote><p id="source-p122l13">“从你眼下能做的事情练起，慢慢学。”</p></blockquote><p id="source-p122l14">她不必立刻站到台前，先有机会参与，就已经有事情可以练习。</p><h2 id="source-p122l18">为什么需要阶段划分？</h2><p id="source-p122l19">把学习过程分成几个阶段，是为了安排练习，也方便双方了解进度。在团队中也是如此。</p><h3 id="source-p123l0">新人知道从哪里开始</h3><p id="source-p123l1">许多人刚开始时，会反复怀疑自己：“我可以吗？”知道下一步要学什么，新人就不必一直猜测自己做得是否够好。</p><h3 id="source-p123l3">做过一段时间再回看</h3><p id="source-p123l4">也有人做得不错，但始终止步不前。做熟一件事以后，还可以看看是否能够解释原因，能否教给别人。它提醒每一个走得快的人：</p><p id="source-p123l7">做事的数量增加了，也要看看自己的理解和能力有没有长进。</p><h3 id="source-p123l8">方便安排带教</h3><p id="source-p123l9">团队里每个人的熟悉程度不同，带教安排也应有所区别。阶段只是参考，不能只凭加入时间或头衔判断。</p><h2 id="source-p123l13">成长的五个阶段总览</h2><p id="source-p123l14">每一个导师，都是从“不会”开始的。五个阶段从体验到传承，说明了不同阶段需要学习和承担的事情。</p><section class="gy-table" id="source-p123l16" aria-label="分项对照"><div class="gy-record"><p id="source-p123l16-r1-c1"><span class="gy-label">阶段</span><span class="gy-value">了解</span></p><p id="source-p123l16-r1-c2"><span class="gy-label">正在做的事</span><span class="gy-value">了解产品、工作与服务</span></p><p id="source-p123l16-r1-c3"><span class="gy-label">需要的帮助</span><span class="gy-value">准确的资料和答疑</span></p><p id="source-p123l16-r1-c4"><span class="gy-label">怎样看进展</span><span class="gy-value">能说清自己是否需要、是否愿意参与</span></p></div><div class="gy-record"><p id="source-p123l16-r2-c1"><span class="gy-label">阶段</span><span class="gy-value">练习</span></p><p id="source-p123l16-r2-c2"><span class="gy-label">正在做的事</span><span class="gy-value">与导师一起尝试</span></p><p id="source-p123l16-r2-c3"><span class="gy-label">需要的帮助</span><span class="gy-value">示范、陪同与反馈</span></p><p id="source-p123l16-r2-c4"><span class="gy-label">怎样看进展</span><span class="gy-value">知道基本步骤，敢于提问</span></p></div><div class="gy-record"><p id="source-p123l16-r3-c1"><span class="gy-label">阶段</span><span class="gy-value">独立</span></p><p id="source-p123l16-r3-c2"><span class="gy-label">正在做的事</span><span class="gy-value">自己完成日常工作</span></p><p id="source-p123l16-r3-c3"><span class="gy-label">需要的帮助</span><span class="gy-value">遇到难题时可以请教</span></p><p id="source-p123l16-r3-c4"><span class="gy-label">怎样看进展</span><span class="gy-value">能独立沟通并处理常见问题</span></p></div><div class="gy-record"><p id="source-p123l16-r4-c1"><span class="gy-label">阶段</span><span class="gy-value">协作</span></p><p id="source-p123l16-r4-c2"><span class="gy-label">正在做的事</span><span class="gy-value">参与活动、配合伙伴</span></p><p id="source-p123l16-r4-c3"><span class="gy-label">需要的帮助</span><span class="gy-value">分工和交接</span></p><p id="source-p123l16-r4-c4"><span class="gy-label">怎样看进展</span><span class="gy-value">能承担约定的工作</span></p></div><div class="gy-record"><p id="source-p123l16-r5-c1"><span class="gy-label">阶段</span><span class="gy-value">带教</span></p><p id="source-p123l16-r5-c2"><span class="gy-label">正在做的事</span><span class="gy-value">整理经验、帮助新人</span></p><p id="source-p123l16-r5-c3"><span class="gy-label">需要的帮助</span><span class="gy-value">学习观察与反馈</span></p><p id="source-p123l16-r5-c4"><span class="gy-label">怎样看进展</span><span class="gy-value">新人逐渐能够独立完成</span></p></div></section><p id="source-p124l0">阶段变化，主要看能够承担的工作有没有变化。</p><h2 id="source-p124l2">先了解产品和工作</h2><p id="source-p124l4">刚接触时，先了解企业、产品和工作内容，问清自己的疑惑。可以先做的事：</p><p id="source-p124l7">• 用心体验产品，形成属于自己的真实感受。</p><p id="source-p124l8">• 选择有帮助的交流参加，具体次数按需要安排。</p><p id="source-p124l9">• 写下自己为什么关注这件事，以及目前最想了解什么。</p><p id="source-p124l10">容易遇到的困难：</p><p id="source-p124l11">• 面对陌生概念与外界质疑。</p><p id="source-p124l12">• 害怕表达、担心说错。</p><p id="source-p124l13">• 不知道“自己能不能行”。</p><h3 id="source-p124l14">可以怎样往前走</h3><p id="source-p124l15">找到一句属于自己的核心故事。哪怕只有三十秒，也要敢于说出口。体验者先要亲自尝试。有了自己的感受，才有可讲的内容。</p><h2 id="source-p124l19">跟着伙伴练习</h2><p id="source-p124l21">开始跟随导师行动，从“学习”进入“实战”。可以先做的事：</p><p id="source-p125l1">• 列出准备联系的人，记录实际情况。</p><p id="source-p125l2">• 学会基础邀约话术，知道如何开口。</p><p id="source-p125l3">• 至少陪导师完成三次沟通，从旁观察节奏。</p><p id="source-p125l4">容易遇到的困难：</p><p id="source-p125l5">• 害怕被拒绝、怕尴尬。</p><p id="source-p125l6">• 担心自己“说不好”，陷入犹豫。</p><p id="source-p125l7">• 不知道什么时候该开口、什么时候该停。</p><h3 id="source-p125l8">可以怎样往前走</h3><p id="source-p125l9">从“我不敢说”到“我敢开口”。哪怕只是一句问候、一句介绍、一场陪同。小陈第一次邀约时说得颠三倒四。导师先肯定他把话说完，再和他一起检查。练习多了，他才逐渐知道哪些地方容易说乱。刚开始不熟练很正常，要给新人尝试和修正的机会。</p><h2 id="source-p125l16">自己完成日常工作</h2><p id="source-p125l18">能独立邀约、沟通、带人见会，开始出现成果。可以先做的事：</p><p id="source-p125l21">• 按能够完成的数量，安排每周联系。</p><p id="source-p125l22">• 能独立讲解事业逻辑。</p><p id="source-p125l23">• 能独立说明活动内容，并协助愿意参加的人了解安排。</p><p id="source-p126l0">容易遇到的困难：</p><p id="source-p126l1">• 受挫后容易否定自己。</p><p id="source-p126l2">• 业绩波动，容易陷入“高峰-低谷”循环。</p><p id="source-p126l3">• 缺乏稳定节奏，靠热情而非系统。</p><h3 id="source-p126l4">可以怎样往前走</h3><p id="source-p126l5">建立“行动节奏”。把工作安排到生活里，减少临时起意。每天列出能够完成的计划，每周检查一次，负担过重时及时调整。阿敏曾经一遇到拒绝就停下来。后来，她把每天准备联系的人写好，完成后记下情况，每周和同伴讨论一次，安排才渐渐稳定。能够持续做好约定的工作，比偶尔忙上一整天更有参考价值。</p><h2 id="source-p127l3">开始与别人协作</h2><p id="source-p127l4">开始带人以后，除了自己完成工作，还要为别人的学习留出时间。自己熟练以后，还要学会分工、示范和交接，伙伴才有机会独立承担。可以先做的事：</p><p id="source-p127l10">• 建立能够互相配合的小组，先从几个人开始；</p><p id="source-p127l11">• 每周固定组织一次小组例会，让学习成为节奏；</p><p id="source-p127l12">• 会讲“为什么做、怎么做”的基本逻辑，让团队有方向、有方法。</p><p id="source-p127l13">容易遇到的困难：</p><p id="source-p127l14">• 容易陷入“自己做比教别人快”的陷阱；</p><p id="source-p127l15">• 面对团队差异，有人积极、有人犹豫，不知该推谁、该等谁；</p><p id="source-p127l16">• 情绪被消耗在协调和纠正中，渐渐忘记最初的那份热。</p><h3 id="source-p127l17">学会交出一部分工作</h3><p id="source-p127l18">交代清楚后，让对方自己尝试。需要帮助时及时回应，已经学会的部分就逐渐放手。小芳刚带人时，连写名单、打电话也替新人完成。她忙得不可开交，新人仍不知道怎样独立做。后来，她改成先示范，再安排分工，留出回顾的时间。半年后，一些日常工作已经能够由伙伴接手。看伙伴能独立承担多少，比数一数自己布置了多少任务更能说明带教进展。带人时，要留出让别人独立承担的空间，必要时再帮一把。</p><h2 id="source-p128l6">学习怎样带新人</h2><p id="source-p128l7">经验积累以后，可以进一步整理成别人能够学习的方法。除了业绩和工作方法，也开始关心团队怎样把好的做法留给后来的人。别人遇到难题时，导师帮助分析，也说明自己还不了解的地方。可以先做的事：</p><p id="source-p128l13">• 培养出一批能独当一面的领导者；</p><p id="source-p128l14">• 系统化自己的经验与方法，能公开传授；</p><p id="source-p128l15">• 按自己提出的要求做事，接受伙伴的反馈。</p><p id="source-p128l16">容易遇到的困难：</p><p id="source-p128l17">• 保持初心，不被成绩与名望吞噬；</p><p id="source-p128l18">• 对自己负责的工作和教出的做法承担责任；</p><p id="source-p128l19">• 在繁荣中保持清醒，在光亮中保持谦卑。</p><h3 id="source-p128l20">让别人也能教</h3><p id="source-p128l21">已经会带人之后，还要帮助其他带教者成长。示范、观察、反馈和整理经验，都是这一阶段的工作。阿明安排了一次家人交流，邀请愿意参加的父母到现场看看。家人听了工作介绍，也问了平日没有机会问的问题。团队由此更清楚，工作安排怎样影响各自的家庭。导师把自己的经验交给别人，也让团队有机会继续成长。他的日常言行，会影响新人怎样理解这份事业。</p><h2 id="source-p129l3">把学过的继续传下去</h2><p id="source-p129l4">承担更多工作以后，遇到新问题，仍要回到学习和练习。</p><p id="source-p129l5">• 新人进入→体验者→实践者→行动者→领导者→导师；</p><p id="source-p129l6">• 导师再带新人，形成新的循环。</p><p id="source-p129l7">一位导师能够带人，就可能帮助更多新人完成入门。经验也在这个过程中继续传下去。教会一个人之后，还要帮助他学着教别人。接手的人逐渐学会带人，经验才有继续传授的机会。</p><h2 id="source-p129l14">实操练习</h2><p id="source-p129l15">练习一：写下自己目前能独立做什么，哪些地方仍需要帮助。</p><p id="source-p129l16">诚实面对自己，是成长的第一步。</p><p id="source-p129l17">练习二：结合当前情况，安排未来一个月可以做到的事：</p><p id="source-p129l18">• 体验者→讲出30秒的个人故事；</p><p id="source-p129l19">• 实践者：完成几次有准备的邀约，并得到反馈；</p><p id="source-p129l20">• 行动者：检查每周工作是否能够稳定完成；</p><p id="source-p129l21">• 领导者→建立小组例会；</p><p id="source-p129l22">• 导师→举办一次文化活动。</p><p id="source-p129l23">目标定下来以后，写清准备怎样练习。</p><p id="source-p129l24">练习三：想一想，将来有新人来请教时，自己能教他哪些已经做熟的事：</p><blockquote><p id="source-p129l25">“如果有一天我是导师，我希望带出什么样的团队？”带着这个问题，看看自己今天还需要学什么。</p></blockquote><p id="source-p130l7">已经学会的人，回过头来帮助新人时，也会发现自己还有哪些地方没有讲明白。</p><nav><a href="ch12.html">上一节</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">全书目录</a> · <a href="ch14.html">下一节</a></nav></main></noscript></body></html>
