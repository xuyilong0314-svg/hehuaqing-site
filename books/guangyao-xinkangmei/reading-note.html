</head><body><div id="root"></div><noscript><main style="max-width:760px;margin:auto;padding:40px 24px;line-height:1.9"><nav><a href="/#books">全部著作</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">广药新康美</a></nav><h1>阅读说明</h1><p>何华清 著</p><p id="source-p19l10">这本书围绕广药新康美的事业实践展开，谈新人怎样起步、导师怎样带人，也谈团队在遇到困难时怎样继续做下去。刚开始做这份工作，可以先读起步、沟通和服务的章节。初入这一行，信息很多，容易着急。先弄清自己要做什么，再去学具体的方法，会稳一些。已经在带人的读者，可以多看示范、练习和独立承担工作的部分。带人时，除了示范和提醒，也要给对方自己尝试的机会，让他逐渐能够独立做事。团队一起阅读时，可以挑出正在遇到的问题来讨论。</p><p id="source-p20l0">团队要经营业绩，也要把有用的做法留下来，交给后来的人。每章从故事或实际问题谈起，再展开方法和工具。读到练习时，可以联系自己的处境试一试，看看哪些做法适合自己。健康行业的工作面对着人的身体和生活。客户把问题交给你，也把一份信任交给了你。谋生之外，这份工作还会考验一个人的耐心、判断和责任心。这些东西，要在一件件小事中慢慢积累。书里的方法需要结合自己的处境试用，有效的留下，不适合的就调整。</p><p id="source-v43_reading_note">书中的人物故事和对话作了整理，用来讨论常见的工作情境，不作为产品效果、收入或成长速度的证明。读到方法时，可以先想想自己遇到的情况，再决定怎样使用。</p><nav><a href="author-preface.html">上一节</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">全书目录</a> · <a href="ch01.html">下一节</a></nav></main></noscript></body></html>
