</head><body><div id="root"></div><noscript><main style="max-width:760px;margin:auto;padding:40px 24px;line-height:1.9"><nav><a href="/#books">全部著作</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">广药新康美</a></nav><h1>第十六章｜从了解到购买</h1><p>何华清 著</p><h2 id="source-p149l0">有兴趣，却没有继续了解</h2><p id="source-p149l1">那天，小赵带着朋友去参加健康分享会。台上的人轮流讲自己的经历，朋友听得认真。朋友听得频频点头，还在笔记上写下“体质调理”“人参双茅”。小赵心里暗自欢喜：“他肯定会加入，这次稳了。”几天过去，朋友没有再联系，小赵原先期待的回应也没有出现。回顾时，导师提醒他，听得认真只说明对方愿意了解。购买还需要考虑具体需要和条件。小赵才发现，自己把朋友的兴趣想得太满。</p><h2 id="source-p149l20">从了解走到购买</h2><h3 id="source-p149l21">先确认是否确有需要</h3><p id="source-p149l22">许多人会被“反应热烈”所迷惑。他们以为对方频频点头、连连称赞，就意味着成交。但“心动”不等于“行动”。交流有没有价值，不能只看当场有没有订单。听懂以后决定不买，也应尊重。有了兴趣以后，还需要通过实际行动，逐步建立信任。</p><h3 id="source-p150l3">让对方知道将买到什么</h3><p id="source-p150l4">愿意付钱，通常经过了对需要、价格和信任的考虑。购买以后，客户仍有自己的判断权。提供服务的人，应把使用要求和后续安排说明白。对方愿意行动，说明此前的交流已经建立了一定信任；这份信任还需要继续维护。</p><h3 id="source-p150l13">从一次服务学到经验</h3><p id="source-p150l14">购买发生以后，会出现使用和售后的具体问题。有的人愿意分享经历，有的人只想自己使用，两种选择都可以。成交之后，服务和跟进才刚刚开始。</p><h2 id="source-p150l21">谈购买时容易遇到的问题</h2><h3 id="source-p150l22">没有问清还需要什么信息</h3><p id="source-p150l24">新人常常觉得：“他听懂了、也挺有兴趣，应该会主动找我。”这时可以询问是否还有问题，而不是替他猜测。</p><p id="source-p151l1">“还有哪一部分需要说明？你想再看看资料，还是暂时不考虑？”答复以后，让他自己决定。</p><h3 id="source-p151l4">过度解释</h3><p id="source-p151l5">很多人一到关键时刻就慌了：“他好像还有点犹豫，再多讲点产品成分吧！”</p><p id="source-p151l7">“再多讲一点资料吧，也许他就懂了！”结果讲得越多，越乱、越空、越失焦。先回答尚未解决的问题，不必重新讲一遍所有材料。</p><h3 id="source-p151l12">价格焦虑</h3><p id="source-p151l13">客户觉得贵，可能是在比较价值，也可能是预算确实有限。先听清是哪一种情况。价格本来就是选择的重要条件，不能把它当作不该出现的顾虑。说明价格对应的产品和服务，不用“尊严”“未来”来代替费用讨论。价格之外，还要把产品能提供的价值讲清楚。</p><h2 id="source-p152l0">帮助对方作决定</h2><h3 id="source-p152l1">询问还有什么疑问</h3><p id="source-p152l2">问题应当帮助了解需要，不能预先把答案设成购买。</p><p id="source-p152l6">例如：</p><p id="source-p152l7">• “你最想了解这款产品的哪一项信息？”</p><p id="source-p152l8">• “现在考虑它，主要是出于什么需要？”</p><p id="source-p152l9">听完以后，才能知道有没有适合的选择。让对方想清楚之后，自己说出“我愿意”。</p><h3 id="source-p152l12">把选择摆清楚</h3><p id="source-p152l13">已经决定购买的人，可以进一步比较规格和数量。尚未决定的人，应保留不买的选择。可以问：</p><p id="source-p152l16">• “这两种规格有什么差别，你想再比较一下吗？”</p><p id="source-p152l17">• “要不要先带资料回去看看？”</p><p id="source-p152l19">选项要真实，不能把两个购买选项当作对方唯一的回答。</p><h3 id="source-p152l22">参考经历，核对资料</h3><p id="source-p152l23">别人已经购买的消息，可能会影响一个人的判断。介绍这类信息时，要留意是否给对方添了压力。可以讲相关经历的完整经过，并说明个体情况不同。不必用“大家都买了”催促决定。愿意了解别人的经历以后，仍要回到自己的需要。</p><h2 id="source-p154l0">几种常见的购买情境</h2><h3 id="source-p154l1">先把费用算清楚</h3><p id="source-p154l2">当对方犹豫价格时，不要急着解释，更不要匆忙降价。先按相同口径列清费用，再讨论差异。每个人对咖啡、外卖或娱乐的安排不同，不必先把他的消费习惯评成浪费。如果考虑增加一项支出，就看看预算里是否有余地，是否需要减少其他支出。费用仍是费用，不能换成“投资”两个字就省去实际比较。先把账算明白，对方才知道这一步对自己的生活意味着什么。</p><h3 id="source-p154l20">交流体验与实际需要</h3><p id="source-p154l21">活动可以让人听到更多信息，也可能使人更容易受到现场气氛影响。介绍者应当给对方安静考虑的时间。可以邀请他向有相关经验的人提问。参与者的经历，按实际情况说明。对方是否购买，不由在场多少人已经购买来决定。别人的经历，可以帮助他联系自己的情况来考虑。</p><h3 id="source-p155l11">替家人选东西</h3><p id="source-p155l12">谈起父母，许多人会格外认真。这时更要听清家人实际需要什么。</p><p id="source-p155l16">“父母最近怎样？有没有他们自己想解决的问题？”选东西以前，也应听听父母的想法。</p><p id="source-p155l21">案例：小赵的朋友犹豫再三。</p><p id="source-p155l23">小赵把话题转到父母身上，用将来可能后悔的话催促对方。朋友受到触动，最后签了字。这类经过值得反省：一时动容，不能代替对产品和费用的了解。关心亲人，不应变成购买压力。谈到家人时，也要理解他对亲人的牵挂。</p><h3 id="source-p156l4">给考虑留出时间</h3><p id="source-p156l5">有的人担心自己不会使用，或者出了问题没人答复。害怕自己不会、怕被笑话、怕失败。此时最有力量的一句话是：“没关系，我陪你一起开始。”</p><p id="source-p156l10">“我们先从小目标做起，慢慢走。”把能够提供的帮助讲具体，对方才知道自己能得到什么。陪同需要有明确安排，答应的事情应当做得到。有些人需要先有人陪着做一次，才愿意开始。</p><h2 id="source-p156l20">案例拆解</h2><h3 id="source-p156l21">只介绍投入，没听清需要</h3><p id="source-p156l22">小陈面对犹豫的朋友，拼命强调——“这绝对能赚钱！”结果对方立刻摇头：“我不是来投资的。”这里的问题，是作出了无法保证的收入承诺，也没说明实际工作。换一个更温柔的语气，也不能解决这个问题。</p><h3 id="source-p157l3">一起核对资料和预算</h3><p id="source-p157l4">小李先听同事说完最近关心的事，再说明手头有哪些资料。他把产品的具体信息和使用要求交给对方查看。对方问过问题后，再考虑是否尝试。这种交流的重点，是把需要、信息和选择放在一起讨论。把问题放回对方的处境中，他才有机会找到自己的答案。</p><h2 id="source-p157l14">实操练习</h2><h3 id="source-p157l15">练习一：购买前的提问</h3><p id="source-p157l16">找一个伙伴，模拟对话，围绕以下三问：</p><p id="source-p157l17">• “你最关注什么？”</p><p id="source-p157l18">• “还有哪些信息需要补充？”</p><p id="source-p157l19">• “你想怎样安排下一步？”</p><h3 id="source-p157l20">练习二：算账演练</h3><p id="source-p157l21">选择一款具体产品，列出规格、单价、预计使用数量和相关费用。再找同类选择，用相同口径作比较。让伙伴检查有没有遗漏费用或夸大用途。</p><h3 id="source-p158l2">练习三：为家人作选择</h3><p id="source-p158l3">练习把决定交还给实际使用的人：</p><p id="source-p158l4">• “这件东西，你自己需不需要？”</p><p id="source-p158l5">• “有什么信息还没弄清楚？”</p><p id="source-p158l6">• “现在不买也可以，我们再看看。”</p><p id="source-p158l20">认真听完、把问题说清楚，再陪对方尝试，信任才有机会落在实际的事情上。购买产品之后，客户还需要了解怎样使用，也需要有人回应后续的问题。</p><nav><a href="ch15.html">上一节</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">全书目录</a> · <a href="ch17.html">下一节</a></nav></main></noscript></body></html>
