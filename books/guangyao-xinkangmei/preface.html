</head><body><div id="root"></div><noscript><main style="max-width:760px;margin:auto;padding:40px 24px;line-height:1.9"><nav><a href="/#books">全部著作</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">广药新康美</a></nav><h1>写在前面</h1><p>何华清 著</p><h3 id="source-frontmatter_subtitle_v42">——从产业到家庭</h3><p id="source-frontmatter_01">2021年8月2日，广药集团首次进入《财富》世界500强，位列第468位。<sup><a href="#source-frontmatter_ref_1">〔1〕</a></sup>一家以中医药为主业的企业走到这个规模，背后有许多年生产和经营的积累。我想在书的开头，先谈谈这些积累与我们有什么关系。这份榜单按企业营业收入排列。<sup><a href="#source-frontmatter_ref_2">〔2〕</a></sup>排名告诉我们企业有多大，至于它怎样做事，还要看原料怎样检验、产品怎样生产、货物怎样送到消费者手中。这些环节平常很少出现在宣传的中心，却直接影响人们买到的东西。</p><p id="source-frontmatter_04">广药旗下有陈李济、王老吉等老字号。<sup><a href="#source-frontmatter_ref_3">〔3〕</a></sup>老招牌经历过漫长岁月，今天的消费者却仍有今天的问题：价格是否合适，质量能否放心，自己到底需不需要。了解企业历史以后，这些问题还得逐一回答。谈广药新康美，很容易停在“平台有多大、背景有多强”上。了解背景有必要，但具体到自己的工作，还要再往下看。</p><p id="source-frontmatter_06">这里先分清几个名称。广药集团的公开介绍使用“参股康美药业”的表述；康美时代（广东）发展有限公司，在康美药业2025年年报中列为直接持股100%的子公司。<sup><a href="#source-frontmatter_ref_3">〔3〕</a></sup><sup><a href="#source-frontmatter_ref_4">〔4〕</a></sup>介绍业务时，哪一家企业做了什么，就说清哪一家企业，不能把几个名称混在一起。</p><p id="source-frontmatter_07">康美药业年报介绍了中药材种植、研发、中药饮片生产和销售服务等业务。<sup><a href="#source-frontmatter_ref_4">〔4〕</a></sup>这些是了解康美时代时可以继续追问的产业条件：某一款产品用到了哪些资源，原料、配方和质量有怎样的依据，需要查具体资料。对于一个普通人，这里面有一种很实际的可能。自己没有条件建药材基地、办工厂、组织检验和运输，却可以在弄懂产品、明确职责之后，从服务身边几个家庭做起。前面已经有人完成的工作，让后来的人有机会把时间花在离消费者更近的地方。</p><p id="source-frontmatter_10">一件产品从生产线上下来，还没有回答一个家庭的全部问题。买回去放在哪里，怎样按标签要求食用，什么情形不适合，遇到问题找谁，有时都需要有人耐心说明。资料上看起来很简单的一句话，到了具体的生活里，未必人人都能一下明白。</p><p id="source-frontmatter_11">试想，一位顾客拿着产品问你：“这个究竟有什么用？我们家需要吗？”如果我们只会再讲一遍企业有多大，他的问题还留在那里。把说明书摊开，讲清产品属于什么类别，能提供哪些已经有依据的信息，哪些问题需要另外请教专业人员，这才是在回应他。消费者接触到的，是手中的产品和面前的人。企业有没有把事情做好，他会从购买和使用的经历中慢慢判断。</p><p id="source-frontmatter_13">草本产品也有许多相似的选择。为什么选这一种，价格差在哪里，配方和规格有什么不同，都应讲明白。介绍到自己不懂的地方，可以先记下来，查清楚以后再答复。我也愿意用一个很朴素的问题，来衡量这份工作有没有做出价值：如果一个人只想买东西自己用，没有参与经营的打算，也不准备介绍朋友，他还愿不愿意选择我们的产品和服务？</p><p id="source-frontmatter_15">回答这个问题，需要听顾客说话。他可能喜欢方便，也可能觉得价格太高，或是用过以后不合适。这些意见都要收回来。即使他最后没有购买，也不妨把话听完，让他按自己的需要作决定。由此再去看行业，眼光会有所不同。健康与生活相连，范围很广；落到我们手里，先是几个具体的人，几件能够做好的事。与其急着估算一个庞大市场能分给自己多少，不如先弄清身边的家庭在为什么事情发愁，自己又能在职责范围内帮上什么忙。</p><p id="source-frontmatter_17">一场讲解后，顾客是否看懂了标签；一次售后，问题有没有解决；老顾客再次来找你，认可的是哪些地方。留意这些反馈，才能知道接下来该改什么。经营的账也要认真算。货卖出了多少，款收回了多少，花了多少时间和费用，都应当如实记下来。账面上的热闹，未必就是一家人的日子有所改善。做了一段时间，能坐下来看看自己究竟留下了什么，再决定下一步怎么走，会少一些盲目，也少给家人添一些本可避免的负担。</p><p id="source-frontmatter_19">带团队同样如此。新人来到这里，带着的可能是期待，也可能是对现状的不安。我们给他介绍机会，也要给他了解实际工作的时间。他需要学会的事情，一件件教；他暂时做不好的地方，一起找原因。每个人的处境不同，走路的快慢也会不同。一个团队能容得下这样的差别，人才有可能安心成长。</p><p id="source-frontmatter_20">中医药产业离人们的生活很近，背后的生产过程却相当复杂。我觉得，这里有许多值得长期了解的事情。普通人可以从自己的职责做起，学会介绍产品，也学会处理那些琐碎、具体的服务问题。书名里用了“修行”二字，指的也是做事过程中对自己的要求。客户有自己的身体、收入和家人，有些顾虑未必会直接说出来。谈事业时，要记得自己面对的是这样一个人。</p><p id="source-frontmatter_22">一本书可以把方法写下来，许多细节还得在做事时慢慢体会。有些话讲得过满，后来需要收回来；有些问题一开始不懂，回去查过，再给人答复。愿意这样一点点修正自己，日子久了，才有可能成为别人愿意信赖的人。了解产业，是为了把眼前的工作看得更清楚。书里接下来谈的，便是这些日常的事。</p><h2 id="source-frontmatter_refs_title">本篇资料出处</h2><p id="source-frontmatter_ref_1" class="gy-note">〔1〕《财富》中文网：《2021年世界500强榜单上的143家中国公司》，2021年8月2日。 <a href="https://www.fortunechina.com/fortune500/c/2021-08/02/content_394569.htm" target="_blank" rel="noopener noreferrer">查阅资料</a></p><p id="source-frontmatter_ref_2" class="gy-note">〔2〕Fortune Media：2026年世界500强榜单发布说明，2026年7月28日。 <a href="https://www.prnewswire.com/news-releases/fortune-announces-2026-fortune-global-500-list-302835648.html" target="_blank" rel="noopener noreferrer">查阅资料</a></p><p id="source-frontmatter_ref_3" class="gy-note">〔3〕广药集团官网及集团介绍：企业业务、旗下老字号及参股康美药业的表述。 <a href="https://www.gpc.com.cn/aboutUs.html" target="_blank" rel="noopener noreferrer">查阅资料</a> <a href="https://gpc.com.cn/" target="_blank" rel="noopener noreferrer">官网</a></p><p id="source-frontmatter_ref_4" class="gy-note">〔4〕康美药业：《2025年年度报告》，第16—19页、第232页。 <a href="https://static.cninfo.com.cn/finalpage/2026-04-18/1225121661.PDF" target="_blank" rel="noopener noreferrer">查阅资料</a></p><p id="source-frontmatter_note" class="gy-note">资料核对日期：2026年11月19日。文中的经营认识为本书的讨论与判断。</p><nav><a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">全书目录</a> · <a href="author-preface.html">下一节</a></nav></main></noscript></body></html>
