</head><body><div id="root"></div><noscript><main style="max-width:760px;margin:auto;padding:40px 24px;line-height:1.9"><nav><a href="/#books">全部著作</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">广药新康美</a></nav><h1>第十七章｜让好的做法留下来</h1><p>何华清 著</p><h2 id="source-p159l7">学会了，为什么教不出去</h2><p id="source-p159l8">在同一个会议上，小李和小赵都带了三位新人。他们听着同样的导师、同样的内容、同样的激励，连笔记都几乎一样。三个月后，小李带来的新人里，有人能独立邀约，有人开始练习主持。小赵带来的几个人，后来却很少参与。导师问他们：“你们知道差别在哪里吗？”小赵说：“我把每一步动作都教了。”小李谈到，自己给新人安排过练习，也留时间听他们说困难。讨论两人的做法，不能只看教过哪些内容，还要看新人有没有机会尝试。</p><h2 id="source-p160l6">学过以后，为什么仍做不出来</h2><p id="source-p160l7">动作容易模仿，难的是理解为什么这样做。</p><h3 id="source-p160l8">模仿动作以后仍要理解</h3><p id="source-p160l9">新人可能背得出说法，却不知道遇到新问题该怎样回应。要把练习、反馈和下一次尝试接起来，才容易逐渐学会。</p><h3 id="source-p160l15">安排以外，还要看日常相处</h3><p id="source-p160l16">要求说清楚后，也要了解伙伴是否有困难。</p><p id="source-p160l19">有机会表达意见，大家才能一起调整安排。</p><h3 id="source-p160l22">一次成绩与日常习惯</h3><p id="source-p160l23">一时热情过去以后，还要有能够持续完成的安排。常用做法整理下来，人员交接时也更容易说明。安排稳定以后，很多事情就不必每次重新提醒。</p><h2 id="source-p161l5">方法以外，还要留意什么</h2><h3 id="source-p161l6">相处的方式</h3><p id="source-p161l7">新人进入团队，会留意别人怎样说话、怎样处理事情。有人耐心回答问题，也愿意让他试一试，他就更容易参与。</p><p id="source-p161l15">案例：阿芳第一次带新人参加会议，新人什么都不懂，她没有讲太多，只是轻轻说：“你先感受。”</p><p id="source-p161l19">结果新人回来后对她说：“我不知道原理是什么，但我被那种氛围打动了。”现场受到鼓舞以后，还要回到具体内容，看看究竟学会了什么。相处的气氛，会影响伙伴是否愿意开口、是否愿意继续参与。</p><h3 id="source-p162l0">日常的安排</h3><p id="source-p162l1">每天邀约、每周例会、每月复盘。固定安排能减少临时起意，但也要根据实际情况调整。</p><p id="source-p162l7">案例：小李的团队有一个小仪式——每天晚上九点，大家在群里打卡“今天邀约了几人”。</p><p id="source-p162l11">最初是导师监督，后来大家互相提醒。再后来，即使导师出差，大家也会自发完成。半年过去，这个“简单动作”变成了他们的共同节拍。记录用于了解工作情况，不应让人为了完成数字勉强联系别人。</p><h3 id="source-p162l19">遇到困难的态度</h3><p id="source-p162l20">联系别人时，难免会遇到拒绝。被拒绝时，先听清原因，尊重决定。新人也会观察带头的人怎样面对不顺。可以坦诚说有些失落，再一起回看过程，不必强装兴奋。</p><p id="source-p163l1">案例：小赵被拒绝时叹气抱怨，团队气氛瞬间下滑；小李却总能带着笑说：“没关系，今天学到经验了。”</p><p id="source-p163l4">后来，团队逐渐形成了回顾问题、调整做法的习惯。带头的人怎样面对拒绝，新人也会看在眼里。</p><h2 id="source-p163l8">在哪些场合一起学</h2><h3 id="source-p163l9">会议中的示范与练习</h3><p id="source-p163l10">会议让伙伴有机会共同学习。除了听讲，也应留机会提问、练习和回顾。会议除了讲知识，也让伙伴看见其他人怎样面对工作中的问题。</p><h3 id="source-p163l17">伙伴之间的日常交流</h3><p id="source-p163l18">同伴能够提供支持，也可能带来比较和压力。看见别人进步，可以询问方法，不必要求自己照着同样速度走。群体既是压力，也是支撑。共同安排应当容得下个人的实际情况。</p><h3 id="source-p164l0">讲述做过的事情</h3><p id="source-p164l1">具体经历容易让人理解当时的处境。</p><p id="source-p164l4">例如，一个人怎样从不敢开口到能够讲清楚，中间遇到什么问题、怎样练过，都可以慢慢说。故事帮助理解，实际操作仍需要练习。</p><h2 id="source-p165l0">带教中容易忽略的事</h2><h3 id="source-p165l1">教过动作，却没检查是否理解</h3><p id="source-p165l2">有时邀约和讲解教得很勤，却没有问新人是否明白每一步的目的。他能够模仿，遇到不同情况时却不知道怎样调整。受挫后停下来，可能正是因为有具体困难没有解决。教完以后，请他用自己的话说明理由，再试着处理一个变化的场景。</p><h3 id="source-p165l14">过度依赖个人</h3><p id="source-p165l15">所有工作都集中在一个人身上，其他人就很难接手。会议要他主持，邀约要他出面，成交要他背书。团队看似热闹，其实人人在等领导开口。负责人出差或生病，日常工作也就容易停下来。逐项分工，并留出练习时间，比继续增加负责人的工作更有用。</p><p id="source-p165l23">案例：小赵的团队，每次会议都由他主持。</p><p id="source-p165l24">他一周不在，整个团队便陷入静默。他很困惑：“我教了那么多，为什么没人接得住？”导师笑着说：“因为你从没让他们练。”小赵需要把一项工作交给同伴，让他从准备到完成实际负责一次。</p><h3 id="source-p166l2">急于求成</h3><p id="source-p166l3">有些领导太心急，希望新人“一周成才”，总想让他们立刻能邀约、成交、开会。不同人需要的练习时间并不一样。催得过紧，人可能只顾完成要求，来不及消化。先看看对方具体卡在哪里，再安排下一次练习。</p><h2 id="source-p166l14">典型案例</h2><h3 id="source-p166l15">所有工作都等小赵处理</h3><p id="source-p166l16">小赵的团队起初很有冲劲。他开会激情澎湃，伙伴们也频频响应。但几个月后，他发现——只要他不在，大家立刻失去方向。有人问：“赵哥，下次活动还开吗？”有人说：“你不在，我们不好意思带人。”事情又回到了小赵一个人身上。他意识到，教过以后还要让伙伴亲自负责。团队暂时离不开负责人，就从最容易交接的一件事开始练。</p><h3 id="source-p167l2">让伙伴独立负责</h3><p id="source-p167l3">小李的团队运作简单却稳健。他让愿意尝试的伙伴轮流主持，提前一起准备，结束后再给反馈。三个月后，团队里每个人都能主持、都能讲故事。大家逐渐知道遇到问题该找谁配合。有一次，小李外出两周，回来发现会议照常进行。他说：“现在有人能接手了，我也能把时间用在别的事情上。”这次外出，让他看见哪些工作已经有人接得住。</p><h2 id="source-p167l18">回看四个方面</h2><h3 id="source-p167l19">动作是否学会</h3><p id="source-p167l20">让新人学会“怎么做”——如何邀约、如何沟通、如何成交。学会基本动作以后，再看能否面对不同情况。</p><h3 id="source-p168l0">习惯是否养成</h3><p id="source-p168l1">让动作变成节奏。每天的邀约、每周的例会、每月的总结。安排稳定以后，也要检查是否仍适合当前工作。</p><h3 id="source-p168l5">遇到困难能否处理</h3><p id="source-p168l6">让人学会面对拒绝、承受挫折、保持热情。遇到困难时，能够商量和调整，工作才有继续的可能。</p><h3 id="source-p168l10">是否形成共同做法</h3><p id="source-p168l12">共同的习惯需要在做事时反复实践。对客户守约，对同伴坦诚，遇到问题愿意一起处理，都比抽象的口号更容易学习。</p><h2 id="source-p168l22">实操练习</h2><p id="source-p168l23">练习一：回看自己的团队，大家是否学会了基本动作、形成了日常习惯，遇到问题能否一起处理。</p><p id="source-p169l0">练习二：下次例会请一位愿意尝试的新人主持，事先一起准备。</p><p id="source-p169l1">提前和他一起准备，结束后再看哪里做得好、哪里需要练。</p><p id="source-p169l3">练习三：愿意分享的伙伴可以写一段照顾家人或照顾自己的经历，再谈谈其中的困难。</p><p id="source-p169l4">愿意公开的再分享，也可以只作为自己的学习记录。培训之后，还要有持续练习和带人的安排。带过的伙伴学会带新人，经验就有了下一位接手的人。</p><nav><a href="ch16.html">上一节</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">全书目录</a> · <a href="ch18.html">下一节</a></nav></main></noscript></body></html>
