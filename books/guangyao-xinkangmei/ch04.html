</head><body><div id="root"></div><noscript><main style="max-width:760px;margin:auto;padding:40px 24px;line-height:1.9"><nav><a href="/#books">全部著作</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">广药新康美</a></nav><h1>第四章｜产品、团队与工具</h1><p>何华清 著</p><p id="source-p46l20">第一章提过个人、企业、会议、产品、团队和工具六个方面。这里接着谈后三项：产品怎样介绍，讲解怎样分工，资料怎样使用。</p><h2 id="source-p46l19">介绍产品</h2><p id="source-p47l0">讲产品需要了解标签和资料，也可以说说自己的使用经历。两种内容应当分清：个人感受有助于理解，但不能代替对产品的说明。那天，阿明更新了一条朋友圈：</p><blockquote><p id="source-p47l3">“这阵子早上醒来没以前那么累，具体是什么原因，我还在留意。”</p></blockquote><p id="source-p47l5">三十分钟内，五个朋友留言：“你最近气色真好。”“你用的什么？”这条记录从自己的生活说起，朋友也就有了继续问的兴趣。个人体验可以引起兴趣，具体选择仍需要产品资料和实际需要来支持。用过的产品，可以如实讲自己的感受；没有用过的，就依据资料介绍，不把别人的经历说成自己的。成分和使用要求要讲得容易懂，不能因为故事好听就略去这些信息。需要试饮或试用时，先说明产品信息，确认对方愿意。</p><h3 id="source-p48l15">阿慧的日常记录</h3><p id="source-p48l16">阿慧不擅长表达，也不喜欢推销。导师让她记录自己的身体变化：“睡眠、肤色、心情，一天一句。”一个月后，她把这三十句做成小卡片。朋友看完后说：“我不需要被说服，我想试试看。”这些日常记录，给了阿慧一个容易开口的话题。另一位年轻白领长期熬夜，常常睡不好。她接触到黄精枸杞饮，也开始和导师聊起自己的生活状况。半个月后，她谈到自己的睡眠感受有了变化。</p><p id="source-p52l0">她随后把这段经历讲给别人。讲述时，应把观察与产品作用分开，不把先后发生的事情直接写成因果。</p><h2 id="source-p47l10">与同伴分工</h2><p id="source-p47l11">讲解不必全由一个人承担。新人遇到不懂的问题，可以向同伴求助。学习群、导师、会议和资料，各有用处，先想清楚哪一种最能回答眼前的问题。很多新人犯的错，是想“一个人说完所有事情”。说不清楚时，可以坦诚地说：“这个问题我还没弄懂，我们一起请教一下。”安排好流程，团队中不同的人就能各自承担一部分讲解。共同的问题整理成资料，重复的工作安排好分工，能减轻个人的负担。ABC配合，是由一位同伴协助新人向交流对象作说明。</p><p id="source-p50l19">协助者补充知识，新人也要参与，逐步学会独立回答。名单、邀约、沟通、购买和服务，各环节由谁负责，都可以事先安排。团队还需要形成共同习惯，例如准确介绍、尊重选择、及时处理问题。新来的人接触到这样的环境，会更容易知道自己该怎样做事。</p><h3 id="source-p48l22">学习群里的一次回应</h3><p id="source-p48l23">老陈邀请朋友进学习群，朋友三天没回应。第四天，群里发了一段日常健康照护的分享。朋友随后私信老陈，想进一步了解。先前没有回复，并不代表他一直没有留意群里的内容。小王带朋友去沙龙，请导师帮助回答自己暂时说不清的问题。朋友听完以后，决定继续了解。小王也记下了导师怎样解释，留着回去练习。</p><h2 id="source-p47l24">选择合适的工具</h2><p id="source-p47l25">最后一要素，是工具。自动回复、朋友圈和短视频，都可以用来传递信息。一段简短的视频或一份清楚的资料，有时可以省去重复讲解。拍摄不必追求完美，内容要准确，事情要说清楚。别人连续看过几次分享，才会逐渐了解你在做什么。那天晚上，小陈终于发了他第一条视频：</p><p id="source-p48l7">他拍下泡饮品的日常，讲了这段时间的睡眠感受，也说自己还在观察。第二天早晨，七个点赞，三个私信。他笑了。有人愿意提问，让他觉得这次尝试有了回应。借助工具，一次分享可以被更多人看到。工具可以按用途来选。硬工具：PPT、资料、产品手册——让复杂变清晰。软工具：故事、语言模板——让新人有话可说。新工具：微信群、短视频、线上讲座——让信息传得更远。</p><p id="source-p51l15">案例：一位宝妈最初羞于开口，却坚持每天在朋友圈发一次健康小故事。</p><p id="source-p51l18">一个月后，找她的人比她主动邀约的还多。这些记录让朋友逐渐了解她在做的事情。</p><h3 id="source-p49l1">小美第一次拍视频</h3><p id="source-p49l2">小美从来不拍视频，觉得害羞。后来，她看见同伴拍的一段泡饮品的日常短片，觉得自己也可以试试。第二天她也拍了一条。这次尝试带来了新的询问，也让她发现视频可以成为交流的补充。小敏每天在群里分享健康知识，也转发适合成员需要的官方讲座。三个月后，她的团队扩展到几十人。有人告诉她，平时看过那些分享，见面时已经有了一些了解。</p><h2 id="source-p52l8">实操练习</h2><p id="source-p52l9">练习一：选一段亲身使用产品的经历，用一分钟讲清楚；分清观察到的变化和自己尚不能确定的原因。</p><p id="source-p52l10">练习二：和伙伴模拟一次三人交流。新人先说，协助者补充，交流对象提出问题；结束后一起检查回答是否清楚。</p><p id="source-p52l11">练习三：列出可用的资料和工具，选一两种最适合当前工作的使用，并记录对方的反馈。</p><p id="source-p49l21">分好工以后，个人就能腾出手来处理更具体的问题。也要经常看看，资料是否过时，同伴能否接手，客户的问题有没有得到答复。</p><nav><a href="ch03.html">上一节</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">全书目录</a> · <a href="ch05.html">下一节</a></nav></main></noscript></body></html>
