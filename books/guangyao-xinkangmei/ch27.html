</head><body><div id="root"></div><noscript><main style="max-width:760px;margin:auto;padding:40px 24px;line-height:1.9"><nav><a href="/#books">全部著作</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">广药新康美</a></nav><h1>第二十七章｜怎样带出能独立做事的人</h1><p>何华清 著</p><h2 id="source-p252l9">导师的力量</h2><p id="source-p252l10">小芳是团队里最不起眼的新人。她第一次发朋友圈时手抖了五次，打完一段话又删掉；第一次邀约时被拒绝三次，回家哭了一晚上。她曾以为自己真的不行，甚至准备放弃。直到导师在群里@她：“别急，我陪你试一次。”那天，导师陪她写下了第一条朋友圈，帮她打了第一通邀约电话，还在会议上用掌声给她第一个“公开认可”。半年后，她也开始帮助新人。回想起初那段日子，她说：“有人陪我做过几次，我才慢慢不那么怕了。”</p><p id="source-p252l20">她开始带新人时，还记得自己第一次开口有多难。导师的工作，是帮助新人逐渐理解方法，并能独立使用。</p><h2 id="source-p253l1">为什么要建立导师体系？</h2><h3 id="source-p253l2">新人需要有人可以请教</h3><p id="source-p253l3">新人最容易在三个阶段掉队：</p><p id="source-p253l4">• 第一次邀约被拒绝；</p><p id="source-p253l5">• 第一次成交失败；</p><p id="source-p253l6">• 第一次被质疑时无人支持。</p><p id="source-p253l7">碰到这些事，有一位熟悉情况的人可以商量，会少一些无助。一起回看那次对话，通常比简单说一句“坚持下去”更有帮助。新人没有人带，容易各自摸索同样的问题，也难以判断自己做得是否合适。</p><h3 id="source-p253l11">把经验教给后来的人</h3><p id="source-p253l12">资料能够写下流程，但遇到具体问题，仍需要示范和解释。导师把自己怎样做、为什么这样做讲清楚，新人才容易上手。有稳定的导师安排，入门经验才容易一批批传下去。</p><h3 id="source-p253l17">让问题有人回应</h3><p id="source-p253l18">当团队高速扩张时，焦虑、误解、信任危机都会出现。带教人员需要留意：</p><p id="source-p253l20">• 新人是否遇到困难；</p><p id="source-p253l21">• 对工作有没有误解；</p><p id="source-p253l22">• 哪些问题需要其他负责人共同处理。</p><h2 id="source-p254l0">不同带教工作怎样分配</h2><h3 id="source-p254l1">个人导师：手把手带人</h3><p id="source-p254l2">新人开始工作时，可以约定一位主要的带教人员。先安排三十天，再按实际进度调整。先熟悉产品和服务，再练习联系、沟通与后续跟进。带教需要一起做过几次，不能只发一份资料。隔一段时间回看一次，看看哪些已经会做、哪些还需要帮助。</p><h3 id="source-p254l10">小组导师：营造学习氛围</h3><p id="source-p254l11">每个小组导师负责5–10人，定期组织线上学习、案例分享、健康打卡。任务是：解决共性问题、保持团队温度。既要懂实际工作，也要能把常见问题讲清楚。小组导师除了安排工作，也要照顾学习中的交流和互助。</p><h3 id="source-p254l18">有经验的导师：处理较复杂的问题</h3><p id="source-p254l19">团队遇到难题时，需要有人帮助判断、协调资源。也要检查现有的教法是否有效，资料是否需要更新。导师要把经验交给新人，也要愿意陪他们走过一段不熟悉的路。这些工作可以按团队规模分配，不必为了凑齐层级而设岗位。</p><h2 id="source-p255l1">课程与日常学习怎样衔接</h2><h3 id="source-p255l2">安排合适的课程</h3><p id="source-p255l3">• 入门课程：产品知识、合规边界、话术基础。</p><p id="source-p255l4">• 进阶课程：客户经营、社群运营、活动策划。</p><p id="source-p255l5">• 成长课程：领导力、复盘思维、文化共识。</p><p id="source-p255l7">入门、上手、独立带人是不同阶段，应看实际能力，不能只按天数判定。每次学习后，最好有一件能试着做的事。</p><h3 id="source-p255l10">集中学习与练习</h3><p id="source-p255l11">• 周末小营：半天到一天，专注单主题。</p><p id="source-p255l12">• 较长的培训：围绕明确的学习目标，安排课程、练习与休息。</p><p id="source-p255l13">集中活动也要让人学到具体内容，不宜只追求现场情绪热烈。营会中的分享和安静思考，可以让参与者重新想想自己为什么做这件事。</p><h3 id="source-p255l16">让资料和后续支持接得上</h3><p id="source-p255l17">课程、练习、日常带教和资料查阅，要能接得上。线上学习平台与线下活动结合，让新人无论在哪个城市，都能有导师陪伴。培训内容和流程整理清楚以后，后来的导师就有了可以参考的做法。</p><h2 id="source-p256l14">常用的带教资料</h2><p id="source-p256l15">带人需要耐心，也需要把常用资料和安排整理清楚。</p><h3 id="source-p256l19">新人入门手册</h3><p id="source-p256l20">手册先回答新人眼前最常遇到的问题。</p><p id="source-p256l21">• 第1天：认识事业、列出10个潜在客户、写下第一条朋友圈。</p><p id="source-p256l22">• 第1周：完成前三次邀约，不论成败，都要总结。</p><p id="source-p256l23">• 第一个月：参与一次团队活动，了解准备、现场配合和后续服务。</p><p id="source-p257l0">这些只是参考安排，应和新人一起商量进度。</p><h3 id="source-p257l2">常见问题答疑库</h3><p id="source-p257l3">把经核对的常见问题整理下来，便于新人查阅；没弄清楚的，继续核实。</p><p id="source-p257l4">• 客户问“是不是药”：找到对应产品的标签和资料，说明具体类别，不能笼统回答所有产品。</p><p id="source-p257l6">• 客户说“不在预算内”：尊重他的实际情况，不劝借钱或挪用必要生活支出。</p><p id="source-p257l7">• 客户问“为什么选你们”：把可核对的产品资料、价格和服务说清楚，让他自己比较。</p><p id="source-p257l8">答疑库要注明出处和更新日期，也要教新人什么时候需要转交专业人员。</p><h3 id="source-p257l9">成长追踪表</h3><p id="source-p257l10">导师记录每位学员的成长轨迹：</p><p id="source-p257l11">• 本周行动数（邀约、成交、分享）；</p><p id="source-p257l12">• 本月进步点（自信、语言、复盘能力）；</p><p id="source-p257l13">• 下阶段目标（突破点与挑战计划）。</p><p id="source-p257l14">记录以后，和学员一起核对，不要只由导师单方面打分。工具帮助导师记清事情，日常交流则让他了解新人的实际处境。</p><h2 id="source-p257l17">培训营的运营流程</h2><p id="source-p257l18">培训营要把学习、练习和实际交流安排在一起。安排之前，先说清这次要学会什么，怎样判断有没有学会。</p><h3 id="source-p257l20">相互认识、讲解、练习与后续安排</h3><p id="source-p257l21">相互认识：简短介绍，让大家知道彼此的工作经历和学习需要。不要求每个人公开私人经历。传授（启发）导师登场，讲解核心理念与方法。讲的不只是“怎么做”，更是“为什么这样做”。</p><p id="source-p258l0">目标：让理念与行动结合，激发理解与信任。</p><p id="source-p258l1">演练（行动）角色扮演、模拟邀约、朋友圈实操。先演示，再让学员练，讲不清或做不到的地方继续帮助。</p><p id="source-p258l3">练习以后，应能知道自己还差在哪里。</p><p id="source-p258l4">安排下一步：每位学员选一件愿意尝试的事，约好何时反馈。</p><p id="source-p258l6">目标应由本人认可，不要求在现场气氛中作过重的承诺。</p><p id="source-p258l7">活动结束以后，还要有人回应实际工作中的问题。</p><h2 id="source-p258l8">一次培训营的回顾</h2><p id="source-p258l9">在广州的一次两天一夜培训营里，共有三十名新人参加。第一天，大家不太熟悉。第二天分组演练，开口的人渐渐多了起来。现场有十人当场完成第一次邀约，三人直接成交。回去以后，还需要继续了解他们能否独立完成工作，而不能只用当天的邀约或成交判断培训效果。主导师回顾时，特别提到模拟练习让新人有了第一次尝试的机会。这次机会有用，但后续的带教同样不能省。</p><h2 id="source-p258l19">常见误区与改进</h2><section class="gy-table" id="source-p258l20" aria-label="分项对照"><div class="gy-record"><p id="source-p258l20-r1-c1"><span class="gy-label">常见问题</span><span class="gy-value">只讲不练</span></p><p id="source-p258l20-r1-c2"><span class="gy-label">表现</span><span class="gy-value">听过了，实际仍不会做</span></p><p id="source-p258l20-r1-c3"><span class="gy-label">调整办法</span><span class="gy-value">示范后安排练习，观察并反馈</span></p></div><div class="gy-record"><p id="source-p258l20-r2-c1"><span class="gy-label">常见问题</span><span class="gy-value">导师包办</span></p><p id="source-p258l20-r2-c2"><span class="gy-label">表现</span><span class="gy-value">新人遇事都等导师决定</span></p><p id="source-p258l20-r2-c3"><span class="gy-label">调整办法</span><span class="gy-value">交出合适任务，逐步减少代做</span></p></div><div class="gy-record"><p id="source-p258l20-r3-c1"><span class="gy-label">常见问题</span><span class="gy-value">课后无人回应</span></p><p id="source-p258l20-r3-c2"><span class="gy-label">表现</span><span class="gy-value">回到工作中又卡住</span></p><p id="source-p258l20-r3-c3"><span class="gy-label">调整办法</span><span class="gy-value">约定后续联系和答疑安排</span></p></div></section><p id="source-p258l24">带教人员要看学员实际做过什么、哪里需要帮助，再决定下一次教什么。</p><h2 id="source-p258l26">带教最终要交出什么</h2><p id="source-p258l27">新人能够独立做事，遇到问题知道怎样查、找谁问，才算逐渐学会了。情绪低落时，可以听他说说困难，但不要用鼓励代替解决实际问题。出现分歧时，把事情和理由讲清楚，也容许新人提出不同意见。愿意带人的伙伴，则可以再学习怎样示范、观察和反馈。有些人擅长服务，有些人愿意带教，不必要求每个人走同一条路。这样，团队也成为了伙伴相互学习的地方。导师体系最终要培养能够独立做事、也能够带人的伙伴。</p><nav><a href="ch26.html">上一节</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">全书目录</a> · <a href="ch28.html">下一节</a></nav></main></noscript></body></html>
