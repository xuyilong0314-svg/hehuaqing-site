</head><body><div id="root"></div><noscript><main style="max-width:760px;margin:auto;padding:40px 24px;line-height:1.9"><nav><a href="/#books">全部著作</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">广药新康美</a></nav><h1>第十二章｜团队里的信任与归属</h1><p>何华清 著</p><h2 id="source-p116l0">来到一个新团队</h2><p id="source-p116l1">初入系统的第一个月，小李总觉得自己“格格不入”。他坐在会议室的角落里，笑得拘谨，话到嘴边又咽下去。别人热烈讨论时，他只敢默默点头。他心想：“也许我并不适合这里。”直到有一天，导师带他去参加小组例会。那是一间普通的会议室，没有宏大的灯光，也没有业绩排名的焦虑。大家轮流讲近况，也问问彼此遇到了什么困难。有人讲被拒绝后的失落，有人谈照顾家人的压力，也有人说起最近学会的一件小事。</p><p id="source-p116l12">那一刻，他感到自己在这里有人关心，也有了归属感。团队里的关心和互助，要让独自遇到困难的人有地方说话，也有人愿意回应。</p><h2 id="source-p116l15">人在这里怎样相处</h2><p id="source-p116l18">团队有工作安排，也有日常相处。大家愿不愿意开口，遇到问题会不会得到回应，需要在相处中慢慢建立。</p><p id="source-p116l20">• 要求讲清楚，才能知道什么事情由谁负责。</p><p id="source-p116l21">• 对人的处境多了解一点，安排工作时才不至于只看任务。</p><p id="source-p116l22">• 分歧可以说出来，再一起找办法。</p><p id="source-p116l24">伙伴愿意一起做下去，也与大家共同认可的意义有关。文化要体现在相处和做事的方式里，团队才会愿意一起往前走。</p><h2 id="source-p117l0">团队里可以养成的习惯</h2><h3 id="source-p117l1">一起学习</h3><p id="source-p117l2">工作中总会遇到新的问题，需要有地方请教和讨论。持续学习，才有机会更新已有的认识。</p><p id="source-p117l4">• 定期交流：把近期的问题拿出来，一起看怎样处理。</p><p id="source-p117l5">• 经验分享：新人讲体会，老伙伴讲方法，让不同层次的人彼此启发。</p><p id="source-p117l6">• 再次练习：对还不熟的内容重做一遍，看有没有进步。</p><p id="source-p117l7">案例：小芳的团队有一条规则——每次例会，每个人都要说一句收获。</p><p id="source-p117l9">刚开始，有人支支吾吾；一个月后，大家都能自如表达；半年后，曾经害怕发言的人，已经成了培训讲师。固定留下这样的时间，学习才容易进入日常。</p><h3 id="source-p117l14">记得彼此的帮助</h3><p id="source-p117l15">说过“谢谢”之后，还要记得别人的帮助，并在有能力时回报。</p><p id="source-p117l17">• 感谢提供便利的人，也认真提出还需改进的地方。</p><p id="source-p117l18">• 记得谁曾经帮助自己，有机会也把帮助传给别人。</p><p id="source-p117l19">• 关心同伴的实际困难，力所能及时搭一把手。</p><p id="source-p117l20">案例：小赵的团队每次聚会，都有一个固定环节——感恩时刻。</p><p id="source-p117l22">有人感谢导师的陪伴，有人感谢团队的信任，有人感谢父母的理解。有位年轻人讲起，自己刚来时不敢说话，是同伴一次次陪他练习，才慢慢敢开口。听过这些经过，大家对彼此有了更多了解。</p><h3 id="source-p118l1">留意家庭与长辈的需要</h3><p id="source-p118l2">家庭是许多人工作之外最牵挂的地方。谈照顾父母，也是在谈怎样承担自己的责任。</p><p id="source-p118l5">• 分享父母的故事：让团队成员回望来路，理解奋斗的意义。</p><p id="source-p118l6">• 家庭健康日：邀请父母参与，让家人感受到这份事业的温度。</p><p id="source-p118l7">• 家人愿意时，可以参加合适的交流，不把工作安排强加给他们。</p><p id="source-p118l8">案例：张叔的团队举办了一场“孝亲健康日”。</p><p id="source-p118l10">几十位父母走进会议室，看到孩子认真讲述健康知识的模样，有人流泪，有人微笑。一位母亲哽咽地说：“原来你做的，是这么有意义的事。”这次活动让家人更了解他们在做什么，也提出了一些平时没有聊过的问题。孝道把团队讨论的话题与各自的家庭联系起来，也提醒大家记得亲人的需要。</p><h2 id="source-p119l3">从日常相处做起</h2><p id="source-p119l4">团队的相处习惯，需要从日常小事里慢慢形成。</p><h3 id="source-p119l7">记住值得纪念的事情</h3><p id="source-p119l8">同伴学会了一项新本领，完成一次难得的配合，都可以简单庆祝。聚会时也可以留时间感谢曾经帮忙的人。共同的仪式，是为了提醒大家记住某些人和事。仪式是否有用，要看参与的人是否自在，是否知道自己在纪念什么。</p><h3 id="source-p119l14">讲具体的经历</h3><p id="source-p119l15">老伙伴可以说说走过的弯路，新人也可以讲最近的困惑，不必人人都讲成功故事。事情的经过讲具体，别人更容易理解。</p><h3 id="source-p120l0">一起做一件事</h3><p id="source-p120l1">一起做一件力所能及的公益活动，组织一次家人交流，或合作完成日常服务，都能让彼此多些了解。共同认可的观念，要在一起做事时体现出来。</p><h2 id="source-p120l6">典型案例</h2><p id="source-p120l7">小陈性格内向，第一次参加例会时坐在角落。导师没有责备，只邀请他做一个30秒自我介绍。大家向他表示欢迎，他也慢慢愿意说话了。从那天起，他不再沉默，一个月后，他主动走上讲台，分享了自己的故事。小陈后来愿意发言，与那次有人耐心听他说完有关。小赵的团队办过一次面向家长的健康知识活动，先说明内容，再邀请有兴趣的人参加。家人听过介绍后，更清楚了他们平时忙些什么，也能够问出自己的担忧。</p><h2 id="source-p120l17">实操练习</h2><p id="source-p120l18">练习一：选一个团队最近关心的问题，安排一次交流，每个人都可以提出意见。</p><p id="source-p120l20">练习二：邀请愿意参与的成员写一段工作经历，整理成可供新人参考的记录。</p><p id="source-p120l22">练习三：邀请愿意了解的家人参加一次合适的活动。内容、时间和是否涉及销售，都事先说明，听听他们回来后的想法。</p><h2 id="source-p121l0">文化的长远意义</h2><p id="source-p121l1">相处习惯稳定下来，遇到变化时，大家更容易把话说开。质疑需要回答，业绩问题需要分析，伙伴犹豫时也需要听原因。共同认同的做法，可以帮助讨论这些事情。人们愿意留下来，常常是因为认同这里的做事方式，也珍惜一起做事的人。新人得到回应，伙伴遇事能够商量，关系才会逐渐稳定。共同经历多了，也不要把熟悉当成理所当然。该问的近况、该说明的安排，仍要认真对待。</p><nav><a href="ch11.html">上一节</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">全书目录</a> · <a href="ch13.html">下一节</a></nav></main></noscript></body></html>
