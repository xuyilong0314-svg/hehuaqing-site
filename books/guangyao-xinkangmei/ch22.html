</head><body><div id="root"></div><noscript><main style="max-width:760px;margin:auto;padding:40px 24px;line-height:1.9"><nav><a href="/#books">全部著作</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">广药新康美</a></nav><h1>第二十二章｜购买之后的长期服务</h1><p>何华清 著</p><h2 id="source-p207l8">一位老客户的回归</h2><p id="source-p207l9">三年前，小赵结识了王姐——一位气质温和的中年客户。那时，王姐刚开始接触中医调理，买了几盒产品，体验不错。可惜忙碌与疏忽让联系渐渐淡去。时间过去三年，小赵重新拨通电话。</p><p id="source-p207l13">“王姐，最近身体怎么样？”那头沉默几秒，传来一声带笑的叹息：“我以为你早就忘了我。”两个人聊起了这几年的近况。王姐不仅重新下单，还主动介绍了两位朋友。小赵明白了，一笔订单之后还有一段关系，需要继续关心和维护。</p><h2 id="source-p208l0">购买之后为什么还要联系</h2><h3 id="source-p208l1">购买之后仍有问题需要回答</h3><p id="source-p208l2">你花了无数时间邀约、沟通、讲解，终于赢得信任。成交以后没人答疑，前面做的工作就容易落空。已有客户的使用情况和反馈值得持续了解，也能帮助我们发现服务中没有做好的地方。</p><h3 id="source-p208l6">让客户知道出了问题可以找谁</h3><p id="source-p208l7">客户选择产品，会比较价格、使用体验和服务，不能只凭熟悉的关系要求他留下。及时答疑、兑现承诺、妥善处理问题，才可能让他更放心。</p><h3 id="source-p208l10">满意的体验可能带来介绍</h3><p id="source-p208l11">有些客户愿意向朋友推荐，但这不是每位客户都要承担的任务。服务做得怎样，先听本人怎么说，不必急着让他介绍别人。会员经营，要把购买之后的服务认真做下去。</p><h2 id="source-p208l16">从首次使用到后续服务</h2><h3 id="source-p208l17">首次使用</h3><p id="source-p208l18">信任的建立，从第一次体验开始。第一次购买，要把使用方法、注意事项和后续联系说清楚。行动要点：</p><p id="source-p208l21">• 细致解答问题，让客户感受到“被尊重”；</p><p id="source-p208l22">• 主动教会使用方法，避免“买了不会用”；</p><p id="source-p208l23">• 三天后跟进感受，用关心取代冷漠。</p><p id="source-p209l0">案例：阿芳在客户首次下单后，亲手写了一张小卡片：</p><blockquote><p id="source-p209l2">“按说明使用，有不舒服先停下来，及时询问专业人员。三天后我再联系您，看看有没有需要帮忙的地方。”客户把卡片贴在了冰箱上。</p></blockquote><h3 id="source-p209l6">持续联系</h3><p id="source-p209l7">客户没有继续购买，可能有很多原因：不再需要、不合适、价格不接受，或者服务出了问题。先听清楚，不要替他下结论。联系的方式和频率，也要让对方觉得方便。</p><p id="source-p209l10">• 按约定的时间询问使用情况；</p><p id="source-p209l11">• 节日送上一条祝福；</p><p id="source-p209l12">• 生日送一个健康贴士或小礼物。</p><p id="source-p209l13">案例：小林建立了一个“健康打卡群”，每天提醒大家喝水、早睡、运动。</p><p id="source-p209l16">愿意参与的人，在群里交换一些日常经验。</p><h3 id="source-p209l19">把后续服务做好</h3><p id="source-p209l20">相处久了，对方可能愿意谈起更多困扰。能帮的认真帮，不懂的如实说明。熟悉客户，不等于具备诊断或解读检查报告的资格。阿明陪客户去医院复查，帮她记下要向医生询问的问题。客户感叹：“你比家人还细心。”几天后，她主动推荐了五位朋友。关系需要靠日常联系维持，让客户在遇到问题时，知道可以找谁。</p><h2 id="source-p210l1">客户购买之后需要什么</h2><section class="gy-table" id="source-p210l2" aria-label="分项对照"><div class="gy-record"><p id="source-p210l2-r1-c1"><span class="gy-label">需要</span><span class="gy-value">理解产品</span></p><p id="source-p210l2-r1-c2"><span class="gy-label">服务内容</span><span class="gy-value">说明使用方法、注意事项和售后</span></p><p id="source-p210l2-r1-c3"><span class="gy-label">怎样确认</span><span class="gy-value">请客户说说是否还有不明白的地方</span></p></div><div class="gy-record"><p id="source-p210l2-r2-c1"><span class="gy-label">需要</span><span class="gy-value">问题得到回应</span></p><p id="source-p210l2-r2-c2"><span class="gy-label">服务内容</span><span class="gy-value">按约定回访，处理使用和订单问题</span></p><p id="source-p210l2-r2-c3"><span class="gy-label">怎样确认</span><span class="gy-value">记录待办并反馈处理结果</span></p></div><div class="gy-record"><p id="source-p210l2-r3-c1"><span class="gy-label">需要</span><span class="gy-value">自愿交流</span></p><p id="source-p210l2-r3-c2"><span class="gy-label">服务内容</span><span class="gy-value">愿意参与的人可以参加社群或活动</span></p><p id="source-p210l2-r3-c3"><span class="gy-label">怎样确认</span><span class="gy-value">询问意愿，允许不参加或退出</span></p></div></section><p id="source-p210l6">有人希望买完就走，有人愿意参加交流。服务应当容得下不同的选择。</p><h2 id="source-p211l3">会员经营的常见误区</h2><h3 id="source-p211l4">把客户当成“订单”</h3><p id="source-p211l5">有些人只在客户要下单时联系，一旦成交，就消失在人海。每次联系都只是催购买，客户难免感到失望。当交易结束，关系也随之终止。客户有自己的生活和需要，交流时要给这些事情留下位置。把承诺过的回访做好，有问题时找得到人，比临时想起来的一句问候更有用。</p><h3 id="source-p211l11">过度推销，缺少关怀</h3><p id="source-p211l12">有些人张口闭口都是“要不要再买点？”客户的防备心立刻升起：“你是不是又要卖我什么？”一次次这样的对话，会让信任一点点流失。有销售目的就如实说明。对方暂时不需要，也照常回答使用和售后的问题。</p><h3 id="source-p211l18">忽视客户的反馈</h3><p id="source-p211l19">有的客户反馈“产品还不错，就是喝着有点热”，销售者却随口一句“正常的”，就匆匆结束对话。这样的答复，既没有弄清情况，也没有解决客户的疑问。先问清出现了什么情况，不要未经判断就说“正常”。涉及身体不适时，应提醒客户及时咨询有资质的专业人员。</p><h2 id="source-p212l3">典型案例</h2><p id="source-p212l4">小王最初积累了几十位客户。他勤奋、热情、冲劲十足，短短一个月就成交不断。然而三个月后，群里几乎无人回应，朋友圈点赞也冷清。回头看，他成交之后很少联系，也没有及时处理客户提出的问题。客户在沉默中渐渐走远。阿芳则把回访列进了自己的日常安排。经客户同意，她记录购买信息、使用反馈和需要跟进的问题。三天后跟进，一周后回访，一个月后邀请复盘。客户不仅复购，还主动介绍家人朋友。几年下来，她的会员群体已从几十人发展成稳定团队。</p><p id="source-p212l15">她的记录让后续联系有了依据，不必每次都从头问起。</p><h2 id="source-p212l16">把客户服务安排好</h2><h3 id="source-p212l17">留下必要的记录</h3><p id="source-p212l18">在客户知情同意的前提下，记录服务确实需要的信息：</p><p id="source-p212l19">• 首次购买时间；</p><p id="source-p212l20">• 产品类型与使用反馈；</p><p id="source-p212l21">• 客户愿意提供、且与当前服务有关的情况。</p><p id="source-p212l22">档案可以是纸质笔记本，也可以用表格、系统记录。记录要便于本人查阅和更正，妥善保存，不在群内公开。</p><h3 id="source-p213l0">按实际需要安排服务</h3><section class="gy-table" id="source-p213l1" aria-label="分项对照"><div class="gy-record"><p id="source-p213l1-r1-c1"><span class="gy-label">当前需要</span><span class="gy-value">产品使用与售后</span></p><p id="source-p213l1-r1-c2"><span class="gy-label">联系内容</span><span class="gy-value">说明、答疑、处理反馈</span></p><p id="source-p213l1-r1-c3"><span class="gy-label">安排依据</span><span class="gy-value">使用情况及约定时间</span></p></div><div class="gy-record"><p id="source-p213l1-r2-c1"><span class="gy-label">当前需要</span><span class="gy-value">日常交流</span></p><p id="source-p213l1-r2-c2"><span class="gy-label">联系内容</span><span class="gy-value">合适的知识、问答或活动</span></p><p id="source-p213l1-r2-c3"><span class="gy-label">安排依据</span><span class="gy-value">本人兴趣与方便程度</span></p></div><div class="gy-record"><p id="source-p213l1-r3-c1"><span class="gy-label">当前需要</span><span class="gy-value">了解事业合作</span></p><p id="source-p213l1-r3-c2"><span class="gy-label">联系内容</span><span class="gy-value">实际工作、成本、责任与要求</span></p><p id="source-p213l1-r3-c3"><span class="gy-label">安排依据</span><span class="gy-value">本人主动表达的意愿</span></p></div></section><p id="source-p213l5">客户需要不同，联系内容也应当不同。基本的答疑和售后服务，不应因购买金额多少而打折扣。</p><h3 id="source-p213l7">约好下一次联系</h3><p id="source-p213l8">根据对方的需要和意愿，商量后续安排：</p><p id="source-p213l9">• 首次使用后，约定回访时间；</p><p id="source-p213l10">• 希望日常交流的人，可以自愿进群；</p><p id="source-p213l11">• 对活动有兴趣的人，说明内容后再邀请；</p><p id="source-p213l12">• 主动询问事业合作的人，另约时间把工作和成本讲清楚。</p><p id="source-p213l13">客户可以一直只做客户，不必按固定步骤成为伙伴。</p><h3 id="source-p213l14">把约好的联系做完</h3><p id="source-p213l15">• 使用跟进：按约定时间询问反馈；</p><p id="source-p213l16">• 月度活动：举办“客户沙龙”“健康日”，增加互动；</p><p id="source-p213l17">• 节日礼仪：生日、节日送祝福或小礼品；</p><p id="source-p213l18">• 定期回顾：核对哪些问题解决了，哪些还需要处理。</p><h2 id="source-p213l22">实操练习</h2><p id="source-p213l23">练习一：整理现有客户记录，核对联系方式、购买信息、使用反馈和待处理事项；不必要的信息不收集。</p><p id="source-p213l24">从记录中应当看得出下一步该做什么、何时做。</p><p id="source-p213l25">练习二：与一位客户商量接下来七天是否需要联系，以及方便的时间和方式。</p><p id="source-p214l1">观察对方反应，记录变化。</p><p id="source-p214l2">练习三：邀请有兴趣的客户组成一个小型交流群，先试一周健康知识和使用问答，看看大家愿意怎样参与。</p><p id="source-p214l4">一周后，总结变化，优化节奏。几项练习都要留意对方的反应，觉得打扰时就调整。</p><nav><a href="ch21.html">上一节</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">全书目录</a> · <a href="ch23.html">下一节</a></nav></main></noscript></body></html>
