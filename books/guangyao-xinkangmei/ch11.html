</head><body><div id="root"></div><noscript><main style="max-width:760px;margin:auto;padding:40px 24px;line-height:1.9"><nav><a href="/#books">全部著作</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">广药新康美</a></nav><h1>第十一章｜被拒绝之后</h1><p>何华清 著</p><h2 id="source-p107l6">二十次拒绝</h2><p id="source-p107l7">小陈加入团队的第一个月，写下了满满一页的名单。他带着激情，拨通第一通电话时，手心都是汗。</p><p id="source-p107l9">——结果，对方只冷冷地说：“你又在搞那种传销吧？”</p><p id="source-p107l10">第二通、第三通、第五通……十个电话挂断，五个冷笑，五个敷衍。他坐在椅子上，长长地叹了一口气。接连遭到拒绝，让他在培训中积攒的热情一下子消退了许多。导师听完，先问了几通电话的具体经过。有的拒绝来自疑虑，有的只是没有需要。先分清对方说了什么，再决定哪些问题需要答复。小陈开始明白，遇到拒绝还需要继续学习怎样回应。被拒绝会让人难受，但不必把每一次拒绝都当成对自己的否定。</p><h2 id="source-p108l0">对方为什么说“不”</h2><h3 id="source-p108l1">信息差——对方不懂你在说什么</h3><p id="source-p108l2">对方可能没有听懂你介绍的内容，也可能已经有自己的判断。不确定时，可以询问，不能替他解释。</p><h3 id="source-p108l5">心理防御——害怕被推销</h3><p id="source-p108l6">有人有过不愉快的购买经历，会对新的介绍保持谨慎。</p><p id="source-p108l7">“没兴趣”也可能就是没有兴趣，不需要再猜一个隐藏的答案。</p><h3 id="source-p108l9">他可能有别的安排</h3><p id="source-p108l10">预算、时间、身体状况和家人意见，都可能影响选择。了解以后决定不参与，同样是一种完整的判断。如果对方仍愿意交流，可以答复疑问；明确拒绝以后，就停下来。</p><h2 id="source-p108l16">被拒绝以后怎样回应</h2><h3 id="source-p108l17">先把事情与自我评价分开</h3><p id="source-p108l18">“太贵”“没时间”“不需要”，首先是在说这件事情。先听清楚具体理由，别急着认为自己很差，也别认定对方不懂。</p><p id="source-p108l21">• 没兴趣：确认是否愿意继续听，不愿意就结束。</p><p id="source-p108l22">• 价格高：说明规格与费用，给他比较的空间。</p><p id="source-p108l23">• 怀疑经营方式：提供能够核对的资料，答不上来时先查清。</p><p id="source-p109l0">案例：小李第一次被朋友冷嘲热讽，整整三天没出门。</p><p id="source-p109l2">导师建议他，把那次交流的原话写下来，和自己后来反复想象的部分分开。过了一段时间，那位朋友又有了了解相关信息的需要。他主动来找小李，说：“能不能带我了解一下？”这是其中一种可能，不能据此认定所有拒绝都会变成认同。</p><h3 id="source-p109l7">从经过里找出可以改的地方</h3><p id="source-p109l8">拒绝本身不会自动教会人什么，需要回看交流的过程。介绍是否清楚，有没有回答问题，对方是否真的需要，都可以逐项检查。</p><p id="source-p109l13">案例：阿芳在前三十次邀约里，只有一次成功。</p><p id="source-p109l15">别人问她为什么不放弃。她笑着说：</p><blockquote><p id="source-p109l17">“我把每次没说清的地方记下来，再慢慢改。”</p></blockquote><p id="source-p109l18">继续练习以后，她的表达逐渐自然，也能够帮助同伴。</p><h3 id="source-p109l22">让一次交流好好结束</h3><p id="source-p109l23">不要害怕对方说“不”。对方已经说“不”时，可以简短回应，给彼此留出余地。</p><p id="source-p109l25">• “没关系，我只是想让你知道有这个选择。”</p><p id="source-p109l26">• “知道了，今天先聊到这里。”</p><p id="source-p109l27">• “以后你需要相关资料，可以再找我。”</p><p id="source-p110l0">这样的回应，不附带继续购买或参加活动的压力。</p><p id="source-p110l1">案例：小赵被拒绝时，笑着回：</p><blockquote><p id="source-p110l3">“没关系，以后有需要再联系。”几个月后，朋友主动询问活动信息，两人才继续了这次交流。</p></blockquote><p id="source-p110l6">是否继续，要由对方决定。</p><h2 id="source-p110l7">低落时怎样整理自己</h2><p id="source-p110l8">拒绝常常伴随着低谷。状态不好时，给自己一点时间，不必马上振作给别人看。先承认：“这件事让我有些失落。”必要时休息一下，等情绪平稳后再回看经过。再问：“我是在和谁比较？”对照自己实际做过的事情，看看有无需要改变的部分。接着想：“下一步我有哪几种选择？”可以继续练习，也可以调整方向，必要时暂停。最后定一件眼下能够完成的小事。不需要用更大的承诺掩盖眼前的困难。</p><h2 id="source-p111l13">工作停滞的时候</h2><p id="source-p111l14">有一段时间做得不顺，原因可能并不相同。有时候，是业务的停滞。联系人没有回应，做过的安排也没带来预想的结果。有时候，是伙伴的流失。昨天还一起商量工作的人，今天决定离开。你开始怀疑自己：是不是哪儿做错了？是不是不够好？还有时候，是情绪的塌陷。看见其他团队进展顺利，自己却没有起色，难免会着急。困难不一定预示着转机。先把情况看清，才能决定下一步。停下来整理费用、时间和服务记录，找出哪些事情没有做好。</p><p id="source-p112l5">也可以重新问问自己，当初的目的与现在的实际是否还一致。</p><h2 id="source-p112l8">低谷时可以先做的事</h2><h3 id="source-p112l9">回想自己原来想做什么</h3><p id="source-p112l10">可以给自己留一点安静的时间，想清几个问题：</p><p id="source-p112l12">• 我为什么出发？</p><p id="source-p112l13">• 我最想守护的是谁？</p><p id="source-p112l14">• 现在的做法，对自己和家人的生活有什么影响？</p><p id="source-p112l15">答案可能让你决定继续，也可能提醒你换一种安排。</p><p id="source-p112l16">案例：小芳在最低谷时几乎想退出系统。</p><p id="source-p112l18">那天夜里，她翻出母亲的病历，想起那句“我希望你有更好的生活”。她想起自己希望改善生活的愿望，第二天回到会议室，和伙伴谈起这段时间的困难。她仍想继续，但也需要重新安排。同伴听完，开始一起讨论哪些工作可以调整。把原因说清楚以后，决定才更踏实。</p><h3 id="source-p112l24">找可信的伙伴商量</h3><p id="source-p112l25">独自处理不顺心的事情，有时会越想越乱。当你一个人扛，一切思绪都会在脑中发酵：“是不是我不行？”</p><p id="source-p113l2">“是不是没希望了？”</p><p id="source-p113l3">“是不是系统在骗我？”找能够认真听你说话的人商量，把疑问逐项摆出来。</p><p id="source-p113l6">• 参加有实际内容的交流，看看能否找到需要的信息。</p><p id="source-p113l7">• 向有经验的人请教，核对自己忽略的地方。</p><p id="source-p113l8">• 与同伴讨论具体困难，需要帮助时明确提出。</p><p id="source-p113l9">案例：小赵曾连续三个月没有业绩。</p><p id="source-p113l11">他觉得天都黑了，连朋友圈都不敢发。导师拉着他去参加一次全国大会。现场的分享让他受到鼓舞，也愿意重新和人交流。他说：“原来，我不是孤军奋战。”回去之后，仍要处理没有业绩的具体原因。</p><h3 id="source-p113l18">从能完成的小事开始</h3><p id="source-p113l19">反复想一个问题却没有新信息时，可以先停一停。脑海里充满自我否定的回声——“是不是不适合我？”</p><p id="source-p113l22">“是不是努力也没用？”</p><p id="source-p113l23">“是不是命运不眷顾我？”这时，可以选一件负担不大的事来完成。于是，小行动成了破局的起点。</p><p id="source-p113l27">• 答复一位正在等消息的客户；</p><p id="source-p114l0">• 整理一次交流中尚未解决的问题；</p><p id="source-p114l1">• 和同伴约定一次具体的讨论。</p><p id="source-p114l2">阿敏决定每天练习一次联系，数量以自己能够认真完成为准。前十天，全被拒绝。第十一天，一个人说：“其实我也想了解一下。”那一刻，她哭了。有人愿意继续了解，让她稍微松了一口气。</p><h2 id="source-p114l10">重新整理状态</h2><p id="source-p114l11">状态恢复得快慢不同，不必要求自己立刻热情起来。可以先从以下几件小事试起。翻看以前做过的记录，找出哪些办法曾经有用，哪些问题现在不同了。过去的记录能够帮助自己看清已经学会了什么。设定小目标不要追“大业绩”，只盯“小行动”。</p><p id="source-p114l17">比如今天答复一个问题，明天整理一份资料。完成一个小目标，能让人重新感到自己做成了一件事，也更愿意继续。分享与感恩在最低谷的时候，写下三件感恩的事。感恩导师、感恩伙伴、感恩自己还在坚持。愿意表达感谢，也要允许自己说累、说难。</p><h2 id="source-p114l24">实操练习</h2><p id="source-p114l25">练习一：给自己写一封短信，回想最初为什么开始。</p><p id="source-p115l1">我最想守护的是谁？现在的做法是否仍合适？过一段时间再读，看看自己的想法有没有变化。</p><p id="source-p115l4">练习二：列一份负担适当的工作清单，把休息和需要求助的事项也写进去。</p><p id="source-p115l6">做完后看实际感受，太重就调整。</p><p id="source-p115l7">练习三：与伙伴聊一次最近得到的帮助，也想想自己能做些什么。</p><p id="source-p115l8">每天一句感恩，接力七天。自愿参与，简单回应，不把表达感谢变成新的任务。低落的时候，不必急着证明自己。把生活和工作中最紧要的事照顾好，再想下一步。</p><nav><a href="ch10.html">上一节</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">全书目录</a> · <a href="ch12.html">下一节</a></nav></main></noscript></body></html>
