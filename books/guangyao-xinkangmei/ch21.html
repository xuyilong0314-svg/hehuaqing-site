</head><body><div id="root"></div><noscript><main style="max-width:760px;margin:auto;padding:40px 24px;line-height:1.9"><nav><a href="/#books">全部著作</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">广药新康美</a></nav><h1>第二十一章｜团队负责人该承担什么</h1><p>何华清 著</p><h2 id="source-p198l3">小组长的抉择</h2><p id="source-p198l4">小林在半年内个人业绩屡创新高，但团队的气氛却逐渐冷了下来。有人抱怨：“领导只顾自己跑，没人教我们。”有人陷入停滞：“反正他那么厉害，我们怎么都追不上。”小林困惑地找到导师：“我自己能跑得快，为什么带团队却跑不动？”导师问他：“这半年，你花了多少时间教伙伴做事？”那一刻，小林沉默了。他意识到，自己只顾往前赶，忽略了伙伴的情况。接下来需要多些沟通，也把方向讲清楚。自己会做以后，还得想办法让别人也学会。</p><h2 id="source-p199l0">个人会做，还要教会别人</h2><h3 id="source-p199l1">照顾到不同成员的进度</h3><p id="source-p199l2">负责人做得快，其他人未必跟得上。有人不会开口，有人不熟悉产品，也有人卡在售后问题上。先知道各自卡在哪里，帮助才有着落。</p><h3 id="source-p199l7">把必要的事持续做下去</h3><p id="source-p199l8">带教、答疑、处理分歧，往往不会立刻反映在业绩上，却不能因此省掉。负责人要给这些事留出时间。</p><h3 id="source-p199l14">让工作逐渐有人接手</h3><p id="source-p199l15">如果负责人一离开，工作就停了，就要检查分工和交接出了什么问题。常做的事情，可以整理出步骤，再让伙伴试着独立完成。</p><h2 id="source-p200l0">负责人需要顾到的几件事</h2><h3 id="source-p200l1">把方向和安排说明白</h3><p id="source-p200l2">先把当前要解决的问题和安排说清楚。产品知识、服务质量和团队协作，都要有人负责，不能只提出一个很大的愿景。阿芳每次开会，都会提醒大家留意客户买回去以后是否会用、有没有人回应问题。这些提醒还要落实为具体的分工和回访。</p><h3 id="source-p200l12">了解伙伴遇到的困难</h3><p id="source-p200l13">伙伴需要的支持并不相同，有人需要示范，有人需要一起处理一次困难。负责人得先了解情况。</p><p id="source-p200l16">案例：小林在导师建议下，开始每周召开一次“成长会”。</p><p id="source-p200l19">会议上不谈业绩，只谈学习与突破。他让大家分享一周中最有收获的一件小事。几周后，气氛渐渐改变——团队成员开始彼此鼓励、彼此学习。团队由一个个有情绪、有各自生活的人组成，不能只按任务看待。</p><h3 id="source-p201l1">帮助伙伴独立做事</h3><p id="source-p201l2">领导者也要帮助伙伴学会做事，逐渐能够独立承担工作。愿意承担更多工作的人，可以给他练习和带人的机会。小赵的一位伙伴希望买房，他便和对方一起算了现有收入、支出与积蓄，再讨论这份工作能投入多少时间、承担多少成本。生活目标可以给人动力，也需要建立在实际能力和收入情况上。</p><h2 id="source-p201l14">日常工作参考</h2><section class="gy-table" id="source-p201l15" aria-label="分项对照"><div class="gy-record"><p id="source-p201l15-r1-c1"><span class="gy-label">事情</span><span class="gy-value">确定目标</span></p><p id="source-p201l15-r1-c2"><span class="gy-label">目的</span><span class="gy-value">知道近期先做什么</span></p><p id="source-p201l15-r1-c3"><span class="gy-label">日常做法</span><span class="gy-value">结合需要、时间和服务能力商量目标</span></p><p id="source-p201l15-r1-c4"><span class="gy-label">检查点</span><span class="gy-value">成员是否理解并认可</span></p></div><div class="gy-record"><p id="source-p201l15-r2-c1"><span class="gy-label">事情</span><span class="gy-value">安排工作</span></p><p id="source-p201l15-r2-c2"><span class="gy-label">目的</span><span class="gy-value">让事情有人接手</span></p><p id="source-p201l15-r2-c3"><span class="gy-label">日常做法</span><span class="gy-value">分清责任、时间和交接方式</span></p><p id="source-p201l15-r2-c4"><span class="gy-label">检查点</span><span class="gy-value">困难是否及时提出</span></p></div><div class="gy-record"><p id="source-p201l15-r3-c1"><span class="gy-label">事情</span><span class="gy-value">做出示范</span></p><p id="source-p201l15-r3-c2"><span class="gy-label">目的</span><span class="gy-value">让方法可以学习</span></p><p id="source-p201l15-r3-c3"><span class="gy-label">日常做法</span><span class="gy-value">一起做一次，再请伙伴独立尝试</span></p><p id="source-p201l15-r3-c4"><span class="gy-label">检查点</span><span class="gy-value">是否真的学会，而非照抄结果</span></p></div></section><p id="source-p201l19">这些日常工作，才是责任具体的样子。</p><h2 id="source-p202l12">领导者的常见误区</h2><h3 id="source-p202l13">只看业绩，不看成长</h3><p id="source-p202l14">许多领导把眼光只放在数字上。报表好看，并不能说明每个人都学会了。成员长期不能独立做事，负责人就会越来越忙。看结果时，也问问伙伴学会了什么，哪些事还需要帮助。</p><h3 id="source-p203l0">只做管理，不做陪伴</h3><p id="source-p203l1">有的人自以为是“经理”：发任务、催结果、做汇报。任务发出去了，成员遇到的困难却没人知道。只下命令，很难了解伙伴真正遇到了什么困难。</p><p id="source-p203l7">案例：小赵的团队业绩滑落，他每天追数据、问结果。</p><p id="source-p203l10">导师问他：“你最近和伙伴一起行动过几次？”他沉默了。后来他改成每周两次陪跑，一起邀约、一起拜访。一起做了几次后，他才发现有些问题出在开场介绍，有些出在后续跟进。负责人也要参与实际工作，让伙伴看见遇到问题时可以怎样处理。</p><h3 id="source-p203l17">只顾自己，不成就别人</h3><p id="source-p203l18">有些人事业做大后，心中仍只有“我”。他们害怕别人超越，生怕分享会让自己失去光环。经验不肯分享，工作就始终离不开自己。</p><p id="source-p203l23">案例：小李业绩全公司第一，却从不带新人。</p><p id="source-p203l26">当他生病休息三个月后，整个团队业绩腰斩。这也暴露了团队长期缺少带教和交接的问题。而另一边，阿芳的团队虽然起步慢，但她始终陪着伙伴成长。三个月后，一个原本沉默的新人成了小组长。阿芳也能把部分工作交给他。</p><h2 id="source-p204l8">典型案例</h2><h3 id="source-p204l9">走偏的小李</h3><p id="source-p204l10">小李的能力毋庸置疑——沟通精、思路快、业绩高。可他始终把团队当“附属品”，任务下达快，反馈要求高，却从不花时间听听伙伴的感受。几个月后，团队流失严重，只剩下他一人独行。他的个人能力没有变成其他成员也能使用的经验。</p><h3 id="source-p204l20">阿芳怎样调整带人的方式</h3><p id="source-p204l21">阿芳曾经也急功近利，催新人签单、逼伙伴报数。后来，导师请她先问一问新人为什么做不下去。她开始陪同拜访，听伙伴讲自己的困难，也和他们讨论生活目标与眼前工作的关系。答应帮忙的事，她记下来，约好时间继续谈。三个月后，那位迟迟未开单的新人，终于迎来第一位客户。他激动地说：“谢谢你没有放弃我。”阿芳那一刻泪目。她开始明白，有些进展急不来，得先把眼前的困难一件件解决。</p><h2 id="source-p205l10">把责任逐步交出去</h2><section class="gy-table" id="source-p205l11" aria-label="分项对照"><div class="gy-record"><p id="source-p205l11-r1-c1"><span class="gy-label">阶段</span><span class="gy-value">了解伙伴</span></p><p id="source-p205l11-r1-c2"><span class="gy-label">具体做法</span><span class="gy-value">询问经历、意愿和目前困难</span></p><p id="source-p205l11-r1-c3"><span class="gy-label">希望做到</span><span class="gy-value">知道他需要什么帮助</span></p><p id="source-p205l11-r1-c4"><span class="gy-label">留意的问题</span><span class="gy-value">不替他决定生活目标</span></p></div><div class="gy-record"><p id="source-p205l11-r2-c1"><span class="gy-label">阶段</span><span class="gy-value">共同实践</span></p><p id="source-p205l11-r2-c2"><span class="gy-label">具体做法</span><span class="gy-value">一起联系、拜访，事后回顾</span></p><p id="source-p205l11-r2-c3"><span class="gy-label">希望做到</span><span class="gy-value">学会基本方法</span></p><p id="source-p205l11-r2-c4"><span class="gy-label">留意的问题</span><span class="gy-value">逐步减少代办</span></p></div><div class="gy-record"><p id="source-p205l11-r3-c1"><span class="gy-label">阶段</span><span class="gy-value">独立承担</span></p><p id="source-p205l11-r3-c2"><span class="gy-label">具体做法</span><span class="gy-value">交出一项合适的工作</span></p><p id="source-p205l11-r3-c3"><span class="gy-label">希望做到</span><span class="gy-value">能够自己准备和完成</span></p><p id="source-p205l11-r3-c4"><span class="gy-label">留意的问题</span><span class="gy-value">出问题时仍有支持</span></p></div><div class="gy-record"><p id="source-p205l11-r4-c1"><span class="gy-label">阶段</span><span class="gy-value">学习带教</span></p><p id="source-p205l11-r4-c2"><span class="gy-label">具体做法</span><span class="gy-value">让愿意的人试着示范和反馈</span></p><p id="source-p205l11-r4-c3"><span class="gy-label">希望做到</span><span class="gy-value">能帮助下一位新人</span></p><p id="source-p205l11-r4-c4"><span class="gy-label">留意的问题</span><span class="gy-value">不以头衔代替实际能力</span></p></div></section><p id="source-p205l16">伙伴逐渐能承担工作，也能带新人，责任才算交接了下去。</p><h2 id="source-p205l17">实操练习</h2><p id="source-p205l18">练习一：和伙伴一起整理一份简要的学习记录。</p><p id="source-p206l0">写下三项内容：</p><p id="source-p206l1">• 他们希望做到什么；</p><p id="source-p206l2">• 目前能独立做什么；</p><p id="source-p206l3">• 下一步需要什么帮助。隔一段时间再看，有变化就更新。</p><p id="source-p206l4">练习二：与新人商量前一个月的安排，把需要学习、练习和请教的事项列清楚。</p><p id="source-p206l6">先示范，再让新人自己试，遇到困难时提供帮助。</p><p id="source-p206l8">练习三：安排一次带教经验交流。</p><p id="source-p206l9">邀请伙伴讲述：“我如何带新人”“我学会了什么”“我下一步要传承给谁”。讲完以后，选一件做法交给另一位伙伴试试，再回来谈结果。负责人不在现场时，伙伴仍能独立承担工作，是此前培养和交接的结果。</p><nav><a href="ch20.html">上一节</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">全书目录</a> · <a href="ch22.html">下一节</a></nav></main></noscript></body></html>
