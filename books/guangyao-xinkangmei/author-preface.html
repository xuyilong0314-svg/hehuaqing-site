</head><body><div id="root"></div><noscript><main style="max-width:760px;margin:auto;padding:40px 24px;line-height:1.9"><nav><a href="/#books">全部著作</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">广药新康美</a></nav><h1>自序</h1><p>何华清 著</p><p id="source-p17l18">中医药在诊室里治病，也在日常生活中影响着人们看待身体、照顾家人的方式。它积累了历代医家的经验，也寄托着普通人对健康的盼望。我长期在临床一线工作。见过病人走进诊室时的担忧，也见过他们在调理后逐渐放松下来的样子。对于病人，几味药背后常常连着一家人的希望。行医久了，更能体会这种托付的分量。中医药留下的经验，需要继续学习，也需要认真传给后来的人。接触广药新康美时，我想到，可以通过日常的讲解与服务，让更多家庭了解中医药。</p><p id="source-p18l11">我也希望年轻人在工作中学到本领，找到适合自己的道路。照顾身体、维持生计、承担家庭责任，这些事情常常同时摆在一个人面前，需要慢慢学会安排。这本书从这些想法写起。书里有具体的工作方法，也有我对行医、做事和待人的一些理解。希望读者能在这些故事和方法中，找到与自己生活有关的部分。自己做过的事，想清楚以后再教给别人；还不懂的地方，留着继续学。写作时，我想到那些在健康问题面前无从下手，或在事业中屡屡碰壁的人。</p><p id="source-p21l4">疲惫的母亲、为生计焦虑的父亲、寻找出路的年轻人，都有各自需要解决的问题。愿书中留下的经验，能让他们少些茫然，也让中医药知识在日常生活中得到恰当的运用。产品需要有人认真讲解和服务，团队扩大以后，也需要有人把责任接过去。事业能否做下去，要看这些具体的事有没有做好。</p><p id="source-p19l7">——何华清</p><nav><a href="preface.html">上一节</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">全书目录</a> · <a href="reading-note.html">下一节</a></nav></main></noscript></body></html>
