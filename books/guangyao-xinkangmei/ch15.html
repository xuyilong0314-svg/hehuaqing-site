</head><body><div id="root"></div><noscript><main style="max-width:760px;margin:auto;padding:40px 24px;line-height:1.9"><nav><a href="/#books">全部著作</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">广药新康美</a></nav><h1>第十五章｜把邀请说清楚</h1><p>何华清 著</p><h2 id="source-p140l3">一次电话的转机</h2><p id="source-p140l4">晚上，小陈翻出一位老同学的号码。他看着通讯录，迟迟没有拨出去。他反复在心里排练开场：“要不要先说产品？还是先问近况？”开场白想了几遍，还是担心对方没兴趣。后来他决定先把活动内容说明白，让同学自己考虑。他深吸一口气，终于拨通了电话：“老同学，好久不见，最近身体怎么样？我们这周有个健康分享会，我觉得挺适合你，想邀请你来看看。”电话那头安静了几秒。小陈心跳加快，几乎要听见“没空”。</p><p id="source-p140l19">但那头却传来温和的笑声：“好啊，我正想调整下身体呢，你发我时间吧。”那一刻，小陈愣住了。小陈原先想了许多种拒绝，却没有想到同学正好愿意了解。一次主动的联系，有时会带来原本没有想到的机会。</p><h2 id="source-p141l1">为什么还要当面说明</h2><h3 id="source-p141l2">给交流一个开始</h3><p id="source-p141l3">想与人交流，通常要有人先发出邀请。这一步做清楚，双方才知道准备谈什么。新人容易把注意力放在成交上，却忽略了先与人取得联系这一步。</p><h3 id="source-p141l11">尊重彼此的时间</h3><p id="source-p141l12">对方来不来，受内容、时间、需要和关系等多种因素影响。没有答应，不能直接解释成他不信任你。问清是否方便，尊重回答，关系才能继续自在。</p><h3 id="source-p141l20">在多次交流中练习</h3><p id="source-p141l21">越犹豫，越难开口；越练习，越自然。可以先和同伴练一遍，再去联系愿意交流的人。</p><blockquote><p id="source-p141l24">“勇敢地拨出那第一个电话。”对新人来说，先完成这一步，就有了继续练习的机会。</p></blockquote><h2 id="source-p142l2">发出邀请时留意什么</h2><h3 id="source-p142l3">简短，但要说明目的</h3><p id="source-p142l4">新人常常犯的错，是想一次讲完所有。邀请要简明，也要让人知道自己被邀请去做什么。</p><p id="source-p142l6">• 说明活动主题及是否涉及产品介绍；</p><p id="source-p142l7">• 交代时间、地点、时长和费用；</p><p id="source-p142l8">• 询问对方是否有兴趣、是否方便。</p><p id="source-p142l9">必要信息说完整后，就给对方回应的机会。</p><h3 id="source-p142l11">如实说明为什么邀请</h3><p id="source-p142l12">语气自然即可，不必刻意热情。如果想到这次内容可能与对方有关，可以把原因讲出来。</p><blockquote><p id="source-p142l15">“记得你上次问过这个问题，这次分享会谈到。我把介绍发给你，你看看有没有兴趣。”</p></blockquote><h3 id="source-p142l18">把时间安排说清楚</h3><p id="source-p142l19">时间地点模糊，对方就不好安排。他说“改天”时，可以问是否需要另约，也可能就此结束。具体安排可以这样说明：</p><blockquote><p id="source-p142l22">“周六下午三点开始，预计一个小时，需要提前报名。你方便的话告诉我。”</p></blockquote><p id="source-p142l23">把时间和安排说明白，是为了方便对方考虑和确认。人数有限或有报名期限时，按真实情况说明。</p><h2 id="source-p143l0">邀约的常见类型</h2><section class="gy-table" id="source-p143l1" aria-label="分项对照"><div class="gy-record"><p id="source-p143l1-r1-c1"><span class="gy-label">类型</span><span class="gy-value">活动邀请</span></p><p id="source-p143l1-r1-c2"><span class="gy-label">要说明的事</span><span class="gy-value">主题、安排和参与条件</span></p><p id="source-p143l1-r1-c3"><span class="gy-label">说法举例</span><span class="gy-value">“周六有场食品标签分享，后面有产品介绍，你有兴趣吗？”</span></p><p id="source-p143l1-r1-c4"><span class="gy-label">适用情况</span><span class="gy-value">对主题感兴趣的人</span></p></div><div class="gy-record"><p id="source-p143l1-r2-c1"><span class="gy-label">类型</span><span class="gy-value">熟人聚会</span></p><p id="source-p143l1-r2-c2"><span class="gy-label">要说明的事</span><span class="gy-value">聚会是否包含商业介绍</span></p><p id="source-p143l1-r2-c3"><span class="gy-label">说法举例</span><span class="gy-value">“想约大家聚一聚，也想介绍我最近的工作，先听听大家是否愿意。”</span></p><p id="source-p143l1-r2-c4"><span class="gy-label">适用情况</span><span class="gy-value">彼此熟悉且知情的人</span></p></div><div class="gy-record"><p id="source-p143l1-r3-c1"><span class="gy-label">类型</span><span class="gy-value">单独交流</span></p><p id="source-p143l1-r3-c2"><span class="gy-label">要说明的事</span><span class="gy-value">具体想谈的事情</span></p><p id="source-p143l1-r3-c3"><span class="gy-label">说法举例</span><span class="gy-value">“你上次问到这款产品，资料找到了，什么时候方便聊？”</span></p><p id="source-p143l1-r3-c4"><span class="gy-label">适用情况</span><span class="gy-value">已有明确问题的人</span></p></div></section><p id="source-p143l5">无论哪种形式，来意都应交代清楚。对方愿意，才约具体安排。通讯录里的关系，需要通过一次次实际联系重新建立起来。</p><h2 id="source-p144l5">邀约的常见误区</h2><p id="source-p144l6">邀请说完后没有得到回应，可以回看几处常见问题。</p><h3 id="source-p144l8">邀请时讲得太多</h3><p id="source-p144l9">内容铺得太开，企业、产品和自己的打算混在一起，对方很难抓住重点。先把这次要邀请他做什么说清楚。他们先交代与对方有关的部分，再留出继续了解的机会。</p><h3 id="source-p145l0">过分恳求对方</h3><p id="source-p145l1">有些人一开口就说：“能不能给我个面子？来支持一下我？”这样说，容易给朋友添上人情压力。你是在向对方介绍一次可能与他有关的机会，态度可以平等一些。平等说话即可，不必用参加与否来判断彼此的关系。邀约时，平等地说明来意，也让对方自在地回应。</p><h3 id="source-p145l10">没有确定具体时间</h3><p id="source-p145l11">“什么时候有空见一面吧。”这句话没有给出可商量的安排。如果确实想见面，可以再提一个具体时间。</p><p id="source-p145l14">“这周六下午三点，在文化中心有场分享，你方便参加吗？”明确的时间、清晰的地点、具体的场景，才让邀约从“想法”变成“事件”。</p><h2 id="source-p145l19">案例拆解</h2><h3 id="source-p145l20">说不清目的的邀请</h3><p id="source-p145l21">小芳打电话给同学：“我最近在做一个新项目，能赚钱，你来看看吧！”对方立刻反感：“我不搞投资，谢谢。”她没有把具体工作说明白，就先强调赚钱，对方自然难以判断。</p><h3 id="source-p146l1">把安排说明白</h3><p id="source-p146l2">小李给朋友打电话：“你最近不是总说睡眠不好吗？这周六有个相关分享，内容和安排我发给你。你有兴趣的话，可以一起听听。”对方几乎没犹豫就答应了。小李说明了想到朋友的原因，也留下了选择。邀请有没有帮助，要看对方是否明白内容并愿意参加。</p><h2 id="source-p146l12">邀请时的几步参考</h2><p id="source-p146l13">下面的顺序可以帮助检查信息是否完整。</p><section class="gy-table" id="source-p146l14" aria-label="分项对照"><div class="gy-record"><p id="source-p146l14-r1-c1"><span class="gy-label">步骤</span><span class="gy-value">问候</span></p><p id="source-p146l14-r1-c2"><span class="gy-label">做什么</span><span class="gy-value">确认方便交流</span></p><p id="source-p146l14-r1-c3"><span class="gy-label">说法举例</span><span class="gy-value">“现在方便聊几分钟吗？”</span></p><p id="source-p146l14-r1-c4"><span class="gy-label">留意什么</span><span class="gy-value">不方便就另约</span></p></div><div class="gy-record"><p id="source-p146l14-r2-c1"><span class="gy-label">步骤</span><span class="gy-value">了解需要</span></p><p id="source-p146l14-r2-c2"><span class="gy-label">做什么</span><span class="gy-value">听清具体问题</span></p><p id="source-p146l14-r2-c3"><span class="gy-label">说法举例</span><span class="gy-value">“上次你提到的事，后来怎样了？”</span></p><p id="source-p146l14-r2-c4"><span class="gy-label">留意什么</span><span class="gy-value">对方愿意谈再继续</span></p></div><div class="gy-record"><p id="source-p146l14-r3-c1"><span class="gy-label">步骤</span><span class="gy-value">回应</span></p><p id="source-p146l14-r3-c2"><span class="gy-label">做什么</span><span class="gy-value">说明自己知道的部分</span></p><p id="source-p146l14-r3-c3"><span class="gy-label">说法举例</span><span class="gy-value">“我了解一些相关资料，可以一起看。”</span></p><p id="source-p146l14-r3-c4"><span class="gy-label">留意什么</span><span class="gy-value">不懂的如实说明</span></p></div><div class="gy-record"><p id="source-p146l14-r4-c1"><span class="gy-label">步骤</span><span class="gy-value">邀请</span></p><p id="source-p146l14-r4-c2"><span class="gy-label">做什么</span><span class="gy-value">交代活动内容</span></p><p id="source-p146l14-r4-c3"><span class="gy-label">说法举例</span><span class="gy-value">“周末有场相关分享，我把安排发给你。”</span></p><p id="source-p146l14-r4-c4"><span class="gy-label">留意什么</span><span class="gy-value">说明是否收费和销售</span></p></div><div class="gy-record"><p id="source-p146l14-r5-c1"><span class="gy-label">步骤</span><span class="gy-value">确认</span></p><p id="source-p146l14-r5-c2"><span class="gy-label">做什么</span><span class="gy-value">商量时间和参与方式</span></p><p id="source-p146l14-r5-c3"><span class="gy-label">说法举例</span><span class="gy-value">“这个时间方便吗？需要提前登记的话，我再告诉你。”</span></p><p id="source-p146l14-r5-c4"><span class="gy-label">留意什么</span><span class="gy-value">不编造稀缺名额</span></p></div><div class="gy-record"><p id="source-p146l14-r6-c1"><span class="gy-label">步骤</span><span class="gy-value">收尾</span></p><p id="source-p146l14-r6-c2"><span class="gy-label">做什么</span><span class="gy-value">留下选择余地</span></p><p id="source-p146l14-r6-c3"><span class="gy-label">说法举例</span><span class="gy-value">“不方便也没关系，有问题再聊。”</span></p><p id="source-p146l14-r6-c4"><span class="gy-label">留意什么</span><span class="gy-value">不逼迫当场答应</span></p></div></section><p id="source-p147l1">顺序可以调整，不必一口气说完。</p><h2 id="source-p147l3">实操练习</h2><p id="source-p147l4">练习一：用一分钟交代活动主题、相关原因、时间地点、费用和确认方式。</p><p id="source-p147l6">要求：自然、真诚、不读稿。</p><p id="source-p147l7">目标：让对方听懂安排，并能自在回答。</p><p id="source-p147l8">练习二：列出几位可能对主题有兴趣的人，根据实际关系和需要，分别准备邀请的说法：</p><p id="source-p147l10">• 活动邀约（偏社交）</p><p id="source-p147l11">• 聚会邀约（偏熟人）</p><p id="source-p147l12">• 一对一邀约：围绕对方明确想了解的问题约时间。</p><p id="source-p147l15">练习三：两人一组，一人邀请，一人回应。换一次角色，再看看哪里容易让人误解。</p><p id="source-p147l16">让对方提出各种拒绝（“没时间”“不感兴趣”“听过类似的”）。</p><p id="source-p147l17">练习怎样回应不同意见。</p><p id="source-p147l18">明确拒绝时，练习好好结束这次交流。电话和邀请，让平日没有机会交流的人重新取得联系。拨通电话之后，才有机会知道对方现在的情况，是否愿意进一步了解。</p><nav><a href="ch14.html">上一节</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">全书目录</a> · <a href="ch16.html">下一节</a></nav></main></noscript></body></html>
