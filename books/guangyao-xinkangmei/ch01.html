</head><body><div id="root"></div><noscript><main style="max-width:760px;margin:auto;padding:40px 24px;line-height:1.9"><nav><a href="/#books">全部著作</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">广药新康美</a></nav><h1>第一章｜先想清楚为什么做</h1><p>何华清 著</p><h2 id="source-p22l4">夜色中的餐巾纸</h2><p id="source-p22l5">黄昏，一位年轻的母亲坐在街角的小饭馆里。她刚陪母亲从医院回来，还在为药费发愁。她翻着手机里所剩无几的余额，低声自语：</p><blockquote><p id="source-p22l10">“如果这样下去，我该怎么办？”</p></blockquote><p id="source-p22l11">对面的朋友抽出一张餐巾纸，写下1→5→25→125→625，想用这个例子说明怎样把做法教给别人。</p><p id="source-p22l16">“假设你教会五个人，他们又各自教会五个人，人数就会增加。”朋友说。纸上的乘法很容易算，实际工作却要看每个人能否学会，也要看他是否愿意继续教。这个例子讲的是传授经验，人数不会照着纸上的数字自行增长。她看着纸上的数字，一时没有说话。她想到，遇到难题时，或许可以和别人一起学着做。如果一种做法能教给别人，参与的人就可能逐渐多起来。这里谈的是把有用的想法和做法教给别人。</p><h2 id="source-p23l3">想过怎样的生活</h2><p id="source-p23l4">不过，人们愿意参与一件事，最终还是因为它与自己的生活有关。金钱、时间和健康，是绕不开的三个问题。</p><h3 id="source-p23l6">金钱与选择</h3><p id="source-p23l7">钱关系到一个家庭能承担多少开支，遇到事情时有多少余地。孩子的教育、父母的治疗、自己的养老，都无可避免地与它相连。手里多一点积蓄，生活中的一些选择就会从容些。</p><h3 id="source-p23l13">给生活留出时间</h3><p id="source-p23l14">忙于挣钱时，人也可能错过父母需要陪伴、孩子盼着自己到场的时刻。每个人每天都只有24小时，工作以外的时间，也需要认真安排。衡量自己的生活，除了收入，还可以看看有没有时间照顾家人、休息和做喜欢的事。</p><h3 id="source-p23l20">照顾身体</h3><p id="source-p23l21">身体不好时，工作和家庭安排都会受到影响。照顾健康，应当放进日常生活的安排里。金钱、时间和健康，都与我们想过的生活有关。</p><h2 id="source-p24l2">把一件事教给别人</h2><p id="source-p24l3">餐巾纸上的例子容易懂，也提醒我们：教人的方法需要简单清楚。</p><h3 id="source-p24l4">讲得简单一些</h3><p id="source-p24l5">讲得过于复杂，听的人可能觉得自己学不会。做法要讲得明白，别人才能学得会。</p><h3 id="source-p24l9">让同伴也能学会</h3><p id="source-p24l10">一个人的时间有限。把已经做熟的事情教给别人，团队才有可能共同承担更多工作。自己学会之后，还要能教给别人，再由他们继续教下去。</p><h3 id="source-p24l16">知道自己为什么做</h3><p id="source-p24l17">遇到困难，有时是方法需要改，有时是自己还没有想清楚要做什么。没有想清楚自己为什么做，遇到困难时就容易动摇。所以在行动之前，请先回答三个问题：</p><p id="source-p24l23">• 如果钱和时间都不是问题，我最想做的是什么？</p><p id="source-p24l24">• 我对现在的生活满意吗？</p><p id="source-p24l25">• 如果不满意，我愿意多久去改变？</p><p id="source-p25l0">把这些问题想清楚，才谈得上“定心”。</p><h2 id="source-p25l1">了解产业、企业和产品</h2><p id="source-p25l2">愿望之外，还需要了解所处的行业、企业和产品。</p><h3 id="source-p25l4">产业的机会</h3><p id="source-p25l5">健康关系到每个家庭，具体需求却各不相同。有人需要就医，有人需要理解产品，也有人只想把日常生活安排得好一些。做服务前，先弄清对方正在面对哪一种问题。需求存在，并不等于自己已经有能力满足它。</p><h3 id="source-p25l12">查清企业背景</h3><p id="source-p25l13">广药的企业背景在书前已经作了介绍。了解这些以后，还要查清具体业务由谁提供、产品由谁生产。</p><h3 id="source-p25l20">核对产品资料</h3><p id="source-p25l21">落实到日常选择，人们还会追问产品本身。</p><p id="source-p25l22">“原生、原方、原理”和“名医、名方、名品”等理念，需要对应到产品的原料、配方及质量资料，才便于消费者理解。介绍黄精枸杞饮等产品时，应从实际标签和可核实资料讲起。产品是这份事业能否持续的基础。面对迟疑或困难，可以回头看看自己起初想解决什么问题，再决定是否调整做法。</p><h2 id="source-p27l0">从介绍到行动</h2><p id="source-p27l1">想法有了，还要学着向别人讲清楚。</p><h3 id="source-p27l5">交流中涉及的六个方面</h3><p id="source-p27l6">这个过程可以从六个环节着手：①销售自己。外在的精神状态先于言语。衣着整洁、精神状态自然，会让交流更容易开始。取得信任，还要靠之后的解释和行动。</p><p id="source-p27l11">②销售公司。了解公司的使命、文化和所处的行业，讲述时才有依据。</p><p id="source-p27l14">③销售会议。会议能让对方接触更多人的经验。</p><p id="source-p27l15">对方愿意参加时，可以让他听听不同人的做法，并留出提问的时间。</p><p id="source-p27l17">④介绍产品。自己的体验可以如实讲述，同时把产品资料说明白，给对方独立判断的依据。</p><p id="source-p27l19">⑤销售系统。借助团队，让对方接触不同人的做法。</p><p id="source-p27l21">⑥销售工具。微信群、视频和资料，可以帮助分享和学习。</p><p id="source-p27l23">这六个环节配合起来，个人就不必独自承担所有讲解工作。</p><h3 id="source-p28l9">心态的影响</h3><p id="source-p28l11">方法之外，心态也会影响事情能否做下去。刚开始有热情，遇到困难后还能不能继续，是另一回事。积极心态：遇到问题先找解决办法，需要帮助时及时提出。带头人的做法，会影响其他人怎样面对问题。学习心态：保持学习，定期复训，及时调整已经不适用的做法。老板心态：哪怕是新手，也要学着对自己的经营负责。感恩心态：记得产品、伙伴和环境给予自己的帮助。坚持心态：热情持续三天并不难，难的是过了很久还肯认真做。</p><h2 id="source-p28l23">几种不同的尝试</h2><h3 id="source-p28l24">张叔开始留意身体</h3><p id="source-p28l25">退休后靠微薄养老金度日的张叔，起初怀疑、犹豫。他在接触产品后，开始留意自己的睡眠和血压变化。半年后，他在社区开起健康小课堂，带动了几十位邻居。他从自己的体验讲起，身边参与的人逐渐多了起来。</p><h3 id="source-p29l4">小敏参与团队工作</h3><p id="source-p29l5">小敏辞职在家，常感到自我价值丧失。一次偶然，她听到“梦想三元素”，觉得这与自己眼下的处境有关。她从分享自身体验开始，逐渐带出一支宝妈团队。后来，她在照顾孩子的同时，也逐步参与了团队工作。这让她重新感到了自己的价值。</p><h3 id="source-p29l10">何医生的尝试</h3><p id="source-p29l11">何医生行医多年，一直关心诊疗以外的日常健康照护。他发现，这与自己一直关心的预防理念相通。他把临床经验与健康管理结合，帮助患者从被动治疗走向主动预防。这份工作，也让他有机会把诊室里的经验用在更多日常照护中。三个人起步的原因不同，都从自己熟悉的生活开始了分享。</p><h2 id="source-p29l19">动手试一试</h2><p id="source-p29l20">练习一：用四十五秒讲清楚，自己为什么选择做这份工作。</p><p id="source-p29l22">我最想解决什么？复制能带来什么？并找一个朋友，当场讲述。</p><p id="source-p29l25">练习二：准备一张白纸，画出“自己先做—一起做—对方独立做”的过程，用一分钟讲给朋友听，听听他还有哪里不明白。</p><p id="source-p30l2">练习三：回看过去一周，哪些事情让自己动摇，后来怎样处理。</p><p id="source-p30l4">回想当时遇到的困难，看看哪些需要坚持，哪些需要换一种做法。</p><p id="source-p30l5">练习时，先把自己的经历讲清楚。</p><p id="source-p30l23">可以从自己熟悉的一件事开始，把它做好，再试着讲给身边的人听。</p><nav><a href="reading-note.html">上一节</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">全书目录</a> · <a href="ch02.html">下一节</a></nav></main></noscript></body></html>
