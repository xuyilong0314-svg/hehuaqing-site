</head><body><div id="root"></div><noscript><main style="max-width:760px;margin:auto;padding:40px 24px;line-height:1.9"><nav><a href="/#books">全部著作</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">广药新康美</a></nav><h1>第二章｜金钱、时间和健康</h1><p>何华清 著</p><h2 id="source-p31l2">三个父亲的故事</h2><p id="source-p31l3">一个培训营里，导师请上台三位父亲。第一位是企业经理。他说：“我有钱，但没时间。一年365天，有300天在出差。女儿的舞蹈演出，我一次都没到场。”第二位是小生意人。他摇摇头：“我有时间，但没钱。孩子想上培训班，父母生病时，我常常囊中羞涩。”第三位是国企职工。他苦笑着说：“我既有稳定收入，也有不少时间。可去年查出糖尿病，医生说要终身吃药。那以后，工作和生活都要重新安排，收入稳定也不能省去照顾身体这件事。”</p><p id="source-p31l14">导师把三个故事放在一起，请大家想想自己的生活。收入、时间和身体状况，哪一项让自己最为难？眼下可以先改变什么？</p><h2 id="source-p31l16">这三件事怎样相互影响</h2><h3 id="source-p31l17">收入带来的余地</h3><p id="source-p31l18">有一定的收入和积蓄，家庭应付开支时会多些余地。孩子的教育、父母的赡养、生活的尊严，都与金钱紧密相连。遇到事情有钱可用，往往比收入数字本身更让人安心。</p><h3 id="source-p32l2">陪伴与休息的时间</h3><p id="source-p32l3">长时间忙于挣钱，可能会挤掉休息和陪伴家人的时间。与父母相处、看着孩子长大，或是自己安静坐一会儿，都需要留出时间。</p><h3 id="source-p32l8">身体状况与生活安排</h3><p id="source-p32l9">身体状况会影响许多生活安排。了解自己的身体，有问题及时处理，也是对家庭负责。收入、时间和健康常常相互影响，很难只顾其中一项。</p><h2 id="source-p32l20">回到实际工作</h2><p id="source-p32l21">知道自己想过怎样的生活之后，还要看每天的安排是否与它相符。</p><h3 id="source-p33l3">在时间层面</h3><p id="source-p33l4">把经常需要说明的内容整理成资料，可以减少一些重复工作。视频、微信群和会议，都可以用来传达共同的信息。团队成员学会独立处理事情以后，负责人也能把时间留给其他工作和家人。</p><h3 id="source-p33l9">在健康层面</h3><p id="source-p33l10">选择产品时，既了解理念，也核对具体资料。</p><p id="source-p33l11">例如介绍黄精枸杞饮，应说明标签所列成分、食用要求和适用范围，不能仅凭配方名称推定作用。梦想能否落地，还要看怎样把想法付诸实践。</p><h2 id="source-p33l17">两个人的选择</h2><h3 id="source-p33l18">工程师的选择</h3><p id="source-p33l19">李强是一名工程师，收入高却长期加班。他开始关注自己的生活习惯，也把接触到的经验分享给同事。半年后，他拥有稳定团队，第一次带孩子去旅行。这次出行，让他认真想了想以后该怎样分配工作和家庭时间。</p><h3 id="source-p34l0">退休阿姨的回归</h3><p id="source-p34l1">王阿姨退休后，糖尿病与失眠困扰多年。接触黄精枸杞饮后，她开始留意自己的日常状态，并继续与身边人交流。她把经历分享出去，带动社区老人组团行动。参与社区活动，也让她有了新的交往和工作。</p><h2 id="source-p36l0">怎样腾出一些时间</h2><p id="source-p36l1">想腾出时间，先看看哪些工作可以整理，哪些事情可以请同伴一起承担。</p><h3 id="source-p36l3">请同伴协助</h3><p id="source-p36l4">新人遇到说不清的问题，可以请有经验的伙伴协助。书中把三人配合称为ABC：A是协助者，B是正在学习的人，C是交流对象。</p><h3 id="source-p36l7">把资料用起来</h3><p id="source-p36l8">微信群、短视频和讲座可以先传递共同信息，再针对个人疑问作解释。</p><h3 id="source-p36l12">让接手的人继续教</h3><p id="source-p36l13">第一代你讲，第二代新人讲你辅助，第三代新人独立讲你见证。对方能够独立讲清楚，才说明这项工作不再完全依赖最初的示范者。团队有人能接手，负责人休息或处理别的事情时，日常工作才不会停下来。</p><h2 id="source-p36l22">日常的健康照护</h2><p id="source-p36l23">工作安排之外，还要给自己的身体留出照顾。</p><h3 id="source-p37l0">名医、名方、名品</h3><p id="source-p37l1">介绍这些理念时，要能拿出与具体产品相符的资料。</p><h3 id="source-p37l3">了解生产过程</h3><p id="source-p37l4">从原料、生产到销售，逐步了解各环节由谁负责，出现问题可以向谁询问。</p><h2 id="source-p37l13">遇到困难时的态度</h2><p id="source-p37l14">方法需要在实际工作中调整，遇到不顺的时候，也需要稳住自己的情绪。</p><p id="source-p37l16">• 积极心态：把遇到的问题讲清楚，一起找办法。</p><p id="source-p37l17">• 学习心态：不懂就问，旧方法不好用时及时调整。</p><p id="source-p37l18">• 老板心态：哪怕只是分享者，也要像经营者那样思考。</p><p id="source-p37l19">• 感恩心态：记得同伴给予的帮助，也愿意支持别人。</p><p id="source-p37l20">• 坚持心态：把热情变成日常安排，并定期检查方向是否合适。</p><p id="source-p37l21">心态会影响一个人怎样使用方法，也会影响他遇到困难时的选择。</p><h2 id="source-p37l22">实操练习</h2><p id="source-p38l3">练习一：和父母聊一次他们关心的健康问题。先听他们的需要，再了解现有选择；需要就医的问题，不用购买产品来替代。</p><p id="source-p38l6">练习二：写下过去一周的时间分配，看看多少给工作，多少给家人，多少留给了自己。</p><p id="source-p38l8">看看哪些安排可以调整，哪些工作可以请同伴协助，再决定省下的时间怎样使用。把愿望分到今天能做的事上，才知道该从哪里开始。回到自己的生活，收入、时间和健康都要照顾。</p><nav><a href="ch01.html">上一节</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">全书目录</a> · <a href="ch03.html">下一节</a></nav></main></noscript></body></html>
