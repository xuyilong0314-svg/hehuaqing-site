</head><body><div id="root"></div><noscript><main style="max-width:760px;margin:auto;padding:40px 24px;line-height:1.9"><nav><a href="/#books">全部著作</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">广药新康美</a></nav><h1>第二十章｜把一场分享讲好</h1><p>何华清 著</p><h2 id="source-p190l3">第一次走上台</h2><p id="source-p190l4">阿芳被导师点名上台分享。那一刻，她的心几乎要跳出胸口。手心出汗，声音发颤，她下意识地说：“我只是个普通妈妈，没什么特别的。”讲到过去失眠的日子，她慢慢不再盯着稿子。台下有人点头，她便接着讲起这段时间的生活变化。分享完以后，她发现自己也能站在台上把一件事讲清楚。普通人的经历，只要讲得清楚、具体，也可能给别人带来启发。</p><h2 id="source-p191l0">公开分享有什么用</h2><h3 id="source-p191l1">舞台建立信任</h3><p id="source-p191l2">公开分享让别人有机会了解你的经历和想法。讲得具体、经得起追问，才有助于建立信任。</p><h3 id="source-p191l9">让经验被更多人听见</h3><p id="source-p191l10">私下的交谈，只能影响一两个人；而一次公开分享，可以触达几十、上百、甚至上千人。听众可以从中找到自己能用的做法。也有人会把它讲给伙伴听。转述时，记得交代故事的来处和适用条件。</p><h3 id="source-p191l16">练习向团队说明事情</h3><p id="source-p191l17">团队负责人常常需要在众人面前把一件事说明白。上台练习有助于发现表达中的问题，但讲得好，并不等于已经会带团队。能否让人听懂，能否回应疑问，都可以从一次次分享里练出来。</p><h2 id="source-p192l0">准备分享时留意什么</h2><h3 id="source-p192l1">把事情讲具体</h3><p id="source-p192l2">观点需要理由，故事提供具体的经过，两者都要说清。听众需要知道：当时遇到了什么事，你怎样处理，后来有什么变化。与其堆砌形容词，不如说出一个确切的细节。</p><p id="source-p192l10">例如“我以前常到凌晨两点还睡不着”，比笼统地说“睡眠不好”更容易让听众理解当时的处境。</p><h3 id="source-p192l12">用自己平时说话的语气</h3><p id="source-p192l13">讲到难过的事，可以停一停；高兴的事，也不必故意压着。语气与事情本身相称就好，不必为了打动人而加重情绪。</p><h3 id="source-p192l21">从小场合开始练习</h3><p id="source-p192l22">有些人说：“我不敢讲，我没天赋。”不敢讲，可以先从熟悉的小场合练起。第一次先把事情讲完整。回听录音，删掉绕远的话，再试一次。找一位伙伴听听，问他哪里没听懂。这样练习，比单纯追求讲了多少遍更有用。</p><h2 id="source-p193l5">演讲的三步结构</h2><section class="gy-table" id="source-p193l6" aria-label="分项对照"><div class="gy-record"><p id="source-p193l6-r1-c1"><span class="gy-label">部分</span><span class="gy-value">开头</span></p><p id="source-p193l6-r1-c2"><span class="gy-label">内容</span><span class="gy-value">说明要谈的问题</span></p><p id="source-p193l6-r1-c3"><span class="gy-label">举例</span><span class="gy-value">“今天想谈谈我第一次带新人时遇到的困难。”</span></p><p id="source-p193l6-r1-c4"><span class="gy-label">目的</span><span class="gy-value">让听众知道这次讲什么</span></p></div><div class="gy-record"><p id="source-p193l6-r2-c1"><span class="gy-label">部分</span><span class="gy-value">中间</span></p><p id="source-p193l6-r2-c2"><span class="gy-label">内容</span><span class="gy-value">交代经过和具体做法</span></p><p id="source-p193l6-r2-c3"><span class="gy-label">举例</span><span class="gy-value">“我原以为发一份资料就够了，后来发现他连开场都不知道怎样说。”</span></p><p id="source-p193l6-r2-c4"><span class="gy-label">目的</span><span class="gy-value">让人了解问题怎样发生、怎样处理</span></p></div><div class="gy-record"><p id="source-p193l6-r3-c1"><span class="gy-label">部分</span><span class="gy-value">结尾</span></p><p id="source-p193l6-r3-c2"><span class="gy-label">内容</span><span class="gy-value">说出认识与仍需改进之处</span></p><p id="source-p193l6-r3-c3"><span class="gy-label">举例</span><span class="gy-value">“后来我先做一次示范，再请他自己试。接下来还要看他能否独立完成。”</span></p><p id="source-p193l6-r3-c4"><span class="gy-label">目的</span><span class="gy-value">留下一项可参考的做法</span></p></div></section><p id="source-p193l10">开头让听众知道为什么要听，中间把事情讲完整，结尾说明自己的认识或建议。</p><h2 id="source-p194l6">演讲的常见误区</h2><h3 id="source-p194l7">追求完美，结果僵硬</h3><p id="source-p194l8">很多新人准备上台时，写满稿子、逐字背诵，甚至连语气、停顿、笑容都要“彩排”得一模一样。结果一旦忘词，脑中一片空白，整场演讲就僵住了。准备稿子有用，但不必连每一次停顿都背下来。忘了一个词，可以换个说法，接着把意思讲完。手里留一张提纲，记住几个要点，会比死记全文轻松一些。</p><h3 id="source-p194l20">强调自己，忽视观众</h3><p id="source-p194l21">有些人上台只顾讲自己的辉煌：“我赚了多少”“我带了多少人”“我多么成功”。听众可能一直在想：“这和我有什么关系？”讲成绩时，也要说明遇到的困难、付出的成本和具体做法。这样，别人才能判断哪些经验与自己有关。</p><h3 id="source-p195l9">信息过载，缺少重点</h3><p id="source-p195l10">有人在十分钟里塞进产品原理、团队介绍和好几个案例，讲得很赶，听众也难以记住。准备时先确定这次最想说明的一个问题。能支持这个问题的内容留下，其余内容另找机会讲。演讲的力量来自简洁，简洁让人记得住。</p><h2 id="source-p195l19">典型案例</h2><h3 id="source-p195l20">低头念稿的一次分享</h3><p id="source-p195l21">小张第一次上台，紧张地拿着厚厚的稿子。他低头念，声音单调，眼神从未离开纸页。十分钟过去，台下手机屏幕的光比掌声还亮。导师请他放下全文，只看提纲，再讲一遍。这一次，他开始抬头看听众，也能留意大家的反应。</p><h3 id="source-p196l1">三分钟讲清一件事</h3><p id="source-p196l2">阿芳的分享只有三分钟。她讲自己做妈妈时遇到的健康困扰，也讲后来怎样学习照顾家人。时间不长，事情的来龙去脉却说清了。结束后，有人留下来问她几个具体问题。这就给后面的交流留下了余地。</p><h2 id="source-p196l10">怎样练习</h2><section class="gy-table" id="source-p196l11" aria-label="分项对照"><div class="gy-record"><p id="source-p196l11-r1-c1"><span class="gy-label">练习</span><span class="gy-value">写提纲</span></p><p id="source-p196l11-r1-c2"><span class="gy-label">做法</span><span class="gy-value">写下起因、经过和结果</span></p><p id="source-p196l11-r1-c3"><span class="gy-label">检查点</span><span class="gy-value">事情是否讲完整</span></p><p id="source-p196l11-r1-c4"><span class="gy-label">下一步</span><span class="gy-value">删掉无关材料</span></p></div><div class="gy-record"><p id="source-p196l11-r2-c1"><span class="gy-label">练习</span><span class="gy-value">改成口语</span></p><p id="source-p196l11-r2-c2"><span class="gy-label">做法</span><span class="gy-value">照平时交流的方式讲一遍</span></p><p id="source-p196l11-r2-c3"><span class="gy-label">检查点</span><span class="gy-value">句子是否太长、太书面</span></p><p id="source-p196l11-r2-c4"><span class="gy-label">下一步</span><span class="gy-value">换成自己说得顺的话</span></p></div><div class="gy-record"><p id="source-p196l11-r3-c1"><span class="gy-label">练习</span><span class="gy-value">听录音</span></p><p id="source-p196l11-r3-c2"><span class="gy-label">做法</span><span class="gy-value">回听语速、停顿和重复</span></p><p id="source-p196l11-r3-c3"><span class="gy-label">检查点</span><span class="gy-value">哪里听不清、跟不上</span></p><p id="source-p196l11-r3-c4"><span class="gy-label">下一步</span><span class="gy-value">只挑几处修改再录</span></p></div><div class="gy-record"><p id="source-p196l11-r4-c1"><span class="gy-label">练习</span><span class="gy-value">找人试讲</span></p><p id="source-p196l11-r4-c2"><span class="gy-label">做法</span><span class="gy-value">先向一两位伙伴讲</span></p><p id="source-p196l11-r4-c3"><span class="gy-label">检查点</span><span class="gy-value">他们是否听懂重点</span></p><p id="source-p196l11-r4-c4"><span class="gy-label">下一步</span><span class="gy-value">按反馈补充或删减</span></p></div></section><p id="source-p196l16">有过准备，就可以先在小场合试讲，再根据反馈修改。</p><h2 id="source-p196l17">实操练习</h2><p id="source-p196l18">练习一：以“我为什么选择这条路”为题，写一份三分钟分享提纲。</p><p id="source-p196l19">要求：真实、简洁、有画面。</p><p id="source-p196l20">练习二：录下自己的分享，检查句子是否像平时说话，哪里太快，哪里重复。</p><p id="source-p197l1">练习三：开场问一个与主题有关的问题，听过回答以后再往下讲。</p><p id="source-p197l3">不要为了互动而提问，听众的回答也应该进入后面的交流。舞台能让更多人听见，也需要我们对说出口的话负责。</p><nav><a href="ch19.html">上一节</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">全书目录</a> · <a href="ch21.html">下一节</a></nav></main></noscript></body></html>
