</head><body><div id="root"></div><noscript><main style="max-width:760px;margin:auto;padding:40px 24px;line-height:1.9"><nav><a href="/#books">全部著作</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">广药新康美</a></nav><h1>终章｜一百天的安排</h1><p>何华清 著</p><h2 id="source-p276l15">先安排接下来的一百天</h2><p id="source-p276l16">小林是一位普通白领。刚加入新康美时，他没有经验，没有人脉，也没有信心。导师对他说的第一句话是：</p><blockquote><p id="source-p276l19">“先别把一年后的事想得太满，我们看看接下来一百天能做什么。”</p></blockquote><p id="source-p276l20">他听进去了。于是，他从第一天开始写名单，每天打卡，每晚复盘。他从练习联系开始，逐渐完成销售，也尝试帮助新人。各个阶段有快有慢，不能拿他的时间表要求每位新人。有了安排，他至少知道眼前该先做哪一件事。把目标放进一百天里，原本模糊的愿望就可以分成每天的行动，也方便团队一起安排和检查。</p><h2 id="source-p277l10">为什么要有一百日计划？</h2><h3 id="source-p277l11">时间足够集中</h3><p id="source-p277l12">一百天是这份计划采用的观察和练习周期，并不是人人适用的习惯养成期限。做完以后，可以据此判断哪些方法适合自己，是否需要调整。</p><h3 id="source-p277l15">目标清晰可见</h3><p id="source-p277l16">把长期目标分成一段时间内的具体工作，方便检查进展。时间不合适，也可以根据自己的工作和生活安排缩短或延长。</p><h3 id="source-p277l20">方便导师与新人一起回顾</h3><p id="source-p277l21">共同使用一份计划，方便知道前面做过什么、后面需要什么帮助。进度不同很正常，不要求每个人取得相同结果。共同使用一百日计划，每个人的进展就更容易被记录、讨论和延续。</p><h2 id="source-p278l0">一百天可以怎样分段</h2><h3 id="source-p278l1">前三十天：熟悉基本工作</h3><p id="source-p278l2">动作要点：</p><p id="source-p278l3">• 整理可以联系、且愿意了解相关内容的人，不必为凑数量列满一百人；</p><p id="source-p278l4">• 与导师商量适量的沟通和见面练习，做完以后回顾；</p><p id="source-p278l5">• 学习产品资料和服务要求；是否购买和使用，由自身需要决定。</p><p id="source-p278l6">心态建设：</p><p id="source-p278l7">• 尊重对方暂时不了解或不愿参与的选择；</p><p id="source-p278l8">• 练习如实介绍：“我目前在做健康产品相关服务，想先听听你有没有这方面的需要。”</p><p id="source-p278l9">成果目标：</p><p id="source-p278l10">• 能够把产品和服务说明白；</p><p id="source-p278l11">• 知道怎样记录需求、回答问题和进行后续联系。</p><p id="source-p278l12">第一个月先把基本动作做起来，不熟悉的地方边做边学。</p><h3 id="source-p278l13">中间三十天：多做几次，再回看</h3><p id="source-p278l14">动作要点：</p><p id="source-p278l15">• 每周举办一次小活动（沙龙、分享会等）；</p><p id="source-p278l16">• 根据自己的时间和服务能力，安排合适数量的联系；</p><p id="source-p278l17">• 整理一份工作记录，涉及客户时先取得同意；</p><p id="source-p278l18">心态建设：</p><p id="source-p278l19">• 从“做给自己”转变为“做给客户”；</p><p id="source-p278l20">• 把导师的语言转化为自己的表达。</p><p id="source-p278l21">成果目标：</p><p id="source-p278l22">• 熟悉购买后的跟进和问题处理；</p><p id="source-p278l23">• 如有人主动希望了解合作，能够把实际工作讲清楚。</p><p id="source-p278l24">第二阶段开始与别人配合，在实际工作中熟悉各个环节。</p><h3 id="source-p279l0">第三阶段：后四十天——尝试协作与带教</h3><p id="source-p279l1">动作要点：</p><p id="source-p279l2">• 已具备相应能力且愿意带教的人，尝试帮助一位新人；</p><p id="source-p279l3">• 与伙伴一起组织一场规模合适的活动；</p><p id="source-p279l4">• 完成数据看板与复盘，形成可复制流程。</p><p id="source-p279l5">心态建设：</p><p id="source-p279l6">• 习惯“站出来”讲话；</p><p id="source-p279l7">• 从“个人成功”升级为“团队责任”。</p><p id="source-p279l8">成果目标：</p><p id="source-p279l9">• 弄清自己适合独立服务、配合活动，还是继续学习带人；</p><p id="source-p279l10">• 留下一份别人看得懂、用得上的经验记录。</p><p id="source-p279l11">这个阶段要练习带人一起做，让新人也有独立尝试的机会。</p><h2 id="source-p279l12">用简单工具帮助记录</h2><p id="source-p279l13">简单的记录和定期的交流，就能支持这份计划。不必为了执行计划再增加许多表格。</p><h3 id="source-p279l15">每日打卡表</h3><p id="source-p279l16">三栏即可：邀约人数｜见面次数｜成交结果。记录要能帮助回忆，没做的事情也如实留下。</p><h3 id="source-p279l19">成长笔记</h3><p id="source-p279l20">每天记录一句感悟、一件突破、一项调整。复盘日翻阅，会看到清晰的“自我轨迹”。</p><h3 id="source-p279l23">导师陪跑</h3><p id="source-p279l24">前一个月安排一位可以请教的带教人员。按双方方便的时间交流，回看做过的事，及时调整不合适的安排。工具提供步骤，导师帮助解决问题，日常练习则让这些动作逐渐熟悉起来。</p><h2 id="source-p280l3">回看自己怎样做事</h2><p id="source-p280l4">一百日计划，也让参与者重新认识自己怎样使用时间、怎样坚持行动。</p><p id="source-p280l6">• 时间：哪些安排做得过来，哪些挤占了必要的生活；</p><p id="source-p280l7">• 方法：哪些已经熟练，哪些还需要学习；</p><p id="source-p280l8">• 配合：哪些可以独立承担，哪些仍需要伙伴帮助。</p><p id="source-p280l9">一百天过去，回看做过的事，就能更具体地认识自己的变化。</p><h2 id="source-p280l17">怎样与伙伴一起使用计划</h2><p id="source-p280l18">一个人的记录，也可以给下一位新人提供参考。留下困难和调整过程，比只留下成绩更有帮助。</p><h3 id="source-p280l21">导师带新人走流程</h3><p id="source-p280l22">新人入队，导师要第一时间交付“一百日成长手册”。每周选定要做的几件事，做完后一起回看，再安排下一周。导师提供示范和反馈，逐渐把决定和行动交还给新人。</p><h3 id="source-p281l5">几位新人一起练习</h3><p id="source-p281l6">有意愿的人可以组一个学习群，交换问题和经验，不要求公开全部个人记录。遇到相似的问题，可以一起讨论，也可以互相练习。</p><h3 id="source-p281l14">分享进展和困难</h3><p id="source-p281l15">完成一项新工作，可以把做法讲给大家听。没有完成的，也说清卡在哪里。不要让表彰变成隐瞒困难的压力。新人知道步骤，有人可以请教，做出的进步也能得到回应，团队的工作就更容易稳定下来。</p><h2 id="source-p281l22">执行中可能遇到的问题</h2><h3 id="source-p281l23">做了一段时间想停下来</h3><p id="source-p281l24">症结：挫折感太强，看不到希望。先了解是方法、成本、生活安排还是兴趣发生了变化，再商量是否调整、暂停或结束。被拒绝并不自动积累信任。尊重拒绝，也检查自己的联系是否给人造成打扰。</p><h3 id="source-p282l3">小组之间做法不一致</h3><p id="source-p282l4">症结：不同小组标准不一，节奏混乱。统一必要的资料和记录方式，具体进度仍应依据成员情况调整。</p><h3 id="source-p282l10">说过的安排没有落实</h3><p id="source-p282l11">症结：喊口号容易，行动难持续。解决：拆解目标：每天一个“小达成”，每周一次“小复盘”，每月一次“百日共修分享会”。共同的做法要进入每周、每天的安排，才不会停留在口头上。</p><h2 id="source-p282l17">三个不同的学习过程</h2><h3 id="source-p282l18">小芳——从零起步到小组长</h3><p id="source-p282l19">她原本是一位全职妈妈，没有人脉，也不懂销售。她的导师告诉她：</p><blockquote><p id="source-p282l21">“别急着卖，先练习表达自己。”</p></blockquote><p id="source-p282l22">她每天坚持邀约、记录心得。后来，她开始帮助两位新人，才体会到教别人时，自己也要把做法想清楚。她说：</p><blockquote><p id="source-p283l0">“做过几次，再回头看，就知道自己哪里还不会了。”</p></blockquote><h3 id="source-p283l1">阿军——从迷茫到自信</h3><p id="source-p283l2">前30天，他被拒绝了17次，几乎想放弃。导师和他回看几次对话，发现开场太生硬，也没有先问对方是否方便。调整以后，后续交流有了进展，他也愿意继续练习。到第一百天，他整理出了自己常遇到的问题。他的总结是：</p><blockquote><p id="source-p283l7">“以前一着急就把话说满了，现在我会先听对方说。”</p></blockquote><h3 id="source-p283l8">老李——从客户到伙伴</h3><p id="source-p283l9">他原本只是产品使用者，被导师邀请加入“百日群”。他没有销售经验，却每天认真记录自己的感受。三个月后，他主动提出进一步了解团队工作。他笑说：</p><blockquote><p id="source-p283l14">“这段时间我知道了大家平时做什么，也想试一试。”</p></blockquote><p id="source-p283l15">这三个故事，都离不开日常积累、导师的帮助，以及当事人持续的练习。</p><h2 id="source-p283l16">一百天以后，再作判断</h2><p id="source-p283l17">新人可以看看，自己是否了解这份工作，能否继续投入。导师可以回顾，哪些帮助有用，哪些只是替新人作了决定。团队则可以检查，人手、服务和活动安排是否匹配。继续、调整或暂停，都应根据这段时间的实际情况决定。走完一百天，再看哪些做法可以教给下一位新人。计划的意义，也在这种延续中。这本书谈过愿望与行动，也谈过产品、服务、团队和分寸。读完以后，不必一下子全部做到，先选眼前最需要的一件事。</p><p id="source-p284l10">做过一段时间，再看看它有没有帮到自己，有没有帮到别人。一百天以后，留下的应当是做事的经验，以及对自己更清楚的认识。已经学会的继续做，有用的经验可以交给别人；走不通的地方，也值得诚实地记下来。</p><nav><a href="ch29.html">上一节</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">全书目录</a></nav></main></noscript></body></html>
