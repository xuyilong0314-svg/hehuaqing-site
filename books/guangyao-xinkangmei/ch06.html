</head><body><div id="root"></div><noscript><main style="max-width:760px;margin:auto;padding:40px 24px;line-height:1.9"><nav><a href="/#books">全部著作</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">广药新康美</a></nav><h1>第六章｜名单、邀约与沟通</h1><p>何华清 著</p><h2 id="source-p68l7">从名单到见面</h2><p id="source-p68l8">一次新人培训上，导师抛出一个看似简单的问题：</p><blockquote><p id="source-p68l9">“假如你有一百个朋友，你打算怎么开始？”</p></blockquote><p id="source-p68l10">有人说：“找最熟的，先聊聊。”有人说：“发个朋友圈，等谁来搭话。”还有人说：“等我再懂一点知识，再开始。”导师摇摇头：</p><blockquote><p id="source-p68l14">“可以先分成三件事：列出准备联系的人，发出清楚的邀请，见面后认真交流。”</p></blockquote><p id="source-p68l17">心情变好之后，仍然要去做这三件事。有没有踏实行动，会带来不同的结果。</p><h2 id="source-p68l19">先整理可以联系的人</h2><p id="source-p68l20">新人常犯的第一个错误，是把“脑子里想得到的几个名字”当成名单。结果就是：想到谁找谁，杂乱无章，几天后就抱怨——“没人可找了”。为什么要写下来？</p><p id="source-p69l3">• 写下来，便于安排先联系谁。</p><p id="source-p69l4">• 放在一起看，能想起原本遗漏的人。</p><p id="source-p69l5">• 留下记录，回顾时不必全靠记忆。</p><p id="source-p69l6">怎么写？</p><p id="source-p69l7">• 先列熟悉的人：朋友、亲人、同学和同事，人数不必勉强凑足。</p><p id="source-p69l8">• 记下已知情况：对方关心什么、是否愿意交流，不凭印象替他下结论。</p><p id="source-p69l9">• 根据实际联系情况更新记录。</p><p id="source-p69l10">案例：小李原以为自己只有十几个朋友。</p><p id="source-p69l11">导师让他安静坐下，一口气写满一百个名字。他惊讶地发现，自己的人脉远比想象宽广。三个月后，团队的骨干，正是那份名单上的第七十三个名字。写名单，是为了安排联系。是否进一步交流，还要看对方的意愿。</p><h2 id="source-p69l18">把邀请说明白</h2><p id="source-p69l19">名单写好以后，接下来是怎样开口。有人在这里犹豫很久。怕被拒绝，怕被误解，怕显得尴尬。邀约的心态：</p><p id="source-p69l23">• 发出邀请时，允许对方拒绝。</p><p id="source-p69l24">• 把活动是什么、谁来讲、怎样参加交代清楚。</p><p id="source-p69l25">• 先约定一次交流，不预设对方一定购买或参与。</p><p id="source-p69l26">可以按以下顺序说：问候近况——“最近好吗？”确认需要——“你上次提到的那件事，现在怎样了？”说明内容——“这次分享主要谈这些问题。”交代安排——“明晚七点，在这里举行。”补充必要信息——时长、是否收费、是否涉及产品介绍，都应如实说明。留下选择——“你看看是否有兴趣，时间方便再来。”</p><p id="source-p70l4">案例：阿芳第一次邀约，在电话里讲了半小时，把朋友讲得一头雾水。</p><p id="source-p70l6">导师提醒她：</p><blockquote><p id="source-p70l7">“先把活动安排说清楚。朋友想了解什么，再接着答。”</p></blockquote><p id="source-p70l8">第二次，她只说：</p><blockquote><p id="source-p70l9">“明晚有个关于日常作息的分享，会介绍哪些内容、开多久，我发给你看看。你有兴趣一起听吗？”</p></blockquote><p id="source-p70l10">邀请说清楚了，对方才好决定是否参加。</p><h2 id="source-p71l7">认真谈一次</h2><p id="source-p71l8">见面以后，要了解对方想谈什么，也把自己准备介绍的事情说清楚。多数新人在沟通时，会踩进同一个陷阱：</p><p id="source-p71l11">• 说太多：洋洋洒洒半小时，朋友反而更迷惑；</p><p id="source-p71l12">• 说太少：草草带过，让人以为你都不信；</p><p id="source-p71l13">• 重点不清：讲了许多知识，却没有回答对方的问题。</p><p id="source-p71l14">一次交流有没有用，要看双方是否更明白彼此的意思。</p><h3 id="source-p71l17">按对方的问题展开</h3><p id="source-p71l18">不必一开口就把所有资料倒出来，可以先说明要点，再逐步展开。</p><p id="source-p71l19">• 企业信息要准确，涉及哪一家就介绍哪一家。</p><p id="source-p71l20">• 涉及收入时，只说明有依据的事实，并把投入与成本讲清。</p><p id="source-p71l21">• 产品成分和要求用容易理解的话讲，对方需要的细节不能略过。</p><p id="source-p72l0">先让对方对事情有一点了解，也愿意继续问，再根据他的兴趣展开。</p><h3 id="source-p72l1">先听对方讲完</h3><p id="source-p72l2">听清楚以后，才能知道自己接下来该说什么。</p><p id="source-p72l3">• 听需求：他关心健康，就从健康切入；他在意时间，就从事业切入。</p><p id="source-p72l4">• 听顾虑：对方说“累”或“担心被骗”，可以继续问，不急着猜测他的真实意思。</p><p id="source-p72l5">• 听故事：让沟通变成朋友间的交谈，而非推销。</p><p id="source-p72l6">案例：阿芳去见小丽，本想滔滔不绝介绍产品。</p><p id="source-p72l7">她忍住，只静静听了十分钟。小丽说自己压力大、常失眠。阿芳听她讲完，才说起自己怎样调整作息。她把做过的事和仍不明白的地方一并讲了出来。小丽接着问了几个具体问题。两个人便顺着这些问题继续聊。阿芳先听完，才知道小丽最关心什么。</p><h3 id="source-p72l15">沟通时可以留意什么</h3><p id="source-p72l16">导师总结为3W+1H：</p><p id="source-p72l17">• Why（为什么）：为什么要健康？为什么要时间自由？</p><p id="source-p72l18">• What（是什么）：具体介绍哪一款产品、哪项服务或哪种工作。</p><p id="source-p72l19">• Who（谁在做）：由哪一家企业提供，眼前由谁负责。</p><p id="source-p72l20">• How（怎么做）：购买、使用、服务或参与工作的具体安排。</p><p id="source-p72l21">这几个问题可以帮助检查介绍是否完整。</p><h2 id="source-p72l22">两次不同的沟通</h2><p id="source-p72l23">小张的一位朋友直问：“你们是不是传销？”这个问题不能靠邀请他听一场分享来回答，应当拿出相应资料说明。</p><blockquote><p id="source-p72l25">“你担心的是哪一种安排？我们把合同、产品和收款情况一起看清楚。”</p></blockquote><p id="source-p73l0">有暂时查不到的内容，就约定核查后再答复。听过讲座或相信某一个人，都不能代替对具体经营方式的了解。小赵见到老同学，先问起了他的近况：</p><blockquote><p id="source-p73l4">“你最近还经常熬夜吗？”同学叹气：“是啊，工作太忙。”小赵问：“你最想先解决哪件事？”</p></blockquote><p id="source-p73l6">同学愿意继续聊，是因为小赵从他正在面对的事情说起。</p><h2 id="source-p73l8">实操练习</h2><p id="source-p73l9">练习一：两人一组，模拟一次初次沟通，一人介绍，一人提出问题。</p><p id="source-p73l10">练习先听清问题，再给出答复；不知道的就记下来，查清楚后再补充。</p><p id="source-p73l11">目标：听明白，也说清楚。</p><p id="source-p73l12">练习二：下次沟通时，记下对方主要谈了什么，自己有没有听完。</p><p id="source-p73l13">结束后写下对方说得最多的三个关键词，检验自己是否真的“听懂了”。</p><p id="source-p73l15">练习三：试着在三分钟内说明自己做什么、为什么做、与对方有什么关系，以及怎样继续了解。</p><p id="source-p73l16">每天练，直到脱口而出。暂时不知从哪里开始时，可以回看自己的记录。谁还需要答复，哪次邀请没有交代清楚，哪一个问题还没查到，都可以先处理。把这些事情做好，再根据回应调整下一次安排。</p><nav><a href="ch05.html">上一节</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">全书目录</a> · <a href="ch07.html">下一节</a></nav></main></noscript></body></html>
