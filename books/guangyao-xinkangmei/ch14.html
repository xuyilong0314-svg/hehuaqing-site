</head><body><div id="root"></div><noscript><main style="max-width:760px;margin:auto;padding:40px 24px;line-height:1.9"><nav><a href="/#books">全部著作</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">广药新康美</a></nav><h1>第十四章｜沟通：先听，再讲</h1><p>何华清 著</p><h2 id="source-p131l3">一句话之后的反应</h2><p id="source-p131l4">小赵第一次邀约朋友吃饭。他带了一叠资料，从企业、产品讲到经营安排，前后说了两个小时。他以为朋友会被热情打动，结果对方皱眉抛下一句——</p><blockquote><p id="source-p131l8">“这是不是传销？”</p></blockquote><p id="source-p131l9">小赵一时不知怎样回答。后来回顾这次交流，先要问：朋友具体担心什么？小赵有没有足够的资料作答？热情不能替代信息。话说到这里，应该停下来，先回答对方的疑问。</p><h2 id="source-p131l17">知道内容，也要会说明</h2><p id="source-p131l18">了解产品和工作内容以后，还要练习怎样向没有接触过的人解释。先听对方关心什么，再决定从哪里说起。知道得多，也可能讲得乱。介绍太复杂、太急切，听的人往往跟不上。第一次交流时，语气和态度会影响对方是否愿意继续。你的一句话、一个语气、一个表情，都在决定别人是否愿意听你讲下去。信任需要一次次兑现：说清楚，也做得到。准备好内容，给对方留出说话的时间，交流才容易继续。</p><h2 id="source-p132l7">几种需要避免的说法</h2><p id="source-p132l8">有些话容易让人误解，有些承诺则根本不能作出。</p><h3 id="source-p132l10">不把复杂信息一次塞给对方</h3><p id="source-p132l11">初次介绍时，应先说明对方最需要了解的内容。涉及费用、责任和工作方式的信息，仍要在决定之前交代清楚。简明不等于隐瞒，重点应由实际问题决定。讲完以后，可以问一句：“这里还有哪一项需要再说明？”</p><h3 id="source-p132l17">不谈负面比较</h3><p id="source-p132l18">“我们比某某公司好”“他们的产品不行”——这是新人最容易陷入的陷阱。你以为在展示优势，对方却听出了贬低。比较应采用能核对的资料，不靠贬低对方。正确做法是：</p><p id="source-p132l24">不熟悉其他品牌时，就坦诚说明；自己介绍的产品，也只谈能够依据资料说明的部分。</p><h3 id="source-p133l0">不谈空头承诺</h3><p id="source-p133l1">最危险的一句话是——</p><blockquote><p id="source-p133l2">“你肯定能赚到钱。”</p></blockquote><p id="source-p133l3">这样的承诺一旦没有实现，就会损害信任。承诺太大，兑现不了；期待太高，反而让信任崩塌。正确做法是：</p><p id="source-p133l7">可以说明自己能够提供哪些帮助，哪些结果仍有不确定性。承诺以前，先确认自己做不做得到。</p><p id="source-p133l9">案例：小芳曾经因为急于成交，说了句“很快就能赚到钱”。</p><p id="source-p133l11">朋友一开始心动，后来发现并非如此，反而远离了她。那一次，她学会了一个教训：</p><p id="source-p133l13">信任需要在一次次诚实的交流中积累。</p><h2 id="source-p133l14">怎样把事情说明白</h2><p id="source-p133l15">交流可以从与对方有关的事实开始。下面几个方面，按需要展开即可。</p><h3 id="source-p133l17">讲清相关经历</h3><p id="source-p133l18">故事可以帮助理解，但要有完整的经过。自己的经历，如实说明；别人的经历，获得允许以后再讲。</p><p id="source-p133l20">例如谈睡眠变化时，说清当时的状况、采取过哪些做法、还有哪些因素同时变化。个人感受与产品效果之间，不作超出已有依据的推断。</p><h3 id="source-p134l0">介绍具体企业</h3><p id="source-p134l1">当对方问：“这公司靠谱吗？”你的回答决定他能否继续听下去。先回答他想了解的具体信息。说明产品由谁生产、服务由谁提供、费用由谁收取，并提供可以核对的资料。企业关系按公开披露说明，不把“参股”说成“全资”，也不把集团规模当作一项交易的保证。</p><h3 id="source-p134l7">说明自己的想法</h3><p id="source-p134l8">对方也可能想知道，你为什么关注这份工作。可以用自己的经历回答，不必把愿望说得很大。</p><blockquote><p id="source-p134l10">“我希望通过这份事业守护父母健康。”“我希望孩子能看到我努力的样子。”“我希望用中医文化，帮助更多人。”</p></blockquote><p id="source-p134l13">把自己为什么做这件事讲明白，对方才容易理解你的选择。</p><h2 id="source-p135l3">沟通的常见误区</h2><p id="source-p135l4">交流过程中，留意对方有没有机会说话。有时是自己太想说清，反而连续讲了很久。停下来问一问，往往能发现刚才漏掉的重点。</p><h3 id="source-p135l7">把邀约当讲课</h3><p id="source-p135l8">新人最常见的错误，就是把邀约变成了演讲。从企业讲到产品，再讲未来安排，内容越堆越多。对方可能已经记不清最初的问题。沟通需要双方参与。对方愿意继续听，也应当有机会说出自己的想法。先说明见面的目的和必要安排，再决定是否继续展开。</p><h3 id="source-p135l15">过度依赖资料</h3><p id="source-p135l16">有人一见面就递上厚厚一叠册子：“你先看看。”结果对方翻了几页，就低头看手机。资料能帮助解释，交流仍然要回到眼前这个人。资料需要配合问题来用，不能递过去就等着别人全部读懂。挑出相关部分，一起看，一起问。</p><h3 id="source-p136l0">情绪化回应</h3><p id="source-p136l1">当对方质疑：“这是不是传销？”有人立刻涨红了脸：“你根本不懂！”这样一来，双方都更难听清对方的意思。涉及经营方式的质疑，应根据具体资料回应。故事和态度不能代替回答。情绪上来时，可以先停一下，约定查清以后再谈。</p><h2 id="source-p136l8">听、问和回答</h2><p id="source-p136l9">交流时可以依次留意听、问和回答。</p><h3 id="source-p136l11">听：先听懂对方的需求</h3><p id="source-p136l13">先听完，再确认自己有没有理解对方的意思。听到含糊的地方，再问清楚，不急着推荐。</p><h3 id="source-p136l15">问：确认自己的理解</h3><p id="source-p136l16">问题尽量具体，也给对方不愿回答的余地。可以问：“你最想了解哪一部分？”“我刚才理解的意思对吗？”</p><h3 id="source-p136l18">答：围绕实际问题说明</h3><p id="source-p136l19">对方提出问题后，先直接答复，再补充必要资料。不确定时可以说：“这项我需要查一下，确认以后再告诉你。”能把一个问题说明白，一次交流就已经有了收获。</p><h2 id="source-p137l0">一次交流的几个步骤</h2><p id="source-p137l1">新人可以先按下面的顺序练习，再根据对方的回应调整。</p><p id="source-p137l2">练习时留意有没有听清，不能只顾把步骤说完。</p><section class="gy-table" id="source-p137l4" aria-label="分项对照"><div class="gy-record"><p id="source-p137l4-r1-c1"><span class="gy-label">步骤</span><span class="gy-value">问候</span></p><p id="source-p137l4-r1-c2"><span class="gy-label">场景</span><span class="gy-value">见面或电话开头</span></p><p id="source-p137l4-r1-c3"><span class="gy-label">说法举例</span><span class="gy-value">“好久不见，最近怎么样？”</span></p><p id="source-p137l4-r1-c4"><span class="gy-label">提醒</span><span class="gy-value">对方不方便时另约时间</span></p></div><div class="gy-record"><p id="source-p137l4-r2-c1"><span class="gy-label">步骤</span><span class="gy-value">了解需要</span></p><p id="source-p137l4-r2-c2"><span class="gy-label">场景</span><span class="gy-value">对方谈起自己的问题</span></p><p id="source-p137l4-r2-c3"><span class="gy-label">说法举例</span><span class="gy-value">“你现在最想了解哪一部分？”</span></p><p id="source-p137l4-r2-c4"><span class="gy-label">提醒</span><span class="gy-value">听对方说，不替他制造需要</span></p></div><div class="gy-record"><p id="source-p137l4-r3-c1"><span class="gy-label">步骤</span><span class="gy-value">交流经历</span></p><p id="source-p137l4-r3-c2"><span class="gy-label">场景</span><span class="gy-value">有相关经历可以参考</span></p><p id="source-p137l4-r3-c3"><span class="gy-label">说法举例</span><span class="gy-value">“我遇到过类似情况，当时是这样处理的……”</span></p><p id="source-p137l4-r3-c4"><span class="gy-label">提醒</span><span class="gy-value">说清条件，不以个人体验代替证据</span></p></div><div class="gy-record"><p id="source-p137l4-r4-c1"><span class="gy-label">步骤</span><span class="gy-value">说明背景</span></p><p id="source-p137l4-r4-c2"><span class="gy-label">场景</span><span class="gy-value">需要了解企业与产品</span></p><p id="source-p137l4-r4-c3"><span class="gy-label">说法举例</span><span class="gy-value">“这款产品的生产主体和资料在这里。”</span></p><p id="source-p137l4-r4-c4"><span class="gy-label">提醒</span><span class="gy-value">对应具体资料，不混用企业名称</span></p></div><div class="gy-record"><p id="source-p137l4-r5-c1"><span class="gy-label">步骤</span><span class="gy-value">提出邀请</span></p><p id="source-p137l4-r5-c2"><span class="gy-label">场景</span><span class="gy-value">对方愿意继续了解</span></p><p id="source-p137l4-r5-c3"><span class="gy-label">说法举例</span><span class="gy-value">“周六有场分享，内容是这些，你有兴趣吗？”</span></p><p id="source-p137l4-r5-c4"><span class="gy-label">提醒</span><span class="gy-value">交代时间、费用和销售内容</span></p></div><div class="gy-record"><p id="source-p137l4-r6-c1"><span class="gy-label">步骤</span><span class="gy-value">结束交流</span></p><p id="source-p137l4-r6-c2"><span class="gy-label">场景</span><span class="gy-value">对方需要考虑</span></p><p id="source-p137l4-r6-c3"><span class="gy-label">说法举例</span><span class="gy-value">“你先考虑，有问题再联系。”</span></p><p id="source-p137l4-r6-c4"><span class="gy-label">提醒</span><span class="gy-value">容许拒绝，不追问私人理由</span></p></div></section><h3 id="source-p137l11">练习方法</h3><p id="source-p137l12">两人一组，分别扮演邀约者和受邀者。先读熟内容，再换成自己的说法，练习在三分钟内自然完成六步。练完后互相说说，哪些话让人放松，哪些话让人警觉。</p><h2 id="source-p138l1">案例拆解</h2><h3 id="source-p138l2">先回答对方的问题</h3><p id="source-p138l3">小芳面对一位老同学，没急着谈事业，先聊起孩子学习的压力。对方吐槽：“最近老失眠。”小芳先问她最近的情况，再讲了自己相关的经历。最后补一句：“下周有个活动，你来听听？”对方愉快答应。这次邀请能够继续，与小芳先听了对方说什么有关。</p><h3 id="source-p138l9">一次没有说清的介绍</h3><p id="source-p138l10">小李一上来就说：“我有个超好的事业，能赚钱、能自由！”对方立刻摆手：“没兴趣。”小李没有先了解对方，也没有说明工作的具体内容。两段交流的差别，要从这些具体做法里看。</p><h2 id="source-p138l15">实操练习</h2><h3 id="source-p138l16">练习一：改掉不合适的说法</h3><p id="source-p138l17">回看最近一次交流，找出塞得过多的信息、没有依据的比较或作不出的承诺，改成具体、清楚的说法。</p><h3 id="source-p138l20">练习二：把相关经历讲清楚</h3><p id="source-p138l21">写出三个版本：</p><p id="source-p138l22">• 一个关于健康的真实体验；</p><p id="source-p139l0">• 一段有资料依据的企业介绍；</p><p id="source-p139l1">• 一段关于自己为什么做这件事的说明。</p><h3 id="source-p139l3">练习三：角色扮演</h3><p id="source-p139l4">两人一组，一人邀约，一人回应。邀约者照“六步话术”练习，受邀者真实反馈。交换角色以后，听听哪些地方不好理解，哪些说法让人有压力，再继续改。顺序可以练熟，交流时仍要听回应。对方问了新问题，就先回答，不必坚持把准备好的话讲完。</p><nav><a href="ch13.html">上一节</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">全书目录</a> · <a href="ch15.html">下一节</a></nav></main></noscript></body></html>
