</head><body><div id="root"></div><noscript><main style="max-width:760px;margin:auto;padding:40px 24px;line-height:1.9"><nav><a href="/#books">全部著作</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">广药新康美</a></nav><h1>第五章｜心态与方法</h1><p>何华清 著</p><h2 id="source-p60l12">两个人的不同进展</h2><p id="source-p60l13">一次团队复盘，两位新伙伴的经历，被导师摆在桌上。小林和小赵同一天加入，用的同样的产品，参加同样的培训，也都老老实实列了100个名字。三个月后，小林已有同伴一起做事，小赵却越来越不愿开口。有人问：</p><blockquote><p id="source-p60l21">“是不是小林口才更好？是不是他朋友更多？”</p></blockquote><p id="source-p60l22">导师摇了摇头：</p><blockquote><p id="source-p60l23">“先看看他们遇到拒绝以后，各自做了什么。”</p></blockquote><p id="source-p61l0">小林在被拒绝十次后，笑着说：</p><blockquote><p id="source-p61l1">“先记下来，看看对方为什么不愿意，下一次把事情说明白些。”</p></blockquote><p id="source-p61l2">小赵在被拒绝三次后，叹了口气：</p><blockquote><p id="source-p61l3">“算了，我可能不适合。”</p></blockquote><p id="source-p61l4">同样参加培训，后来做得不同，原因需要从各自的行动里找。心态会影响行动，方法和实际条件也同样要看。</p><h2 id="source-p61l13">心态怎样影响行动</h2><p id="source-p61l14">表达和邀约需要练习。遇到不顺时，如果一味责怪自己或别人，学过的方法也很难好好用出来。学习和带人都需要时间，暂时没有进展时，要能坐下来检查过程。拒绝之后是否还愿意了解原因，会影响下一次怎样做。带团队的人怎样处理问题，也会影响身边的人。负责人遇事只会抱怨，其他人很难安心；能够把问题说清，大家才有机会一起处理。</p><h2 id="source-p62l0">几种常见的态度</h2><h3 id="source-p62l1">积极：受挫以后仍能处理问题</h3><p id="source-p62l2">积极也包括承认困难，看看自己还可以做什么。被拒绝时，先听清理由，尊重对方的决定。遇到难处，可以把能够改变的部分列出来。</p><p id="source-p62l6">案例：小李前三次邀约都失败，他却笑着记录、总结话术。</p><p id="source-p62l8">第四次，他成功了。</p><blockquote><p id="source-p62l9">“前三次是我交的学费。”</p></blockquote><p id="source-p62l10">他把前三次交流当作回顾材料，调整了后面的说法。</p><h3 id="source-p62l12">做过以后再学一次</h3><p id="source-p62l13">听懂以后还要练习，遇到新问题也要继续学。即使已经在带人，也有自己不懂的地方。培训和资料要围绕这些问题来选。</p><p id="source-p62l18">案例：小敏已是团队骨干，却每次培训都坐在第一排记笔记。</p><p id="source-p62l20">有人问她：</p><blockquote><p id="source-p62l21">“你不是都懂了吗？”她笑笑：“我怕自己停下来。”</p></blockquote><p id="source-p62l22">她继续学习，是想把实际工作中还不明白的地方弄懂。</p><h3 id="source-p62l24">负责：把自己的工作管起来</h3><p id="source-p62l25">无论投入多少时间，都需要给自己做的事情一个清楚的安排。能承担多少工作，就先把那一部分做好。主动查资料、记录费用、处理售后，是经营中的日常责任。有同伴一起做时，也要关心彼此是否学会，分工是否合适。</p><p id="source-p63l6">案例：张叔起初只想着“赚点零花钱”。</p><p id="source-p63l7">导师提醒：</p><blockquote><p id="source-p63l8">“先把自己负责的事情管起来。”张叔后来开始认真安排时间，也更多参与团队工作。</p></blockquote><h3 id="source-p64l3">感恩心态</h3><p id="source-p64l4">感恩要让给予过帮助的人感受到。同伴帮忙接待过一次客户，导师解释过一个难题，都可以记在心里。道谢以外，力所能及时也去帮别人。感谢别人，并不妨碍把实际问题提出来。</p><p id="source-p64l12">案例：阿芳常抱怨：“为什么我的伙伴总不配合？”</p><p id="source-p64l13">导师建议她回想一下，伙伴们以前给过哪些帮助。她开始每天写下三件值得感谢的小事：一杯清水、一句鼓励、一笔小订单。后来，她留意到彼此的交流比以前多了一些。记得别人的帮助，也愿意回应，关系才容易继续。</p><h3 id="source-p65l0">坚持心态</h3><p id="source-p65l1">决定继续做一件事，需要有安排，也要定期看看是否值得继续。留出一段时间观察进展，不能用一个固定期限保证结果。按自己的条件安排邀约和复盘，数量以能够认真完成为准。暂时没有结果时，先检查问题，再决定继续、调整还是停下来。</p><p id="source-p65l7">案例：小赵曾想放弃，因为半年收入平平。</p><p id="source-p65l8">导师对他说：</p><blockquote><p id="source-p65l9">“把这半年做过的事情看一遍，找出还有可能改好的地方。”</p></blockquote><p id="source-p65l10">他后来调整了做法，逐渐带出两位能够承担工作的同伴。他笑说：</p><blockquote><p id="source-p65l13">“回头检查那一步，对我很有用。”</p></blockquote><p id="source-p65l14">坚持是否有意义，还要看方法有没有改进、实际条件有没有变化。</p><h2 id="source-p65l17">心态与技巧的互动</h2><p id="source-p65l18">心态和技巧需要一起练习，不能用一个固定百分比来衡量它们。稳住情绪以后，仍要学习怎样说清楚、怎样安排和怎样处理问题。</p><p id="source-p65l25">例如，愿意打电话以后，要练习把邀请说完整；愿意继续学习以后，要把没答好的问题查清楚。</p><h2 id="source-p66l5">实操练习</h2><p id="source-p66l6">练习一：每天简要记录遇到的一件事，写下自己的反应和下一步准备怎样做。</p><p id="source-p66l8">持续记录一段时间，再回看哪些变化是自己能够观察到的。</p><p id="source-p66l9">练习二：写下最近一次被拒绝的经过。区分对方明确说过的理由与自己的猜测，看看哪些需要改进，哪些应当接受。</p><p id="source-p66l13">练习三：请伙伴各自谈一件最近遇到的困难，先听完，再一起想办法。</p><p id="source-p66l15">听完以后，再讨论眼前要解决的工作问题。方法要学，自己的状态也要照顾。需要休息或改变安排时，可以坦诚地说出来。</p><nav><a href="ch04.html">上一节</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">全书目录</a> · <a href="ch06.html">下一节</a></nav></main></noscript></body></html>
