</head><body><div id="root"></div><noscript><main style="max-width:760px;margin:auto;padding:40px 24px;line-height:1.9"><nav><a href="/#books">全部著作</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">广药新康美</a></nav><h1>第十章｜带人做事</h1><p>何华清 著</p><h2 id="source-p102l1">自己带头与催人做事</h2><p id="source-p102l2">小芳带着十几个伙伴开会。她忙着布置场地、讲解资料、回答问题，连倒水也自己来。会后，她已经很累，伙伴们却还在等下一项安排。导师提醒她，自己把事情全做完，别人就没有机会学。小芳这才意识到，自己多做一些，并不等于伙伴学会了。她需要把教人做事放到更重要的位置。</p><h2 id="source-p102l8">什么是领导力？</h2><p id="source-p102l9">职位和头衔不能代替影响力。伙伴愿不愿意信任你、学习你的做法，要看日常的表现。方向：让团队知道目前要做什么，为什么先做这件事。示范：要求别人做到的，自己先做一遍。带教：让伙伴逐渐学会，能够独立承担。</p><h2 id="source-p102l14">带人时需要考虑什么</h2><p id="source-p102l15">事务型领导安排会议，布置任务，监督执行。这种领导能带来秩序，但容易让人依赖。成长型领导不只安排事务，还教伙伴如何邀约、沟通、成交。这种领导能让团队逐渐自立。也需要经常解释团队准备做什么，听听伙伴的想法。</p><p id="source-p102l23">目标能够共同商量，大家才更清楚自己为什么参与。</p><p id="source-p102l24">小赵刚做组长时，总追问伙伴：“做了吗？邀约了吗？”时间久了，大家只顾交任务。后来，他开始解释安排的原因，也让伙伴说说自己的打算，彼此的讨论才多起来。</p><h2 id="source-p102l27">日常相处的几条原则</h2><p id="source-p102l28">先做示范。自己没有弄懂的要求，不急着交给别人；熟悉的事，先示范一次。信任伙伴。事先说明要求，给对方尝试的机会，做得不熟时再一起练习。安排分工。交代好工作、权限和遇事求助的方式，再让对方承担。看见成长。除了业绩，也看看伙伴学会了什么、还需要怎样的帮助。</p><h2 id="source-p103l12">把带教落到工作里</h2><p id="source-p103l13">带人的能力，也是在一次次具体工作里练出来的。</p><h3 id="source-p103l15">自己先做一次</h3><p id="source-p103l16">从自己熟悉的一项工作开始示范。</p><p id="source-p103l18">• 自己先做：列名单、邀约或处理问题，把实际过程展示出来。</p><p id="source-p103l20">• 讲清难处：哪些地方容易出错，自己以前怎样处理，都可以说明。</p><p id="source-p103l22">小赵的组里，新人总是不敢开口。有一天，他现场联系了三个人，请伙伴听听他怎样问候、说明事情和结束交流。伙伴们看着他紧张、笑场、被拒绝，但也看到他第二通电话就成功。伙伴们看过这几通电话，才知道一次邀约中可能遇到什么情况。</p><h3 id="source-p104l4">说明过程，留出练习</h3><p id="source-p104l5">有了基本流程，双方更容易知道目前做到哪里。</p><p id="source-p104l7">• 分步练习：我做你看、我带你做、你做我帮、你独立做。根据实际完成情况推进。</p><p id="source-p104l9">• 做后回顾：说清哪些顺利、哪些卡住，再约定下一次具体改什么。</p><h3 id="source-p104l14">让伙伴愿意提问和交流</h3><p id="source-p104l15">领导者的态度，也会影响团队相处的气氛。相处是否自在，会影响大家愿不愿意说出问题。</p><p id="source-p104l17">• 定期交流：约好时间，围绕实际问题讨论，避免开完会还不知道要做什么。</p><p id="source-p104l19">• 形成习惯：讲事实、守约定、互相支持，需要负责人先做到。</p><p id="source-p104l21">大家能够提出问题，并逐渐独立处理事情，才算有了进展。</p><h2 id="source-p104l22">常见误区</h2><p id="source-p104l23">带人时，有几种做法容易让双方都疲惫。</p><p id="source-p104l24">• 大包大揽：自己越做越多，伙伴只能在旁边等。可以从一件小事开始交接。</p><p id="source-p104l26">• 只问业绩：忽略学习进展、实际困难和个人承受能力。</p><p id="source-p105l1">• 用责备代替讨论：对方表面答应，问题却没有说出来。先问清经过，再谈怎样改。</p><h2 id="source-p105l5">典型案例</h2><h3 id="source-p105l6">小李试着放手</h3><p id="source-p105l7">小芳曾是“完美主义者”，一切亲力亲为。会议、培训、表格、分享——她都要亲自过手。结果，她越忙，团队越散。导师提醒她：“试着让别人去主持一次小会。”她勉强放手。那次会议瑕疵频出，流程混乱，讲解磕磕绊绊。但会议结束后，那个新人激动地说：“老师，我第一次发现原来我也能行！”这次小会有不少地方需要改，却给了新人一次完整尝试的机会。后来，她开始把更多工作分给伙伴，再安排时间一起回看。</p><h3 id="source-p105l17">阿芳的日常安排</h3><p id="source-p105l18">小赵的团队在去年冬天经历了低谷。业绩下滑，士气低迷，许多人想退出。他没有用数字去逼，也没有发命令。他组织了一场“孝道分享会”。那一晚，所有人围成一圈，谈自己为什么要坚持——有人说为了给父母一个健康的晚年，有人说为了让孩子看到自己不放弃的背影。大家听完，才知道彼此为什么还愿意继续。那一夜之后，伙伴们重新有了做下去的意愿。团队也需要一个大家认可、愿意投入的方向。</p><h2 id="source-p106l0">实操练习</h2><p id="source-p106l1">• 现场示范：选一项熟悉的工作，完整做给伙伴看，再请他们说说观察到了什么。</p><p id="source-p106l3">• 交接练习：让一位新人主持小组交流。结束后，具体说出做得好的地方，以及下次最需要改的一处。</p><p id="source-p106l5">• 相互回应：聚会时留一点时间，让伙伴提困难，也说说谁曾经帮过自己。</p><nav><a href="ch09.html">上一节</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">全书目录</a> · <a href="ch11.html">下一节</a></nav></main></noscript></body></html>
