</head><body><div id="root"></div><noscript><main style="max-width:760px;margin:auto;padding:40px 24px;line-height:1.9"><nav><a href="/#books">全部著作</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">广药新康美</a></nav><h1>第七章｜工具怎么用</h1><p>何华清 著</p><h2 id="source-p74l12">一份资料带来的帮助</h2><p id="source-p74l13">小陈第一次去见朋友，事先做了不少准备。那天，他准备了一整本笔记本，写满了健康理念、产品成分、企业故事。他从企业讲到产品，又讲了自己的打算，前后说了两个小时。嗓子干哑，手心冒汗，连水杯都忘了喝。当他终于停下时，朋友礼貌地笑了笑：</p><blockquote><p id="source-p74l18">“挺好的，你发我个资料吧。”</p></blockquote><p id="source-p74l19">那一刻，小陈有些茫然。他以为是自己“讲得不够动人”；导师却轻轻摇头：</p><blockquote><p id="source-p74l22">“也许你讲得太多了。他想要一份资料，回去慢慢看。”</p></blockquote><p id="source-p74l23">说完，导师从包里拿出一张薄薄的对照表。表格把几个常见问题和相关产品信息列在一起，方便逐项查看。短短五分钟，朋友看完后忽然坐直了身体：</p><blockquote><p id="source-p75l1">“哦——原来你说的，是这个意思啊。”</p></blockquote><p id="source-p75l2">朋友终于知道，小陈前面那两个小时在说什么。</p><h2 id="source-p75l8">资料能帮上什么忙</h2><p id="source-p75l9">一份资料可以帮助讲解，也方便对方事后回看。不过，做成表格或视频，并不会让内容自动变得可信。资料从哪里来、是否准确，仍要检查。选择工具时，可以留意以下几点。</p><h3 id="source-p75l13">方便核对</h3><p id="source-p75l14">口头介绍容易遗漏，写下来便于双方确认。PPT、表格和视频应当写明依据，让对方有机会查问。</p><h3 id="source-p75l20">标准统一</h3><p id="source-p75l21">常用内容整理成一份资料，能减少不同人介绍时的疏漏。关键事实保持一致，具体说明仍可按对方的问题调整。</p><h3 id="source-p76l1">便于传阅</h3><p id="source-p76l4">视频能被转发，表格能被打印，PPT能被重播。同一份资料可以被多人使用，更新时也要让大家知道。这样既省去重复整理，也便于回头检查有没有说错。</p><h2 id="source-p76l13">常用的三类资料</h2><h3 id="source-p76l14">演示文稿</h3><p id="source-p76l15">做PPT时，先想好观众最需要弄清什么。一页说明一件事，图表用于解释，文字不必把讲稿全放上去。</p><p id="source-p76l18">• 开篇：说明要讨论的问题，以及它与听众的关系。</p><p id="source-p76l20">• 中段：提供相关企业、产品和服务资料，区分事实与自己的理解。</p><p id="source-p76l22">• 结尾：交代可以怎样继续了解，并留时间提问。</p><p id="source-p76l23">案例：阿敏第一次演讲紧张得说不出话，只能机械播放幻灯片。</p><p id="source-p76l25">结果会后，朋友却说：</p><blockquote><p id="source-p76l26">“图表一看就懂，比你自己讲好多了。”</p></blockquote><p id="source-p77l0">阿敏发现，图表帮她省去了一段不容易讲清的解释。</p><h3 id="source-p77l2">视频</h3><p id="source-p77l3">视频适合记录过程，也能展示文字不容易说清的细节。拍摄时先把事情交代完整，音乐和剪辑不能代替内容。</p><p id="source-p77l6">• 一分钟短片：介绍一件事，引出进一步了解的兴趣。</p><p id="source-p77l7">• 五分钟记录：讲清一段经历的经过和条件。</p><p id="source-p77l8">• 十分钟讲解：说明一个常见问题或演示一个操作。</p><p id="source-p77l9">案例：小李没时间邀约，只发了一条一分钟短片。</p><p id="source-p77l11">那天晚上，他手机连响三次——三位朋友主动问他：</p><blockquote><p id="source-p77l13">“你发的那个，是啥？”</p></blockquote><p id="source-p77l14">朋友先看过视频，再联系时已经知道想问什么。</p><h3 id="source-p77l16">文档与表格</h3><p id="source-p77l17">不是每个人都被情绪打动。有人要看数字、算逻辑、求可验证性。</p><p id="source-p77l19">• 价格对比表：让产品价值具体化。</p><p id="source-p77l21">• 使用记录：如实记录个人观察，不把个案当作产品效果的证明。</p><p id="source-p77l22">这些工具能让对方看见具体的信息。有资料可查，双方就能围绕具体问题讨论。</p><h2 id="source-p78l0">把工具带进一次交流</h2><p id="source-p78l1">阿芳刚入行时，一紧张就说不顺。导师微笑着说：</p><blockquote><p id="source-p78l3">“你不需要讲太多，只要问一句。”</p></blockquote><p id="source-p78l4">她照做了。见面时，她只轻声问朋友：</p><blockquote><p id="source-p78l6">“你关心的是这几项里的哪一项？”她把表格递给朋友，请他慢慢看。</p></blockquote><p id="source-p78l7">朋友看了三分钟，沉默片刻后说：</p><blockquote><p id="source-p78l8">“我主要关心这两项。”朋友指着表格接着问。阿芳也发现，围绕一个具体问题谈，比较容易开口。</p></blockquote><p id="source-p78l9">小赵有一位在跨国企业工作的朋友，日程很满，很难约出一整段时间听介绍。他只发了一条两分钟短片。朋友在地铁上看完，回了两个字：</p><blockquote><p id="source-p78l13">“约我。”</p></blockquote><p id="source-p78l14">小赵便和他另外约了时间。视频让朋友可以按自己的安排先了解内容。</p><h2 id="source-p79l8">经历怎样讲，问题怎样答</h2><p id="source-p79l9">介绍之外，还可以讲一段相关经历，帮助对方理解当时的处境。PPT便于展示结构和逻辑，故事则能帮助人理解事情发生时的处境。一个好故事，不需要多复杂。把发生的事情说明白就够了，不必刻意编一个漂亮结尾。有时，一个犹豫或一个没做好的细节，反而让听的人更容易理解。</p><h3 id="source-p79l14">故事能提供哪些信息</h3><p id="source-p79l15">健康经历可以谈当时遇到的问题、采取过的做法，以及自己观察到什么。治疗、作息、饮食等同时发生的变化，不能略去。事业故事：讲从怀疑到相信、从孤身一人到带出团队的过程。一个普通人怎样面对困难、怎样作出改变，往往比笼统的道理更容易理解。也可以讲照顾家人、承担责任时遇到的具体事情，让听者知道这些想法从哪里来。故事里具体、可信的细节，往往比完美的讲述更能打动人。</p><h3 id="source-p80l0">整理常见问题的说法</h3><p id="source-p80l2">新人可以先参考已有说法，弄懂意思以后，再用自己的话表达。模板是帮助开口的，不能代替理解。</p><p id="source-p80l4">• 邀约：交代目的、时间、地点和必要信息。</p><p id="source-p80l5">• 三分钟事业分享：按“3W+1H”来，清晰、有节奏。</p><p id="source-p80l6">• 算账：把费用、数量和使用安排列清楚。</p><p id="source-p80l7">案例：小赵以前滔滔不绝，越讲越乱。后来他只说了一句：</p><blockquote><p id="source-p80l9">“我以前常睡不好，最近在留意自己的作息。”这句话比从头背资料更容易开始一段交谈，接下来仍要如实说明经过。</p></blockquote><p id="source-p80l11">把自己的经历说清楚，让对方知道你为什么作出这样的选择。</p><h2 id="source-p80l12">把背景与自己的想法说清</h2><p id="source-p80l13">规则、工具和团队文化，各有各的作用。团队重视什么，最终会体现在日常选择里：对客户怎样说话，出了问题怎样处理，对同伴是否守约。</p><h3 id="source-p80l18">从家庭需要谈起</h3><p id="source-p80l19">• 为父母选产品时，先问他们需要什么，愿不愿意用。</p><p id="source-p80l20">• 家庭健康日可以安排交流和陪伴，让家人有机会提出自己的问题。</p><p id="source-p80l21">谈到孝道，人们会想到自己牵挂的家人。关心家人，不必靠买不买某一件东西来证明。</p><h3 id="source-p80l23">了解行业与企业</h3><p id="source-p80l24">• 政策文件可以帮助了解行业方向，阅读时看清文件日期和适用内容。</p><p id="source-p81l1">• 企业资料可以说明背景，不能代替对具体产品和交易条件的了解。</p><p id="source-p81l2">介绍这些背景，是为了让人理解得更完整。</p><h2 id="source-p81l6">使用时的几个提醒</h2><p id="source-p81l7">工具用在合适的地方，才能省力。发出资料以后，还需要回答问题和跟进。第一要：简洁。一场邀约，不需要五份资料，只要一个核心工具。太多的工具，会淹没重点，让人迷失。第二要：转接。从短片到PPT，再到活动和系统课，前后内容要能衔接，让对方知道下一步可以了解什么。</p><p id="source-p81l15">案例：阿芳邀约朋友，先发一条短片，引发兴趣；见面时带上PPT，展示逻辑；最后轻声说：</p><blockquote><p id="source-p81l20">“下周有个健康沙龙，一起来吧。”</p></blockquote><p id="source-p81l23">第三要：熟悉内容。至少知道资料讲了什么、适合给谁看，不能只是转发。对方问到资料里的细节，能够解释；解释不了的，知道该向谁请教。</p><h2 id="source-p82l0">实操练习</h2><p id="source-p82l1">练习一：把同一件事分别讲成三十秒、一分钟和三分钟，看看各自应保留什么。</p><p id="source-p82l2">根据交流时间选择长短，核心事实保持一致。每个故事，都要能在不同场景下自然衔接。</p><p id="source-p82l4">练习二：熟悉一份对照表、一段短片或一份演示文稿，说明它适合回答什么问题。</p><p id="source-p82l5">练到能够说明内容，也能回答常见问题。</p><p id="source-p82l7">练习三：选择一个自己关心的主题，找出相应资料，讲清它与你的实际工作有什么关系。</p><p id="source-p82l9">用自己的话复述，讲清这段内容为什么与你有关。工具用过之后，可以问问对方：哪一部分有帮助，哪一部分仍然不明白。根据反馈继续整理，比不断往手机里存新资料更有用。</p><nav><a href="ch06.html">上一节</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">全书目录</a> · <a href="ch08.html">下一节</a></nav></main></noscript></body></html>
