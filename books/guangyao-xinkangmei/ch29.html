</head><body><div id="root"></div><noscript><main style="max-width:760px;margin:auto;padding:40px 24px;line-height:1.9"><nav><a href="/#books">全部著作</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">广药新康美</a></nav><h1>第二十九章｜让别人逐渐认识你</h1><p>何华清 著</p><h2 id="source-p268l4">谁更容易被选择？</h2><p id="source-p268l5">同样是卖健康产品。小王的朋友圈满屏广告：“限时优惠”“买一送一”“最后十套”。发得很勤，回应却越来越少。有一天他发现，点赞的只剩同行。而小李呢？小李则在工作内容之外，分享自己的饮食、晨跑和学习记录，也谈服务中遇到的问题。别人能从这些内容中慢慢了解她。一段时间后，开始有人主动询问。客户主动加她，说：“你发的内容让我很安心。”两个人的表达方式不同，也给读者留下了不同印象。</p><p id="source-p268l19">个人IP要让客户知道，产品背后有一个可以找到、可以沟通的人。</p><h2 id="source-p269l0">让别人了解具体的你</h2><h3 id="source-p269l1">信息里要有自己的经历与判断</h3><p id="source-p269l2">朋友圈里的内容很多，人们未必愿意逐条看。一段具体的工作经历、一个认真回答的问题，可能让人多了解你一点。客户会比较功效和价格，也会看服务的人是否可信、是否愿意持续跟进。</p><blockquote><p id="source-p269l10">“你说的，我信。”这句话，来自此前一次次言行的积累。</p></blockquote><h3 id="source-p269l11">你的做法也会影响伙伴</h3><p id="source-p269l12">新人常常会参照熟悉的伙伴怎样说、怎样做。因此，分享经验时也要说明条件和限制，不要把个人成绩包装成人人都能得到的结果。</p><h3 id="source-p269l18">信任需要时间核对</h3><p id="source-p269l19">第一次看到你，别人得到的是印象；相处久了，才知道你是否可靠。说过的话、答应的事，会在后来的接触中被反复核对。持续、真实地表达，并在行动中做到，影响力才会慢慢积累。</p><h2 id="source-p270l0">先把三件事说明白</h2><h3 id="source-p270l1">定位：你是谁？</h3><p id="source-p270l2">自我介绍不用很大，准确就好。做产品服务，就说清服务哪些产品、能提供什么帮助；分享中医文化，就说明自己的学习背景，不把兴趣包装成专业资质。说明白自己擅长什么，别人才能知道什么时候适合来找你。</p><h3 id="source-p270l10">内容：你说什么？</h3><p id="source-p270l11">内容会让别人看见你的经验、兴趣和判断。</p><p id="source-p270l12">• 价值分享：讲知识、讲方法、讲洞察。不求复杂，但要有态度。</p><p id="source-p270l13">• 工作与学习记录：讲遇到的问题、学到的东西和做错的地方。涉及客户的内容，先取得同意并保护隐私。</p><p id="source-p270l15">• 生活日常：按自己的意愿分享早餐、阅读、陪伴家人或运动的小片段。</p><p id="source-p270l16">选择自己愿意公开的部分即可，不必为了经营形象展示全部生活。</p><h3 id="source-p270l19">呈现：怎样便于别人阅读</h3><p id="source-p270l20">头像、简介、配图和排版，尽量清楚、容易识别。色彩和字体不必经常更换。段落不要太挤，图片上的字要看得清楚。语气沿用自己平时说话的方式。</p><h2 id="source-p271l5">表达与做事要对得上</h2><p id="source-p271l6">个人IP要帮助别人了解你，并有依据地信任你。</p><h3 id="source-p271l9">一致性</h3><p id="source-p271l10">对外说明自己的工作，实际提供的服务也要与之相符。有变化就说清楚，不必为了维持人设掩饰。</p><h3 id="source-p271l12">长期性</h3><p id="source-p271l13">别人了解你需要时间，内容也可以慢慢积累。选择做得过来的频率，没有新内容时，不必为了打卡凑一条。</p><h3 id="source-p271l17">回应具体的人</h3><p id="source-p271l18">有人留言提问，认真回答；自己答应回复的事情，记得做到。阿芳连续三年每天分享“健康早餐”，从最初的3个点赞到现在的300个读者。有人向她询问早餐做法，也有人和她交流自己的日常习惯。这些来回的交流，比单看点赞数更能说明彼此是否了解。</p><h2 id="source-p272l1">从介绍自己到持续交流</h2><section class="gy-table" id="source-p272l2" aria-label="分项对照"><div class="gy-record"><p id="source-p272l2-r1-c1"><span class="gy-label">阶段</span><span class="gy-value">介绍自己</span></p><p id="source-p272l2-r1-c2"><span class="gy-label">先做什么</span><span class="gy-value">写清工作、经验和服务范围</span></p><p id="source-p272l2-r1-c3"><span class="gy-label">怎样回看</span><span class="gy-value">别人能否准确理解你做什么</span></p></div><div class="gy-record"><p id="source-p272l2-r2-c1"><span class="gy-label">阶段</span><span class="gy-value">积累内容</span></p><p id="source-p272l2-r2-c2"><span class="gy-label">先做什么</span><span class="gy-value">从知识、工作记录和生活见闻中选择适合的内容</span></p><p id="source-p272l2-r2-c3"><span class="gy-label">怎样回看</span><span class="gy-value">哪些有人关心，哪些自己能够持续写</span></p></div><div class="gy-record"><p id="source-p272l2-r3-c1"><span class="gy-label">阶段</span><span class="gy-value">整理与交流</span></p><p id="source-p272l2-r3-c2"><span class="gy-label">先做什么</span><span class="gy-value">把同一主题的内容归类，认真答复问题</span></p><p id="source-p272l2-r3-c3"><span class="gy-label">怎样回看</span><span class="gy-value">资料是否过时，承诺的事是否完成</span></p></div></section><p id="source-p272l6">建立个人品牌，要从自己的经历和长处出发，让别人认识一个可信的人。</p><h2 id="source-p272l16">可以怎样开始</h2><p id="source-p272l17">个人IP需要持续经营，让别人有时间认识你、了解你。从下面几件事做起就可以。</p><h3 id="source-p272l19">写清自己的介绍</h3><p id="source-p272l20">写明自己目前做什么、能提供什么服务。涉及专业身份的称谓，应与实际资质相符。不必发明一个响亮的新头衔。定位清楚，客户遇到相关问题时，才更容易想起你。</p><h3 id="source-p273l4">选几类自己能持续写的内容</h3><p id="source-p273l5">可以先从以下几类内容中选择：</p><p id="source-p273l6">• 知识与方法：选自己弄懂、有出处的内容，用平实的话解释；拿不准的先查。</p><p id="source-p273l8">• 工作记录：讲怎样处理问题，也交代没有解决的部分，不借客户经历夸大效果。</p><p id="source-p273l9">• 生活点滴：按自己的意愿分享阅读、运动或日常见闻，不必把每件小事都上升成道理。</p><p id="source-p273l11">内容里可以有普通的生活、做事的过程，也可以有尚未解决的问题。</p><h3 id="source-p273l12">按不同场合调整表达</h3><p id="source-p273l13">同一件事，在不同平台上的讲法可以有所变化。</p><p id="source-p273l14">• 朋友圈：简要交代事情和自己的看法；</p><p id="source-p273l15">• 短视频：先讲清一个问题，避免塞进太多内容；</p><p id="source-p273l16">• 直播：留时间回答现场提问。</p><p id="source-p273l17">同样一段话，在不同场景呈现时语气应不同：朋友圈要像朋友说话，视频要像故事讲述，直播要像温暖的对谈。</p><h3 id="source-p273l18">整理以前写过的内容</h3><p id="source-p273l19">内容多了，可以按主题归类，便于后来的人查阅。写过一段时间以后，可以这样整理：</p><p id="source-p273l21">• 把内容整理成文章合集、短视频系列；</p><p id="source-p273l22">• 经同意可以使用的案例，注明背景与适用范围；</p><p id="source-p273l23">• 把经典表达语句做成素材库。</p><p id="source-p273l24">让新客户“一键可见”，让老客户“随时回看”。这些资料也留下了平日做事的记录，方便别人了解和判断。言行一致，平日留下的记录才有参考价值，也才容易让人信任。</p><h2 id="source-p274l1">怎样介绍企业与自己</h2><p id="source-p274l2">很多人担心：“如果每个人都做IP，会不会和公司品牌冲突？”两者能否相互配合，要看表达是否准确、服务是否一致。</p><h3 id="source-p274l5">企业资料提供背景</h3><p id="source-p274l6">企业与产品的介绍，要有明确出处。集团、具体经营企业和某款产品，不是同一个概念；介绍规模、标准或资质时，要说清对应主体和时间。</p><p id="source-p274l9">例如，提到一项标准，就说明标准名称、参与主体以及与所介绍产品的关系，不能笼统说成“国家标准背书”。</p><h3 id="source-p274l11">个人承担具体服务</h3><p id="source-p274l12">客户日常联系的，往往是眼前这位服务人员。客户通过与你的接触，形成对品牌的具体印象。企业背景不能代替个人把事情做好。企业提供品牌和产品基础，个人则通过具体服务与客户建立联系。</p><h2 id="source-p274l18">典型案例复盘</h2><h3 id="source-p274l19">持续记录的交流</h3><p id="source-p274l20">小陈最初只是记录自己的减脂经历，后来每天写“睡眠兽日记”，从饮食、情绪到睡眠一一分享。三个月后，她的朋友圈成了“减脂打卡圈”。有人向她提问，也有人分享自己的经历。超出她能力范围的问题，她仍需说明白。这些记录让人更容易知道她正在做什么。</p><h3 id="source-p275l1">只转发，看不出自己的看法</h3><p id="source-p275l2">小王想做“健康达人”，却天天转发别人写的文章，配几句无关痛痒的感叹。三个月后，点赞量锐减，客户私下说：“看不出他是谁。”教训：只有转发，很难让人认识你。加入自己的经历和想法，才能逐渐形成个人特点。转发有用的资料也可以，但应先读懂，注明出处，再说明自己为什么推荐。个人品牌要从自己的特点长出来，模仿别人往往难以长久。</p><h2 id="source-p275l8">常见误区与改进</h2><section class="gy-table" id="source-p275l9" aria-label="分项对照"><div class="gy-record"><p id="source-p275l9-r1-c1"><span class="gy-label">问题</span><span class="gy-value">经历或身份不实</span></p><p id="source-p275l9-r1-c2"><span class="gy-label">可能的结果</span><span class="gy-value">实际接触后产生怀疑</span></p><p id="source-p275l9-r1-c3"><span class="gy-label">调整方向</span><span class="gy-value">准确介绍自己，承认能力范围</span></p></div><div class="gy-record"><p id="source-p275l9-r2-c1"><span class="gy-label">问题</span><span class="gy-value">内容缺少关联</span></p><p id="source-p275l9-r2-c2"><span class="gy-label">可能的结果</span><span class="gy-value">读者不知道主要讲什么</span></p><p id="source-p275l9-r2-c3"><span class="gy-label">调整方向</span><span class="gy-value">确定常写的主题，其他内容适量穿插</span></p></div><div class="gy-record"><p id="source-p275l9-r3-c1"><span class="gy-label">问题</span><span class="gy-value">短期追逐反应</span></p><p id="source-p275l9-r3-c2"><span class="gy-label">可能的结果</span><span class="gy-value">频繁换方向，难以积累</span></p><p id="source-p275l9-r3-c3"><span class="gy-label">调整方向</span><span class="gy-value">选择可持续的频率，定期回看</span></p></div><div class="gy-record"><p id="source-p275l9-r4-c1"><span class="gy-label">问题</span><span class="gy-value">只套模板</span></p><p id="source-p275l9-r4-c2"><span class="gy-label">可能的结果</span><span class="gy-value">看不出自己的经验与判断</span></p><p id="source-p275l9-r4-c3"><span class="gy-label">调整方向</span><span class="gy-value">从具体经历写起，删掉借来的口号</span></p></div></section><p id="source-p275l14">长期保持可信的言行，比一时把内容包装得漂亮更要紧。</p><h2 id="source-p275l15">让日常做法经得起核对</h2><p id="source-p275l16">长期积累之后，个人品牌才会与日常的可信表现联系起来。客户关心的承诺，要在服务中兑现。伙伴拿来参考的经验，要交代清楚来龙去脉。自己尚未弄懂的地方，承认下来，再去学习。信任增加以后，更要给别人保留独立判断的余地。</p><nav><a href="ch28.html">上一节</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">全书目录</a> · <a href="closing.html">下一节</a></nav></main></noscript></body></html>
