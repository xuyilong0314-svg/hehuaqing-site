</head><body><div id="root"></div><noscript><main style="max-width:760px;margin:auto;padding:40px 24px;line-height:1.9"><nav><a href="/#books">全部著作</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">广药新康美</a></nav><h1>第九章｜一个人到一个团队</h1><p>何华清 著</p><h2 id="source-p93l0">一个人忙不过来时</h2><p id="source-p93l1">一个人做事，许多环节都可以由自己处理。工作多了以后，时间和精力会不够用。这时开始考虑带人，需要面对一个新问题：自己会做的事情，怎样教给别人？对愿意参与工作的伙伴，除了让他听懂，还要留机会让他亲手做。</p><h2 id="source-p93l15">为什么要让别人学会</h2><p id="source-p93l16">在商业的早期阶段，许多人靠“个人能力”崛起，他们勤奋、能讲、能拼。能够长期分工，才有可能把一部分工作交出去。</p><h3 id="source-p93l20">一个人的时间有限</h3><p id="source-p93l21">一个人一天能拜访几位客户？能分享几次？即使用尽全力，也终究有尽头。多人配合可以分担工作，前提是大家清楚各自负责什么。</p><h3 id="source-p94l0">工作要有人接手</h3><p id="source-p94l1">每项事情都要负责人亲自到场，时间久了，个人和团队都会吃力。人数增加之外，还要把教人、分工和配合的办法建立起来。</p><h3 id="source-p94l5">留下可以参考的示范</h3><p id="source-p94l6">如果总是同一个人讲解、带人、处理购买问题，其他人很难得到练习。教人，是让他逐渐能在自己的岗位上独立做事。负责人要为这种独立留出空间。</p><h2 id="source-p94l12">经验传递中的三件事</h2><p id="source-p94l13">带人可以从三个方面观察。先看会不会做，再看是否理解原因，最后看能否按照共同认可的习惯去做。</p><h3 id="source-p94l16">教会基本动作</h3><p id="source-p94l17">新人不会讲？那就让他从最小的动作开始：</p><p id="source-p94l18">• 写名单</p><p id="source-p94l19">• 邀约见会</p><p id="source-p94l20">• 讲清一段经历。先选择一件能够完成的小事，让新人试一试。</p><p id="source-p94l23">当新人完成第一次邀约、第一次沟通、第一次见会，信心就开始萌芽。动手之前说明必要的要求，做完以后再一起回看，理解会逐渐具体起来。第一层复制，就是让每个人都能动起来。</p><h3 id="source-p95l3">说明判断的理由</h3><p id="source-p95l4">当团队能行动后，要让他们理解“为什么”。</p><p id="source-p95l5">• 为什么列名单？——为了安排联系，并留下回顾的依据。</p><p id="source-p95l6">• 为什么邀请要简明？——便于对方迅速听懂目的与安排。</p><p id="source-p95l7">• 为什么参加交流？——看看能否从中找到自己需要的信息。</p><p id="source-p95l8">理解这些理由，遇到不同情况时才知道怎样调整。</p><h3 id="source-p95l11">形成共同的习惯</h3><p id="source-p95l12">当团队的动作熟练、思维清晰，下一个阶段，就是文化的复制。文化是什么？它表现在负责人不在场时，大家仍然怎样对待客户和同伴。共同认可的价值，会影响团队怎样做事。新人开始主动帮别人，伙伴在困难中互相支持，这些都是文化在日常相处中的表现。这些习惯稳定下来，日常工作就少一些反复催促。</p><h2 id="source-p95l24">用哪些方式帮助学习</h2><p id="source-p95l25">要把经验教出去，还需要准备材料和练习机会。它需要明确的结构、流程，以及大家熟悉的共同活动。</p><h3 id="source-p96l1">在会议中练习</h3><p id="source-p96l2">会议可以用来示范，也可以用来回顾问题。新人讲一讲自己的疑问，老伙伴说一说做法，再一起看哪些地方需要调整。定期会议，让平时各自做事的人有机会交流、协调和学习。</p><h3 id="source-p96l9">整理共同使用的资料</h3><p id="source-p96l10">PPT、手册、视频和常见问题表，可以让基本信息保持一致。资料更新后及时通知，避免不同人继续使用旧说法。</p><h3 id="source-p96l15">观察熟练的人怎样做</h3><p id="source-p96l16">看见同伴怎样处理一件事，往往比听一段笼统的要求更容易学。示范时，把难处和处理过程也讲出来。</p><h3 id="source-p96l23">在相处中形成习惯</h3><p id="source-p96l24">规则说明怎样做事，文化则影响人们为什么愿意这样做。共同的做法需要反复讨论，也需要负责人自己遵守。</p><h2 id="source-p97l16">一步步交出去</h2><p id="source-p97l17">把带人的过程分成几步，双方都更容易知道目前做到哪里。下面这四步，可以作为安排练习的参考。</p><h3 id="source-p97l20">第一步：我做给你看</h3><p id="source-p97l21">新人刚进来，总是慌。怕说错，怕尴尬。先做一遍给他看，让他知道完整过程是什么样。怎样准备、怎样开口、遇到问题怎样答复，都可以边做边说明。看完以后，先听他说一遍自己理解的步骤。</p><h3 id="source-p98l5">第二步：我带你一起做</h3><p id="source-p98l6">看懂之后，就要进入“并肩”的阶段。还不熟悉的地方，由你在旁边补充。你邀约时，让他听；他邀约时，你帮他补充；一起面对拒绝，一起总结反应。这一阶段的核心，是“陪练”。一起做完一次，才能知道他具体卡在哪里。</p><h3 id="source-p98l16">第三步：你做我在旁</h3><p id="source-p98l17">到了这一步，新人开始有了勇气，愿意上场。让他多承担一些，你在旁边观察。事先约定哪些情况需要及时提醒，其他问题可以做完后再讨论，尽量不打断他的表达。给他自己处理的机会，才能看出是否已经学会。陪他经历一遍，再让他自己尝试，他才会逐渐形成自己的做法。</p><h3 id="source-p98l25">第四步：你独立去做</h3><p id="source-p98l26">当新人能够独立邀约、独立见会、独立复盘，你就要放手。让他去带新人、去主持会议、去面对挑战。独立完成之后，还可以让他试着教下一位同伴。这时，负责人更多是观察和补充。每一步都看实际完成情况，不必只按加入的天数来推进。</p><h2 id="source-p99l8">典型案例：从个人到团队</h2><h3 id="source-p99l9">小李开始教别人</h3><p id="source-p99l10">小李入行时，只会发朋友圈——没人回应。导师没有批评，只是说：“我们从头来。写名单。”他不情愿，但照做。三天写满一百个名字，导师陪他打电话。第一通，他语无伦次；第三通，他已经笑着邀约。一个月后，他能独立操作。半年后，他的团队成员也在复制相同流程。小李说，有人陪着走过这几步，自己才慢慢知道怎样做。</p><h3 id="source-p99l18">小芳与伙伴一起做事</h3><p id="source-p99l19">小芳最初靠自己，三个月累到几乎放弃。导师提醒她，先看看哪些工作可以教给同伴。她开始交出权力：会议交给系统，培训交给导师，复盘交给小组。三个月后，她的团队从十人扩展到五十人。</p><p id="source-p99l24">“以前总想自己做快一点，现在得腾时间教别人。”她说。教人一开始也会花时间，但这是分工能够发生的前提。</p><h2 id="source-p100l1">实操练习</h2><h3 id="source-p100l2">练习一：四步带人法</h3><p id="source-p100l3">找一个新人，从“我做→我带→你做我在旁→你独立”完整演练一轮。结束后写下复盘笔记：他在哪一步犹豫？你在哪个环节干预过多？做完后一起回看，也是在继续学习。</p><h3 id="source-p100l7">练习二：带教记录</h3><p id="source-p100l8">每天写下一件你复制出去的行动。哪怕只是“今天带新人发了第一条邀约语音”。过一段时间再回看，看看哪些事已经可以交给别人，哪些还要继续练习。</p><h3 id="source-p100l12">练习三：文化传递</h3><p id="source-p100l13">安排一次小组交流，请大家讲一件照顾客户或帮助同伴的具体事情。每人用一分钟讲清经过，再讨论哪些做法值得留下。</p><h2 id="source-p100l17">共同的做事习惯</h2><p id="source-p100l18">学会动作以后，还要逐渐形成共同认可的要求。这些要求需要在日常工作中反复实践。遇到困难时，大家能不能说实话、一起处理问题，比平时喊得是否响亮更能说明团队的情况。可以从几件小事开始：</p><p id="source-p100l23">• 信息一致：关键事实有共同资料可查。</p><p id="source-p101l0">• 责任清楚：谁接了问题，谁负责答复。</p><p id="source-p101l1">• 彼此支持：需要帮助时能开口，也有人愿意回应。</p><p id="source-p101l19">能不能理解方法、独立处理问题，要在实际工作中看。交出一件事之后，留些时间观察。对方还需要帮助时接住，已经能做的就让他自己做。</p><nav><a href="ch08.html">上一节</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">全书目录</a> · <a href="ch10.html">下一节</a></nav></main></noscript></body></html>
