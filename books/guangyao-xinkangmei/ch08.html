</head><body><div id="root"></div><noscript><main style="max-width:760px;margin:auto;padding:40px 24px;line-height:1.9"><nav><a href="/#books">全部著作</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">广药新康美</a></nav><h1>第八章｜把账算清，替家人选好</h1><p>何华清 著</p><h2 id="source-p83l14">答应见面以后</h2><p id="source-p83l15">小赵约小李在茶馆见面，前前后后聊了三个小时。从健康聊到工作，话题一直没有停。小李听着，不时点头。快结束时，他说：</p><blockquote><p id="source-p83l22">“让我再考虑一下吧。”</p></blockquote><p id="source-p83l23">小赵有些失落。他回想自己说过的话，担心是不是哪里没讲清楚。导师听完，问他有没有了解小李还在考虑什么。</p><blockquote><p id="source-p84l2">“点头可能只是听懂了。买不买，他还要对照自己的需要和预算想一想。”</p></blockquote><p id="source-p84l5">一场交流结束后没有购买，也能留下有用的反馈。先弄清对方的疑问，再决定是否还有事情需要说明。</p><h2 id="source-p84l7">购买前容易忽略的事</h2><p id="source-p84l8">第一种误区：说得太多。许多人以为，只要把所有资料、逻辑、案例都倒出来，对方自然会被压服。资料一多，对方反而可能分不清哪些与自己有关。抓住他正在问的问题回答，比继续加材料更有用。第二种误区：怕被拒绝。“算了，他要是真的想买，会主动开口。”对方可能还有问题没有问出口，可以留一次询问的机会。问清楚以后，也要容得下他暂时不买或决定不买。第三种误区：只顾着问买不买，忽略了对方怎样考虑。</p><p id="source-p84l18">购买涉及需要、预算和信任，不能只看最后有没有签字。对方犹豫时，先弄清他还有什么问题，再看看能提供怎样的帮助。</p><h2 id="source-p84l24">把费用算清楚</h2><p id="source-p84l25">对价格有疑问时，可以把费用摊开来算。数量、规格、单价和后续开支都写清，才便于比较。</p><h3 id="source-p85l1">看家庭预算</h3><p id="source-p85l2">可以先问：“这项开支在你原来的预算里吗？”已经发生的医疗支出和准备购买的产品，要分别计算。不能承诺买了产品就能抵消未来的医疗费用。家里的看病、用药和日常生活开支，都要按实际需要安排。介绍产品时，把它本身的用途和价格说清楚，让对方判断是否值得购买。</p><h3 id="source-p85l13">算消费账</h3><p id="source-p85l14">同样预算下，可以把同类产品的规格、成分、使用要求和售后放在一起比较。对照表应当采用同一口径，不能只挑有利于自己的项目。价钱便宜或贵一些，都要说明差别具体在哪里。</p><h3 id="source-p85l22">算事业账</h3><p id="source-p85l23">如果对方考虑参与经营，先算自己能投入多少时间和资金。预期收入与已经发生的收入要分开，再扣除进货、交通、活动等费用。做经营有成本和不确定性，作决定前要给自己留出余地。</p><p id="source-p86l1">案例：小李觉得这套产品太贵。</p><p id="source-p86l3">他家里原本就有固定的医疗和生活支出，购买产品还会增加一笔费用。这时需要看的是预算是否承受得起、产品是否确实需要，不能用“以后少跑一次医院”劝他购买。算过账，对方才有机会把选择放回自己的生活中考虑。</p><h2 id="source-p86l9">替家人选东西</h2><p id="source-p86l10">很多人给自己买东西时犹豫，想到父母和孩子却舍得花钱。这份心意应当得到尊重。也正因为如此，介绍产品时更不能催促。</p><h3 id="source-p86l13">先问需要</h3><p id="source-p86l14">“父母现在最关心什么？这件东西他们自己想用吗？”他们的需要应由他们说出来，不能只凭子女的好意替他们决定。把话题放回家人的日常生活，才容易知道哪些事值得先做。</p><h3 id="source-p86l19">考虑负担</h3><p id="source-p86l20">家里要承担哪些固定开支，购买后会不会影响原有安排，都应提前想清楚。这些问题，让谈话回到家庭需要面对的实际开支。今天花一笔钱，不能保证将来省下一大笔医疗费。</p><h3 id="source-p87l0">留下陪伴</h3><p id="source-p87l1">照顾家人还有许多具体的事：听他们说话，了解近况，需要时陪着处理问题。话题由此回到了他关心的家人身上。礼物和产品都只是其中一种选择。</p><p id="source-p87l6">案例：张叔犹豫是否开始这份事业。</p><p id="source-p87l8">导师没有多言，只问了一句：</p><blockquote><p id="source-p87l9">“你想为家里做什么？这项工作需要你付出多少？”</p></blockquote><p id="source-p87l10">张叔沉默了一会儿。张叔最后作了决定。关心家人的心情很真切，具体选择仍要考虑自己的能力和处境。</p><h2 id="source-p88l2">听经历，也看具体资料</h2><p id="source-p88l3">了解别人的经历、参加一次交流，可以帮助提出新的问题。有了兴趣以后，还要继续核对资料。</p><h3 id="source-p88l6">怎样听一段使用经历</h3><p id="source-p88l7">普通人的讲述容易理解，但个体经历有自己的条件。</p><p id="source-p88l9">• 使用体验：讲清用了什么、怎样使用、同期还有哪些生活变化。</p><p id="source-p88l11">• 经营经历：介绍收入时，也交代投入、费用和时间，不把个别结果当作大家的结果。</p><p id="source-p88l13">• 学习经历：可以谈从不敢说到能够完整表达的过程，让听者知道中间练过什么。</p><p id="source-p88l16">经历讲得越具体，越便于别人判断与自己有多少关系。</p><p id="source-p88l17">案例：阿芳一开始很怯场，什么也不会讲。</p><p id="source-p88l19">她讲了自己使用产品后的感受。朋友听过以后，想再了解产品的具体信息。个人经历使他产生了兴趣，是否购买仍需结合自己的需要判断。朋友愿意试一试，仍要先了解标签、用途和使用要求。</p><h3 id="source-p89l0">参加交流前后</h3><p id="source-p89l1">个人讲不清楚时，可以请对方接触团队里其他人的经验。不同规模的活动，可以提供不同的交流机会。</p><p id="source-p89l3">• 小型交流：便于坐下来提问，了解个人关心的细节。</p><p id="source-p89l4">• 专题讲解：适合把一个问题讲得完整一些。</p><p id="source-p89l5">• 大型活动：可以接触较多信息，回来后仍需逐项核对。</p><p id="source-p89l6">案例：小赵的朋友总是犹豫不决。</p><p id="source-p89l8">他没再解释，只轻轻说了一句：</p><blockquote><p id="source-p89l9">“周末有个大会，你来看看。”</p></blockquote><p id="source-p89l10">朋友到现场听了分享，情绪受到感染。原先犹豫的事情，他当晚便作了决定。这样的例子提醒我们，现场气氛会影响判断。活动结束后，仍应留出时间，让对方安静地把费用、责任和需要想清楚。</p><h2 id="source-p89l15">购买前的考虑</h2><p id="source-p89l16">小李迟迟没有决定，介绍者又谈起了家庭开支和父母的身体状况。这些都是小李在意的事。后来，他参加了一次健康沙龙。现场的音乐、灯光和众人的热情让他受到感染，他点头表示愿意继续。回头看这段过程，更需要确认的是：他是否明白自己选择了什么，是否还有没有问完的问题。小王的一位朋友第一次了解后说：“太贵了。”小王没有急着解释，只说：</p><blockquote><p id="source-p90l0">“你愿意的话，可以再去听一次。听完仍由你自己考虑。”</p></blockquote><p id="source-p90l1">会上，一位母亲讲起照顾父亲的经历。他听后有些动容。会后，他表示愿意再了解一些。情感让交流继续下去，价格和产品问题仍需要逐项答复。这次交流能继续，离不开此前的耐心，也离不开对方愿意进一步了解。把问题谈透，比一味设法消除犹豫更重要。</p><h2 id="source-p90l8">实操练习</h2><h3 id="source-p90l9">练习一：三分钟算账</h3><p id="source-p90l10">找一个伙伴，假装他犹豫。用三分钟列清一项产品或服务的实际费用、数量和使用安排，让对方能够检查。</p><h3 id="source-p90l13">练习二：听听家人的需要</h3><p id="source-p90l14">练习怎样询问家人的近况，避免直接把谈话带向购买。</p><p id="source-p90l15">例如：</p><p id="source-p90l16">• “最近有没有什么事情让你觉得不方便？”</p><p id="source-p90l17">• “这件东西你自己想用吗？”</p><p id="source-p90l18">• “除了买东西，还有什么是我可以帮忙的？”</p><h3 id="source-p90l19">练习三：会议引荐</h3><p id="source-p90l20">准备一段介绍，把活动内容和安排说清楚，并留下拒绝的余地。</p><blockquote><p id="source-p90l21">“你不必现在决定，只要去听一次，自己判断。”</p></blockquote><p id="source-p90l22">在作决定之前，先邀请他到现场了解情况。</p><h2 id="source-p91l0">购买之后还有哪些工作</h2><p id="source-p91l1">签下合同，也意味着作出一个与自己生活有关的选择。对自己，要知道买了什么、承担什么。涉及家人的需要时，应听取他们的意见。对提供产品和服务的人，成交以后要履行约定。</p><nav><a href="ch07.html">上一节</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">全书目录</a> · <a href="ch09.html">下一节</a></nav></main></noscript></body></html>
