</head><body><div id="root"></div><noscript><main style="max-width:760px;margin:auto;padding:40px 24px;line-height:1.9"><nav><a href="/#books">全部著作</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">广药新康美</a></nav><h1>第二十六章｜用记录看清经营</h1><p>何华清 著</p><h2 id="source-p244l7">小周的月度记录</h2><p id="source-p244l8">那是一个普通的月度总结夜。会议室的投影亮着，小周满脸自信地展示他的成果：“老师，我这个月朋友圈发了20条，邀约了15个客户，成交了3单。”掌声响起几秒，导师淡淡问了一句：</p><blockquote><p id="source-p244l12">“你的邀约转化率是多少？”</p></blockquote><p id="source-p244l13">小周愣住了。他报出了数量，却还没有比较各个环节的结果。导师请他把到场、购买和后续反馈放在一起看，找出需要继续了解的地方。小周才发现，有些邀请没有说清主题，有些客户的问题也没及时回复。记下数字，是为了让这些问题更容易被发现。</p><h2 id="source-p245l0">记录能帮助我们看见什么</h2><h3 id="source-p245l1">做过哪些事</h3><p id="source-p245l2">忙了一周，凭印象回想，常会漏掉一些事情。发过多少内容、联系过多少人、处理了多少问题，可以简要记下来。把做过的事记下来，才方便观察自己有没有进步。</p><h3 id="source-p245l6">哪一步需要调整</h3><p id="source-p245l7">不同环节的数字放在一起，才便于比较。邀请很多、到场很少，和到场不少、后续没有回应，是两种不同的问题。没有记录，做得多还是做得有效，往往只能凭感觉判断。</p><h3 id="source-p245l11">哪些做法值得多了解</h3><p id="source-p245l12">数字能提示差异，但不自动说明原因。同样联系十个人，结果不同，还要看对象、内容、时机和后续服务。数据把这些差别显出来，供我们检查和调整。</p><h2 id="source-p245l16">先保留少量有用的记录</h2><p id="source-p245l17">很多团队陷入“数据海洋”，每天填表、打卡、汇报，却依然迷茫。表格应当服务于工作。填完从来不用的数据，可以考虑不再收集。通常可以先看三类：</p><h3 id="source-p245l21">过程指标：看你做了多少</h3><p id="source-p245l22">• 每天发多少条朋友圈？</p><p id="source-p245l23">• 每周邀约多少客户？</p><p id="source-p245l24">• 每月开展几场活动？这些记录说明做了多少，不能单凭数量判断质量。</p><h3 id="source-p246l0">结果指标：看你做成了多少</h3><p id="source-p246l1">• 成交额、复购率。</p><p id="source-p246l2">• 新增客户数、活跃客户数。统计时先说清“新增”和“活跃”的范围。</p><h3 id="source-p246l3">效率指标：比较环节之间的关系</h3><p id="source-p246l4">• 到场率＝实际到场人数÷已邀请人数。</p><p id="source-p246l5">• 购买转化率＝购买人数÷到场人数。分子、分母须来自同一时期、同一批人；人数很少时，不宜据此作大判断。</p><p id="source-p246l7">还可以看客户在一段时间后是否继续保持联系，结合反馈了解原因。数字变化只是线索，收入、成本、退货和服务情况也要一起看。</p><h2 id="source-p246l12">怎样展示记录</h2><p id="source-p246l13">记录整理成简明的表或图，便于大家讨论。涉及个人与客户的信息，应限制在确有工作需要的范围内查看。</p><h3 id="source-p246l16">日常进展表</h3><p id="source-p246l17">哪些联系已完成，哪些问题待处理，哪些事情需要帮助，可以列在一张表里。</p><h3 id="source-p246l20">每周回顾</h3><p id="source-p246l21">一起看本周的进展，选择一两个有用的做法分享。排名如果让人只追数量或虚填数字，就应调整方式。</p><h3 id="source-p247l0">月度趋势看板</h3><p id="source-p247l1">用曲线图展示整体趋势：上升还是下降？把几个时期的数字放在一起，也要注明统计范围是否变化。一次数字的高低说明不了全部问题，还要看一段时间里的变化。图表展示以后，仍需要听当事人说明情况。</p><h2 id="source-p247l6">用记录讨论下一步</h2><p id="source-p247l7">填完表，还得回到实际问题。复盘时不要逐个念数字，选择最需要处理的一两件事深入谈。</p><h3 id="source-p247l9">时间频率</h3><p id="source-p247l10">• 每周一次“小复盘”，针对行动与策略。</p><p id="source-p247l11">• 每月一次“大复盘”，对标目标与趋势。</p><h3 id="source-p247l12">标准流程</h3><p id="source-p247l13">回顾：对照目标与实际。分析：哪些成功可复制？哪些失败可避免？行动：下周要如何改？责任人是谁？</p><h3 id="source-p247l16">谁来主持与记录</h3><p id="source-p247l17">每次复盘由不同人主持，让所有成员都具备“自省力”。把事情的经过讲清楚，讨论做法，避免把数字高低直接当成人的好坏。复盘时，把不同时间的数字放在一起，观察变化，再决定下一步怎样做。复盘也是让大家重新检查共同判断的机会。</p><h2 id="source-p248l11">设计一套适合团队的数据化体系</h2><p id="source-p248l12">先根据实际工作决定记录哪些内容。别的团队用得好的表，不一定适合自己。可以先试，再删去用不上的栏目。个人、小组和团队，需要看的内容也有区别。</p><h3 id="source-p248l16">个人：记清做过的事</h3><p id="source-p248l17">• 每日必填：邀约人数、见面人数、成交人数。</p><p id="source-p248l18">• 每周总结：复购情况、客户反馈、个人成长反思。</p><p id="source-p248l19">新人先学会记清“今天做了什么”“这些行动有什么结果”，再逐步学习分析。</p><h3 id="source-p248l21">小组：找出需要配合的事</h3><p id="source-p248l22">• 小组长每周汇总：团队总邀约量、出席率、转化率。</p><p id="source-p249l0">• 只向相关人员展示必要的汇总，客户和成员的敏感信息不放进公开群。</p><p id="source-p249l1">把数字拿出来共同讨论，是为了看见下一步怎样改进，而不只是完成上交作业。</p><h3 id="source-p249l2">团队：看整体情况</h3><p id="source-p249l3">• 月度总览：客户数、活跃会员数、营收曲线。</p><p id="source-p249l4">• 年度回顾：结合收入、费用、客户留存和服务能力，看看哪些安排需要改变。</p><p id="source-p249l5">记录能帮助负责人看见整体变化，也让伙伴知道自己的进展在哪里。三层记录尽量衔接，已经填过的内容不再重复抄写。</p><h2 id="source-p249l8">记录怎样帮助调整</h2><h3 id="source-p249l9">小刘调整了联系对象</h3><p id="source-p249l10">小刘每天邀约20人，但成交率始终偏低。回看记录，她发现不少人对主题没有兴趣，也有人明确表示不在预算之内。导师建议她尊重这些选择，把时间留给主动愿意了解、且有相应需要的人。后来，她联系的人数少了，交流也更充分。有了对照，才知道哪些事情值得多做，哪些做法需要调整。</p><h3 id="source-p249l18">小王的回访习惯</h3><p id="source-p249l19">小王平时沉默寡言，大家以为他“存在感低”。整理购买记录以后，大家发现他那里有不少客户再次购买。复盘后发现，他的跟进话术特别温柔、细致。导师请他说明平时怎样回访，再让其他伙伴结合自己的情况尝试。原来不显眼的一个习惯，被全队发现并学了过去。数据能帮助团队看见此前忽略的细节，也让不显眼的努力得到回应。</p><h2 id="source-p250l0">让记录更容易坚持</h2><p id="source-p250l1">记录安排得简单一些，讨论也有固定时间，才比较容易持续。</p><h3 id="source-p250l2">简化记录工具</h3><p id="source-p250l3">使用Excel、飞书表单或小程序制作“打卡工具”。输入三项核心数据：邀约、成交、复购。系统自动汇总，无需手抄。工具尽量简单，记录时才不会觉得麻烦。</p><h3 id="source-p250l7">分享有用的做法</h3><p id="source-p250l8">每周可以留一点时间，让伙伴说说：</p><p id="source-p250l9">• 哪一次联系有了进展；</p><p id="source-p250l10">• 哪一个问题还没有解决；</p><p id="source-p250l11">• 哪种做法可以给别人参考。</p><h3 id="source-p250l15">给讨论固定的时间</h3><p id="source-p250l16">每次复盘先明确要谈的问题，避免把时间耗在重复汇报上。每个人发言3分钟，说出一句“我发现了什么”。讲完以后，确定下一步由谁做、什么时候再看。</p><h2 id="source-p250l21">常见阻力与解决方案</h2><h3 id="source-p250l22">阻力一：有人抗拒数据化</h3><p id="source-p250l23">理由：麻烦、没时间。解决：简化表格，只留核心三项。填表不超过两分钟。门槛低一些，才容易坚持下来。</p><h3 id="source-p251l1">阻力二：有人害怕公开数据</h3><p id="source-p251l2">理由：怕被比较。先说明哪些信息确有必要共享，哪些只需本人和负责人了解。不靠公开排名逼人填报。看到不足之后，还要一起寻找改进的方法。</p><h3 id="source-p251l5">阻力三：有人敷衍应付</h3><p id="source-p251l6">理由：随便填数字，敷衍了事。解决：建立“随机抽查+实地对照”的机制。发现异常先核实，分清误填、统计口径不同还是故意造假，再决定怎样处理。执行不下去时，也要看看记录方式是否过于繁琐。</p><h2 id="source-p251l12">数字最后要回到具体的人</h2><p id="source-p251l13">到场率提高了，还要看看参与者有没有听懂；购买增加了，也要看后续问题有没有解决。数据工作要持续做，边记边看，才能逐渐改善日常判断。数据最终要用来改进服务，帮助团队更准确地理解客户和伙伴的需要。</p><nav><a href="ch25.html">上一节</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">全书目录</a> · <a href="ch27.html">下一节</a></nav></main></noscript></body></html>
