</head><body><div id="root"></div><noscript><main style="max-width:760px;margin:auto;padding:40px 24px;line-height:1.9"><nav><a href="/#books">全部著作</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">广药新康美</a></nav><h1>第十八章｜遇到低谷时</h1><p>何华清 著</p><h2 id="source-p170l8">面对相似的困难</h2><p id="source-p170l9">那是一个下着细雨的下午。小芳坐在咖啡馆角落，手边的本子摊开，写着几个被划掉的名字。她刚被五个朋友拒绝邀约。她叹了口气，却微笑着在本子上重新写下第六个名字。</p><p id="source-p170l13">“再试一次。”她轻声说。同一时间，小赵也坐在家里。他盯着手机，看着那几个未回复的微信，眉头越皱越紧。</p><p id="source-p170l16">“算了，我可能不适合做这个。”他把手机丢在沙发上，叹出一口闷气。两个人的反应不同，还需要了解各自遇到了什么。回顾时，导师请他们说说经过，先把具体问题摆出来。一个人情绪低落时，需要的可能是休息、帮助，也可能是调整当前安排。</p><h2 id="source-p171l2">状态怎样影响判断</h2><p id="source-p171l3">心情不好时，容易把一次不顺想成全部失败，也可能急着作出过大的承诺。做长期工作，需要给自己安排可以持续的节奏。困难来自哪里，要具体分析，不能全归于是否坚持。拒绝、伙伴离开和业务波动，都可能发生。遇到这些事情，可以先稳住生活，再看工作怎样调整。</p><h2 id="source-p171l17">可以重新想想的三个问题</h2><h3 id="source-p171l18">我原来想做什么</h3><p id="source-p171l19">当你迷茫、疲惫、怀疑时，请回到最初的那个问题：“我为什么要出发？”困难的时候，回想自己为什么开始，也许能帮助判断下一步。最初的想法也可以改变，要看现在的条件是否还适合。</p><p id="source-p171l24">案例：小芳在最低谷的那段日子，几乎想放弃。</p><p id="source-p172l1">她把孩子的照片放在桌前。工作有进展时会高兴，忙得顾不上家里时，也会提醒自己重新安排时间。她仍希望努力，但需要把这个愿望放进现实的时间和费用安排里。</p><h3 id="source-p172l6">现在的判断是否有依据</h3><p id="source-p172l7">对一项工作有信心，也应保留核对和修正的余地。亲身经历值得重视，其中能说明什么、不能说明什么，也要分清。阿明遇到质疑时，别人问他：“这产品真有效吗？”他想拿母亲的健康报告来回答。但个人报告的变化，不能单独说明产品的作用，还需要考虑其他因素。愿意继续了解证据，比急着找一句肯定的答案更踏实。有疑问时查清，有不同意见时听完。</p><h3 id="source-p172l18">可以找谁商量</h3><p id="source-p172l19">难受的时候，可以找愿意认真听自己说话的人。同伴的支持有用，也可以听听家人和团队之外的人怎么看。</p><p id="source-p172l23">案例：小赵低谷那次，已经几乎不想再出门。</p><p id="source-p172l25">后来，他和导师一起参加了交流。听过别人的经历，他愿意再次开口谈自己的问题。得到支持以后，仍需回到实际困难上。</p><h2 id="source-p173l3">整理状态的几种办法</h2><h3 id="source-p173l4">写下当天的情况</h3><p id="source-p173l5">每天写三句话：</p><p id="source-p173l6">• 今天的挫折</p><p id="source-p173l7">• 今天的收获</p><p id="source-p173l8">• 今天得到的帮助</p><p id="source-p173l10">写下来以后，看看哪些是事实，哪些只是自己的猜测。</p><h3 id="source-p173l13">回顾遇到的困难</h3><p id="source-p173l14">每周花30分钟，写下：“这周我经历的最大拒绝是什么？我从中学到了什么？”回顾时，既记录做得不好的地方，也记录已经尝试过的办法。不能马上解决的问题，可以先记着，再寻找需要的信息。</p><h3 id="source-p173l19">参考别人的具体做法</h3><p id="source-p173l20">选择一个你敬佩的导师，记下他面对困难时的故事。比较你们的条件有哪些相同、哪些不同，选择能借鉴的部分。别人的经历可以参考，不必当作自己的时间表。</p><h2 id="source-p174l13">心态的常见误区</h2><p id="source-p174l14">情绪低落时，有几种想法容易让自己更为难。</p><h3 id="source-p174l16">把拒绝当失败</h3><p id="source-p174l17">新人最常见的心理陷阱：“他们拒绝我，就是否定我。”于是，信心被一点点消磨。对方为什么拒绝，要听具体理由，不能猜定他只是没有准备好。停下来考虑，并不等于失败。</p><h3 id="source-p175l3">把低谷当终点</h3><p id="source-p175l4">一段时间没有进展，可能让人担心以后都不会变好。先把眼前的问题拆开，看哪些可以改变，哪些超出了自己的能力。是否继续，要依据这些情况来决定。</p><h3 id="source-p175l12">把比较当动力</h3><p id="source-p175l13">比较有时提供信息，也可能加重自己的焦虑。短期能激发竞争，长期则会让人陷入焦虑与自我怀疑。当你盯着别人跑得多快，你会忘了自己原本的方向。可以回看自己的记录，了解实际变化，不只盯着别人的结果。</p><h2 id="source-p176l1">典型案例</h2><h3 id="source-p176l2">陷入误区的小陈</h3><p id="source-p176l3">小陈在一个月内被拒绝十几次，开始怀疑自己：“是不是没天赋？”他停下邀约，拒绝参加会议，连导师的信息也不回。导师听他讲完，建议先把每次被拒绝的具体理由写下来。这样一来，他有了可以处理的事情，不再只反复责怪自己。他重新开始练习、打电话、写日记。三个月后，业绩突破了两倍。后来的进展与他继续练习、调整做法有关，不能只用一句鼓励来解释。</p><h3 id="source-p176l14">低谷中的阿芳</h3><p id="source-p176l15">阿芳的团队一周内流失两人。她难过得整夜睡不着，怀疑自己做错了什么。导师让她做一次复盘：“看看留下来的三个人——他们是谁？他们为什么还在？”她发现：那三人恰好是最认真学习、最稳定的伙伴。这次讨论让她更清楚，留下的人各自愿意做什么。从那天起，她带着这三人重新出发。半年后，她的团队稳扎稳打，反而更有凝聚力。离开的伙伴也有自己的理由，不必把去留看作人的好坏。</p><h2 id="source-p177l0">状态不好时怎样调整</h2><p id="source-p177l1">情绪需要留意，也需要照顾。可以从四件小事开始。</p><h3 id="source-p177l5">第一步：承认情绪</h3><p id="source-p177l6">不要假装没事。勉强说“没事”，可能让别人不知道你正在需要帮助。先诚实地承认：“我很难过”“我有点焦虑”“我怕失败”。把感受说明白，是为了知道接下来怎样照顾自己。</p><h3 id="source-p177l12">第二步：回到初心</h3><p id="source-p177l13">写下这句话：“我为什么出发？”然后，把答案贴在你每天都能看到的地方。再看看现在的做法，与这个目的是否一致。</p><h3 id="source-p177l19">第三步：设定小目标</h3><p id="source-p177l20">目标太大、事情堆得太多时，容易不知从哪里下手。</p><p id="source-p177l22">请把大目标拆成“今日动作”。今天打一通电话；今天发一条感谢信息；今天复盘一个小失误。完成后看看负担怎样，再安排下一件。</p><h3 id="source-p178l2">找人一起商量</h3><p id="source-p178l3">需要帮助时，可以找信任的人聊聊。同伴、家人或熟悉自己的人，都可以成为商量的对象。不必只留在同一种意见里。</p><h2 id="source-p178l9">实操练习</h2><p id="source-p178l10">练习一：写下最近三次被拒绝的经过，分清对方说过的话与自己的猜测。</p><p id="source-p178l13">目的：从被动反应→主动学习。</p><p id="source-p178l14">练习二：状态低落时，选几件仍能完成的小事，不必一下排得太满，例如：</p><p id="source-p178l16">• 答复一条已经约定的消息</p><p id="source-p178l17">• 每天写一句感恩</p><p id="source-p178l18">• 晚上花十分钟整理当天的问题</p><p id="source-p178l19">练习三：找一位信任的伙伴谈谈近况，听听他的看法，再决定是否需要调整安排。</p><p id="source-p178l22">自愿参与即可，也给不想公开表达的人留出空间。心态会影响判断，也影响每天能否把事情做好。面对拒绝、低谷和外界变化时，尽量保持判断，再安排下一步行动。外部困难一时解决不了，也可以先看看自己的状态和做法有哪些能够调整。</p><nav><a href="ch17.html">上一节</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">全书目录</a> · <a href="ch19.html">下一节</a></nav></main></noscript></body></html>
