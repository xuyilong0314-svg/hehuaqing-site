</head><body><div id="root"></div><noscript><main style="max-width:760px;margin:auto;padding:40px 24px;line-height:1.9"><nav><a href="/#books">全部著作</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">广药新康美</a></nav><h1>第三章｜把学会的教给别人</h1><p>何华清 著</p><h2 id="source-p39l11">怎样教会下一个人</h2><p id="source-p39l12">一次培训营上，一位年轻伙伴问：“我能把自己的经历讲清楚了，可带别人讲，还是不知道从哪里开始。”导师想了想，先请他回忆自己是怎样学会的。有人做过示范，有人听他练过，也有人指出哪里没有说清。把这些过程回想一遍，他才发现，自己原来也不是听了一次就会的。接下来带新人，同样要给出示范和练习的机会。个人经验传给别人以后，才有可能成为团队共同会做的事。带人时，除了看对方会不会做，也要看他能否把过程讲给下一位同伴。</p><h2 id="source-p40l2">从自己会做到别人会做</h2><h3 id="source-p40l3">从示范到独立</h3><p id="source-p40l4">第一章的餐巾纸上写的是人数的乘法。实际教人时，更值得观察的是每一步由谁完成：</p><p id="source-p40l9">• 第一代：你直接讲。</p><p id="source-p40l10">• 第二代：新人讲，你补充。</p><p id="source-p40l11">• 第三代：新人独立讲，你只需见证。</p><p id="source-p40l12">这里的“三代”，用来描述学习和接手的过程。能否独立，仍要看对方实际做得怎样。到了这一步，他已经能离开最初的示范，自己把事情讲清楚了。</p><h3 id="source-p40l16">先听需要，再作说明</h3><p id="source-p40l17">教人之前，先了解他想学什么，以及目前懂到什么程度。一开始就塞进太多产品、经营和收入信息，对方往往记不住。介绍的顺序可以调整：</p><p id="source-p40l21">• 先听对方的需要，再讨论相关产品或工作；</p><p id="source-p40l22">• 先讲容易理解的经历，再解释具体安排；</p><p id="source-p40l23">• 涉及费用和责任时，及时说清楚，不以故事代替必要的信息。</p><h3 id="source-p41l1">用资料辅助讲解</h3><p id="source-p41l2">整理好的工具，可以减轻对个人讲解能力的依赖。微信群、短视频和线上讲座，适合传递多人都需要了解的内容。资料发出以后，还要听听对方是否看懂。系统的作用，是让分享有可以遵循的步骤。</p><h2 id="source-p41l8">把几个环节接起来</h2><p id="source-p41l9">可以把这个过程分为六个相互衔接的环节。列名单：写下100个名字——先写，不筛。了解近况：认真听对方说话，看看他正在关心什么。发出邀请：把见面的目的、时间和方式说清楚。沟通原则：倾听为主，故事为辅，让对方在对比中看见希望。讨论购买：结合需要与预算比较选择，让对方有考虑的时间。继续学习：有意参与工作的新人，还需要练习怎样说明和服务。</p><p id="source-p41l17">练习时间可以尽早约定，也应照顾对方的实际安排。</p><p id="source-p41l18">六个环节前后衔接，做完一个，再进入下一个。</p><h2 id="source-p41l19">两次交流</h2><h3 id="source-p41l20">小李的突破</h3><p id="source-p41l21">小李起初只敢和熟人聊，总觉得“拉不下脸”。导师让他写出“100人名单”，并提醒他：“不用管谁会拒绝，先写出来。”写到第70个名字时，他忽然想起一位多年未联系的同学——正是这个人，后来成为他最早的核心伙伴。这份名单帮小李想起了原本没有想到的人。</p><h3 id="source-p42l3">宝妈的温暖</h3><p id="source-p42l4">一位母亲开始与朋友聊起孩子的作业和生活，慢慢了解对方平时在忙什么。半个月后，她才轻轻地分享自己的体验。朋友说：“正因为你没急着推，我才愿意试。”这次交流以后，两人的联系多了起来，也开始一起做事。别人愿意接着做，常常与他在过程中得到的关心有关。</p><h2 id="source-p43l21">带人时需要怎样的耐心</h2><p id="source-p43l22">教人需要耐心。遇到困难时，先弄清哪一步没做好，再决定怎样继续。</p><h3 id="source-p44l2">几种需要练习的态度</h3><p id="source-p44l3">• 积极心态：不要急于求成，出现困难时一起找原因。</p><p id="source-p44l4">• 学习心态：做过一次以后，还要再练，直到能够独立完成。</p><p id="source-p44l5">• 负责的心态：愿意参与经营的人，需要了解自己应当承担的工作。</p><p id="source-p44l6">• 感恩心态：接受过别人的帮助，也愿意在别人需要时伸手。</p><p id="source-p44l7">• 坚持心态：把工作安排到日常生活里，定期看进展，必要时调整。</p><p id="source-p44l8">遇到挫折时，先稳住自己，才能继续把事情教给别人。</p><h2 id="source-p44l9">不同情境下怎样带人</h2><h3 id="source-p44l10">犹豫的新兵</h3><p id="source-p44l11">小张入门时总是犹豫，不敢邀约。他只写下20个名字。导师建议他先找一位熟悉的朋友，试着把邀请说完整。在一次小组演练中，他把邀请说完整，也从伙伴的反馈中知道了哪里还不清楚。小张明白了，不能总等到准备充分才开口。</p><h3 id="source-p44l17">从家庭到社区</h3><p id="source-p44l18">一位宝妈起初只想自用产品，她在使用之后，开始把自己的经验分享给家人。她先听父母的需要，再把自己了解的产品资料讲清楚，父母后来也和邻居聊起了这件事。不到半年，小区形成了一个健康小圈子。</p><h3 id="source-p45l0">医生的团队</h3><p id="source-p45l1">何医生原本只是把理念传递给病人。后来他意识到：如果只有他一个人在讲，力量终究有限。于是他开始带徒弟，让徒弟去讲。半年后，徒弟们已能独立开小会。徒弟能够独立分享后，何医生的经验也能帮助更多人。</p><h2 id="source-p45l7">实操练习</h2><p id="source-p45l8">练习一：画出从示范到独立的过程：先由你讲，再由新人讲、你补充，最后让新人独立完成。</p><p id="source-p45l10">并标注关键任务。</p><p id="source-p45l11">练习二：和伙伴模拟一次交流。先听需要，再说明事情；对方问到费用、产品和责任时，练习给出清楚的回答。</p><p id="source-p45l13">记录哪些地方没说清，下一次再改。教过之后，找机会看一次对方独立完成的过程。哪里做得顺，哪里还需要帮助，都在实际操作里看。一项做法经得起反复练习，才会慢慢成为团队的习惯。</p><nav><a href="ch02.html">上一节</a> · <a href="https://www.hehuaqing.com/books/guangyao-xinkangmei/">全书目录</a> · <a href="ch04.html">下一节</a></nav></main></noscript></body></html>
