    <noscript><main class="reader-frame reading-prose"><h1>光明心髓</h1><p>何华清 著</p><div class="poem-text"><p class="poem-stanza" id="verse-1"><span class="poem-line">无常说</span><span class="poem-line">没有一帧是可以被重复的</span><span class="poem-line">当下说</span><span class="poem-line">终点与起点在我这里合一</span><span class="poem-line">虚无说</span><span class="poem-line">一切终归于尘土</span><span class="poem-line">冒险家说</span><span class="poem-line">不是无知而无畏</span><span class="poem-line">而是知危而面对</span><span class="poem-line">人生当如蜡烛，始终光明</span><span class="poem-line">用温柔去对待黑暗是无用的</span><span class="poem-line">得用火</span></p></div><figure class="poem-illustration"><button type="button" class="poem-art-open" data-poem-art="/books/jing-mi-de-kuang-chao/art/002.webp" data-caption="《光芒》" aria-label="放大欣赏插画《光芒》"><img src="/books/jing-mi-de-kuang-chao/art/002.webp" width="885" height="1050" alt="亮子绘制的原书插画《光芒》" loading="lazy" decoding="async"/></button><figcaption>《光芒》 · 亮子<span>轻触画面，放大欣赏</span></figcaption></figure><p class="poem-original-page">原书第 2 页</p><p><a href="index.html">返回诗集目录</a></p></main></noscript>
