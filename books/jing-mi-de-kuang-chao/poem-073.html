    <noscript><main class="reader-frame reading-prose"><h1>从前慢木心——致佛性</h1><p>何华清 著</p><div class="poem-text"><p class="poem-stanza" id="verse-1"><span class="poem-line">向佛陀致敬</span></p><p class="poem-stanza" id="verse-2"><span class="poem-line">从前慢，人心很慢，思维很慢，</span><span class="poem-line">能够感悟佛性的圆满；</span></p><p class="poem-stanza" id="verse-3"><span class="poem-line">从前慢，行走很慢，修行很慢，</span><span class="poem-line">慢得人们才会体悟生命的奥妙。</span><span class="poem-line">后来快，科技已经很快，生活也很快，</span><span class="poem-line">忙碌和浮躁充斥着人们的内心；</span><span class="poem-line">后来快，文化也很快，思想也很快，</span><span class="poem-line">快得人们已经不曾悟得佛性的真谛。</span></p><p class="poem-stanza" id="verse-4"><span class="poem-line">今天慢，宁静很慢，心灵很慢，</span><span class="poem-line">用心去领悟佛性的智慧；</span><span class="poem-line">今天慢，行迹很慢，修心很慢，</span><span class="poem-line">慢得人们才能融入生命的意义。</span><span class="poem-line">向佛陀致敬，领悟生命的真谛，</span><span class="poem-line">走过一段段艰辛的人生之路；</span><span class="poem-line">向佛性致敬，探究生命的奥妙，</span><span class="poem-line">让人生的旅途有光彩，也有坚定。</span><span class="poem-line">正念修行，寻求内心的平静，</span><span class="poem-line">抚平浮躁和短视所带来的疲惫；</span><span class="poem-line">舍离纷扰，融入宁静的清新，</span><span class="poem-line">体悟佛陀教诲的真谛，拥抱实相。</span></p></div><p class="poem-original-page">原书第 73—74 页</p><p><a href="index.html">返回诗集目录</a></p></main></noscript>
