    <noscript><main class="reader-frame reading-prose protected-illustrations"><h1>不如不见</h1><p>何华清 著</p><div class="poem-text"><p class="poem-stanza" id="verse-1"><span class="poem-line">多想</span><span class="poem-line">在某一路段的街头</span><span class="poem-line">因缘际会的街头</span></p><p class="poem-stanza" id="verse-2"><span class="poem-line">遇见</span></p><p class="poem-stanza" id="verse-3"><span class="poem-line">道一句</span><span class="poem-line">好久不见</span></p><p class="poem-stanza" id="verse-4"><span class="poem-line">知你不幸</span><span class="poem-line">而构成的再次相遇</span><span class="poem-line">心中的疼</span><span class="poem-line">无言</span></p><p class="poem-stanza" id="verse-5"><span class="poem-line">情愿你安好</span><span class="poem-line">来成就我一生的遗憾</span></p></div><figure class="poem-illustration"><button type="button" class="poem-art-open" data-poem-art="/books/jing-mi-de-kuang-chao/art/033.webp" data-caption="《等你》" aria-label="放大欣赏插画《等你》"><img draggable="false" src="/books/jing-mi-de-kuang-chao/art/033.webp" width="885" height="1050" alt="亮子绘制的原书插画《等你》" loading="lazy" decoding="async"/></button><figcaption>《等你》 · 亮子<span>轻触画面，放大欣赏</span></figcaption></figure><p class="poem-original-page">原书第 33 页</p><p><a href="index.html">返回诗集目录</a></p></main></noscript>
