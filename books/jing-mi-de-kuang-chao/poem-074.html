    <noscript><main class="reader-frame reading-prose"><h1>苦海有边</h1><p>何华清 著</p><div class="poem-text"><p class="poem-stanza" id="verse-1"><span class="poem-line">身处苦海中</span><span class="poem-line">不愿再重复</span><span class="poem-line">的你</span></p><p class="poem-stanza" id="verse-2"><span class="poem-line">成为战神般</span><span class="poem-line">置之死地而</span><span class="poem-line">奋力</span></p><p class="poem-stanza" id="verse-3"><span class="poem-line">咬掉那蛇头</span><span class="poem-line">连同其毒液</span><span class="poem-line">吞下</span></p><p class="poem-stanza" id="verse-4"><span class="poem-line">我愿意伸出最诚恳的双手</span><span class="poem-line">在河边以及隧道的光明里</span></p></div><figure class="poem-illustration"><button type="button" class="poem-art-open" data-poem-art="/books/jing-mi-de-kuang-chao/art/074.webp" data-caption="《看见》" aria-label="放大欣赏插画《看见》"><img src="/books/jing-mi-de-kuang-chao/art/074.webp" width="885" height="1050" alt="亮子绘制的原书插画《看见》" loading="lazy" decoding="async"/></button><figcaption>《看见》 · 亮子<span>轻触画面，放大欣赏</span></figcaption></figure><p class="poem-original-page">原书第 75 页</p><p><a href="index.html">返回诗集目录</a></p></main></noscript>
