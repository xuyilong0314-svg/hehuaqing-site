    <noscript><main class="reader-frame reading-prose"><h1>从苦难之中绽放</h1><p>何华清 著</p><div class="poem-text"><p class="poem-stanza" id="verse-1"><span class="poem-line">事物是没有恒常的。</span><span class="poem-line">这是无需辩驳的至理。</span></p><p class="poem-stanza" id="verse-2"><span class="poem-line">不能因为花会落，</span><span class="poem-line">就拒绝去拥有一棵娇艳的玫瑰；</span><span class="poem-line">不能因为看到一些不美满的婚姻，</span><span class="poem-line">就拒绝走进婚姻的殿堂。</span></p><p class="poem-stanza" id="verse-3"><span class="poem-line">能否收获是完全自然性的，</span><span class="poem-line">它是充满变数的。</span><span class="poem-line">青涩的小麦，</span><span class="poem-line">它不知道明年是旱是涝或是有蝗虫。</span></p><p class="poem-stanza" id="verse-4"><span class="poem-line">但如果你是农民，</span><span class="poem-line">你不管明年什么情况，</span><span class="poem-line">你都会在春天播种，</span><span class="poem-line">因为不播种就是一个确定的失败。</span><span class="poem-line">你要接受不顺利，也接受顺利，</span><span class="poem-line">你要像树一样生长，</span><span class="poem-line">即使四季旱涝，闪电雷劈，依旧继续生长。</span></p></div><figure class="poem-illustration"><button type="button" class="poem-art-open" data-poem-art="/books/jing-mi-de-kuang-chao/art/004.webp" data-caption="《旋律》" aria-label="放大欣赏插画《旋律》"><img src="/books/jing-mi-de-kuang-chao/art/004.webp" width="885" height="1050" alt="亮子绘制的原书插画《旋律》" loading="lazy" decoding="async"/></button><figcaption>《旋律》 · 亮子<span>轻触画面，放大欣赏</span></figcaption></figure><p class="poem-original-page">原书第 4 页</p><p><a href="index.html">返回诗集目录</a></p></main></noscript>
