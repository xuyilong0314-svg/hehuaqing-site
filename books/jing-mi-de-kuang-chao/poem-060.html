    <noscript><main class="reader-frame reading-prose"><h1>净观</h1><p>何华清 著</p><div class="poem-text"><p class="poem-stanza" id="verse-1"><span class="poem-line">时间之外我是谁</span><span class="poem-line">时间之内谁是我</span><span class="poem-line">寻寻觅觅</span><span class="poem-line">探源溯流</span></p><p class="poem-stanza" id="verse-2"><span class="poem-line">当我向大道致敬</span><span class="poem-line">将疑惑通通揉碎</span><span class="poem-line">藏进中脉里</span><span class="poem-line">每个呼吸中</span><span class="poem-line">窥见世界的折射</span></p><p class="poem-stanza" id="verse-3"><span class="poem-line">混沌初开</span><span class="poem-line">净障合一</span></p></div><figure class="poem-illustration"><button type="button" class="poem-art-open" data-poem-art="/books/jing-mi-de-kuang-chao/art/060.webp" data-caption="《坐》" aria-label="放大欣赏插画《坐》"><img src="/books/jing-mi-de-kuang-chao/art/060.webp" width="885" height="1050" alt="亮子绘制的原书插画《坐》" loading="lazy" decoding="async"/></button><figcaption>《坐》 · 亮子<span>轻触画面，放大欣赏</span></figcaption></figure><p class="poem-original-page">原书第 60 页</p><p><a href="index.html">返回诗集目录</a></p></main></noscript>
