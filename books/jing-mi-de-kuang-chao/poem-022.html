    <noscript><main class="reader-frame reading-prose"><h1>520</h1><p>何华清 著</p><div class="poem-text"><p class="poem-stanza" id="verse-1"><span class="poem-line">我将版纳的春天</span><span class="poem-line">格兰菲迪15及窦唯和你</span><span class="poem-line">揉进阿赖耶识</span></p><p class="poem-stanza" id="verse-2"><span class="poem-line">化为一颗璀璨金刚不坏的晶体</span><span class="poem-line">美妙的降临堪比金字塔的奇迹</span></p><p class="poem-stanza" id="verse-3"><span class="poem-line">灵虚香在空中游舞</span><span class="poem-line">懒散且自由</span><span class="poem-line">完美地诠释</span><span class="poem-line">虚度的秘密</span></p><p class="poem-stanza" id="verse-4"><span class="poem-line">莎翁不合时宜地出现</span><span class="poem-line">左手持金刚铃</span><span class="poem-line">右手攥金刚杵</span><span class="poem-line">在晶体的四个面分别写上</span></p><p class="poem-stanza" id="verse-5"><span class="poem-line">“求而不得”</span></p></div><figure class="poem-illustration"><button type="button" class="poem-art-open" data-poem-art="/books/jing-mi-de-kuang-chao/art/022.webp" data-caption="《同行》" aria-label="放大欣赏插画《同行》"><img src="/books/jing-mi-de-kuang-chao/art/022.webp" width="885" height="1050" alt="亮子绘制的原书插画《同行》" loading="lazy" decoding="async"/></button><figcaption>《同行》 · 亮子<span>轻触画面，放大欣赏</span></figcaption></figure><p class="poem-original-page">原书第 22 页</p><p><a href="index.html">返回诗集目录</a></p></main></noscript>
