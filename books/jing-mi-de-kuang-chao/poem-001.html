    <noscript><main class="reader-frame reading-prose protected-illustrations"><h1>秦越梦中话</h1><p>何华清 著</p><div class="poem-text"><p class="poem-stanza" id="verse-1"><span class="poem-line">它在山间伫立以及等待</span><span class="poem-line">全然地，长成它会长成的样子</span><span class="poem-line">甚至无神论者也愿意称他们为药神。</span><span class="poem-line">如果世界有倒影</span><span class="poem-line">倒影成为了天上星</span><span class="poem-line">在伫立的林间入梦，我看见的是星河。</span><span class="poem-line">本草是繁星，还是繁星是本草？</span></p></div><figure class="poem-illustration"><button type="button" class="poem-art-open" data-poem-art="/books/jing-mi-de-kuang-chao/art/001.webp" data-caption="《生长》" aria-label="放大欣赏插画《生长》"><img draggable="false" src="/books/jing-mi-de-kuang-chao/art/001.webp" width="885" height="1050" alt="亮子绘制的原书插画《生长》" loading="lazy" decoding="async"/></button><figcaption>《生长》 · 亮子<span>轻触画面，放大欣赏</span></figcaption></figure><p class="poem-original-page">原书第 1 页</p><p><a href="index.html">返回诗集目录</a></p></main></noscript>
