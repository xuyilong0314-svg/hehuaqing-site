    <div id="root"></div>
    <noscript><main class="reader-frame reading-prose"><h1>空音不二</h1><p>何华清 著</p><div class="poem-text"><p class="poem-stanza" id="verse-1"><span class="poem-line">如果说时间是空白的</span><span class="poem-line">那么音乐便是时间的调味</span><span class="poem-line">快或者慢，悲或喜</span><span class="poem-line">悲的苦寒，喜的甘热。</span></p><p class="poem-stanza" id="verse-2"><span class="poem-line">音乐为时间加入烟火味</span><span class="poem-line">自此时间不再空洞无华</span><span class="poem-line">音乐是人间值得的证据</span></p><p class="poem-stanza" id="verse-3"><span class="poem-line">空是音的底色，音是空的答案</span></p></div><figure class="poem-illustration"><button type="button" class="poem-art-open" data-poem-art="/books/jing-mi-de-kuang-chao/art/037.webp" data-caption="《吸引》" aria-label="放大欣赏插画《吸引》"><img src="/books/jing-mi-de-kuang-chao/art/037.webp" width="885" height="1050" alt="亮子绘制的原书插画《吸引》" loading="lazy" decoding="async"/></button><figcaption>《吸引》 · 亮子<span>轻触画面，放大欣赏</span></figcaption></figure><p class="poem-original-page">原书第 37 页</p><p><a href="index.html">返回诗集目录</a></p></main></noscript>
