    <noscript><main class="reader-frame reading-prose"><h1>遥相寄·悉达多成道</h1><p>何华清 著</p><div class="poem-text"><p class="poem-stanza" id="verse-1"><span class="poem-line">众生苦海无尽头，悉达多子寻菩提。</span><span class="poem-line">彼岸花开雨濛濛，心灯，点燃普照大地春。</span><span class="poem-line">菩提树下禅境深，涅槃，摘星摘月跻苍穹。</span><span class="poem-line">度尽六道脱生死，金身，照耀三千世界空。</span></p></div><figure class="poem-illustration"><button type="button" class="poem-art-open" data-poem-art="/books/jing-mi-de-kuang-chao/art/071.webp" data-caption="《树》" aria-label="放大欣赏插画《树》"><img src="/books/jing-mi-de-kuang-chao/art/071.webp" width="885" height="1050" alt="亮子绘制的原书插画《树》" loading="lazy" decoding="async"/></button><figcaption>《树》 · 亮子<span>轻触画面，放大欣赏</span></figcaption></figure><p class="poem-original-page">原书第 71 页</p><p><a href="index.html">返回诗集目录</a></p></main></noscript>
