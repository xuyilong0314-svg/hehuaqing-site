    <div id="root"></div>
    <noscript><main class="reader-frame reading-prose"><h1>观众</h1><p>何华清 著</p><div class="poem-text"><p class="poem-stanza" id="verse-1"><span class="poem-line">你不动如山</span><span class="poem-line">我静默无言</span><span class="poem-line">你眼帘低垂</span><span class="poem-line">我虔诚合十</span><span class="poem-line">抬头</span><span class="poem-line">从你眼中</span><span class="poem-line">我看到人世里最美的花</span><span class="poem-line">闭上眼睛</span><span class="poem-line">我闻到了蝶翼上的幽香</span><span class="poem-line">以及心愿</span><span class="poem-line">睁眼时 你已如云烟</span><span class="poem-line">低头时 看见脚下的路</span><span class="poem-line">真善不在雕塑</span><span class="poem-line">而在众生之中</span></p></div><figure class="poem-illustration"><button type="button" class="poem-art-open" data-poem-art="/books/jing-mi-de-kuang-chao/art/035.webp" data-caption="《空城》" aria-label="放大欣赏插画《空城》"><img src="/books/jing-mi-de-kuang-chao/art/035.webp" width="885" height="1050" alt="亮子绘制的原书插画《空城》" loading="lazy" decoding="async"/></button><figcaption>《空城》 · 亮子<span>轻触画面，放大欣赏</span></figcaption></figure><p class="poem-original-page">原书第 35 页</p><p><a href="index.html">返回诗集目录</a></p></main></noscript>
