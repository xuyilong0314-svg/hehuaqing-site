    <noscript><main class="reader-frame reading-prose"><h1>普巴，普巴</h1><p>何华清 著</p><div class="poem-text"><p class="poem-stanza" id="verse-1"><span class="poem-line">伸出手来</span><span class="poem-line">让我紧握你的双手</span><span class="poem-line">以原子对撞的速度相拥</span><span class="poem-line">合而为一</span></p><p class="poem-stanza" id="verse-2"><span class="poem-line">钩召众生的业火</span><span class="poem-line">铸成铁围山里的熔炎</span></p><p class="poem-stanza" id="verse-3"><span class="poem-line">伸出手来</span><span class="poem-line">举杯向空性致敬</span><span class="poem-line">将世间最炙热的烦恼</span><span class="poem-line">一饮而尽</span></p><p class="poem-stanza" id="verse-4"><span class="poem-line">窥见无瑕的密语</span></p></div><figure class="poem-illustration"><button type="button" class="poem-art-open" data-poem-art="/books/jing-mi-de-kuang-chao/art/067.webp" data-caption="《藤》" aria-label="放大欣赏插画《藤》"><img src="/books/jing-mi-de-kuang-chao/art/067.webp" width="885" height="1050" alt="亮子绘制的原书插画《藤》" loading="lazy" decoding="async"/></button><figcaption>《藤》 · 亮子<span>轻触画面，放大欣赏</span></figcaption></figure><p class="poem-original-page">原书第 67 页</p><p><a href="index.html">返回诗集目录</a></p></main></noscript>
