    <noscript><main class="reader-frame reading-prose protected-illustrations"><h1>我的世界</h1><p>何华清 著</p><div class="poem-text"><p class="poem-stanza" id="verse-1"><span class="poem-line">在这个世界的一隅，</span><span class="poem-line">意识去了知晓的角落。</span><span class="poem-line">然而真相只在我内心，</span><span class="poem-line">丑陋与美丽共融。</span><span class="poem-line">善良天使徜徉心间，</span><span class="poem-line">所在即是净土。</span><span class="poem-line">反之亦有魔鬼身影，</span><span class="poem-line">取决于我每个当下。</span><span class="poem-line">我选择什么，即是我，</span><span class="poem-line">我的感知决定我的境界。</span><span class="poem-line">在这片浪漫的世界里，</span><span class="poem-line">我和自己约定盟约。</span></p></div><figure class="poem-illustration"><button type="button" class="poem-art-open" data-poem-art="/books/jing-mi-de-kuang-chao/art/068.webp" data-caption="《同行》" aria-label="放大欣赏插画《同行》"><img draggable="false" src="/books/jing-mi-de-kuang-chao/art/068.webp" width="885" height="1050" alt="亮子绘制的原书插画《同行》" loading="lazy" decoding="async"/></button><figcaption>《同行》 · 亮子<span>轻触画面，放大欣赏</span></figcaption></figure><p class="poem-original-page">原书第 68 页</p><p><a href="index.html">返回诗集目录</a></p></main></noscript>
