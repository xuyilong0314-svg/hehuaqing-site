    <noscript><main class="reader-frame reading-prose"><h1>驭苦观景</h1><p>何华清 著</p><div class="poem-text"><p class="poem-stanza" id="verse-1"><span class="poem-line">把所有别离细分，背后有无数种失去，</span><span class="poem-line">这无数种，苦的程度都不同。</span></p><p class="poem-stanza" id="verse-2"><span class="poem-line">修行是为了把失去与执着的相随剥离，</span><span class="poem-line">做到存在失去但不存在痛苦。</span></p><p class="poem-stanza" id="verse-3"><span class="poem-line">苦海这个词之所以能成立，是因为一波接一波，</span><span class="poem-line">每一波段都不同，有高也低。</span><span class="poem-line">我们应接不暇，被冲刷击倒。</span></p><p class="poem-stanza" id="verse-4"><span class="poem-line">如想在苦海里乘风破浪，驭苦观景，</span><span class="poem-line">保持平衡是第一要训练的技巧。</span></p></div><figure class="poem-illustration"><button type="button" class="poem-art-open" data-poem-art="/books/jing-mi-de-kuang-chao/art/032.webp" data-caption="《缺失》" aria-label="放大欣赏插画《缺失》"><img src="/books/jing-mi-de-kuang-chao/art/032.webp" width="885" height="1050" alt="亮子绘制的原书插画《缺失》" loading="lazy" decoding="async"/></button><figcaption>《缺失》 · 亮子<span>轻触画面，放大欣赏</span></figcaption></figure><p class="poem-original-page">原书第 32 页</p><p><a href="index.html">返回诗集目录</a></p></main></noscript>
