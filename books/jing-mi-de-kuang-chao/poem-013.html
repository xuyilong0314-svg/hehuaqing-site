    <noscript><main class="reader-frame reading-prose"><h1>思念观世音</h1><p>何华清 著</p><div class="poem-text"><p class="poem-stanza" id="verse-1"><span class="poem-line">让我观想起你</span><span class="poem-line">容颜以及所有的细节</span><span class="poem-line">我的心从城市跃入洪荒</span><span class="poem-line">原始野性中浮动着暗香</span><span class="poem-line">在混沌中渗出一丝海运</span><span class="poem-line">势以开天之势</span><span class="poem-line">扶摇直上</span><span class="poem-line">这思念</span><span class="poem-line">夜长一寸</span><span class="poem-line">今夜如此</span><span class="poem-line">夜夜皆然</span></p></div><figure class="poem-illustration"><button type="button" class="poem-art-open" data-poem-art="/books/jing-mi-de-kuang-chao/art/013.webp" data-caption="《感受》" aria-label="放大欣赏插画《感受》"><img src="/books/jing-mi-de-kuang-chao/art/013.webp" width="885" height="1050" alt="亮子绘制的原书插画《感受》" loading="lazy" decoding="async"/></button><figcaption>《感受》 · 亮子<span>轻触画面，放大欣赏</span></figcaption></figure><p class="poem-original-page">原书第 13 页</p><p><a href="index.html">返回诗集目录</a></p></main></noscript>
