    <noscript><main class="reader-frame reading-prose"><h1>太阳必将胜利</h1><p>何华清 著</p><div class="poem-text"><p class="poem-stanza" id="verse-1"><span class="poem-line">太阳东升西落，</span><span class="poem-line">既是旭日也是落日。</span><span class="poem-line">少年眺望人间，</span><span class="poem-line">老人离开带走回忆。</span><span class="poem-line">永恒传承生命死亡，</span><span class="poem-line">散布颓唐与希望。</span><span class="poem-line">世间沧桑昔人已逝，</span><span class="poem-line">一日复一日见证残照。</span><span class="poem-line">岁月易逝，</span><span class="poem-line">细数流年不负轮回。</span></p></div><figure class="poem-illustration"><button type="button" class="poem-art-open" data-poem-art="/books/jing-mi-de-kuang-chao/art/069.webp" data-caption="《太阳》" aria-label="放大欣赏插画《太阳》"><img src="/books/jing-mi-de-kuang-chao/art/069.webp" width="885" height="1050" alt="亮子绘制的原书插画《太阳》" loading="lazy" decoding="async"/></button><figcaption>《太阳》 · 亮子<span>轻触画面，放大欣赏</span></figcaption></figure><p class="poem-original-page">原书第 69 页</p><p><a href="index.html">返回诗集目录</a></p></main></noscript>
