    <noscript><main class="reader-frame reading-prose"><h1>生命之河</h1><p>何华清 著</p><div class="poem-text"><p class="poem-stanza" id="verse-1"><span class="poem-line">感谢生老病死，让河流得以顺畅，</span><span class="poem-line">在苦难中坚守，在乐中怡情。</span><span class="poem-line">感谢低地与高山，给河流有了起伏。</span><span class="poem-line">感谢无常，生成河流两岸的四季。</span><span class="poem-line">感谢成败，河流有了波澜。</span></p><p class="poem-stanza" id="verse-2"><span class="poem-line">哎玛吙，我们终会汇入海洋，彼此相融，</span><span class="poem-line">我们会再一次蒸腾，共赴明日，</span><span class="poem-line">共赴人世间的剧场，剧中的人们阿，</span><span class="poem-line">你可以哭泣，但不要持续地悲伤，</span><span class="poem-line">因为你是剧中人。</span></p><p class="poem-stanza" id="verse-3"><span class="poem-line">感谢死神，感谢他如此耐心。</span></p></div><figure class="poem-illustration"><button type="button" class="poem-art-open" data-poem-art="/books/jing-mi-de-kuang-chao/art/041.webp" data-caption="《生命》" aria-label="放大欣赏插画《生命》"><img src="/books/jing-mi-de-kuang-chao/art/041.webp" width="885" height="1050" alt="亮子绘制的原书插画《生命》" loading="lazy" decoding="async"/></button><figcaption>《生命》 · 亮子<span>轻触画面，放大欣赏</span></figcaption></figure><p class="poem-original-page">原书第 41 页</p><p><a href="index.html">返回诗集目录</a></p></main></noscript>
