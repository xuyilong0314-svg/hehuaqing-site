    <noscript><main class="reader-frame reading-prose"><h1>撕下心境上的胶带</h1><p>何华清 著</p><div class="poem-text"><p class="poem-stanza" id="verse-1"><span class="poem-line">在无限的自然里投射里</span><span class="poem-line">从孩童到成人</span><span class="poem-line">从无暇到复杂</span><span class="poem-line">对世界</span><span class="poem-line">开始映射出数条</span><span class="poem-line">带有颜色的胶布</span><span class="poem-line">蒙蔽真实的见解</span><span class="poem-line">你已无法完全映射出真实</span><span class="poem-line">你陷入甘于平庸的原罪里</span><span class="poem-line">放松</span><span class="poem-line">本来无一物，何处惹尘埃</span></p></div><figure class="poem-illustration"><button type="button" class="poem-art-open" data-poem-art="/books/jing-mi-de-kuang-chao/art/043.webp" data-caption="《世界》" aria-label="放大欣赏插画《世界》"><img src="/books/jing-mi-de-kuang-chao/art/043.webp" width="885" height="1050" alt="亮子绘制的原书插画《世界》" loading="lazy" decoding="async"/></button><figcaption>《世界》 · 亮子<span>轻触画面，放大欣赏</span></figcaption></figure><p class="poem-original-page">原书第 43 页</p><p><a href="index.html">返回诗集目录</a></p></main></noscript>
