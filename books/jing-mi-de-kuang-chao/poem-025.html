    <noscript><main class="reader-frame reading-prose"><h1>生命之书</h1><p>何华清 著</p><div class="poem-text"><p class="poem-stanza" id="verse-1"><span class="poem-line">终于有一天</span><span class="poem-line">待我翻尽经藏</span><span class="poem-line">仍有疑惑时</span></p><p class="poem-stanza" id="verse-2"><span class="poem-line">浪漫星空里</span><span class="poem-line">向我展现了</span><span class="poem-line">一部以七宝</span><span class="poem-line">铸造的经书</span></p><p class="poem-stanza" id="verse-3"><span class="poem-line">我从极力仰望中</span><span class="poem-line">看到了</span><span class="poem-line">最最深刻的</span><span class="poem-line">无限禅机的</span><span class="poem-line">令我无惑的</span></p><p class="poem-stanza" id="verse-4"><span class="poem-line">刹那</span></p></div><figure class="poem-illustration"><button type="button" class="poem-art-open" data-poem-art="/books/jing-mi-de-kuang-chao/art/025.webp" data-caption="《叶子》" aria-label="放大欣赏插画《叶子》"><img src="/books/jing-mi-de-kuang-chao/art/025.webp" width="885" height="1050" alt="亮子绘制的原书插画《叶子》" loading="lazy" decoding="async"/></button><figcaption>《叶子》 · 亮子<span>轻触画面，放大欣赏</span></figcaption></figure><p class="poem-original-page">原书第 25 页</p><p><a href="index.html">返回诗集目录</a></p></main></noscript>
