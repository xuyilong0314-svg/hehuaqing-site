    <noscript><main class="reader-frame reading-prose"><h1>问道</h1><p>何华清 著</p><div class="poem-text"><p class="poem-stanza" id="verse-1"><span class="poem-line">虔诚之心渡沧海，执念褪去见真我。</span><span class="poem-line">日夜修行度群生，禅境，梦幻泡影若浮萍。</span><span class="poem-line">菩提道上觅真谛，灵光，逐渐映照心中城。</span><span class="poem-line">始终开悟破尘埃，笑看，红尘繁华转瞬间。</span></p></div><figure class="poem-illustration"><button type="button" class="poem-art-open" data-poem-art="/books/jing-mi-de-kuang-chao/art/072.webp" data-caption="《皱纹》" aria-label="放大欣赏插画《皱纹》"><img src="/books/jing-mi-de-kuang-chao/art/072.webp" width="885" height="1050" alt="亮子绘制的原书插画《皱纹》" loading="lazy" decoding="async"/></button><figcaption>《皱纹》 · 亮子<span>轻触画面，放大欣赏</span></figcaption></figure><p class="poem-original-page">原书第 72 页</p><p><a href="index.html">返回诗集目录</a></p></main></noscript>
