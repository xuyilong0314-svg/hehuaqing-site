    <noscript><main class="reader-frame reading-prose"><h1>地藏，地藏</h1><p>何华清 著</p><div class="poem-text"><p class="poem-stanza" id="verse-1"><span class="poem-line">我问</span><span class="poem-line">你什么时候会圆满？</span><span class="poem-line">他说</span><span class="poem-line">这是无有穷尽的路</span><span class="poem-line">我在众多愿望之中</span><span class="poem-line">选择了</span><span class="poem-line">所有捷径里最远的那条路</span><span class="poem-line">大圆满</span><span class="poem-line">它在那里不增不减</span><span class="poem-line">而此时此刻</span><span class="poem-line">我在这里，它也在这里</span></p></div><figure class="poem-illustration"><button type="button" class="poem-art-open" data-poem-art="/books/jing-mi-de-kuang-chao/art/024.webp" data-caption="《寻找》" aria-label="放大欣赏插画《寻找》"><img src="/books/jing-mi-de-kuang-chao/art/024.webp" width="885" height="1050" alt="亮子绘制的原书插画《寻找》" loading="lazy" decoding="async"/></button><figcaption>《寻找》 · 亮子<span>轻触画面，放大欣赏</span></figcaption></figure><p class="poem-original-page">原书第 24 页</p><p><a href="index.html">返回诗集目录</a></p></main></noscript>
