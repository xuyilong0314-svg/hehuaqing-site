    <noscript><main class="reader-frame reading-prose"><h1>定风波·慈悲智慧融合行</h1><p>何华清 著</p><div class="poem-text"><p class="poem-stanza" id="verse-1"><span class="poem-line">慈悲智慧共呼应，心境安然似水清。</span><span class="poem-line">合一天地生灵意，放松身心任风行。</span><span class="poem-line">遥望苍茫宇宙间，微笑，因果法则自然成。</span><span class="poem-line">顺遂人生踏浮华，回首，已无往事也无惊。</span></p></div><figure class="poem-illustration"><button type="button" class="poem-art-open" data-poem-art="/books/jing-mi-de-kuang-chao/art/070.webp" data-caption="《融》" aria-label="放大欣赏插画《融》"><img src="/books/jing-mi-de-kuang-chao/art/070.webp" width="885" height="1050" alt="亮子绘制的原书插画《融》" loading="lazy" decoding="async"/></button><figcaption>《融》 · 亮子<span>轻触画面，放大欣赏</span></figcaption></figure><p class="poem-original-page">原书第 70 页</p><p><a href="index.html">返回诗集目录</a></p></main></noscript>
