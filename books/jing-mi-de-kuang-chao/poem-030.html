    <noscript><main class="reader-frame reading-prose protected-illustrations"><h1>夜空</h1><p>何华清 著</p><div class="poem-text"><p class="poem-stanza" id="verse-1"><span class="poem-line">抬头</span><span class="poem-line">看见神圣</span><span class="poem-line">先祖与诸佛</span></p><p class="poem-stanza" id="verse-2"><span class="poem-line">他们在天空燃起篝火</span><span class="poem-line">灿烂中充盈着光明与希望</span></p><p class="poem-stanza" id="verse-3"><span class="poem-line">启示于自心浮现</span><span class="poem-line">与篝火照相辉映</span></p><p class="poem-stanza" id="verse-4"><span class="poem-line">犹如灯塔</span><span class="poem-line">令我不曾迷失</span></p></div><figure class="poem-illustration"><button type="button" class="poem-art-open" data-poem-art="/books/jing-mi-de-kuang-chao/art/030.webp" data-caption="《月光》" aria-label="放大欣赏插画《月光》"><img draggable="false" src="/books/jing-mi-de-kuang-chao/art/030.webp" width="885" height="1050" alt="亮子绘制的原书插画《月光》" loading="lazy" decoding="async"/></button><figcaption>《月光》 · 亮子<span>轻触画面，放大欣赏</span></figcaption></figure><p class="poem-original-page">原书第 30 页</p><p><a href="index.html">返回诗集目录</a></p></main></noscript>
