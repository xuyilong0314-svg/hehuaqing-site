    <noscript><main class="reader-frame reading-prose"><h1>致女儿诗</h1><p>何华清 著</p><div class="poem-text"><p class="poem-stanza" id="verse-1"><span class="poem-line">愿你目光所及</span><span class="poem-line">皆星河的浪漫</span><span class="poem-line">尘世的暗触及你心扉</span><span class="poem-line">也能如飞蛾扑火</span><span class="poem-line">有来无往</span><span class="poem-line">你是天使的荣光</span><span class="poem-line">散落于人间的希望</span><span class="poem-line">愿你眼里有光</span><span class="poem-line">心有暖意</span><span class="poem-line">一如既往</span></p></div><figure class="poem-illustration"><button type="button" class="poem-art-open" data-poem-art="/books/jing-mi-de-kuang-chao/art/062.webp" data-caption="《盛开》" aria-label="放大欣赏插画《盛开》"><img src="/books/jing-mi-de-kuang-chao/art/062.webp" width="885" height="1050" alt="亮子绘制的原书插画《盛开》" loading="lazy" decoding="async"/></button><figcaption>《盛开》 · 亮子<span>轻触画面，放大欣赏</span></figcaption></figure><p class="poem-original-page">原书第 62 页</p><p><a href="index.html">返回诗集目录</a></p></main></noscript>
