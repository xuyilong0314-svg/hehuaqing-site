    <noscript><main class="reader-frame reading-prose protected-illustrations"><h1>憨山</h1><p>明代憨山大师《六咏诗》摘选</p><div class="poem-text"><p class="poem-stanza" id="verse-1"><span class="poem-line">金翅鸟命终，骨肉尽消散，</span><span class="poem-line">唯有心不化，圆明光灿烂。</span><span class="poem-line">龙王取为珠，能破千年暗。</span><span class="poem-line">转轮得如意，能救一切难。</span><span class="poem-line">如合在人中，日用而不见。</span></p></div><p class="poem-source-note">（摘选自明代憨山大师《六咏诗》）</p><figure class="poem-illustration"><button type="button" class="poem-art-open" data-poem-art="/books/jing-mi-de-kuang-chao/art/007.webp" data-caption="《羽毛》" aria-label="放大欣赏插画《羽毛》"><img draggable="false" src="/books/jing-mi-de-kuang-chao/art/007.webp" width="885" height="1050" alt="亮子绘制的原书插画《羽毛》" loading="lazy" decoding="async"/></button><figcaption>《羽毛》 · 亮子<span>轻触画面，放大欣赏</span></figcaption></figure><p class="poem-original-page">原书第 7 页</p><p><a href="index.html">返回诗集目录</a></p></main></noscript>
